/* -------------------------- RESTRUCTURING (more) -------------------------- */
{c:"restr",l:1,t:"mc",q:"A prepackaged bankruptcy is:",o:["A filing made without creditor notice","A plan negotiated and voted on before the company files","A liquidation under Chapter 7","A filing that skips court approval"],a:1,e:"The terms are agreed and the required creditor votes secured in advance, so the court process can be completed in weeks rather than months."},
{c:"restr",l:1,t:"mc",q:"Cramdown refers to:",o:["Forcing a company into liquidation","Confirming a plan over the objection of a dissenting class","Reducing management compensation","Calling a loan early"],a:1,e:"The court can confirm a plan despite a dissenting class, provided the plan is fair and equitable to that class and does not unfairly discriminate."},
{c:"restr",l:1,t:"mc",q:"The best interests test requires that each creditor receives:",o:["Payment in full","At least what it would receive in a Chapter 7 liquidation","An equal share with all other creditors","Equity in the reorganised company"],a:1,e:"It is the floor protection for dissenting creditors, which is why a liquidation analysis is a required part of any plan."},
{c:"restr",l:1,t:"mc",q:"A technical default is:",o:["A missed interest payment","A breach of a covenant without a missed payment","A default caused by a clerical error","A default on a subsidiary's debt only"],a:1,e:"Breaching a leverage or coverage test triggers default rights even though the company has kept paying. It is often the first visible sign of distress."},
{c:"restr",l:2,t:"mc",q:"Exit financing in a Chapter 11 process refers to:",o:["Fees paid to advisers on emergence","New capital raised to fund the company out of bankruptcy","The sale of the business to a third party","Repayment of the DIP facility by equity holders"],a:1,e:"It replaces the DIP facility and funds plan distributions and working capital as the reorganised company emerges."},
{c:"restr",l:2,t:"mc",q:"In the claims waterfall, trade creditors normally rank:",o:["Ahead of secured lenders","Alongside secured lenders","As general unsecured claims, below secured debt","Below equity"],a:2,e:"Unless they hold security or benefit from a critical vendor order, trade claims sit in the general unsecured pool and often recover very little."},
{c:"restr",l:2,t:"open",q:"What is an amend and extend, and why would lenders agree to one?",m:"The borrower and its lenders agree to push out the maturity of existing debt, usually in exchange for economic concessions: a higher margin, an upfront amendment fee, tighter covenants, additional security, or amortisation steps.\n\nLenders agree because the alternative is often worse. If the company cannot refinance at maturity, the choice is a default and a restructuring where recoveries are uncertain and the process is expensive. Extending buys time for the business to recover or for credit markets to reopen, while the lender improves its economics and its documentation in the meantime.\n\nIt is most common when the underlying business is sound but the maturity is badly timed, hence the phrase amend and pretend when the business is not in fact sound and the extension only defers a loss.\n\nFor the company it avoids a formal process, preserves equity value and keeps the situation private."},
{c:"restr",l:2,t:"open",q:"How would you advise a company facing a large maturity in twelve months?",m:"Start with the liquidity picture: build a thirteen-week cash flow forecast and understand exactly when the company runs out of room, since that deadline drives every other decision.\n\nThen work through the options in order of least to most disruptive. Refinance in the market if credit conditions allow, potentially with a sweetener such as security or a shorter tenor. Amend and extend with the existing lender group. Raise new capital: an equity issue, a sponsor injection, or a junior tranche to take out part of the maturity. Sell non-core assets to pay it down. Draw undrawn facilities before conditions tighten.\n\nIf none of those clear it, prepare for a liability management exercise or a negotiated restructuring, ideally out of court, and consider a prepackaged filing as the backstop.\n\nThe strategic advice that matters most: start twelve months out, not three. Options narrow sharply as the maturity approaches, and negotiating leverage collapses once the company is visibly out of time."},
{c:"restr",l:3,t:"open",q:"What is liability management, and why has it become controversial?",m:"Liability management exercises are transactions that restructure debt outside a formal court process, using flexibility in the existing documentation rather than a consensual negotiation with all lenders.\n\nThe common structures: moving valuable assets into an unrestricted subsidiary and raising new debt against them, which leaves existing lenders structurally subordinated; uptiering, where a majority group amends the credit agreement to allow new super-priority debt that only they participate in; and discounted exchanges that pressure holders to swap into new paper on worse terms or be left behind.\n\nThe controversy is that these are lender-on-lender transactions. A majority group and the sponsor agree something that benefits them at the direct expense of a minority in the same original tranche, exploiting covenant-lite documentation that was never negotiated with this in mind.\n\nThe consequences: extensive litigation, and lenders now insisting on explicit blockers in new credit agreements. It has also changed how recoveries are modelled, since the priority of a claim can now be rewritten mid-life."},
{c:"restr",l:3,t:"open",q:"How does a rights offering work in a reorganisation?",m:"Creditors in one or more classes are given the right, in proportion to their claims, to subscribe for new equity in the reorganised company at a discount to plan value. The proceeds fund the plan and provide working capital on emergence.\n\nIt is usually backstopped by a group of large creditors who commit to take up whatever is not subscribed, in exchange for a backstop fee, often in the range of 5% to 10% of the committed amount, paid in cash or additional equity.\n\nWhy it is used: it raises new money from parties who already know the business, it lets creditors who believe in the recovery increase their stake, and it avoids the discount a third-party capital raise would demand from a company just emerging from bankruptcy.\n\nThe objection frequently raised by smaller creditors is that the backstop fee and the subscription discount transfer value to the largest holders, who negotiated the terms of the plan they are now being paid to backstop."},
{c:"restr",l:3,t:"open",q:"Why is liquidity, rather than leverage, usually what triggers a restructuring?",m:"Because leverage is a ratio and liquidity is a deadline. A company can carry eight times leverage indefinitely if it generates enough cash to pay interest and has no near-term maturities. It cannot survive a single missed payment.\n\nThe triggers are almost always cash events: an interest payment due with insufficient cash, a maturity that cannot be refinanced, a revolver that is fully drawn with no headroom left, a covenant breach that blocks further drawings, or a supplier tightening terms and pulling working capital out of the business.\n\nHigh leverage matters because it removes the buffer. It makes the company vulnerable to a shock, it consumes cash flow through interest, and it closes off refinancing options when markets turn.\n\nThe practical implication for advisory work: the thirteen-week cash flow forecast is the first document built in any restructuring, before any valuation work. It tells you how much time there is, and time determines what options exist."},
{c:"restr",l:3,t:"open",q:"How does a creditor recovery waterfall work in practice?",m:"Start with the value available for distribution: either the reorganised enterprise value in a going-concern plan, or the net proceeds in a liquidation after costs of sale.\n\nDeduct administrative claims first. Professional fees for the debtor's and creditors' advisers, and any DIP facility with super-priority status, come off the top and can be substantial in a long case.\n\nThen apply the claims in strict priority: secured creditors up to the value of their collateral, with any shortfall dropping into the unsecured pool as a deficiency claim; then priority unsecured claims such as certain employee and tax obligations; then general unsecured claims including bondholders, trade creditors and rejected lease damages; then subordinated debt; then preferred equity; then common equity.\n\nEach class recovers pro rata within itself, and nothing reaches the next class until the one above is satisfied in full.\n\nIn practice, senior classes often agree to give junior classes or equity a small recovery to secure consent and speed, which is a permitted deviation when the affected senior class votes for it."},

{c:"brain",l:1,t:"mc",q:"You roll two fair dice. What is the probability the total is 7?",o:["1/12","1/6","1/8","5/36"],a:1,e:"Six of the thirty-six combinations sum to seven, which is 1/6. Seven is the most likely total on two dice."},
{c:"brain",l:1,t:"mc",q:"You flip a fair coin three times. What is the probability of at least one head?",o:["1/2","5/8","3/4","7/8"],a:3,e:"The only excluded outcome is three tails, which has probability 1/8. So 1 - 1/8 = 7/8."},
{c:"brain",l:2,t:"mc",q:"A car drives 60km at 30km/h and returns the same 60km at 60km/h. What is the average speed for the trip?",o:["45 km/h","40 km/h","50 km/h","35 km/h"],a:1,e:"Total distance 120km, total time 2 + 1 = 3 hours, so 40 km/h. Averaging the two speeds gives 45 and is the trap."},
{c:"brain",l:2,t:"mc",q:"How many times do the hour and minute hands of a clock overlap in 24 hours?",o:["24","23","22","12"],a:2,e:"They overlap 11 times in each 12-hour cycle, not 12, because the hour hand keeps moving. That gives 22 in a day."},
{c:"brain",l:2,t:"mc",q:"Three switches outside a room control three bulbs inside. You may enter once. How do you identify which switch controls which bulb?",o:["It cannot be done","Turn on switch one for several minutes then off, turn on switch two, then enter: lit is two, warm is one, cold is three","Turn on all three and enter immediately","Turn on switches one and two together"],a:1,e:"The trick is using heat as a second signal alongside light, which gives you three distinguishable states from one observation."},
{c:"brain",l:3,t:"mc",q:"You have two identical eggs and a 100-floor building, and want to find the highest floor an egg survives, minimising drops in the worst case. What is the optimal worst case?",o:["10 drops","14 drops","20 drops","50 drops"],a:1,e:"Start at floor 14 and reduce the step by one each time (14, 27, 39...). That balances the two search phases so the worst case is 14 either way."},
{c:"brain",l:2,t:"open",q:"How many windows are there in Oslo?",m:"Build from housing stock and work out loud.\n\nOslo has roughly 700,000 people at about 2 people per household, so around 350,000 dwellings. Assume an average of 6 windows per dwelling, giving roughly 2.1 million residential windows.\n\nCommercial and public buildings: offices, schools, shops, hospitals. Assume these add perhaps 30% to 40% of the residential figure, so roughly 700,000 to 850,000 more.\n\nTotal in the region of 2.8 to 3 million.\n\nThen state the main sensitivities: the windows-per-dwelling assumption drives the answer more than anything else, and apartment blocks, which dominate central Oslo, have fewer windows per unit than detached houses.\n\nThe interviewer is checking whether you decompose the problem, use round numbers you can defend, and flag which assumption the answer hinges on."},
{c:"brain",l:3,t:"open",q:"How would you estimate the annual revenue of the Oslo metro system?",m:"Build from ridership.\n\nOslo's metro carries roughly 100 million journeys a year, which you can sanity-check: 700,000 residents, of whom perhaps 40% use it regularly, at around 300 to 400 journeys a year each, plus commuters from surrounding municipalities and tourists.\n\nRevenue per journey is well below the single-ticket price, because most travel is on monthly passes and discounted fares. Assume an effective yield of around 15 to 20 NOK per journey rather than the headline 40.\n\nThat gives roughly 1.5 to 2 billion NOK in fare revenue.\n\nThen flag the structural point: public transport systems in Norway are heavily subsidised, so fare revenue covers only part of operating cost, and total funding is substantially higher than ticket sales. If the question is about revenue rather than fares, you would add the public subsidy.\n\nName the yield assumption as the biggest source of error."},
{c:"brain",l:3,t:"open",q:"Estimate the weight of a Boeing 747.",m:"Decompose rather than guessing a number.\n\nPassengers and crew: roughly 400 people at 80kg each, plus 20kg of luggage, so about 40 tonnes.\n\nFuel: the aircraft has a range of around 12,000km. Rough fuel burn for a long-haul widebody is in the region of 10 to 12 tonnes per hour over a 14-hour flight, so roughly 150 tonnes at full load.\n\nStructure and systems: the empty operating weight is the hard part. Reason from scale: a length of roughly 70 metres, a wingspan of similar size, four large engines at several tonnes each, plus fuselage, wings, landing gear and interior. Estimate around 180 to 200 tonnes.\n\nTotal maximum take-off weight lands around 380 to 400 tonnes, which is close to the real figure of roughly 400 tonnes for the 747-400.\n\nThe method is the point: name the components, size each with a defensible reference, and add them up."}

{c:"acct",l:1,t:"mc",q:"Which of these is a current liability?",o:["Goodwill","Accounts payable","Long-term debt due in four years","Treasury stock"],a:1,e:"Accounts payable is owed to suppliers within the operating cycle, so it sits in current liabilities. Goodwill is a non-current asset, debt due in four years is non-current, and treasury stock is a contra-equity account."},
{c:"acct",l:1,t:"mc",q:"Accounts receivable increases by $20. What happens to cash flow from operations?",o:["Increases by $20","Decreases by $20","No change","Increases by $12 after tax"],a:1,e:"An increase in a working capital asset is a use of cash. You booked the revenue but have not collected it, so CFO falls by $20 relative to net income."},
{c:"acct",l:2,t:"mc",q:"Interest expense increases by $10. Tax rate is 40%. What happens to net income?",o:["Falls by $10","Falls by $6","Falls by $4","No change, interest is non-cash"],a:1,e:"Interest is tax-deductible, so pre-tax income falls $10 and taxes fall $4. Net income falls by $6. Cash also falls by $6 because interest is a real cash cost."},
{c:"acct",l:2,t:"open",q:"Interest expense goes up by $10. Walk me through the three statements. 40% tax rate.",m:"Income statement: pre-tax income falls $10, taxes fall $4, net income falls $6.\n\nCash flow statement: start with net income down $6. Interest is a cash expense, so there is no add-back. Cash from operations falls $6 and ending cash falls $6.\n\nBalance sheet: cash on the asset side falls $6. On the other side, retained earnings falls $6 from lower net income. Both sides fall by $6 and the balance sheet balances.\n\nIf the interest is PIK rather than cash-pay, the answer changes: you add the accrued interest back on the cash flow statement and the debt balance grows by $10 instead, so cash only rises by the $4 tax shield."},
{c:"acct",l:2,t:"mc",q:"A company repays $50 of debt principal using cash. What is the immediate effect on net income?",o:["Falls by $50","Falls by $30 after tax","No change","Rises by the interest saved"],a:2,e:"Principal repayment is a financing activity, not an expense. Net income is unchanged on the day of repayment. Only the interest saved in future periods flows through the income statement."},
{c:"acct",l:2,t:"open",q:"A company pays a $20 cash dividend. Walk me through the three statements.",m:"Income statement: no change. Dividends are a distribution of profit, not an expense, so they never touch the income statement.\n\nCash flow statement: no change to operating or investing. Cash flow from financing falls $20. Net change in cash is negative $20.\n\nBalance sheet: cash falls $20 on the asset side. Retained earnings falls $20 within shareholders' equity. The balance sheet balances.\n\nA sharp addition: if the dividend is declared but not yet paid, you instead book a dividends payable liability of $20 with no cash movement until settlement."},
{c:"acct",l:1,t:"mc",q:"Which of these does NOT appear on the balance sheet?",o:["Deferred revenue","Accumulated depreciation","Cost of goods sold","Non-controlling interest"],a:2,e:"Cost of goods sold is an income statement line for a period. The other three are balance sheet items: deferred revenue is a liability, accumulated depreciation is a contra-asset, and non-controlling interest sits in equity."},
{c:"acct",l:2,t:"mc",q:"A company switches from straight-line to accelerated depreciation for tax purposes in year one. What happens to year-one cash flow?",o:["Falls, because depreciation is higher","Rises, because cash taxes are lower","No change, depreciation is non-cash","Falls by the depreciation times the tax rate"],a:1,e:"Higher depreciation means a lower taxable income and therefore lower cash taxes in year one. Depreciation itself is non-cash, so the only cash effect is the tax shield, which is positive. It reverses in later years."},
{c:"acct",l:3,t:"open",q:"Explain deferred tax assets and deferred tax liabilities, and how they unwind.",m:"Both arise from timing differences between book accounting and tax accounting on the same economic item.\n\nA deferred tax liability means you have paid less tax to the authorities than your book expense implies, so you owe it later. The classic case is accelerated depreciation for tax versus straight-line for books, or an asset write-up in an acquisition that is not deductible for tax.\n\nA deferred tax asset means you have overpaid relative to the book expense, so it is a future benefit. Common sources are net operating loss carryforwards, accrued expenses not yet deductible, and warranty or bad debt reserves.\n\nThey unwind over time as the timing difference reverses. Accelerated depreciation front-loads the deduction, so in later years tax depreciation is lower than book, the DTL reverses, and cash taxes exceed book taxes.\n\nOn the cash flow statement, the change in net deferred taxes is a non-cash add-back in operating activities. Strong answers mention the valuation allowance: if a company is unlikely to generate enough future taxable income, a DTA is written down."},
{c:"acct",l:2,t:"mc",q:"A company negotiates longer payment terms with suppliers, stretching days payable from 30 to 60. All else equal, this:",o:["Reduces cash flow from operations","Increases cash flow from operations","Has no effect on cash flow","Increases net income"],a:1,e:"Payables are a source of cash. Paying suppliers later means cash stays in the business longer, which increases operating working capital efficiency and boosts CFO. Net income is unaffected."},
{c:"acct",l:2,t:"open",q:"What is EBITDA, and why is it criticised?",m:"EBITDA is earnings before interest, taxes, depreciation and amortisation. It is used as a rough proxy for operating cash flow that is neutral to capital structure, tax jurisdiction and depreciation policy, which makes it useful for comparing companies and for sizing debt capacity.\n\nThe criticisms are real. It ignores capital expenditure, so it flatters capital-intensive businesses where D&A is a genuine recurring cost of staying in business. It ignores working capital swings, so a company burning cash into inventory can show growing EBITDA. It ignores interest and taxes, which are unavoidable cash costs. It is also not a defined measure under IFRS or US GAAP, so management has wide latitude to present adjusted EBITDA with addbacks that flatter the number.\n\nBuffett's line is worth knowing: does management think the tooth fairy pays for capex. The practical answer in an interview is that EBITDA is a starting point, and you cross-check it against free cash flow and EBITDA less capex before you rely on it."},
{c:"acct",l:3,t:"open",q:"How do you normalise EBITDA for a comparable companies analysis?",m:"The goal is a run-rate operating number that is comparable across the set and repeatable going forward.\n\nStrip out one-time and non-recurring items: restructuring charges, litigation settlements, impairments, gains or losses on asset sales, and transaction costs. Add back items only if they are genuinely non-recurring, not if the company restructures every year.\n\nAdjust for accounting differences: capitalised versus expensed development costs, different lease treatment in older filings, and differing revenue recognition policies.\n\nAdjust for stock-based compensation consistently across the set. Many practitioners treat it as a real expense, but whichever convention you use, apply it to every company or the multiples are not comparable.\n\nAdjust for pro forma effects: a full year of an acquisition completed mid-year, or the removal of a divested business.\n\nFor private targets, add back owner compensation above market, personal expenses and related-party items. That is the classic quality-of-earnings adjustment.\n\nThe discipline is to document every adjustment, and to be able to defend why each one is genuinely non-recurring."},
{c:"acct",l:3,t:"mc",q:"A company capitalises $100 of interest incurred during construction of a new facility. Compared with expensing it, year-one net income is:",o:["Lower","Higher","Unchanged","Lower by the after-tax amount"],a:1,e:"Capitalising moves the cost off the income statement and onto the balance sheet as part of the asset's cost, so year-one net income is higher. It is then depreciated over the asset's life, so the expense is spread out rather than avoided."},
{c:"acct",l:3,t:"open",q:"When is revenue recognised, and what are the practical red flags?",m:"Under the current framework, revenue is recognised when control of a good or service transfers to the customer. The five steps are: identify the contract, identify the performance obligations, determine the transaction price, allocate that price to the obligations, and recognise revenue as each obligation is satisfied.\n\nIn practice the judgement sits in two places: how many distinct performance obligations a bundled contract contains, and whether revenue is recognised at a point in time or over time.\n\nRed flags for an analyst: receivables growing much faster than revenue, which suggests aggressive recognition or weak collection. A large and growing gap between reported revenue and cash collections. Bill-and-hold arrangements. Heavy use of estimated variable consideration. Channel stuffing near quarter end, visible as a spike in distributor inventory. And frequent restatements or changes in accounting policy.\n\nThe one-line version: revenue is recognised when the company has actually done the work, and you check that by tracing it to cash."},
{c:"acct",l:2,t:"mc",q:"On a consolidated income statement, non-controlling interest appears as:",o:["An addition to revenue","A deduction to arrive at net income attributable to the parent","Part of operating expenses","A financing cash flow only"],a:1,e:"When a parent consolidates a subsidiary it does not wholly own, 100% of the subsidiary's revenue and costs are consolidated, then the share of earnings belonging to outside shareholders is deducted to arrive at net income attributable to the parent. That is the figure used for the parent's EPS."},
{c:"acct",l:2,t:"open",q:"What do gross margin, operating margin and net margin each tell you?",m:"Gross margin is revenue less cost of goods sold, over revenue. It tells you about pricing power and the unit economics of the product itself. A software company running 80% gross margin and a grocer running 25% are structurally different businesses.\n\nOperating margin is EBIT over revenue. It adds the fixed cost base: sales and marketing, R&D, and overhead. It tells you how well the company converts gross profit into operating profit, and it is the cleanest measure of core operating performance because it is before financing and tax.\n\nNet margin is net income over revenue. It includes interest, taxes and anything non-operating, so it reflects capital structure and tax jurisdiction as much as operating quality. It is the least comparable across companies.\n\nThe useful analytical move is to look at the trend in all three. Gross margin holding but operating margin falling means the cost base is growing faster than the business. Operating margin holding but net margin falling usually points at leverage or tax."},
{c:"acct",l:3,t:"mc",q:"A company sells equipment with a book value of $40 for $60 in cash. Tax rate is 40%. What is the net change in cash?",o:["$60","$52","$36","$44"],a:1,e:"The gain is $20, taxed at 40%, so cash taxes rise $8. Cash proceeds of $60 less $8 of tax equals a net $52 increase. On the cash flow statement the $20 gain is subtracted out of operations as non-cash and the full $60 appears in investing."},
{c:"acct",l:3,t:"open",q:"A company sells a factory carried at $100 for $70 in cash. Walk me through the three statements. 40% tax.",m:"Income statement: you book a $30 loss on sale. Pre-tax income falls $30, taxes fall $12, net income falls $18.\n\nCash flow statement: start at net income down $18. Add back the $30 loss as a non-cash item, since the actual cash effect belongs in investing, so operations is up $12, which is exactly the tax saving. In investing, proceeds from the sale are a $70 inflow. Net change in cash is positive $82.\n\nBalance sheet: cash rises $82 and PP&E falls $100, so assets are down $18 net. On the other side, retained earnings falls $18 from the loss. The balance sheet balances.\n\nThe point the interviewer is testing is that you do not double count: the loss runs through the income statement, gets reversed in operations, and the full cash proceeds show up once, in investing."},
/* ==================== ENTERPRISE VALUE (expansion) ==================== */
{c:"ev",l:1,t:"mc",q:"A company repays $100 of debt using $100 of balance sheet cash. What happens to enterprise value?",o:["Falls by $100","Rises by $100","No change","Falls by $100 times one minus the tax rate"],a:2,e:"Debt falls $100 and cash falls $100, so net debt is unchanged and enterprise value is unchanged. Equity value is also unchanged. This is the cleanest illustration that EV is capital-structure neutral."},
{c:"ev",l:2,t:"open",q:"Why is enterprise value sometimes called takeover value?",m:"Because it approximates what an acquirer actually has to fund to own the whole business free and clear.\n\nYou pay the equity holders their value, you assume or refinance the debt, you take on any preferred stock and non-controlling interests, and you get the target's cash, which offsets part of the cost. That is exactly the enterprise value bridge.\n\nThe caveats matter, and mentioning them separates a good answer. In reality you pay a control premium over the current equity value, not the market price. Debt often has change-of-control puts, so it has to be repaid at par or a premium rather than simply assumed. Not all cash is available: some is trapped offshore or needed for operations. And there are off-balance-sheet items such as pension deficits and litigation reserves that behave like debt in a negotiation.\n\nSo enterprise value is the right conceptual frame for what you are buying, but the actual funds flow in a deal is built line by line in a sources and uses table."},
{c:"ev",l:2,t:"mc",q:"A company pays a $50 cash dividend. What happens to enterprise value?",o:["Falls by $50","Rises by $50","No change","Falls by $50 after tax"],a:2,e:"Cash falls $50 so net debt rises $50, while equity value falls $50 as the share price adjusts. The two moves offset and enterprise value is unchanged. The operating business is exactly as valuable as it was the day before."},
{c:"ev",l:2,t:"mc",q:"Fully diluted shares rather than basic shares are used in equity value because:",o:["It is required by IFRS","In-the-money securities will convert and claim a share of value","It always produces a more conservative multiple","Basic shares exclude treasury stock"],a:1,e:"Anyone holding in-the-money options, warrants, RSUs or convertibles has a claim on the equity, and an acquirer has to pay for those claims. Ignoring them understates equity value and therefore understates enterprise value and every multiple built on it."},
{c:"ev",l:2,t:"open",q:"How do you treat restricted stock units and performance shares in a diluted share count?",m:"Restricted stock units that have vested are already outstanding shares, so they are in the basic count. Unvested RSUs have no strike price, so the treasury stock method does not apply in the usual way: there are no exercise proceeds to buy back shares. The convention is to add the full number of unvested RSUs to the diluted count, sometimes adjusted for expected forfeitures.\n\nPerformance share units are contingent on hitting targets. The standard treatment is to include the number that would vest based on performance to date, which is what the company discloses in its equity compensation footnote. If performance is tracking below threshold, you may exclude them, but you should flag the assumption.\n\nOptions and warrants are different: those have a strike, so you run the treasury stock method on them.\n\nThe practical point is that you pull all of this from the equity compensation footnote and the cover page share count of the most recent filing, and you use the most recent share count rather than the weighted average that the EPS calculation uses."},
{c:"ev",l:3,t:"mc",q:"How should a large net operating loss carryforward be handled in enterprise value?",o:["Added to enterprise value like debt","Ignored entirely","Treated as a non-operating asset that reduces effective purchase price","Netted against goodwill"],a:2,e:"An NOL is a non-operating asset: it saves future cash taxes but is not produced by the operating business. Practitioners typically value it separately, often on a present-value basis, and treat it like cash in the bridge. Note that acquisitions trigger limits on how fast the NOL can be used."},
{c:"ev",l:3,t:"open",q:"How do you treat joint ventures and equity method investments when calculating enterprise value?",m:"Equity method investments, where the company owns roughly 20% to 50% and does not consolidate, are non-operating assets. The income statement picks up only the company's share of the investee's net income in a single line below operating income, so none of that investee's revenue or EBITDA is in your denominator.\n\nThat means you must subtract the value of the stake from enterprise value, exactly as you would subtract cash. Otherwise the numerator includes an asset the denominator has no earnings from, and the multiple is overstated.\n\nUse market value where the stake is in a listed company. Where it is private, book value is the fallback, but it is often stale, so a better approach is to apply a multiple to the investee's own earnings and take your pro rata share.\n\nThe mirror image is non-controlling interest. When the company consolidates a subsidiary it only partly owns, 100% of that subsidiary's EBITDA is in the denominator, so you add the NCI to enterprise value to keep numerator and denominator consistent.\n\nThe underlying rule for the whole bridge is simple: if the earnings are in the denominator, the claim belongs in the numerator."},
{c:"ev",l:2,t:"mc",q:"Under current accounting standards, finance and operating lease liabilities are:",o:["Excluded from enterprise value entirely","Both capitalised on the balance sheet, with the liability typically added to enterprise value","Only relevant for retailers","Deducted from enterprise value like cash"],a:1,e:"Since IFRS 16 and ASC 842, both lease types are capitalised as a right-of-use asset with a matching liability. Most practitioners add the lease liability to net debt, and must then use a consistent EBITDA. The critical thing is consistency across the comp set."},
{c:"ev",l:2,t:"open",q:"Why do EV-based multiples travel better across countries than P/E?",m:"Because P/E is contaminated by everything that sits between EBIT and net income, and those things differ enormously by jurisdiction.\n\nTax rates differ, so two identical operating businesses in different countries produce different net income and therefore different P/E, with no difference in operating quality.\n\nCapital structure differs. Companies in bank-dominated markets often carry more leverage, which depresses net income and inflates P/E relative to an unlevered peer.\n\nAccounting for depreciation and amortisation differs, and amortisation of acquired intangibles in particular varies with deal history rather than with economics.\n\nEV/EBITDA strips all three out: it compares the value of the whole operating business to the operating cash earnings of that business, before financing and tax choices.\n\nThe honest caveat is that EV/EBITDA does not fix everything. Capital intensity still differs, so EV/EBIT or EV/EBITDA less capex is often the better cross-border comparison for heavy industry, and local accounting for leases, pensions and capitalised development costs still needs normalising."},
{c:"ev",l:3,t:"mc",q:"A company has a market cap of $400m, debt of $200m and cash of $300m. What is its enterprise value?",o:["$900m","$300m","$500m","Negative $100m"],a:1,e:"Enterprise value is $400m plus $200m less $300m, which is $300m. Net debt is negative $100m. This profile is common in cash-rich technology companies and means the market values the operating business at well below the equity market cap."},
{c:"ev",l:3,t:"open",q:"How do you calculate enterprise value for a company with multiple share classes?",m:"You value every class and add them together. A single class times the listed price is the most common mistake.\n\nThe usual structure is a listed Class A with one vote and an unlisted or thinly traded Class B with ten votes, held by founders. Both classes have identical economic rights in most structures, so the standard approach is to apply the listed Class A price to the total share count across all classes.\n\nWhere economic rights genuinely differ, for example a class with a preferential dividend or a different liquidation preference, you have to value each class on its own terms.\n\nWhere the super-voting class trades separately at a premium, you have a judgement call. Most practitioners still use the liquid class's price for both, because the voting premium usually disappears in a change of control where all classes are typically collapsed into one.\n\nThe practical mechanics: pull the share count for each class from the cover page of the latest 10-K or 10-Q rather than from a data provider, because providers are inconsistent about whether they include all classes. Then add options, RSUs and convertibles on top as usual.\n\nSame discipline applies to up-C structures, where partnership units held by founders are exchangeable into public shares and must be included."},
{c:"ev",l:2,t:"mc",q:"Under the treasury stock method, the proceeds from option exercise are assumed to be used to:",o:["Pay a special dividend","Repurchase shares at the current market price","Repay debt","Fund capital expenditure"],a:1,e:"The method assumes the company collects the strike price from option holders and immediately uses that cash to buy back shares in the market. The net share increase is therefore the options outstanding less the shares repurchased, which shrinks as the share price rises above the strike."},
{c:"ev",l:2,t:"open",q:"What is the difference between basic and diluted shares, and when does the gap matter most?",m:"Basic shares are the shares actually outstanding today. Diluted shares add the shares that would exist if all in-the-money dilutive securities converted: options and warrants via the treasury stock method, convertible bonds and preferred via the if-converted method, plus unvested RSUs and performance shares.\n\nThe gap matters most in three situations.\n\nFirst, in high-growth technology companies, where stock-based compensation is a large share of total pay. Dilution of 5% to 15% is common and it materially changes equity value.\n\nSecond, when a share price has risen sharply. Options that were far out of the money become deeply in the money, and the treasury stock method share count balloons. A valuation built on a stale share count understates equity value badly.\n\nThird, in companies with convertible bonds outstanding. A convert that moves in the money can add a large block of shares at once, and whether the company settles in cash or shares changes the answer.\n\nFor valuation you always use diluted. For EPS, GAAP reports both, and diluted EPS is the one analysts quote."},
{c:"ev",l:3,t:"open",q:"Walk me through how you would build a fully diluted share count from a public filing.",m:"Start with the cover page of the most recent 10-Q or 10-K. It gives the actual shares outstanding as of a date shortly before filing, which is more current than the weighted average used in the EPS calculation. That is your basic count.\n\nThen go to the equity compensation footnote. Pull the options outstanding by tranche, with weighted average exercise prices. Apply the treasury stock method to each tranche that is in the money against the current share price: add the option count, subtract the shares repurchasable with the proceeds. Skip the out-of-the-money tranches.\n\nAdd unvested RSUs in full, since there are no exercise proceeds. Add performance shares at the level management expects to vest.\n\nThen handle convertibles from the debt footnote. Check the conversion price. If the convert is in the money, apply the if-converted method, adding the conversion shares and removing the after-tax interest expense from earnings. If it is out of the money, leave it as debt in the enterprise value bridge.\n\nAdd warrants the same way as options, and in an up-C structure add exchangeable partnership units.\n\nFinally, check subsequent events and recent 8-Ks for any large issuance, buyback or acquisition-related share issuance after the balance sheet date. This is the step people skip, and it is the one that most often makes the number wrong."},
];

const Q10 = [
/* ======================== VALUATION (expansion) ======================== */
{c:"val",l:1,t:"mc",q:"Which of these is an intrinsic valuation method rather than a relative one?",o:["Comparable companies","Precedent transactions","Discounted cash flow","Premiums paid analysis"],a:2,e:"A DCF values a business off its own projected cash flows and risk, so it is intrinsic. Comps, precedents and premiums paid all price the company by reference to what the market pays for something else, so they are relative."},
{c:"val",l:2,t:"mc",q:"You are valuing a company using both LTM and NTM multiples and they differ sharply. The most likely explanation is:",o:["An error in the share count","A material change in expected growth or a one-off in the trailing period","A different tax rate","The comp set is too large"],a:1,e:"The gap between trailing and forward multiples is the market's view on the next twelve months. A high LTM and low NTM multiple means earnings are expected to grow sharply, or the trailing period contained a depressed one-off. Always state which basis you are quoting."},
{c:"val",l:2,t:"open",q:"Why do you use the median rather than the mean in a comp set?",m:"Because the mean is distorted by outliers, and comp sets are small enough that one outlier moves it a long way.\n\nWith eight comparables, a single company trading at 40x when the rest trade between 9x and 13x will drag the mean several turns above anything defensible. The median ignores the magnitude of the outlier and reports the middle of the distribution, which is a better description of where the group actually trades.\n\nIn practice you show both, plus the high, low and quartiles, and you usually anchor the valuation range on the interquartile range rather than a single point.\n\nThe better answer goes one step further: rather than mechanically taking the median, you ask why the outlier trades where it does. If the 40x company is growing at 40% and the others at 5%, the honest conclusion is that it does not belong in the set, or that the set needs to be regressed on growth rather than averaged."},
{c:"val",l:2,t:"mc",q:"A minority stake in a public company trades at a discount to a control valuation primarily because:",o:["Minority holders pay higher taxes","A minority holder cannot direct strategy, cash flows or a sale","Minority shares are less liquid","Accounting rules require it"],a:1,e:"Control has value because it lets the owner change management, redirect capital, capture synergies and choose when to sell. A minority holder gets none of that, so the same cash flows are worth less to them. The mirror of this is the control premium paid in M&A."},
{c:"val",l:2,t:"open",q:"What is a discount for lack of marketability, and when does it apply?",m:"It is the reduction in value applied to an equity interest that cannot be readily sold, reflecting the fact that a buyer will pay less for an asset they cannot exit quickly.\n\nIt applies most often to private company equity, to restricted or lock-up shares in a public company, and to minority stakes in family businesses. It is central in fairness opinions, estate and tax valuations, and in pricing secondary transactions in private company stock.\n\nTypical ranges cited in practice run from around 10% to 30%, with the empirical evidence drawn from restricted stock studies and pre-IPO studies. The size depends on the expected holding period, the prospects of a liquidity event, the company's dividend policy and whether there is any contractual exit such as a put right or a drag-along.\n\nThe important distinction for an interview is that this is separate from the control discount. One reflects the inability to direct the business, the other the inability to sell it, and a minority stake in a private company can suffer both."},
{c:"val",l:3,t:"open",q:"How do you build a valuation range rather than a single number?",m:"You triangulate across methodologies and present the overlap.\n\nEach method gives its own range. Comps give a range from the interquartile spread of the peer multiples applied to your company's metric. Precedents give a range from the transaction multiple spread, usually higher because of control and synergies. A DCF gives a range from a sensitivity grid on WACC and terminal growth, or terminal multiple. An LBO gives a floor, being the most a sponsor could pay and still hit their return hurdle.\n\nYou then lay them out on a football field chart and look for where the bars overlap. That overlap, not the midpoint of any one method, is the defensible range.\n\nJudgement enters in two places: which methods you weight most heavily given the business, and whether you are advising a buyer or a seller. For a stable regulated utility you lean on the DCF and dividend-based methods. For a high-growth technology company with volatile near-term cash flows you lean on comps and precedents.\n\nThe discipline is that every bar on the chart must be defensible line by line, because the first question you get is why the top of the range is where it is."},
{c:"val",l:2,t:"mc",q:"A company with high and growing capital expenditure relative to depreciation will typically look:",o:["Cheap on EV/EBITDA and expensive on EV/EBIT","Expensive on both","Cheap on both","Identical on both"],a:0,e:"EBITDA ignores the capital intensity entirely, so a capex-heavy business looks cheap on EV/EBITDA. EBIT captures depreciation, which for a growing asset base is rising, so the same company looks more expensive on EV/EBIT. That gap is exactly why you check both."},
{c:"val",l:3,t:"open",q:"How would you value a subscription software business?",m:"You value it on the economics of the recurring revenue base rather than on current profitability, because a growing subscription business deliberately spends ahead of revenue.\n\nStart with the revenue multiple, because EBITDA is often negative. EV/ARR or EV/NTM revenue is the market convention, and the multiple is set almost entirely by growth rate and net revenue retention. The rule-of-40 framing, growth plus free cash flow margin, is the standard cross-check.\n\nThen go underneath the multiple to the unit economics: gross retention and net retention, customer acquisition cost payback in months, gross margin, and the ratio of lifetime value to acquisition cost. A business with 120% net retention compounds without winning a single new customer, and that is what justifies the multiple.\n\nFor a DCF, the honest approach is to model the cohort: existing customers with their retention curve, plus new cohorts with a sales and marketing cost attached. The reason the naive DCF fails is that current free cash flow is depressed by growth spending that is really an investment.\n\nA useful sanity check is the steady-state margin: strip sales and marketing back to a maintenance level and ask what margin the business would print if it stopped growing. That number, not today's loss, is what the terminal value should reflect."},
{c:"val",l:3,t:"mc",q:"In a premiums paid analysis, the premium is normally measured against:",o:["The target's book value","The target's unaffected share price before any leak or rumour","The acquirer's share price","The sector median multiple"],a:1,e:"You measure against the unaffected price, typically one day, one week and one month before the first rumour or announcement. Using the price after a leak understates the premium, because the market has already partly priced in the deal."},
{c:"val",l:2,t:"open",q:"Your DCF, comps and precedents give wildly different answers. How do you present that?",m:"You do not average them and hope nobody notices. You explain the divergence, because the divergence is the analysis.\n\nFirst diagnose it. A DCF far above comps usually means your projections are more optimistic than the market's, or your WACC is too low, so you check the implied exit multiple against where the comps trade. A DCF far below comps means the market is pricing in growth or optionality your model does not capture. Precedents above comps is normal and reflects control and synergies, but a very large gap may mean the transactions are from a different cycle or involved strategic buyers with unusual synergies.\n\nThen present each method with its own range on a football field, say clearly which you weight most and why, and state the assumption that drives the gap. The useful phrasing is: comps imply the market expects X, our projections assume Y, and here is what has to be true for Y.\n\nFor a client this is more useful than a single number, because it converts a valuation debate into a debate about specific assumptions, which is a debate that can actually be resolved."},
{c:"val",l:3,t:"open",q:"How would you value a company with a large non-core division?",m:"Sum of the parts, and the reason is that a blended multiple on consolidated earnings will misprice both halves.\n\nSegment the business by its reporting segments or, better, by the way it actually competes. For each segment, build or source its own revenue, EBITDA and capital intensity, then apply the multiple from that segment's own peer set. A distribution arm at 7x and a software arm at 20x cannot be captured by a single consolidated multiple.\n\nSum the segment enterprise values, then apply corporate adjustments: unallocated corporate overhead, usually capitalised at a multiple and subtracted, plus net debt, pension deficits, non-controlling interests and non-operating assets.\n\nThe interesting part of the answer is the conglomerate discount. Sum of the parts often shows the whole trading below the parts, which raises the strategic question of whether the non-core division should be sold or spun. That is frequently the pitch: here is the value trapped inside the structure, and here is how a separation releases it.\n\nThe practical difficulty is segment disclosure. If the company does not report segment EBITDA or capital employed, you are estimating, and you should show the sensitivity to that estimate."},
{c:"val",l:2,t:"mc",q:"Which of these is the strongest argument for a company trading at a premium to its peer group?",o:["A larger absolute revenue base","Structurally higher returns on invested capital","A higher dividend payout ratio","More outstanding shares"],a:1,e:"Multiples are ultimately driven by growth, returns and risk. A business that earns returns well above its cost of capital creates value with every incremental dollar invested, which justifies a premium. Size alone, payout policy and share count do not."},
{c:"val",l:3,t:"open",q:"How do you value a cyclical business at the top of its cycle?",m:"You do not apply a multiple to peak earnings, because both the earnings and the multiple are cyclical and mispricing them compounds.\n\nThe standard approach is mid-cycle or normalised earnings. Take the average margin over a full cycle, ideally seven to ten years covering at least one downturn, apply it to current revenue or to a normalised revenue level, and then apply a multiple that is also the mid-cycle average rather than today's.\n\nThe classic trap is that cyclicals look cheapest at the top, on a low P/E against peak earnings, and most expensive at the bottom, on a high P/E against trough earnings. A low multiple on a cyclical is often a warning rather than an opportunity.\n\nCross-checks that help: price to book or EV per unit of capacity, which are more stable through the cycle. Replacement cost, which sets a rough ceiling since above it new capacity gets built. And an explicit through-the-cycle DCF, which forces you to state a view on the cycle rather than hide it in a multiple.\n\nFor commodity businesses you also anchor on the marginal cost of production, since price gravitates toward the cost of the highest-cost producer that the market needs."},
{c:"val",l:3,t:"open",q:"When is book value a meaningful valuation anchor?",m:"When assets are marked close to their economic value and the business earns roughly its cost of capital on them.\n\nThat is why price to book is the standard for banks and insurers. Their assets are largely financial instruments carried at or near fair value, regulatory capital is measured against book, and the link between price to book and return on equity is tight: a bank earning above its cost of equity trades above book, one earning below trades below.\n\nIt is also relevant for asset-heavy and asset-backed businesses such as shipping, real estate and some resource companies, where the asset has an observable market price, and in liquidation or deep distress, where you care about recovery on assets rather than going-concern earnings.\n\nIt is close to meaningless for asset-light businesses. A software or services company's real assets are code, brand and people, none of which are on the balance sheet, so book value understates the business badly. Book value is also distorted by acquisition history, since goodwill from past deals inflates it, and by buybacks, which can drive book equity negative.\n\nThe cleanest framing: book value matters when the balance sheet is the business."},
/* =========================== DCF (expansion) =========================== */
{c:"dcf",l:1,t:"mc",q:"In a DCF, the discount rate reflects:",o:["The company's historical return on equity","The risk of the cash flows being discounted","The risk-free rate only","The company's tax rate"],a:1,e:"The discount rate is the required return for bearing the risk of those specific cash flows. Unlevered cash flows belong to all capital providers so you use WACC; levered cash flows belong only to equity so you use cost of equity."},
{c:"dcf",l:2,t:"mc",q:"Terminal-year EBITDA is $250m and you apply an 8.0x exit multiple. What is the terminal value?",o:["$1,600m","$2,000m","$1,250m","$450m"],a:1,e:"Exit multiple terminal value is simply the multiple applied to the terminal-year metric: 8.0 times $250m equals $2,000m. Remember this is an undiscounted figure sitting at the end of the forecast, so it still has to be discounted back to today."},
{c:"dcf",l:2,t:"mc",q:"Which of these would you NOT include in unlevered free cash flow?",o:["Capital expenditure","Change in net working capital","Interest expense","Cash taxes on EBIT"],a:2,e:"Unlevered free cash flow is before financing, so interest is excluded. Including it double counts: interest is already reflected in the WACC used to discount, and adding it to the cash flows would penalise the company twice for its leverage."},
{c:"dcf",l:2,t:"open",q:"How do you decide on the length of the explicit forecast period?",m:"The forecast runs until the business reaches a steady state, meaning stable growth, stable margins and a stable reinvestment rate, because the terminal value formula assumes exactly that.\n\nFive to ten years is the normal range. Five years is the default for a mature business where the current run rate is close to steady state. Ten years or more is appropriate where the company is still scaling, where margins are expanding toward a structural level, or where there is a long contracted revenue profile such as infrastructure or pharma with patent cliffs.\n\nThe tension is real: a longer horizon means less value in the terminal value, which feels more rigorous, but the incremental years are forecasts you cannot defend. A shorter horizon is more honest about your visibility but pushes seventy or eighty percent of value into the terminal calculation.\n\nThe practical test is to look at the final forecast year and ask whether it is a fair representation of the business in perpetuity. If the final year still has margins expanding 200 basis points and revenue growing 20%, the forecast is too short, because the Gordon growth formula will capitalise an unsustainable state forever.\n\nFor genuinely long-cycle assets such as mines or concessions you drop the perpetuity entirely and model the finite asset life to zero."},
{c:"dcf",l:3,t:"mc",q:"You increase WACC from 9% to 10% and reduce terminal growth from 3% to 2%. The terminal value under Gordon growth will:",o:["Fall modestly","Fall sharply","Rise","Stay roughly the same"],a:1,e:"The denominator is WACC less growth, which goes from 6% to 8%. That is a one-third increase in the denominator, so terminal value falls by about 25%. Small changes to both inputs compound because they both act on a narrow spread."},
{c:"dcf",l:3,t:"open",q:"What is the implied perpetuity growth rate, and why do you calculate it?",m:"It is the growth rate embedded in your terminal value when you have used the exit multiple method instead of Gordon growth. You take the terminal value the multiple produces, then solve the Gordon growth formula backwards for g: g equals WACC minus the terminal cash flow divided by the terminal value.\n\nYou calculate it as a sanity check. The exit multiple method is popular because it feels market-grounded, but a multiple carries an implicit growth assumption, and it is easy to pick a multiple that implies something absurd. If your 12x exit multiple implies 5% perpetual growth while the economy grows at 2%, you are assuming the company eventually becomes larger than the economy, which is not a defensible position.\n\nThe reverse check matters too. If you used Gordon growth, you calculate the implied exit multiple and compare it to where the comps trade today. A 2% growth assumption that implies a 4x exit multiple in a sector trading at 10x means your discount rate is too high or your terminal cash flow is understated.\n\nGood practice is to run both methods and show that they converge. When they do not, you have found the assumption that needs defending, and that is usually the most valuable output of the whole exercise."},
{c:"dcf",l:2,t:"mc",q:"Capital expenditure equals depreciation and net working capital is flat. Unlevered free cash flow is therefore approximately:",o:["EBITDA","EBIT after tax","Net income","EBITDA less interest"],a:1,e:"UFCF is EBIT after tax, plus D&A, less capex, less the change in working capital. If capex equals D&A they cancel and working capital contributes nothing, leaving tax-effected EBIT, also called NOPAT. This is the standard steady-state simplification."},
{c:"dcf",l:3,t:"open",q:"How would you treat a company with large, lumpy capital expenditure in a DCF?",m:"You model the lumpiness explicitly in the forecast period and normalise it in the terminal value.\n\nIn the explicit years, put the capex in the year it actually happens rather than smoothing it, because timing affects the discounted value and because a company that must build a new plant in year three has a genuinely different cash profile from one that spends evenly. Separate maintenance capex from growth capex, and link growth capex to the revenue it supports so the model is internally consistent.\n\nExtend the forecast period if necessary so it ends after the major spending cycle completes. Ending the explicit period in a heavy investment year and then capitalising that year forever will badly understate value.\n\nIn the terminal year, normalise capex to a sustainable maintenance level, which for a steady-state business means capex roughly equal to depreciation, adjusted upward for inflation and for any real growth you are assuming. If you assume 2% perpetual growth, terminal capex has to exceed depreciation enough to fund that growth, otherwise you are assuming growth without investment.\n\nThe cross-check is the terminal-year return on invested capital. If your terminal assumptions imply the business earns 40% returns forever with minimal reinvestment, competition says you are wrong."},
{c:"dcf",l:3,t:"mc",q:"A comparable company has a levered beta of 1.32, a debt-to-equity ratio of 60% and a tax rate of 25%. What is its approximate unlevered beta?",o:["0.91","1.32","1.92","0.79"],a:0,e:"Unlevered beta equals levered beta divided by one plus one minus the tax rate times debt over equity. That is 1.32 divided by 1 plus 0.75 times 0.6, so 1.32 divided by 1.45, which is about 0.91. Unlevered beta is always below levered beta because you are stripping out financial risk."},
{c:"dcf",l:2,t:"open",q:"How do you build a sensitivity table, and what should it show?",m:"The standard output is a two-way data table with WACC on one axis and either terminal growth or exit multiple on the other, showing implied share price or enterprise value in the cells.\n\nThe centre of the table should be your base case, with the axes stepped symmetrically around it, typically in 25 or 50 basis point increments for WACC and growth, or half-turn increments for the exit multiple. Five by five or seven by seven is the usual size.\n\nBut WACC and terminal growth are the least interesting sensitivities, because they are financial assumptions rather than business ones. The tables that actually inform a decision flex the operating drivers: revenue growth against EBITDA margin, price against volume, or customer retention against acquisition cost. Those tell a client which part of the business plan they need to be right about.\n\nThe interpretation matters as much as the table. You want to say something like: the valuation supports the offer price across the full range of WACC we consider reasonable, but it only works if margins hold above 18%. That converts a grid of numbers into a statement about risk.\n\nA scenario analysis complements the table, because it flexes several linked assumptions together in a coherent story rather than one at a time."},
{c:"dcf",l:3,t:"open",q:"Your DCF gives a value 40% above the current share price. What do you do?",m:"Assume you are wrong before you assume the market is, and work through the possibilities in order.\n\nFirst check the mechanics: discount periods, mid-year convention applied consistently, terminal value discounted for the right number of years, net debt as of the right date, diluted share count current. Simple errors account for most large gaps.\n\nSecond, check the implied multiples. Calculate what your enterprise value implies on this year's and next year's EBITDA, and compare it to where the comps trade. If your DCF implies 18x in a sector trading at 10x, the model is saying this company deserves a 80% premium to peers, and you need a reason.\n\nThird, interrogate the assumptions. The usual culprits are a revenue growth rate that stays above the market's forever, a margin that expands without a mechanism, a WACC below what the equity market would demand, or a terminal growth rate near the discount rate.\n\nFourth, consider that the market may be pricing in something your model is not: a known regulatory risk, a customer concentration issue, a pending patent expiry, or simply disbelief in management guidance.\n\nOnly after all that do you conclude the stock is undervalued. And the right output is not a point estimate but a statement of what has to be true: the market is pricing 3% growth, we think it is 6%, and the difference is worth X per share."},
{c:"dcf",l:2,t:"mc",q:"A company's cost of equity is 9%, pre-tax cost of debt is 5%, tax rate 25%, and the capital structure is 50% debt and 50% equity. WACC is:",o:["7.0%","6.375%","5.75%","8.0%"],a:1,e:"Equity contributes 0.5 times 9%, which is 4.5%. Debt contributes 0.5 times 5% times 0.75, which is 1.875%. WACC is 6.375%. The tax shield only applies to the debt component."},
{c:"dcf",l:3,t:"open",q:"How does country risk factor into a DCF for an emerging market company?",m:"There are two defensible routes, and the important thing is not to double count by using both.\n\nThe first is to adjust the discount rate. You add a country risk premium to the cost of equity, most commonly derived from the sovereign credit default swap spread or the yield spread of that country's dollar-denominated bonds over US Treasuries, sometimes scaled up by the ratio of equity market volatility to bond market volatility. Damodaran's published country risk premiums are the standard reference. You then apply it in full or partially, depending on how much of the company's revenue is genuinely exposed to that country.\n\nThe second, and the one most practitioners prefer conceptually, is to adjust the cash flows. You build explicit scenarios including expropriation, currency controls, devaluation or demand collapse, and probability-weight them, then discount at a rate that reflects only business risk. This is cleaner because country risk is mostly a distribution problem, not a systematic risk problem, and because a single premium applied to the discount rate penalises distant cash flows disproportionately.\n\nSeparately, decide the currency. Either forecast in local currency and discount at a local nominal rate consistent with local inflation, or forecast in dollars and discount at a dollar rate. Mixing them, for example dollar cash flows at a local nominal rate, is the most common error."},
{c:"dcf",l:3,t:"open",q:"Why might two analysts building a DCF on the same company reach very different answers?",m:"Because a DCF has a handful of inputs that compound, and each one carries genuine judgement.\n\nThe terminal value is the biggest single source. It is typically 60% to 80% of total value, and it swings on two numbers, WACC and terminal growth, whose difference sits in the denominator. A 50 basis point difference in each can move value by 20% or more.\n\nThe discount rate itself is built from estimates: which risk-free rate, which equity risk premium, which beta over which period against which index, whether to use current or target capital structure, and whether to add size or country premiums.\n\nThe operating forecast is where most of the real disagreement lives. Two analysts with different views on the addressable market, competitive intensity or achievable margin will produce different cash flows, and that is a genuine analytical disagreement rather than a modelling one.\n\nSmaller choices add up: mid-year convention or not, stock-based compensation treated as an expense or added back, how NOLs and the tax rate are modelled, working capital as a percentage of revenue or driven by days, and the treatment of leases, pensions and non-operating assets.\n\nThis is precisely why the sensitivity table and the implied multiple cross-check exist. The DCF's value is not the point estimate, it is that it forces every assumption into the open where it can be argued about."},
];

const Q11 = [
/* =========================== M&A (expansion) =========================== */
{c:"ma",l:1,t:"mc",q:"In a merger model, the exchange ratio is:",o:["The premium paid over the unaffected price","The number of acquirer shares issued per target share","The ratio of synergies to purchase price","The pro forma ownership split"],a:1,e:"The exchange ratio is how many acquirer shares each target shareholder receives for one target share. It equals the offer price per target share divided by the acquirer's share price, and it determines both new shares issued and the pro forma ownership split."},
{c:"ma",l:2,t:"mc",q:"A fixed exchange ratio rather than a fixed price means the target's shareholders bear:",o:["No market risk","The risk of the acquirer's share price moving before close","Only the regulatory risk","The financing risk"],a:1,e:"Under a fixed exchange ratio the number of shares is locked but their value floats with the acquirer's price, so the target carries that risk. A fixed value deal locks the price and floats the share count, putting the dilution risk on the acquirer."},
{c:"ma",l:2,t:"open",q:"What is a collar in a stock deal, and why would parties use one?",m:"A collar is a mechanism that caps how far the consideration can move as the acquirer's share price moves between signing and closing, bridging the gap between a fixed exchange ratio and a fixed value.\n\nA fixed exchange ratio protects the acquirer from issuing more shares than planned but leaves the target exposed if the acquirer's stock falls. A fixed value protects the target but exposes the acquirer to unlimited dilution. A collar sets a band.\n\nIn a fixed exchange ratio collar, the ratio is fixed while the acquirer's price stays inside the band, and adjusts outside it to hold value constant. In a fixed value collar, the value is fixed inside the band and the ratio is capped outside it.\n\nThey are used where there is a long gap to close, usually because of antitrust or regulatory review, or where the acquirer's stock is volatile, and where the two sides genuinely disagree about which way the acquirer's price will move.\n\nCollars often come with walk-away rights: if the acquirer's stock falls below a floor, the target can terminate unless the acquirer tops up the consideration. That is the provision that actually gets negotiated hardest."},
{c:"ma",l:2,t:"mc",q:"In purchase accounting, the write-up of the target's PP&E to fair value creates:",o:["Additional goodwill","Additional depreciation that reduces future net income","An immediate cash outflow","A deferred tax asset"],a:1,e:"Writing an asset up to fair value increases its depreciable base, so future depreciation rises and pro forma net income falls. It also usually creates a deferred tax liability, because the write-up is generally not deductible for tax."},
{c:"ma",l:3,t:"open",q:"Walk me through the sources and uses table for an acquisition.",m:"Uses are everything you have to pay for. The largest line is the equity purchase price, which is the offer price per share times fully diluted shares. Then the repayment of the target's existing debt, if it has change-of-control provisions or the structure requires refinancing. Then any call premium or make-whole on that debt. Then transaction fees: advisory, financing fees, legal, accounting and other costs. Sometimes a cash-out of in-the-money options separately if not already in the diluted count.\n\nSources are how you fund it. New debt across the tranches: revolver drawn, term loans, senior notes. Equity issued, either new acquirer shares in a stock deal or sponsor equity in a buyout. Cash from the acquirer's own balance sheet. And importantly, the target's excess cash, which is available to the buyer at close and reduces the net funding need.\n\nSources must equal uses. The equity cheque or share issuance is normally the plug that makes it balance once the debt is sized by leverage capacity.\n\nThe details that show experience: distinguishing funded from unfunded fees, remembering that original issue discount reduces the proceeds from a term loan, and noting that minimum cash must stay in the business rather than being used to fund the deal."},
{c:"ma",l:3,t:"mc",q:"An acquirer with a P/E of 25x acquires a target at an effective P/E of 15x in an all-stock deal. Ignoring synergies, the deal is:",o:["Dilutive","Accretive","Neutral","Impossible to determine"],a:1,e:"In an all-stock deal you compare the two P/E multiples. Buying earnings at 15x using shares valued at 25x means you acquire more earnings than you give up, so EPS rises. The rule is that an all-stock deal is accretive when the acquirer's P/E exceeds the target's effective P/E including the premium."},
{c:"ma",l:2,t:"open",q:"What is the difference between a merger of equals and an acquisition?",m:"Economically the difference is smaller than the label suggests, but the distinction matters for how the deal is run and sold.\n\nIn a merger of equals, the two companies are of similar size, consideration is typically all stock, the premium is small or nominal, ownership is split close to proportionally, and governance is shared: board seats divided, a defined leadership succession, sometimes a new name and dual headquarters. The framing avoids the appearance of one side losing.\n\nIn an acquisition, one party clearly buys the other, pays a control premium, and takes control of the board and management.\n\nThe practical reasons to structure as a merger of equals: no control premium means less value transferred to the other side's shareholders, it can be easier to get target management and board support, and it may receive better treatment from regulators and employees.\n\nThe practical problem is that shared governance frequently fails. Ambiguous leadership slows integration, culture clashes go unresolved because neither side has the authority to impose a decision, and the promised synergies arrive late or not at all. Most mergers of equals end up with one side effectively in control within two years, and the honest interview answer notes that."},
{c:"ma",l:3,t:"mc",q:"Which of these would typically NOT be a condition precedent to closing an acquisition?",o:["Antitrust clearance","Shareholder approval","Absence of a material adverse change","The acquirer's share price remaining above a level"],a:3,e:"Share price is not normally a closing condition, which is precisely why collars and walk-away rights exist as negotiated exceptions. Regulatory clearance, shareholder votes and the absence of a material adverse change are standard conditions in almost every deal."},
{c:"ma",l:3,t:"open",q:"What is a material adverse change clause, and how often does it actually work?",m:"A MAC or MAE clause lets a buyer walk away if the target suffers a materially adverse change in its business, financial condition or prospects between signing and closing.\n\nIn practice the clause is heavily negotiated and heavily carved out. Standard exclusions are changes in general economic or market conditions, changes affecting the industry as a whole, changes in law or accounting standards, acts of war or terrorism, pandemics in more recent drafting, and the effects of announcing the deal itself. The carve-outs usually come back with a disproportionate effect qualifier, meaning a general industry downturn only counts if it hits this target far worse than its peers.\n\nThe result is that MAC clauses almost never succeed. Delaware courts set an extremely high bar: the change must be durationally significant, measured in years not quarters, and substantial in magnitude. For a long time no Delaware court had ever found a MAC. That changed with Akorn in 2018, where the target's regulatory and data integrity failures caused a roughly 86% collapse in EBITDA and pervasive compliance breaches, and the court allowed Fresenius to terminate.\n\nThe practical read for a banker: a MAC is leverage for renegotiating price, not a reliable exit. Most disputes settle with a price cut rather than a walk."},
{c:"ma",l:2,t:"mc",q:"Transaction fees in an acquisition are generally:",o:["Capitalised into goodwill","Expensed as incurred, reducing net income","Added to the target's PP&E","Treated as a financing cash flow only"],a:1,e:"Under current accounting, advisory and legal transaction costs are expensed as incurred rather than capitalised into the purchase price. Financing fees are the exception: they are capitalised and amortised over the life of the debt."},
{c:"ma",l:3,t:"open",q:"How do you think about integration risk when advising on a deal?",m:"Integration risk is where most of the value of a deal is actually won or lost, and it should shape the price and the structure, not just the post-close plan.\n\nThe substantive questions: how much overlap is there in systems, and what does it cost to consolidate ERP, billing and data platforms. How different are the two cultures and sales models, because a direct enterprise sales force and a channel model do not merge easily. How concentrated are the customers, and will any of them use the deal as a reason to renegotiate or leave. How dependent is the target on a small number of key people, and what retains them. How different are the regulatory regimes.\n\nThe financial expression of this is the synergy schedule. Cost synergies should be phased realistically, usually over two to three years, with the costs to achieve them explicitly modelled, because severance, systems integration and site closures are real cash outflows that hit before the benefits arrive. Revenue synergies should be haircut heavily or excluded.\n\nFor the client's decision, the framing that lands is: the deal needs X of synergies to justify the premium, here is what has to be true operationally to deliver X, and here is the probability-weighted range. If the deal only works on full synergies delivered on schedule, the premium is too high."},
{c:"ma",l:2,t:"mc",q:"A reverse merger is most often used to:",o:["Take a private company public without a traditional IPO","Force a hostile acquisition","Unwind a failed acquisition","Split a company into two"],a:0,e:"In a reverse merger a private company merges into a listed shell, with the private company's owners ending up in control of the public entity. It is faster and cheaper than a traditional IPO but comes with weaker price discovery and often a poorer shareholder base."},
{c:"ma",l:3,t:"open",q:"How does a spin-off differ from a carve-out and a split-off?",m:"All three separate a business from its parent, but the mechanics and who ends up owning what differ.\n\nIn a spin-off, the parent distributes shares of the subsidiary to its existing shareholders pro rata. No cash changes hands, shareholders end up owning two separate listed companies, and if it is structured correctly it is tax-free to both parent and shareholders. It is used when the parent wants to separate a business but has no need for cash proceeds.\n\nIn a carve-out, also called an equity carve-out or partial IPO, the parent sells a minority stake in the subsidiary to the public for cash. The parent retains control and consolidates, and there is a taxable gain. It is used when the parent wants cash and a public valuation mark on the asset, often as a first step before a full separation.\n\nIn a split-off, the parent offers its shareholders the chance to exchange parent shares for subsidiary shares. It is effectively a buyback paid in subsidiary stock, so it shrinks the parent's share count. It is used where the parent wants the separation and also wants to reduce its own shares outstanding, and where only some shareholders want the subsidiary.\n\nThe common motivation is that the market applies a conglomerate discount, and separating lets each business attract its natural shareholder base and be valued on its own comps. The common cost is losing scale in shared functions and the dis-synergies of standing up a separate corporate infrastructure."},
{c:"ma",l:2,t:"mc",q:"Pro forma interest expense in a cash-funded acquisition should include:",o:["Only interest on new debt raised","Interest on new debt plus foregone interest income on cash used","Only the target's existing interest","No interest, as it is non-cash"],a:1,e:"Using balance sheet cash has an opportunity cost: the acquirer loses the interest income that cash was earning. A complete accretion analysis charges both the interest on new debt and the foregone interest income, both tax-effected."},
{c:"ma",l:3,t:"open",q:"What is a go-shop provision, and why would a board insist on one?",m:"A go-shop lets a target actively solicit competing bids for a defined period after signing a deal, typically 30 to 50 days, despite having already agreed to a transaction.\n\nIt exists because of the board's fiduciary duty to get the best reasonably available price. In a deal that was negotiated exclusively without a broad auction, the board is exposed to a claim that it never tested the market. A go-shop is a way to run that test after the fact while still locking in a certain bid.\n\nThe mechanics that matter: the go-shop period length, whether the target can share confidential information, and critically the two-tier break fee. A bidder that emerges during the go-shop typically triggers a lower break fee, often half the normal level, which lowers the barrier to a topping bid. The original buyer usually gets matching rights.\n\nThey appear most often in sponsor-led take-privates, where management may have a conflict because they are rolling over equity, and in deals signed without an auction.\n\nThe honest assessment is that go-shops rarely produce a topping bid, partly because the original buyer has an information and timing advantage and matching rights. Their real function is often procedural protection for the board rather than genuine price discovery, and courts have been sceptical of go-shops that are too short or too constrained."},
