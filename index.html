const seenCount  = () => Object.keys(S.stats).filter(id => byId[id] && S.stats[id].seen > 0).length;
const isMastered = id => { const s = S.stats[id]; return !!s && s.seen > 0 && s.wrong === 0; };
const masteredIn = k => QUESTIONS.filter(q => (k === "all" || q.c === k) && isMastered(q.id)).length;
function accuracy() {
  let seen = 0, wrong = 0;
  for (const id of Object.keys(S.stats)) { if (!byId[id]) continue; seen += S.stats[id].seen; wrong += S.stats[id].wrong; }
  return seen ? Math.round((seen - wrong) / seen * 100) : 0;
}
function markDay() {
  const d = ls.get(K_DAYS, []);
  if (d[d.length - 1] !== today()) { d.push(today()); ls.set(K_DAYS, d.slice(-400)); }
}
function streak() {
  const d = ls.get(K_DAYS, []);
  if (!d.length) return 0;
  const set = new Set(d), day = 86400000;
  let cur = new Date(today() + "T00:00:00Z").getTime(), n = 0;
  if (!set.has(new Date(cur).toISOString().slice(0, 10))) cur -= day;  // yesterday still counts
  while (set.has(new Date(cur).toISOString().slice(0, 10))) { n++; cur -= day; }
  return n;
}

function pool() {
  const weak = new Set(weakIds());
  return QUESTIONS.filter(q =>
    (S.cat === "all" || (S.cat === "weak" ? weak.has(String(q.id))
                       : S.cat === "flag" ? S.flags.has(q.id) : q.c === S.cat)) &&
    (S.lvl === 0 || q.l === S.lvl) &&
    (S.mode === "mixed" || q.t === S.mode));
}

/* ================================ HOME ================================ */
function renderHome() {
  const p = pool(), wk = weakIds().length, fl = [...S.flags].filter(id => byId[id]).length;
  const n = S.len === 0 ? p.length : Math.min(S.len, p.length);
  const seen = seenCount(), acc = accuracy(), st = streak(), mast = masteredIn("all");
  const saved = ls.get(K_RESUME, null);

  const topic = (k, name, desc, count, done) => {
    const pctM = count ? Math.round((done || 0) / count * 100) : 0;
    return `<button class="topic ${S.cat === k ? "sel" : ""}" data-cat="${k}" aria-pressed="${S.cat === k}">
      <span class="topic-top">
        <span><span class="topic-n">${esc(name)}</span><span class="topic-d">${esc(desc)}</span></span>
        <span class="topic-c">${count}</span>
      </span>
      ${done !== null ? `<span class="mast"><i style="width:${pctM}%"></i></span>` : ""}
    </button>`;
  };
  const seg = (name, val, opts) => `<div class="seg" data-seg="${name}">` +
    opts.map(o => `<button data-v="${o[0]}" class="${String(val) === String(o[0]) ? "sel" : ""}" aria-pressed="${String(val) === String(o[0])}">${esc(o[1])}</button>`).join("") + `</div>`;

  document.getElementById("home").innerHTML = `
    <header>
      <div class="headrow">
        <div class="brand">${LOGO}<div class="wordmark">Drill<i>400</i></div></div>
        <button class="icobtn" id="theme" title="Switch theme" aria-label="Switch colour theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <div class="lede">${QUESTIONS.length} investment banking interview questions. Multiple choice to check recall, written answers graded on substance.</div>
    </header>

    ${saved ? `<div class="resume">
      <p><b>Unfinished set.</b> You were ${saved.idx + 1} of ${saved.deck.length} through ${esc(saved.catName)}.</p>
      <div class="row"><button class="btn pri" id="resume">Resume</button><button class="btn" id="discard">Discard</button></div>
    </div>` : ""}

    <div class="tiles">
      <div class="tile"><b>${seen}</b><small>SEEN</small></div>
      <div class="tile"><b style="color:var(--${acc >= 70 ? "good" : acc >= 50 ? "brass" : seen ? "bad" : "faint"})">${seen ? acc + "%" : "–"}</b><small>ACCURACY</small></div>
      <div class="tile"><b style="color:var(--${st ? "brass" : "faint"})">${st}</b><small>DAY STREAK</small></div>
      <div class="tile"><b>${mast}</b><small>MASTERED</small></div>
    </div>

    <div class="label">Topic</div>
    <div class="stack group">
      ${topic("all", "Everything", "All topics mixed, the way a real interview runs", QUESTIONS.length, mast)}
      ${wk ? topic("weak", "Ones you missed", "Questions you have got wrong before", wk, null) : ""}
      ${fl ? topic("flag", "Flagged", "Questions you marked to come back to", fl, null) : ""}
      ${CATS.map(c => { const tot = QUESTIONS.filter(q => q.c === c.k).length;
        return topic(c.k, c.n, c.d, tot, masteredIn(c.k)); }).join("")}
    </div>

    <div class="group">
      <div class="label">Difficulty</div>
      ${seg("lvl", S.lvl, [[0,"All"],[1,"Easy"],[2,"Medium"],[3,"Hard"]])}
      <div class="label">Format</div>
      ${seg("mode", S.mode, [["mixed","Both"],["mc","Multiple choice"],["open","Written"]])}
      <div class="label">Length</div>
      ${seg("len", S.len, [[5,"5"],[10,"10"],[20,"20"],[0,"All"]])}
    </div>

    <button class="btn pri" id="start" ${p.length ? "" : "disabled"}>
      ${p.length ? `Start (${n} question${n === 1 ? "" : "s"})` : "No questions match that combination"}
    </button>
    ${p.length ? `<div class="note">${p.length} available in this selection</div>` : ""}

    <div style="margin-top:28px">
      <button class="linkbtn" id="keytoggle">${S.apiKey ? "AI grading is on. Manage key" : "Turn on AI grading of written answers"}</button>
    </div>
    ${S.keyOpen ? `
      <div class="card keybox" style="margin-top:14px">
        <p>Written answers can be graded by Claude. This site is static, so it calls the API straight from your browser using your own key. The key is stored in this browser only and is never sent anywhere except to Anthropic. Get one at console.anthropic.com.</p>
        <input type="password" id="keyin" placeholder="sk-ant-..." value="${esc(S.apiKey)}" autocomplete="off" spellcheck="false"/>
        <div class="row">
          <button class="btn pri" id="keysave">Save key</button>
          ${S.apiKey ? `<button class="btn" id="keyclear">Remove</button>` : ""}
        </div>
        <p style="margin:12px 0 0">Without a key everything still works. You self-mark written answers against the model answer.</p>
      </div>` : ""}`;


  document.querySelectorAll("#home .topic").forEach(b => b.onclick = () => { S.cat = b.dataset.cat; renderHome(); });
  document.querySelectorAll("#home .seg").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    const v = b.dataset.v; S[g.dataset.seg] = (g.dataset.seg === "mode") ? v : Number(v); renderHome();
  }));
  const stB = document.getElementById("start"); if (stB) stB.onclick = () => start();
  document.getElementById("theme").onclick = toggleTheme;
  const rs = document.getElementById("resume"); if (rs) rs.onclick = resume;
  const ds = document.getElementById("discard"); if (ds) ds.onclick = () => { ls.del(K_RESUME); renderHome(); };
  document.getElementById("keytoggle").onclick = () => { S.keyOpen = !S.keyOpen; renderHome(); };
  const sv = document.getElementById("keysave");
  if (sv) {
    sv.onclick = () => { S.apiKey = document.getElementById("keyin").value.trim(); ls.set(K_KEY, S.apiKey); S.keyOpen = false; renderHome(); };
    document.getElementById("keyin").onkeydown = e => { if (e.key === "Enter") sv.click(); };
  }
  const cl = document.getElementById("keyclear");
  if (cl) cl.onclick = () => { S.apiKey = ""; ls.del(K_KEY); renderHome(); };
}

/* ================================ QUIZ ================================ */
function start() {
  const p = pool(); if (!p.length) return;
  S.deck = shuffle(p).slice(0, S.len === 0 ? p.length : Math.min(S.len, p.length));
  S.idx = 0; S.log = []; S.startedAt = Date.now(); resetQ(); saveResume(); show("quiz"); renderQuiz();
}
function saveResume() {
  if (S.idx >= S.deck.length) { ls.del(K_RESUME); return; }
  ls.set(K_RESUME, { deck: S.deck.map(q => q.id), idx: S.idx, log: S.log, startedAt: S.startedAt,
                     catName: S.cat === "all" ? "Everything" : S.cat === "weak" ? "Ones you missed"
                            : S.cat === "flag" ? "Flagged" : CATNAME[S.cat] || "a set" });
}
function resume() {
  const r = ls.get(K_RESUME, null); if (!r) return;
  const deck = r.deck.map(id => byId[id]).filter(Boolean);
  if (!deck.length) { ls.del(K_RESUME); renderHome(); return; }
  S.deck = deck; S.idx = Math.min(r.idx, deck.length - 1); S.log = r.log || [];
  S.startedAt = r.startedAt || Date.now();
  resetQ(); show("quiz"); renderQuiz();
}
function resetQ() { S.picked = null; S.typed = ""; S.revealed = false; S.fb = null; S.fbErr = null; S.fbLoading = false; }
const cur = () => S.deck[S.idx];
const logged = () => S.log.some(e => e.id === cur().id);

function record(correct) {
  const q = cur();
  S.log.push({ id: q.id, cat: q.c, correct });
  const prev = S.stats[q.id] || { seen: 0, wrong: 0 };
  S.stats[q.id] = { seen: prev.seen + 1, wrong: correct ? Math.max(0, prev.wrong - 1) : prev.wrong + 1 };
  saveStats(); markDay(); saveResume();
}
function next() {
  if (S.idx + 1 >= S.deck.length) { ls.del(K_RESUME); show("result"); renderResult(); return; }
  S.idx++; resetQ(); saveResume(); renderQuiz(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function toggleFlag() {
  const id = cur().id;
  S.flags.has(id) ? S.flags.delete(id) : S.flags.add(id);
  saveFlags(); renderQuiz();
}
const fmtTime = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function renderQuiz() {
  const q = cur();
  const pct = (S.idx / S.deck.length) * 100;
  let body = "";

  if (q.t === "mc") {
    body += `<div class="stack">` + q.o.map((o, i) => {
      let cls = "opt";
      if (S.picked !== null) cls += i === q.a ? " right" : (i === S.picked ? " wrong" : " dim");
      return `<button class="${cls}" data-i="${i}" ${S.picked !== null ? "disabled" : ""}>
        <span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;
    }).join("") + `</div>`;
    if (S.picked !== null) {
      const ok = S.picked === q.a;
      body += `<div class="exp ${ok ? "ok" : "no"}" role="status"><h4>${ok ? "Correct" : "Not quite"}</h4><p>${esc(q.e)}</p></div>`;
    }
  } else {
    body += `<textarea id="ta" ${S.revealed ? "disabled" : ""} placeholder="Answer it out loud first, then type the version you would actually say.">${esc(S.typed)}</textarea>`;
    if (!S.revealed) {
      body += `<div class="row" style="margin-bottom:22px">`;
      if (S.apiKey) body += `<button class="btn pri" id="grade" ${(!S.typed.trim() || S.fbLoading) ? "disabled" : ""}>${S.fbLoading ? '<span class="spin"></span>Grading' : "Grade my answer"}</button>`;
      body += `<button class="btn ${S.apiKey ? "" : "pri"}" id="reveal">${S.apiKey ? "Just show me" : "Show the answer"}</button></div>`;
    }
    if (S.fbErr) body += `<div class="exp no"><h4>Grading failed</h4><p>${esc(S.fbErr)}</p></div>`;
    if (S.fb) {
      const f = S.fb, good = f.score >= 7;
      body += `<div class="grade" style="border-color:var(--${good ? "good" : "bad"})" role="status">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span class="score" style="color:var(--${good ? "good" : "bad"})">${f.score}</span>
          <span style="font-size:12px;color:var(--faint)">out of 10</span></div>
        <div class="verdict">${esc(f.verdict || "")}</div>
        ${(f.strong || []).length ? `<div style="margin-bottom:12px"><h5 style="color:var(--good)">Landed</h5><ul>${f.strong.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : ""}
        ${(f.missing || []).length ? `<div><h5 style="color:var(--bad)">Missing or wrong</h5><ul>${f.missing.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : ""}
        ${f.tip ? `<div class="tip">${esc(f.tip)}</div>` : ""}
      </div>`;
    }
    if (S.revealed) body += `<div class="model"><h4>What a strong answer covers</h4><p>${esc(q.m)}</p></div>`;
    if (S.revealed && !S.fb && !logged())
      body += `<div class="row" style="margin-bottom:22px">
        <button class="btn" id="gotit" style="border-color:var(--good);color:var(--good)">I had that</button>
        <button class="btn" id="missed" style="border-color:var(--bad);color:var(--bad)">I missed it</button></div>`;
  }

  const done = q.t === "mc" ? S.picked !== null : (S.revealed && logged());
  if (done) body += `<button class="btn pri" id="next">${S.idx + 1 >= S.deck.length ? "See results" : "Next question"}</button>`;

  const flagged = S.flags.has(q.id);
  document.getElementById("quiz").innerHTML = `
    <div class="topbar">
      <button class="linkbtn" id="back" style="text-decoration:none;color:var(--muted)">Back</button>
      <div class="mid">
        <button class="flagbtn ${flagged ? "on" : ""}" id="flag" aria-pressed="${flagged}">${flagged ? "Flagged" : "Flag"}</button>
        <span>${S.idx + 1} of ${S.deck.length}</span>
      </div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="chips"><span class="chip acc">${esc(CATNAME[q.c])}</span>
      <span class="chip">${LVLNAME[q.l]}</span>
      <span class="chip">${q.t === "mc" ? "Multiple choice" : "Written"}</span></div>
    <div class="qtext">${esc(q.q)}</div>${body}`;

  document.getElementById("back").onclick = () => { saveResume(); show("home"); renderHome(); };
  document.getElementById("flag").onclick = toggleFlag;
  document.querySelectorAll("#quiz .opt").forEach(b => b.onclick = () => pick(Number(b.dataset.i)));
  const ta = document.getElementById("ta");
  if (ta) {
    ta.oninput = () => {
      const was = !!S.typed.trim(); S.typed = ta.value;
      const g = document.getElementById("grade");
      if (g && was !== !!S.typed.trim()) g.disabled = !S.typed.trim();
    };
    if (!S.revealed && !S.fbLoading) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  const g = document.getElementById("grade"); if (g) g.onclick = grade;
  const rv = document.getElementById("reveal"); if (rv) rv.onclick = () => { S.revealed = true; renderQuiz(); };
  const gi = document.getElementById("gotit"); if (gi) gi.onclick = () => { record(true); renderQuiz(); };
  const mi = document.getElementById("missed"); if (mi) mi.onclick = () => { record(false); renderQuiz(); };
  const nx = document.getElementById("next"); if (nx) nx.onclick = next;
}

function pick(i) {
  const q = cur();
  if (q.t !== "mc" || S.picked !== null) return;
  S.picked = i; record(i === q.a); renderQuiz();
}

/* ============================= AI GRADING ============================= */
async function grade() {
  const q = cur();
  S.fbLoading = true; S.fbErr = null; renderQuiz();
  const prompt = `You are a senior investment banking interviewer grading a candidate's answer to an interview question. Be direct and demanding but fair. This is technical interview prep, so precision matters more than encouragement.

QUESTION: ${q.q}

REFERENCE ANSWER (what a strong response covers):
${q.m}

CANDIDATE'S ANSWER:
${S.typed}

Grade it. Respond with ONLY a raw JSON object, no markdown fences, no preamble, in this exact shape:
{"score": <integer 0-10>, "verdict": "<one sentence, direct, on whether this answer would pass in a real interview>", "strong": ["<what they actually got right, max 3 items, empty array if nothing>"], "missing": ["<specific gaps or errors, most important first, 2-4 items>"], "tip": "<one sentence on how to restructure or deliver it better>"}

Scoring guide: 9-10 covers the reference substance with clear structure. 7-8 solid but incomplete. 5-6 partially right with a real gap. 3-4 major misunderstanding. 0-2 wrong or empty. For fit questions, grade structure, specificity and self-awareness rather than factual match.`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": S.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: K_MODEL, max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "API error");
    const raw = data.content.filter(c => c.type === "text").map(c => c.text).join("").replace(/```json|```/g, "").trim();
    S.fb = JSON.parse(raw);
    if (!logged()) record(S.fb.score >= 7);
    S.revealed = true;
  } catch (e) {
    S.fbErr = (e && e.message ? e.message : "Request failed") + ". Check your key, or use the model answer below and mark yourself.";
    S.revealed = true;
  } finally {
    S.fbLoading = false; renderQuiz(); window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }
}

/* =============================== RESULTS =============================== */
function renderResult() {
  const right = S.log.filter(e => e.correct).length;
  const pct = S.log.length ? Math.round(right / S.log.length * 100) : 0;
  const col = pct >= 70 ? "good" : pct >= 50 ? "brass" : "bad";
  const by = {};
  S.log.forEach(e => { (by[e.cat] = by[e.cat] || { r: 0, t: 0 }).t++; if (e.correct) by[e.cat].r++; });
  const rows = Object.entries(by).sort((a, b) => a[1].r / a[1].t - b[1].r / b[1].t);
  const elapsed = S.startedAt ? Date.now() - S.startedAt : 0;
  const perQ = S.log.length && elapsed ? Math.round(elapsed / S.log.length / 1000) : 0;

  const review = S.log.map((e, i) => {
    const q = byId[e.id]; if (!q) return "";
    const open = S.openRev === i;
    const ans = q.t === "mc" ? q.e : q.m;
    return `<div class="item">
      <button class="head" data-rev="${i}" aria-expanded="${open}">
        <span class="mark ${e.correct ? "y" : "n"}">${e.correct ? "✓" : "✗"}</span>
        <span>${esc(q.q)}</span></button>
      ${open ? `<div class="body"><b>${q.t === "mc" ? esc(q.o[q.a]) : "WHAT A STRONG ANSWER COVERS"}</b>${esc(ans)}</div>` : ""}
    </div>`;
  }).join("");

  document.getElementById("result").innerHTML = `
    <div class="bigscore"><b style="color:var(--${col})">${pct}%</b>
      <small>${right} of ${S.log.length} answered well${elapsed ? ` &middot; ${fmtTime(elapsed)} &middot; ${perQ}s per question` : ""}</small></div>
    ${rows.length > 1 ? `<div class="label">By topic</div><div class="card brk">${rows.map(([k, v]) => {
      const r = v.r / v.t, c = r >= .7 ? "good" : r >= .5 ? "brass" : "bad";
      return `<div class="r"><span style="font-size:14px">${esc(CATNAME[k])}</span>
        <span style="display:flex;align-items:center;gap:12px">
          <span class="meter"><i style="width:${r * 100}%;background:var(--${c})"></i></span>
          <span class="n">${v.r}/${v.t}</span></span></div>`;
    }).join("")}</div>` : ""}

    ${S.log.length ? `<div class="label">Review <b>tap to expand</b></div><div class="rev">${review}</div>` : ""}

    <div class="stack group" style="margin-bottom:0"><button class="btn pri" id="again">Run another set</button>
      <button class="btn" id="home2">Change topic</button></div>
    <div class="note">Everything you got wrong is saved under &ldquo;Ones you missed&rdquo; on the home screen.</div>`;

  document.querySelectorAll("#result .head").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.rev); S.openRev = S.openRev === i ? null : i; renderResult();
  });
  document.getElementById("again").onclick = () => { S.openRev = null; start(); window.scrollTo(0, 0); };
  document.getElementById("home2").onclick = () => { S.openRev = null; show("home"); renderHome(); window.scrollTo(0, 0); };
}

applyTheme();
renderHome();

</script>
</body>
</html>
