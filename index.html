{"c":"val","l":3,"t":"mc","q":"A sum-of-the-parts valuation is most appropriate when:","o":["A company has one homogeneous business","A company has divisions with very different growth, margin and capital profiles","The company is in liquidation","There are no public comparables"],"a":1,"e":"A single blended multiple misprices a group containing, say, a distribution arm worth 7x and a software arm worth 20x. You value each segment against its own peers, then adjust for corporate overhead, net debt and other claims."},
{"c":"val","l":3,"t":"mc","q":"Oil and gas and biotech companies are typically valued differently because:","o":["They use different currencies","Value depends on reserves or on clinical trial outcomes rather than current earnings","They have no revenue","They are not publicly listed"],"a":1,"e":"Oil and gas uses net asset value built on proved reserves and strip pricing, plus EV per flowing barrel. Biotech uses risk-adjusted NPV, probability-weighting each drug by phase. Both have current earnings that say little about value."},
{"c":"val","l":3,"t":"mc","q":"For a regulated utility, which approach carries the most weight?","o":["EV/revenue multiples","A DCF or dividend discount model, given stable, predictable, regulated cash flows","Liquidation value","Replacement cost only"],"a":1,"e":"Regulated returns make cash flows unusually predictable, which is exactly the condition a DCF needs. Regulatory asset base multiples and dividend discount models are also standard, since these companies are held largely for income."},
{"c":"val","l":3,"t":"mc","q":"When comparing companies reporting under different accounting standards, the priority is to:","o":["Ignore the differences","Normalise treatment of items such as leases, development costs and revenue recognition","Use only net income","Convert everything to one currency and stop there"],"a":1,"e":"Capitalised versus expensed development costs, lease treatment and pension assumptions can shift EBITDA materially. Currency conversion alone does not make the underlying numbers comparable."},
{"c":"val","l":3,"t":"mc","q":"Your DCF, comps and precedents disagree sharply. The best way to present that is:","o":["Average the three into one number","Show each range and explain what assumption drives the divergence","Present only the highest","Present only the DCF"],"a":1,"e":"The divergence is the analysis. A football field with each method's range, plus a clear statement of what must be true for the high end to hold, turns a valuation argument into a debate about specific assumptions that can be resolved."},
{"c":"val","l":3,"t":"mc","q":"How do you value a company in an industry with no public comparables?","o":["You cannot value it","Widen the set to adjacent industries with similar economics, and lean more on the DCF","Use the market average multiple","Use book value"],"a":1,"e":"You look for businesses with similar margins, capital intensity, growth and customer dynamics even in different sectors, use international comps, and put more weight on intrinsic valuation, since the DCF does not require a peer group."},
{"c":"val","l":3,"t":"mc","q":"A key practical difference between building a trading comp and a transaction comp is that transaction comps:","o":["Need no financial data","Use the target's financials at the time of announcement and the price actually paid","Always use forward estimates","Ignore debt"],"a":1,"e":"Trading comps use current market prices and live forward estimates, updated daily. Transaction comps are frozen at announcement, use the target's LTM figures at that date, and the data often has to be dug out of filings and press releases."},
{"c":"val","l":3,"t":"mc","q":"The most defensible valuation range comes from:","o":["The midpoint of the DCF alone","The overlap between the ranges produced by several methodologies","The highest method","The average of all methods"],"a":1,"e":"Each method produces its own range, and where those ranges overlap is the region supported by more than one line of evidence. A single averaged point estimate hides exactly the disagreement a client needs to understand."},
{"c":"val","l":3,"t":"mc","q":"A subscription software business is usually valued on revenue multiples rather than earnings because:","o":["It has no costs","Growth spending depresses current profit, so earnings understate the economics","Revenue is easier to audit","Earnings multiples are not allowed"],"a":1,"e":"Sales and marketing spend is an investment in future recurring revenue but is expensed immediately, so a fast-growing business can be loss-making while creating value. The multiple is driven by growth rate and net revenue retention."},
{"c":"val","l":3,"t":"mc","q":"A company has a large non-core division dragging its rating. Which analysis makes that case?","o":["A single blended EV/EBITDA multiple","Sum-of-the-parts, showing the value trapped by the conglomerate discount","Liquidation value","A premiums paid analysis"],"a":1,"e":"Sum-of-the-parts values each business against its own peers and frequently shows the whole trading below the sum of the parts. That gap is the pitch for a divestiture or spin-off."},
{"c":"val","l":3,"t":"mc","q":"Valuing a cyclical business at the top of its cycle, the biggest trap is:","o":["Using too long a forecast period","Applying a peak multiple to peak earnings","Using mid-cycle margins","Discounting at WACC"],"a":1,"e":"Cyclicals look cheapest at the top on a low P/E against peak earnings, and most expensive at the bottom. You normalise to mid-cycle margins over a full cycle and apply a through-the-cycle multiple, cross-checked against replacement cost."},
{"c":"val","l":3,"t":"mc","q":"Book value is most meaningful as a valuation anchor for:","o":["A software company","A bank or insurer, where assets are financial and marked near fair value","A consulting firm","A luxury brand"],"a":1,"e":"For banks the balance sheet is the business, regulatory capital is measured against book, and price to book tracks return on equity closely. For asset-light businesses the real assets are not on the balance sheet at all."},
{"c":"val","l":3,"t":"mc","q":"Calendarisation is required when:","o":["Companies in a comp set have different fiscal year ends","Companies use different currencies","A company has no forward estimates","A company is private"],"a":0,"e":"Comparing a December year-end company to a June year-end one compares different economic periods. You weight the fiscal years by the months falling inside the target calendar year so the multiples describe the same window."},

/* ========================== DCF (53) ========================== */
{"c":"dcf","l":1,"t":"mc","q":"Unlevered free cash flow equals:","o":["Net income + D&A - capex - change in NWC","EBIT x (1 - tax rate) + D&A - capex - change in NWC","EBITDA - capex","Operating cash flow - dividends"],"a":1,"e":"Start at EBIT so the figure sits before interest and is therefore available to all capital providers. Tax-effect it, then adjust for non-cash and investment items."},
{"c":"dcf","l":1,"t":"mc","q":"Unlevered free cash flow is discounted at:","o":["Cost of equity","WACC","Cost of debt","Risk-free rate"],"a":1,"e":"Unlevered cash flow belongs to both debt and equity holders, so it is discounted at the blended cost of both."},
{"c":"dcf","l":1,"t":"mc","q":"Levered free cash flow is discounted at:","o":["WACC","Cost of equity","Cost of debt","Marginal tax rate"],"a":1,"e":"Levered free cash flow is already after interest, so it belongs only to equity holders. Discounting it gives equity value directly."},
{"c":"dcf","l":1,"t":"mc","q":"The two standard methods for calculating terminal value are:","o":["Perpetuity growth and exit multiple","Book value and liquidation value","Comps and precedents","Payback period and IRR"],"a":0,"e":"Gordon growth applies a perpetual growth rate, exit multiple applies a trading multiple to the terminal-year metric. In practice you cross-check one against the other."},
{"c":"dcf","l":1,"t":"mc","q":"The risk-free rate in a DCF is normally taken from:","o":["The central bank policy rate","A long-dated government bond yield in the relevant currency","The company's cost of debt","The interbank rate"],"a":1,"e":"The maturity should roughly match the horizon of the cash flows, so a ten- or twenty-year government bond is conventional."},
{"c":"dcf","l":1,"t":"mc","q":"The equity risk premium is most commonly assumed to be in which range?","o":["0% to 2%","4% to 6%","8% to 10%","12% to 15%"],"a":1,"e":"Four to six percent is the standard practitioner range, drawn from long-run historical excess returns and implied market estimates."},
{"c":"dcf","l":1,"t":"mc","q":"An increase in net working capital is:","o":["A source of cash that raises free cash flow","A use of cash that reduces free cash flow","Neutral to free cash flow","Added back like depreciation"],"a":1,"e":"Growing receivables and inventory tie cash up in the operating cycle, so the increase is subtracted when calculating free cash flow."},
{"c":"dcf","l":1,"t":"mc","q":"A DCF gives an enterprise value of $1,000m. Net debt is $200m and there are 100m diluted shares. What is the implied price per share?","o":["$10.00","$8.00","$12.00","$6.00"],"a":1,"e":"Equity value is 1,000 less 200 = 800, divided by 100m shares gives $8.00."},
{"c":"dcf","l":1,"t":"mc","q":"In a DCF, the discount rate reflects:","o":["The company's historical return on equity","The risk of the cash flows being discounted","The risk-free rate only","The company's tax rate"],"a":1,"e":"The discount rate is the required return for bearing the risk of those specific cash flows. Unlevered cash flows belong to all capital providers so you use WACC; levered cash flows belong only to equity so you use cost of equity."},
{"c":"dcf","l":1,"t":"mc","q":"Which sequence correctly describes a DCF?","o":["Forecast net income, discount at cost of equity, add debt","Forecast unlevered free cash flow, discount at WACC, add terminal value, bridge to equity","Apply a multiple to EBITDA and subtract debt","Discount dividends at the risk-free rate"],"a":1,"e":"You project unlevered free cash flow over an explicit period, discount it and the terminal value at WACC to get enterprise value, then subtract net debt and other claims to reach equity value and divide by diluted shares."},
{"c":"dcf","l":1,"t":"mc","q":"WACC is correctly described as:","o":["The cost of debt only","The blended required return of debt and equity, weighted by capital structure, with debt tax-affected","The risk-free rate plus inflation","The company's return on equity"],"a":1,"e":"WACC equals the equity weight times cost of equity plus the debt weight times the after-tax cost of debt. The tax adjustment applies only to the debt component, because interest is deductible while dividends are not."},
{"c":"dcf","l":1,"t":"mc","q":"Levered free cash flow differs from unlevered in that levered:","o":["Excludes taxes","Is after interest and debt service, so it belongs to equity holders alone","Excludes capex","Is always larger"],"a":1,"e":"Unlevered cash flow is available to all capital providers and is discounted at WACC to give enterprise value. Levered cash flow is after interest and mandatory repayments, belongs only to equity, and is discounted at the cost of equity to give equity value directly."},
{"c":"dcf","l":2,"t":"mc","q":"Beta measures:","o":["Total volatility of a stock","Volatility relative to the market","The risk-free rate","The probability of default"],"a":1,"e":"Beta captures systematic risk, the part of volatility that moves with the market and cannot be diversified away."},
{"c":"dcf","l":2,"t":"mc","q":"Terminal value typically represents what share of total DCF value?","o":["Under 20%","Around 30%","Roughly 50% to 80%","Always under 50%"],"a":2,"e":"That concentration is exactly why interviewers press on terminal assumptions and why you always sanity-check the implied exit multiple."},
{"c":"dcf","l":2,"t":"mc","q":"Final-year free cash flow is $100m, WACC is 10%, perpetual growth is 2%. What is the terminal value?","o":["$1,000m","$1,250m","$1,275m","$1,020m"],"a":2,"e":"TV = FCF x (1+g) / (WACC - g) = 100 x 1.02 / 0.08 = $1,275m. Note the growth applied to the final year before discounting."},
{"c":"dcf","l":2,"t":"mc","q":"All else equal, raising the terminal growth rate:","o":["Lowers the valuation","Raises the valuation","Has no effect","Raises WACC"],"a":1,"e":"A higher g shrinks the denominator (WACC - g), which increases terminal value and therefore enterprise value. Keep g at or below long-run GDP or inflation to stay credible."},
{"c":"dcf","l":2,"t":"mc","q":"Cost of equity is 10% on 70% of the capital structure, pre-tax cost of debt is 6% on 30%, tax rate 25%. What is WACC?","o":["7.60%","8.35%","8.80%","9.20%"],"a":1,"e":"0.70 x 10% = 7.00%. 0.30 x 6% x (1 - 0.25) = 1.35%. Total 8.35%."},
{"c":"dcf","l":2,"t":"mc","q":"At a 10% WACC, the discount factor applied to a year-three cash flow is approximately:","o":["0.91","0.83","0.75","0.68"],"a":2,"e":"The discount factor is 1 divided by one plus the rate, raised to the period. Here 1 over 1.10 cubed is 0.751, so a dollar received in year three is worth about 75 cents today. Note the factor falls fast, which is why terminal value dominates a DCF."},
{"c":"dcf","l":2,"t":"mc","q":"The perpetual growth rate in a terminal value should generally not exceed:","o":["The company's historical growth rate","Long-run nominal GDP growth","WACC minus 1%","The inflation rate"],"a":1,"e":"A company growing faster than the economy forever would eventually become the entire economy. Two to three percent is the usual band in developed markets."},
{"c":"dcf","l":2,"t":"mc","q":"Which of these raises WACC, all else equal?","o":["A lower risk-free rate","A higher levered beta","A higher tax rate with debt in the structure","More cash on the balance sheet"],"a":1,"e":"A higher beta raises cost of equity directly through CAPM. A higher tax rate makes the interest shield more valuable, which lowers WACC."},
{"c":"dcf","l":2,"t":"mc","q":"Terminal-year EBITDA is $250m and you apply an 8.0x exit multiple. What is the terminal value?","o":["$1,600m","$2,000m","$1,250m","$450m"],"a":1,"e":"Exit multiple terminal value is simply the multiple applied to the terminal-year metric: 8.0 times $250m equals $2,000m. Remember this is an undiscounted figure sitting at the end of the forecast, so it still has to be discounted back to today."},
{"c":"dcf","l":2,"t":"mc","q":"Which of these would you NOT include in unlevered free cash flow?","o":["Capital expenditure","Change in net working capital","Interest expense","Cash taxes on EBIT"],"a":2,"e":"Unlevered free cash flow is before financing, so interest is excluded. Including it double counts: interest is already reflected in the WACC used to discount, and adding it to the cash flows would penalise the company twice for its leverage."},
{"c":"dcf","l":2,"t":"mc","q":"Capital expenditure equals depreciation and net working capital is flat. Unlevered free cash flow is therefore approximately:","o":["EBITDA","EBIT after tax","Net income","EBITDA less interest"],"a":1,"e":"UFCF is EBIT after tax, plus D&A, less capex, less the change in working capital. If capex equals D&A they cancel and working capital contributes nothing, leaving tax-effected EBIT, also called NOPAT. This is the standard steady-state simplification."},
{"c":"dcf","l":2,"t":"mc","q":"A company's cost of equity is 9%, pre-tax cost of debt is 5%, tax rate 25%, and the capital structure is 50% debt and 50% equity. WACC is:","o":["7.0%","6.375%","5.75%","8.0%"],"a":1,"e":"Equity contributes 0.5 times 9%, which is 4.5%. Debt contributes 0.5 times 5% times 0.75, which is 1.875%. WACC is 6.375%. The tax shield only applies to the debt component."},
{"c":"dcf","l":2,"t":"mc","q":"EBIT is $250m, tax rate 25%, D&A $80m, capex $110m, and working capital increased $20m. What is unlevered free cash flow?","o":["$150m","$137.5m","$200m","$187.5m"],"a":1,"e":"NOPAT is $250m times 0.75, which is $187.5m. Add back D&A of $80m to get $267.5m, subtract capex of $110m to get $157.5m, then subtract the $20m working capital build, leaving $137.5m."},
{"c":"dcf","l":2,"t":"mc","q":"Cost of equity under CAPM equals:","o":["Risk-free rate plus beta times the equity risk premium","Risk-free rate times beta","Dividend yield plus growth only","The company's ROE"],"a":0,"e":"CAPM prices systematic risk only, since diversifiable risk earns no premium. Practitioners often add a size premium for smaller companies and a country risk premium for emerging markets exposure."},
{"c":"dcf","l":2,"t":"mc","q":"You unlever and relever beta because:","o":["Regulators require it","Observed betas reflect each peer's own leverage, which must be stripped out before applying to your company","It increases the valuation","Beta cannot be measured directly"],"a":1,"e":"A peer's raw beta mixes business risk with its particular financing. You unlever each comparable to isolate business risk, take the median, then relever at your target company's capital structure so the beta reflects its own leverage."},
{"c":"dcf","l":2,"t":"mc","q":"To get from enterprise value to implied share price you:","o":["Divide enterprise value by basic shares","Subtract net debt and other claims such as preferred and minority interest, then divide by diluted shares","Add net debt then divide by shares","Multiply by the tax rate"],"a":1,"e":"Enterprise value belongs to all capital providers. Stripping out debt less cash, preferred stock and non-controlling interests leaves equity value, which is then divided by the fully diluted share count."},
{"c":"dcf","l":2,"t":"mc","q":"The most defensible way to forecast revenue in a DCF is:","o":["Apply a single growth rate forever","Build it from drivers such as price and volume, or units and average revenue per unit","Match the industry average","Extrapolate the last three years"],"a":1,"e":"Driver-based forecasting forces explicit, testable assumptions and lets you sanity-check implied market share. A single blended growth rate hides the assumptions and cannot be defended when a client challenges it."},
{"c":"dcf","l":2,"t":"mc","q":"Your Gordon growth terminal value implies an exit multiple far above where comps trade. You should:","o":["Ignore it, the DCF is intrinsic","Revisit the growth rate and discount rate, since the implied multiple is a reality check","Raise the growth rate further","Delete the terminal value"],"a":1,"e":"The two terminal methods should roughly agree. An implied multiple well above the peer group usually means the terminal growth rate is too close to WACC, or the terminal cash flow is not a genuine steady state."},
{"c":"dcf","l":2,"t":"mc","q":"The explicit forecast period in a DCF should run until:","o":["Exactly five years, always","The business reaches a steady state of stable growth, margins and reinvestment","The company is expected to be sold","Ten years, always"],"a":1,"e":"The terminal value formula assumes perpetual steady state, so the final forecast year must plausibly represent the business forever. If margins are still expanding in the final year, the forecast is too short and the perpetuity capitalises an unsustainable state."},
{"c":"dcf","l":2,"t":"mc","q":"The most decision-useful sensitivity table flexes:","o":["Only WACC and terminal growth","The operating drivers, such as revenue growth against EBITDA margin","The tax rate alone","The share count"],"a":1,"e":"WACC and growth are financial assumptions that tell a client little about their business. Flexing the operating drivers shows which part of the plan they actually need to be right about, which is what informs a decision."},
{"c":"dcf","l":3,"t":"mc","q":"The mid-year convention:","o":["Assumes cash flows arrive at year end, lowering valuation","Assumes cash flows arrive evenly through the year, raising valuation","Only applies to terminal value","Adjusts the tax rate"],"a":1,"e":"Discounting at 0.5, 1.5, 2.5 rather than 1, 2, 3 reflects cash arriving throughout the year rather than in a lump at year end. It raises present value modestly."},
{"c":"dcf","l":3,"t":"mc","q":"You increase WACC from 9% to 10% and reduce terminal growth from 3% to 2%. The terminal value under Gordon growth will:","o":["Fall modestly","Fall sharply","Rise","Stay roughly the same"],"a":1,"e":"The denominator is WACC less growth, which goes from 6% to 8%. That is a one-third increase in the denominator, so terminal value falls by about 25%. Small changes to both inputs compound because they both act on a narrow spread."},
{"c":"dcf","l":3,"t":"mc","q":"A comparable company has a levered beta of 1.32, a debt-to-equity ratio of 60% and a tax rate of 25%. What is its approximate unlevered beta?","o":["0.91","1.32","1.92","0.79"],"a":0,"e":"Unlevered beta equals levered beta divided by one plus one minus the tax rate times debt over equity. That is 1.32 divided by 1 plus 0.75 times 0.6, so 1.32 divided by 1.45, which is about 0.91. Unlevered beta is always below levered beta because you are stripping out financial risk."},
{"c":"dcf","l":3,"t":"mc","q":"A DCF gives an enterprise value of $2,000m. Debt is $600m, cash $150m, preferred stock $100m and non-controlling interest $50m, with 100m diluted shares. What is the implied share price?","o":["$14.00","$15.50","$12.50","$13.00"],"a":0,"e":"Work the full bridge: 2,000 less 600 debt, plus 150 cash, less 100 preferred, less 50 non-controlling interest gives $1,400m of equity value, or $14.00 per share. Preferred and NCI are claims ahead of common equity, so both are subtracted."},
{"c":"dcf","l":3,"t":"mc","q":"The most serious practical flaw of a DCF is that:","o":["It ignores the time value of money","Most of the value sits in a terminal value driven by two highly sensitive assumptions","It cannot handle taxes","It requires public comparables"],"a":1,"e":"Typically 60% to 80% of value sits in the terminal period, and that figure swings on WACC and terminal growth, whose difference sits in the denominator. Small input changes produce large valuation changes, which is why sensitivity tables are mandatory."},
{"c":"dcf","l":3,"t":"mc","q":"You discount unlevered free cash flow at WACC rather than cost of equity because:","o":["WACC is always lower","The cash flow belongs to all capital providers, so the discount rate must reflect all of them","Cost of equity ignores risk","It is an accounting requirement"],"a":1,"e":"Numerator and denominator must match. Unlevered cash flow is before interest and available to debt and equity together, so it is discounted at their blended required return. Using cost of equity on unlevered cash flow overstates the risk and understates value."},
{"c":"dcf","l":3,"t":"mc","q":"Two companies generate identical free cash flow but have different WACCs. The least likely cause is:","o":["Different capital structures","Different business risk and therefore beta","Different tax rates","Identical industry and identical leverage"],"a":3,"e":"If industry and leverage are identical, the main WACC drivers are the same. Differences arise from leverage, business risk, tax jurisdiction, size and country risk, all of which feed the blended rate."},
{"c":"dcf","l":3,"t":"mc","q":"Building a DCF for a pre-revenue company, the right approach is:","o":["Refuse, it is impossible","Model the path to a steady state over a long horizon and probability-weight scenarios","Assume revenue equals the industry average","Use last year's revenue"],"a":1,"e":"You size the addressable market, model adoption and a target steady-state margin over a longer horizon, then probability-weight outcomes. The honest framing is that the output is a range of scenarios rather than a point estimate."},
{"c":"dcf","l":3,"t":"mc","q":"Cost of equity is generally higher for a $500m company than a $5bn company because:","o":["Small companies pay more tax","Smaller companies are less liquid and more vulnerable, so investors demand a size premium","Small companies have no beta","Large companies use more debt"],"a":1,"e":"Empirically, smaller companies have delivered higher returns, attributed to lower liquidity, greater concentration risk and less access to capital. Practitioners add an explicit size premium on top of the CAPM result."},
{"c":"dcf","l":3,"t":"mc","q":"Adding leverage lowers WACC up to a point, but beyond that point WACC rises because:","o":["The tax shield disappears","Distress risk raises both the cost of debt and the cost of equity","Interest stops being deductible","Enterprise value falls to zero"],"a":1,"e":"Initially the cheaper, tax-deductible debt pulls the blend down. Past the optimal structure, the probability of financial distress raises the required return on both debt and equity faster than the tax shield benefits, so WACC turns back up."},
{"c":"dcf","l":3,"t":"mc","q":"The most defensible treatment of stock-based compensation in a DCF is:","o":["Add it back as non-cash and ignore the dilution","Treat it as a real economic cost, since it transfers value from existing shareholders","Deduct it twice","Capitalise it as an asset"],"a":1,"e":"It is non-cash but not free: it issues shares and dilutes existing holders. Either expense it in the cash flows, or add it back and then increase the share count for the shares issued. Doing neither systematically overstates value."},
{"c":"dcf","l":3,"t":"mc","q":"A large NOL balance should be handled in a DCF by:","o":["Ignoring it","Modelling the reduced cash taxes until the NOL is used, or valuing it separately as an asset","Adding it to revenue","Treating it as debt"],"a":1,"e":"NOLs shelter future taxable income, so cash taxes are below the book rate until exhausted. Model that explicitly, or discount the tax savings separately and add them like cash. Note that acquisitions trigger annual limits on usage."},
{"c":"dcf","l":3,"t":"mc","q":"Adjusted present value is preferable to WACC when:","o":["The company has no debt","Capital structure is changing significantly, as in an LBO","Cash flows are perfectly stable","There are no taxes"],"a":1,"e":"WACC assumes a constant capital structure, which is wrong when leverage falls sharply over a holding period. APV values the unlevered business at the unlevered cost of equity and adds the present value of the tax shields separately, year by year."},
{"c":"dcf","l":3,"t":"mc","q":"The single most useful sanity check on a completed DCF is:","o":["Confirming the file opens","Comparing the implied multiples to where comparable companies trade","Checking the font size","Recalculating revenue"],"a":1,"e":"Converting your enterprise value into an implied EV/EBITDA and comparing it to the peer group immediately shows whether the model is claiming a large premium or discount, and forces you to justify it. Checking the implied terminal growth rate is the companion test."},
{"c":"dcf","l":3,"t":"mc","q":"WACC should generally be based on:","o":["The current capital structure only","The target or optimal capital structure the company will converge to","The industry maximum leverage","Zero debt always"],"a":1,"e":"A DCF values the business into perpetuity, so the discount rate should reflect the structure the company will sustain, usually the industry norm, rather than a temporarily unusual current position such as a recent large debt raise."},
{"c":"dcf","l":3,"t":"mc","q":"You calculate the implied perpetuity growth rate from an exit multiple terminal value in order to:","o":["Increase the valuation","Check that the multiple does not imply an absurd growth rate, such as above nominal GDP","Satisfy auditors","Avoid using WACC"],"a":1,"e":"A multiple carries an implicit growth assumption. If your exit multiple implies 5% perpetual growth in a 2% economy, you are assuming the company eventually outgrows the economy, which is indefensible."},
{"c":"dcf","l":3,"t":"mc","q":"For a business with large, lumpy capital expenditure, the terminal year capex should be:","o":["Set to zero","Normalised to a sustainable maintenance level that also funds assumed growth","Set equal to the peak year","Set equal to revenue"],"a":1,"e":"Ending the explicit period in a heavy spending year and capitalising it forever understates value; assuming no capex overstates it. Terminal capex should roughly cover depreciation plus the investment needed to support the perpetual growth rate assumed."},
{"c":"dcf","l":3,"t":"mc","q":"Your DCF values a company 40% above the market price. The first thing to do is:","o":["Publish a buy recommendation","Check the mechanics and then compare your implied multiples to the comps","Raise the discount rate until it matches","Assume the market is wrong"],"a":1,"e":"Check discount periods, net debt date and share count first, since simple errors explain most large gaps. Then test whether your implied multiple is defensible against peers. Only after that do you conclude the market is mispricing it."},
{"c":"dcf","l":3,"t":"mc","q":"When incorporating country risk in an emerging market DCF, the main error to avoid is:","o":["Using any discount rate at all","Double counting by both adding a country premium and haircutting the cash flows for the same risk","Forecasting in local currency","Using a long forecast period"],"a":1,"e":"You either adjust the discount rate with a country risk premium or build explicit downside scenarios into the cash flows, but not both for the same risk. You must also keep currency consistent: local cash flows discounted at a local nominal rate."},
{"c":"dcf","l":3,"t":"mc","q":"Two analysts build a DCF on the same company and reach very different values. The largest single source of divergence is usually:","o":["The share count","Terminal value assumptions","The tax rate","The number of forecast rows"],"a":1,"e":"Terminal value is typically 60% to 80% of total value and turns on WACC and terminal growth, whose difference sits in the denominator. A 50 basis point difference in each can move value 20% or more."},
{"c":"dcf","l":3,"t":"mc","q":"Your terminal value is 85% of total enterprise value. The most likely problem is:","o":["Nothing, this is always normal","The terminal growth rate is too close to WACC, or the final year is not a steady state","The forecast period is too long","The tax rate is wrong"],"a":1,"e":"60% to 80% is typical. Above that, check whether the growth rate is compressing the denominator, or whether the terminal year still has expanding margins or capex below depreciation. Extending the forecast period also pulls value back into the explicit years."},

/* ========================== M&A / MERGER MODEL (52) ========================== */
{"c":"ma","l":1,"t":"mc","q":"In an all-stock deal with no synergies, the transaction is accretive when:","o":["The acquirer's P/E is lower than the target's P/E","The acquirer's P/E is higher than the target's P/E","Both trade at the same P/E","The target has higher revenue"],"a":1,"e":"A higher-P/E acquirer is issuing expensive currency to buy cheaper earnings, so EPS rises. The reverse is dilutive."},
{"c":"ma","l":1,"t":"mc","q":"Which financing method is usually cheapest for an acquirer, assuming it is available?","o":["Issuing new equity","Raising new debt","Using excess cash on hand","Issuing convertible bonds"],"a":2,"e":"Cash costs only the forgone interest income, typically the lowest of the three. Debt is next, since interest is tax-deductible. Equity is the most expensive form of currency."},
{"c":"ma","l":1,"t":"mc","q":"Synergies in M&A are usually split into:","o":["Tax and accounting","Revenue and cost","Short-term and permanent","Hard and soft assets"],"a":1,"e":"Cost synergies come from eliminating overlap. Revenue synergies come from cross-selling and expanded distribution. Cost synergies are far more credible."},
{"c":"ma","l":1,"t":"mc","q":"A hostile takeover is best described as:","o":["Any deal where the price is contested","An offer taken directly to shareholders over the board's objection","A deal blocked by regulators","An acquisition funded entirely with debt"],"a":1,"e":"When the target's board refuses to negotiate, the bidder can go around it with a tender offer or a proxy fight."},
{"c":"ma","l":1,"t":"mc","q":"A poison pill works by:","o":["Requiring the bidder to pay a break fee","Letting all other shareholders buy discounted shares, diluting the bidder","Forcing an immediate shareholder vote","Transferring assets to a subsidiary"],"a":1,"e":"Once a bidder crosses a set ownership threshold, the rights plan triggers and makes the stake prohibitively expensive to increase."},
{"c":"ma","l":1,"t":"mc","q":"In an all-cash acquisition, the acquirer's share count:","o":["Rises by the purchase price divided by share price","Falls","Is unchanged","Depends on the target's share count"],"a":2,"e":"No shares are issued, so only the balance sheet and interest expense change. That is part of why cash deals are usually more accretive."},
{"c":"ma","l":1,"t":"mc","q":"A tender offer is:","o":["A bid submitted to the target's board","An offer made directly to the target's shareholders to buy their shares","A regulatory filing","An agreement to negotiate exclusively"],"a":1,"e":"It bypasses the board, which is why it is the standard instrument in a hostile approach."},
{"c":"ma","l":1,"t":"mc","q":"In a merger model, the exchange ratio is:","o":["The premium paid over the unaffected price","The number of acquirer shares issued per target share","The ratio of synergies to purchase price","The pro forma ownership split"],"a":1,"e":"The exchange ratio is how many acquirer shares each target shareholder receives for one target share. It equals the offer price per target share divided by the acquirer's share price, and it determines both new shares issued and the pro forma ownership split."},
{"c":"ma","l":1,"t":"mc","q":"Which is the least credible stated reason for an acquisition?","o":["Cost synergies from eliminating duplicate functions","Acquiring technology or capability faster than building it","Diversification purely to reduce earnings volatility","Consolidating a fragmented market to gain pricing power"],"a":2,"e":"Shareholders can diversify far more cheaply by holding a portfolio, so diversification alone rarely creates value and is the classic empire-building justification. Synergies, capability acquisition and consolidation all have defensible economic logic."},
{"c":"ma","l":1,"t":"mc","q":"In a merger model, the correct sequence is:","o":["Combine balance sheets, then guess EPS","Set purchase price and funding, run purchase accounting, combine the income statements, then compare pro forma EPS to standalone","Calculate synergies first, then the price","Value the acquirer only"],"a":1,"e":"You establish the offer and consideration mix, build sources and uses, allocate the purchase price creating goodwill and asset write-ups, then combine earnings adjusting for new interest, foregone interest and incremental D&A, and test accretion against standalone EPS."},
{"c":"ma","l":1,"t":"mc","q":"A deal is accretive when:","o":["Pro forma EPS exceeds the acquirer's standalone EPS","Revenue increases","The target is larger than the acquirer","Goodwill is created"],"a":0,"e":"Accretion and dilution compare combined EPS against what the acquirer would have earned alone. It says nothing on its own about value creation: a cheaply financed deal can be accretive and still destroy value if the price exceeds what the business is worth."},
{"c":"ma","l":1,"t":"mc","q":"Revenue synergies are treated as less credible than cost synergies because:","o":["They are smaller in absolute terms","They depend on customer behaviour and competitor response, which are outside management's control","They are illegal to include","They arrive faster"],"a":1,"e":"Closing a duplicate office or removing an overlapping function is within management's control and can be scheduled. Cross-selling assumes customers buy more and competitors do not respond, so bankers and acquirers heavily discount or exclude them."},
{"c":"ma","l":2,"t":"mc","q":"Acquirer trades at 15x earnings, target at 20x. All-stock deal, no synergies. The deal is:","o":["Accretive","Dilutive","Neutral","Cannot be determined"],"a":1,"e":"The acquirer is issuing 15x currency to buy 20x earnings, so it gives up more in earnings per share than it gains. Dilutive without synergies."},
{"c":"ma","l":2,"t":"mc","q":"A deferred tax liability is created in an acquisition mainly because:","o":["The target owes back taxes","Asset write-ups increase book D&A but are not deductible for tax","Goodwill is amortised for book purposes","The acquirer changes tax jurisdiction"],"a":1,"e":"Book depreciation rises on the written-up assets while tax depreciation does not, so book taxes are lower than cash taxes and the gap accrues as a DTL."},
{"c":"ma","l":2,"t":"mc","q":"Acquirer has 100m shares and EPS of $2.00, trading at $30. It buys a target with $50m of net income for $600m, all in stock. What is pro forma EPS?","o":["$2.00","$2.08","$2.50","$1.92"],"a":1,"e":"Shares issued: 600/30 = 20m, so 120m total. Combined net income: 200 + 50 = 250. EPS = 250/120 = $2.08, so accretive."},
{"c":"ma","l":2,"t":"mc","q":"A break fee in a merger agreement is typically:","o":["Paid by the buyer if financing fails only","Paid by the target if it walks away for a competing bid","Paid to regulators","Paid annually until closing"],"a":1,"e":"It compensates the buyer for costs and deters interlopers. A reverse break fee runs the other way, covering the seller if the buyer fails to close."},
{"c":"ma","l":2,"t":"mc","q":"Which of these reduces accretion in a merger model?","o":["Cost synergies","Incremental D&A from asset write-ups","Using cash rather than stock","A lower purchase price"],"a":1,"e":"Purchase accounting write-ups create new depreciation and amortisation that did not previously exist, which drags on pro forma earnings."},
{"c":"ma","l":2,"t":"mc","q":"An earnout is most often used when:","o":["The buyer lacks financing","Buyer and seller disagree about the target's future performance","Regulatory approval is uncertain","The target is publicly listed"],"a":1,"e":"Part of the price is made contingent on hitting agreed targets, which bridges a valuation gap by shifting performance risk back to the seller."},
{"c":"ma","l":2,"t":"mc","q":"A fixed exchange ratio rather than a fixed price means the target's shareholders bear:","o":["No market risk","The risk of the acquirer's share price moving before close","Only the regulatory risk","The financing risk"],"a":1,"e":"Under a fixed exchange ratio the number of shares is locked but their value floats with the acquirer's price, so the target carries that risk. A fixed value deal locks the price and floats the share count, putting the dilution risk on the acquirer."},
{"c":"ma","l":2,"t":"mc","q":"In purchase accounting, the write-up of the target's PP&E to fair value creates:","o":["Additional goodwill","Additional depreciation that reduces future net income","An immediate cash outflow","A deferred tax asset"],"a":1,"e":"Writing an asset up to fair value increases its depreciable base, so future depreciation rises and pro forma net income falls. It also usually creates a deferred tax liability, because the write-up is generally not deductible for tax."},
{"c":"ma","l":2,"t":"mc","q":"Transaction fees in an acquisition are generally:","o":["Capitalised into goodwill","Expensed as incurred, reducing net income","Added to the target's PP&E","Treated as a financing cash flow only"],"a":1,"e":"Under current accounting, advisory and legal transaction costs are expensed as incurred rather than capitalised into the purchase price. Financing fees are the exception: they are capitalised and amortised over the life of the debt."},
{"c":"ma","l":2,"t":"mc","q":"A reverse merger is most often used to:","o":["Take a private company public without a traditional IPO","Force a hostile acquisition","Unwind a failed acquisition","Split a company into two"],"a":0,"e":"In a reverse merger a private company merges into a listed shell, with the private company's owners ending up in control of the public entity. It is faster and cheaper than a traditional IPO but comes with weaker price discovery and often a poorer shareholder base."},
{"c":"ma","l":2,"t":"mc","q":"Pro forma interest expense in a cash-funded acquisition should include:","o":["Only interest on new debt raised","Interest on new debt plus foregone interest income on cash used","Only the target's existing interest","No interest, as it is non-cash"],"a":1,"e":"Using balance sheet cash has an opportunity cost: the acquirer loses the interest income that cash was earning. A complete accretion analysis charges both the interest on new debt and the foregone interest income, both tax-effected."},
{"c":"ma","l":2,"t":"mc","q":"In purchase price allocation, goodwill equals:","o":["The target's existing goodwill","Purchase price less the fair value of identifiable net assets acquired","The premium over book value of equity","The value of cost synergies"],"a":1,"e":"You write identifiable assets to fair value, recognise previously unrecorded intangibles such as brands and customer relationships, record any deferred tax liability from non-deductible write-ups, and goodwill is the residual plug."},
{"c":"ma","l":2,"t":"mc","q":"What happens to the target's existing goodwill in an acquisition?","o":["It carries over unchanged","It is written off and replaced by newly calculated goodwill","It is added to the purchase price","It becomes cash"],"a":1,"e":"Existing goodwill is not an identifiable asset, so it is eliminated in the allocation. New goodwill is calculated fresh as the residual after writing the target's identifiable assets to fair value."},
{"c":"ma","l":2,"t":"mc","q":"A cash deal and a stock deal produce different accretion primarily because:","o":["Cash deals avoid taxes","Cash costs after-tax interest or foregone interest income, while stock issues new shares","Stock deals never create goodwill","Cash deals are always dilutive"],"a":1,"e":"Cash consideration adds an after-tax financing cost to the numerator; stock consideration increases the denominator. Which is more accretive depends on the after-tax cost of debt versus the earnings yield implied by the acquirer's P/E."},
{"c":"ma","l":2,"t":"mc","q":"Compared with a stock purchase, an asset purchase typically gives the buyer:","o":["All of the target's liabilities","A step-up in tax basis and the ability to leave unwanted liabilities behind","A lower purchase price always","The target's NOLs in full"],"a":1,"e":"Buyers prefer asset deals for the depreciation step-up and liability protection. Sellers usually prefer stock deals to avoid double taxation and achieve a clean exit, which is why the structure is negotiated and priced."},
{"c":"ma","l":2,"t":"mc","q":"A fairness opinion states that the consideration is:","o":["The highest price obtainable","Fair from a financial point of view to a specified group","Guaranteed to create value","Approved by regulators"],"a":1,"e":"It is a governance document supporting the board's fiduciary duty, not a promise of the best possible price. Its weakness is that the adviser giving it often earns a fee contingent on completion, which is why independent opinions exist."},
{"c":"ma","l":2,"t":"mc","q":"In a sell-side process, first-round bidders typically submit:","o":["A fully financed binding offer","A non-binding indication of interest with a valuation range","A signed purchase agreement","Nothing in writing"],"a":1,"e":"First round produces non-binding indications after the CIM. Selected bidders then get management presentations and data room access before submitting binding offers with a marked-up purchase agreement and committed financing."},
{"c":"ma","l":2,"t":"mc","q":"Compared with a financial buyer, a strategic buyer can often pay more because:","o":["They have lower tax rates","They can realise synergies a standalone owner cannot","They borrow more cheaply always","They complete faster"],"a":1,"e":"A strategic can strip duplicate costs and cross-sell, so the target is worth more in their hands. A financial buyer underwrites to a target return on a standalone business, which caps what the model supports."},
{"c":"ma","l":2,"t":"mc","q":"A collar in a stock deal is used to:","o":["Guarantee regulatory approval","Limit how far the consideration moves as the acquirer's share price changes before closing","Fix the closing date","Eliminate the break fee"],"a":1,"e":"It bridges fixed exchange ratio and fixed value structures by setting a band. Outside the band the ratio or value adjusts. Collars are common where the gap to closing is long because of regulatory review, and often come with walk-away rights."},
{"c":"ma","l":2,"t":"mc","q":"A merger of equals is distinguished from an acquisition mainly by:","o":["The absence of any consideration","A small or nominal premium, all-stock consideration and shared governance","The lack of regulatory review","The size of the advisory fee"],"a":1,"e":"The label avoids the appearance of one side losing and avoids paying a control premium. The recurring problem is that shared governance slows integration, and most such deals end with one side effectively in control within a couple of years."},
{"c":"ma","l":2,"t":"mc","q":"Breakeven synergies on a value basis are approximately:","o":["The premium paid, since that is the value handed to the target's shareholders","The target's revenue","The acquirer's market cap","The advisory fee"],"a":0,"e":"Paying a 30% premium on a $2bn target transfers $600m. The deal needs at least that much present value in synergies for the acquirer's shareholders to break even. Converting to an annual run-rate means dividing by a capitalisation multiple and adjusting for tax."},
{"c":"ma","l":3,"t":"mc","q":"An acquirer trades at 15x earnings and funds an acquisition entirely with debt at a 5% interest rate. Tax rate is 40%. Ignoring the target's own multiple, the after-tax cost of debt versus the acquirer's earnings yield is:","o":["3% versus 6.7%, so accretive","5% versus 6.7%, so accretive","3% versus 15%, so dilutive","6.7% versus 3%, so dilutive"],"a":0,"e":"After-tax cost of debt is 5% x (1 - 0.40) = 3%. The acquirer's earnings yield is 1/15 = 6.7%. Financing cost below the yield being acquired means accretion."},
{"c":"ma","l":3,"t":"mc","q":"An acquirer with a P/E of 25x acquires a target at an effective P/E of 15x in an all-stock deal. Ignoring synergies, the deal is:","o":["Dilutive","Accretive","Neutral","Impossible to determine"],"a":1,"e":"In an all-stock deal you compare the two P/E multiples. Buying earnings at 15x using shares valued at 25x means you acquire more earnings than you give up, so EPS rises. The rule is that an all-stock deal is accretive when the acquirer's P/E exceeds the target's effective P/E including the premium."},
{"c":"ma","l":3,"t":"mc","q":"Which of these would typically NOT be a condition precedent to closing an acquisition?","o":["Antitrust clearance","Shareholder approval","Absence of a material adverse change","The acquirer's share price remaining above a level"],"a":3,"e":"Share price is not normally a closing condition, which is precisely why collars and walk-away rights exist as negotiated exceptions. Regulatory clearance, shareholder votes and the absence of a material adverse change are standard conditions in almost every deal."},
{"c":"ma","l":3,"t":"mc","q":"Acquirer has 200m shares, net income $400m, and trades at $40. It buys a target for $1,000m in cash at 5% pre-tax interest, tax rate 25%. Target net income is $60m. Is the deal accretive?","o":["Yes, EPS rises to about $2.11","No, EPS falls to about $1.95","Neutral","Cannot be determined"],"a":0,"e":"Acquirer EPS is $400m over 200m, which is $2.00. After-tax interest cost is $1,000m times 5% times 0.75, which is $37.5m. Combined net income is 400 plus 60 less 37.5, which is $422.5m over an unchanged 200m shares, so $2.11. The deal is accretive, since the target's earnings yield exceeds the after-tax cost of debt."},
{"c":"ma","l":3,"t":"mc","q":"To find the synergies needed for a deal to be EPS-neutral, you:","o":["Divide the premium by the share count","Solve for the after-tax synergy level that makes pro forma EPS equal standalone EPS","Multiply the premium by the tax rate","Use the target's EBITDA margin"],"a":1,"e":"Build the accretion bridge with synergies as the unknown and solve. Present it as the required run-rate, net of the costs to achieve, so the client can judge whether that number is operationally realistic."},
{"c":"ma","l":3,"t":"mc","q":"An accretive deal can still destroy value when:","o":["EPS rises","The price paid exceeds the present value of the target's cash flows plus synergies","Goodwill is created","The acquirer uses cash"],"a":1,"e":"Accretion is a short-term earnings arithmetic driven by the relative multiples and financing cost. Value creation depends on whether the price paid is below what the business plus synergies is actually worth. Cheap debt makes almost anything accretive."},
{"c":"ma","l":3,"t":"mc","q":"A target with large NOLs affects a merger model by:","o":["Increasing the purchase price automatically","Reducing combined cash taxes, subject to annual usage limits triggered by the change of control","Eliminating goodwill","Removing the need for financing"],"a":1,"e":"NOLs shelter future taxable income and add real value, but a change of ownership triggers limitations capping how fast they can be used. Modelling them as immediately usable in full materially overstates the benefit."},
{"c":"ma","l":3,"t":"mc","q":"A contribution analysis compares:","o":["Each party's contribution of revenue, EBITDA and earnings against its share of the combined equity","The advisers' fees","The number of employees only","The tax rates of both parties"],"a":0,"e":"It tests whether the ownership split matches economic contribution, which is central in mergers of equals and all-stock deals. If one side contributes 60% of EBITDA but receives 50% of the equity, that gap has to be justified."},
{"c":"ma","l":3,"t":"mc","q":"Purchase accounting affects the combined income statement going forward mainly through:","o":["Higher revenue","Incremental D&A from asset write-ups, which reduces reported earnings","Lower tax rates","Reduced share count"],"a":1,"e":"Writing PP&E and intangibles to fair value raises their depreciable and amortisable base, so future non-cash charges rise and reported net income falls. This is why acquirers emphasise cash EPS, which adds back acquired intangible amortisation."},
{"c":"ma","l":3,"t":"mc","q":"A seller might prefer stock over cash consideration because:","o":["Stock is always worth more","It can defer tax and preserve participation in the combined upside","Stock deals close faster","Stock avoids regulatory review"],"a":1,"e":"An all-stock exchange can be structured as tax-deferred, and the seller keeps exposure to synergies they believe in. The trade-off is that they now carry market risk on the acquirer's shares."},
{"c":"ma","l":3,"t":"mc","q":"The strongest indicator that a deal faces serious antitrust risk is:","o":["The deal is large in absolute size","High combined market share in a concentrated, well-defined market","The buyer is foreign","The deal is all cash"],"a":1,"e":"Regulators focus on concentration in the relevant market, commonly assessed through share and HHI, plus evidence on barriers to entry and closeness of competition. Absolute deal size matters mainly for filing thresholds, not for the substantive test."},
{"c":"ma","l":3,"t":"mc","q":"The target's existing debt in an acquisition is most often:","o":["Always assumed unchanged","Repaid or refinanced, because change-of-control provisions are triggered","Converted to equity","Forgiven"],"a":1,"e":"Most credit agreements and indentures contain change-of-control clauses letting holders demand repayment at par or a premium. That is why the sources and uses table usually shows target debt repayment as a use of funds."},
{"c":"ma","l":3,"t":"mc","q":"A credible synergy schedule should:","o":["Assume full run-rate from day one","Phase benefits over two to three years and deduct the cash costs to achieve them","Include only revenue synergies","Ignore integration costs"],"a":1,"e":"Severance, systems integration and site closures are real cash outflows that land before benefits arrive. Phasing plus costs to achieve, often roughly one year of synergies, is what makes a schedule defensible rather than promotional."},
{"c":"ma","l":3,"t":"mc","q":"In a sources and uses table, which is a source?","o":["Repayment of target debt","The target's excess cash available at closing","Advisory fees","The equity purchase price"],"a":1,"e":"Sources are how the deal is funded: new debt, equity issued, acquirer cash and the target's own excess cash. Uses are what must be paid: equity purchase price, target debt repayment, call premiums and fees. The two must balance."},
{"c":"ma","l":3,"t":"mc","q":"In practice, material adverse change clauses:","o":["Are invoked successfully in most failed deals","Almost never succeed, given extensive carve-outs and a very high legal bar","Guarantee the buyer can walk away","Apply only to the seller"],"a":1,"e":"Carve-outs for general economic and industry conditions, plus a requirement that the change be durationally significant, make MACs extremely hard to invoke. Delaware first found one in Akorn in 2018. In practice a MAC is leverage to renegotiate price, not a reliable exit."},
{"c":"ma","l":3,"t":"mc","q":"Integration risk should primarily influence:","o":["Only the post-close plan","The price and structure, since synergy delivery is what justifies the premium","The choice of adviser","The announcement date"],"a":1,"e":"If the deal only works on full synergies delivered on schedule, the premium is too high. Systems overlap, culture, customer concentration and key-person dependence all feed the phasing and haircut applied to the synergy schedule."},
{"c":"ma","l":3,"t":"mc","q":"In a spin-off, as distinct from a carve-out:","o":["The parent receives cash proceeds","Shares are distributed to existing shareholders pro rata, usually tax-free, with no cash raised","The subsidiary is sold to a third party","The parent retains full ownership"],"a":1,"e":"A spin-off distributes subsidiary shares to existing holders and raises nothing. A carve-out sells a minority stake to the public for cash while the parent retains control. A split-off offers shareholders an exchange of parent shares for subsidiary shares."},
{"c":"ma","l":3,"t":"mc","q":"A go-shop provision allows a target to:","o":["Cancel the deal at will","Actively solicit competing bids for a defined period after signing","Increase the break fee","Avoid shareholder approval"],"a":1,"e":"It addresses the board's duty to test the market when a deal was negotiated without an auction, usually with a reduced break fee for a bidder emerging during the window. Topping bids are rare, since the original buyer holds matching rights."},
{"c":"ma","l":3,"t":"mc","q":"Before launching an unsolicited approach for a public target, the most important assessment is:","o":["The colour of the pitchbook","The target's defences, shareholder register and your financing certainty","The weather on announcement day","The target's dividend history"],"a":1,"e":"A staggered board plus a poison pill can extend a fight past two annual meetings. Concentrated founder ownership can make it impossible. And hostile bids require fully committed financing up front, with diligence limited to public information."},

/* ========================== LBO (51) ========================== */
{"c":"lbo","l":1,"t":"mc","q":"The three main value drivers in an LBO are:","o":["Revenue growth, cost cuts, and dividends","Debt paydown, EBITDA growth, and multiple expansion","Tax savings, capex reduction, and refinancing","Synergies, integration, and market share"],"a":1,"e":"Debt paydown converts enterprise value into equity value, EBITDA growth raises enterprise value, and multiple expansion raises it further. Sponsors control the first two far more than the third."},
{"c":"lbo","l":1,"t":"mc","q":"Which profile makes the best LBO candidate?","o":["High growth, high capex, no assets","Stable cash flows, low capex, strong asset base","Early stage, negative EBITDA, high optionality","Highly cyclical with volatile margins"],"a":1,"e":"Debt service needs predictable cash. Low capex leaves more free cash for the sweep, and hard assets support secured borrowing capacity."},
{"c":"lbo","l":1,"t":"mc","q":"All else equal, IRR increases when:","o":["The exit multiple falls","The hold period lengthens with the same exit equity value","The exit multiple rises","Entry leverage decreases"],"a":2,"e":"A higher exit multiple raises exit enterprise value and therefore equity proceeds. A longer hold for the same total return lowers the annualised rate."},
{"c":"lbo","l":1,"t":"mc","q":"Sponsor equity as a share of the total purchase price in a typical LBO today is around:","o":["5% to 15%","40% to 60%","75% to 85%","90% or more"],"a":1,"e":"The 1980s deals ran far higher leverage. Modern structures typically sit near half equity, more for businesses with volatile cash flows."},
{"c":"lbo","l":1,"t":"mc","q":"A cash sweep provision means:","o":["The sponsor can withdraw excess cash as a dividend","Excess free cash flow must be used to repay debt","Interest can be deferred in a downturn","Working capital is funded by the revolver"],"a":1,"e":"It accelerates deleveraging, which is one of the main return drivers, and reduces lender risk. It typically steps down as leverage falls."},
{"c":"lbo","l":1,"t":"mc","q":"Which tranche normally carries mandatory amortisation?","o":["High yield bonds","Term loan A / senior secured","Mezzanine","PIK notes"],"a":1,"e":"Senior secured loans amortise on a schedule. Bonds and junior tranches are typically bullet repayments at maturity."},
{"c":"lbo","l":1,"t":"mc","q":"A management incentive plan in an LBO is usually sized at roughly:","o":["Under 1% of equity","5% to 15% of equity","25% to 30% of equity","50% of equity"],"a":1,"e":"Options or sweet equity vesting on time and on return hurdles, which aligns management with the sponsor's exit."},
{"c":"lbo","l":1,"t":"mc","q":"In an LBO, the sponsor's equity return is driven by all of these EXCEPT:","o":["Debt paydown from cash generation","EBITDA growth","Multiple expansion at exit","The target's dividend policy before the deal"],"a":3,"e":"The three classic value drivers are deleveraging, EBITDA growth and multiple expansion. The target's pre-deal dividend policy is irrelevant, because the capital structure is entirely replaced at close."},
{"c":"lbo","l":1,"t":"mc","q":"Which sequence correctly describes an LBO?","o":["Buy with all equity, grow revenue, sell","Acquire using mostly debt serviced by the target's cash flow, repay debt over the hold, exit in three to seven years","Lend money to a company and collect interest","Merge two public companies"],"a":1,"e":"A sponsor funds the purchase largely with debt raised against the target's own cash flows, contributes an equity cheque for the balance, uses operating cash to service and repay that debt, then exits via sale or IPO."},
{"c":"lbo","l":1,"t":"mc","q":"Sponsors use debt in an LBO primarily because:","o":["Debt is free","It amplifies returns on a smaller equity cheque and interest is tax-deductible","Lenders demand it","It reduces risk"],"a":1,"e":"A smaller equity base means each dollar of value creation produces a larger percentage return, and the interest tax shield lowers the effective cost. The cost is fixed obligations that must be serviced in bad years as well as good."},
{"c":"lbo","l":1,"t":"mc","q":"Which is NOT a standard LBO exit route?","o":["Sale to a strategic buyer","Sale to another sponsor","Initial public offering","Liquidating the assets at book value"],"a":3,"e":"The three normal exits are a strategic sale, a secondary buyout, and an IPO, with dividend recapitalisations providing interim liquidity. Liquidation is a failure outcome, not a planned exit."},
{"c":"lbo","l":2,"t":"mc","q":"Entry at 5.0x EBITDA of $100m with 60% debt. Exit after 5 years at 5.0x on EBITDA of $130m, with $150m of debt repaid. Approximate IRR?","o":["12%","20%","28%","35%"],"a":1,"e":"Entry EV $500m, debt $300m, equity $200m. Exit EV $650m, debt $150m, equity $500m. That is 2.5x MoM over 5 years, so IRR = 2.5^(1/5) - 1, roughly 20%."},
{"c":"lbo","l":2,"t":"mc","q":"A revolving credit facility in an LBO is primarily there to:","o":["Fund the purchase price","Cover seasonal working capital swings and short-term liquidity","Pay sponsor dividends","Replace the equity cheque"],"a":1,"e":"The revolver is drawn and repaid as working capital needs fluctuate. It is usually undrawn or lightly drawn at close and carries a commitment fee on the unused portion."},
{"c":"lbo","l":2,"t":"mc","q":"Total leverage in a typical mid-market LBO most commonly falls in which range?","o":["1x to 2x EBITDA","4x to 6x EBITDA","8x to 10x EBITDA","Above 12x EBITDA"],"a":1,"e":"Four to six times is the conventional band, though it moves with credit conditions, sector, and cash flow stability. Software deals have gone materially higher."},
{"c":"lbo","l":2,"t":"mc","q":"EBITDA is $100m, leverage is 5.0x, and the blended interest rate is 8%. What is annual interest expense?","o":["$25m","$40m","$50m","$80m"],"a":1,"e":"Leverage of 5.0x on $100m of EBITDA means $500m of debt, and 8% on that is $40m of annual interest. That leaves $60m of EBITDA before capex, taxes and amortisation, so interest coverage is 2.5x \u2014 thin enough that a downturn would threaten covenants."},
{"c":"lbo","l":2,"t":"mc","q":"Same company: EBITDA $100m, interest expense $40m. What is interest coverage?","o":["1.5x","2.5x","4.0x","5.0x"],"a":1,"e":"EBITDA divided by interest is 100/40 = 2.5x. Lenders typically want comfortably above 2.0x at close."},
{"c":"lbo","l":2,"t":"mc","q":"A target with $80m EBITDA is bought at 10.0x. The sponsor funds 45% with equity. What is the equity cheque?","o":["$320m","$360m","$400m","$440m"],"a":1,"e":"Enterprise value is 10 x 80 = $800m. 45% of that is $360m, with $440m of debt."},
{"c":"lbo","l":2,"t":"mc","q":"Entry at 8.0x, exit at 8.0x after five years, EBITDA flat, and no debt repaid. What is the multiple of money?","o":["0.5x","1.0x","1.5x","2.0x"],"a":1,"e":"With no growth, no multiple expansion and no deleveraging, none of the three value drivers has done anything. The sponsor gets its money back and nothing more."},
{"c":"lbo","l":2,"t":"mc","q":"A sponsor invests $200m of equity and exits five years later for $600m of equity proceeds. What is the approximate IRR?","o":["20%","25%","33%","40%"],"a":1,"e":"That is a 3.0x multiple of money over five years. The rule of thumb is that 3x over five years is roughly 25%, since 1.25 to the fifth is about 3.05. Memorising the grid of MoM to IRR for three and five year holds is worth doing."},
{"c":"lbo","l":2,"t":"mc","q":"Original issue discount on a term loan means the lender:","o":["Charges a higher interest rate","Funds less than par while the borrower repays par","Takes equity warrants","Defers interest to maturity"],"a":1,"e":"With 2% OID, the lender advances 98 cents for every dollar of face value, but the borrower still owes and repays 100. It raises the effective yield without raising the coupon, and in a sources and uses table it reduces the cash actually available from that tranche."},
{"c":"lbo","l":2,"t":"mc","q":"Which of these is a use of cash in an LBO's debt schedule?","o":["Cash flow available for debt repayment","Mandatory amortisation","Revolver drawdown","Beginning cash balance"],"a":1,"e":"Mandatory amortisation is a contractual repayment and therefore a use. Cash flow available for repayment, revolver draws and the opening cash balance are all sources within the schedule."},
{"c":"lbo","l":2,"t":"mc","q":"Over a hold, deleveraging contributes $200m of value, EBITDA growth $250m and multiple expansion $50m. What share of value creation came from EBITDA growth?","o":["40%","50%","20%","10%"],"a":1,"e":"Total value created is $500m, so EBITDA growth of $250m is 50%. Deleveraging is 40% and multiple expansion 10%. Sponsors and their investors care about this split because only the EBITDA growth component reflects genuine operational improvement."},
{"c":"lbo","l":2,"t":"mc","q":"The fastest way to estimate IRR without a calculator is to:","o":["Divide the multiple of money by the years","Memorise anchor points, such as 2x in three years being about 26% and 3x in five years about 25%","Use the tax rate","Multiply the equity by the exit multiple"],"a":1,"e":"IRR is a compound rate, so dividing by years is wrong. The useful anchors are 2x over three years at roughly 26%, 2x over five at about 15%, and 3x over five at about 25%. The rule of 72 gives a quick cross-check."},
{"c":"lbo","l":2,"t":"mc","q":"Compared with senior secured debt, subordinated debt in an LBO:","o":["Is cheaper and ranks higher","Ranks behind, carries a higher coupon, and usually has looser amortisation","Is always converted to equity","Has no maturity"],"a":1,"e":"Senior secured sits first in the waterfall with collateral, tighter covenants and mandatory amortisation. Subordinated and mezzanine debt rank behind, so lenders demand a higher return, often with PIK features or warrants."},
{"c":"lbo","l":2,"t":"mc","q":"A dividend recapitalisation involves:","o":["Issuing equity to pay down debt","Raising new debt to pay the sponsor a dividend before exit","Selling the company to management","Converting debt to equity"],"a":1,"e":"It pulls cash out early, de-risking the sponsor's position and improving IRR because money returned sooner is worth more. The company is left more levered, which is why lenders and rating agencies view them warily."},
{"c":"lbo","l":2,"t":"mc","q":"In a debt schedule, the cash available for optional repayment is calculated after:","o":["Only interest","Interest, mandatory amortisation, capex and working capital","Only taxes","The exit multiple"],"a":1,"e":"You build down from EBITDA through cash interest, taxes, capex and working capital to free cash flow, subtract mandatory amortisation, apply any minimum cash requirement, and sweep what remains against the debt in order of priority."},
{"c":"lbo","l":2,"t":"mc","q":"A buy-and-build strategy creates value primarily through:","o":["Cutting all research spending","Multiple arbitrage, buying smaller businesses at lower multiples and folding them into a larger platform","Reducing the exit multiple","Raising more equity"],"a":1,"e":"Small add-ons typically trade at lower multiples than the platform, so value is created on acquisition before any synergies. Scale can also improve procurement, pricing and the eventual exit multiple, but integration risk compounds with each deal."},
{"c":"lbo","l":2,"t":"mc","q":"A leveraged recapitalisation differs from an LBO in that:","o":["No debt is used","Ownership largely stays the same while the capital structure changes","The company is liquidated","It applies only to private companies"],"a":1,"e":"A recap raises debt to fund a special dividend or buyback while the company remains independent. An LBO is a change of control. Both increase financial risk in exchange for higher returns on a smaller equity base."},
{"c":"lbo","l":2,"t":"mc","q":"Sponsors want management to roll over equity because it:","o":["Reduces the purchase price","Aligns management with the new owners by putting their own money at risk","Is required by law","Eliminates the need for an incentive plan"],"a":1,"e":"Management with real capital at risk behave differently from those who have been fully cashed out. A refusal to roll is itself a signal. The rollover sits alongside a management incentive plan, typically 8% to 12% of equity."},
{"c":"lbo","l":2,"t":"mc","q":"Sponsors care about revenue quality because:","o":["It determines the tax rate","Leverage turns revenue volatility into equity volatility, and fixed debt service cannot flex","Auditors require it","It sets the management fee"],"a":1,"e":"Contracted, recurring revenue with high retention and a diversified customer base supports far more debt than project-based or concentrated revenue. That is why software and healthcare services command high entry multiples and leverage."},
{"c":"lbo","l":2,"t":"mc","q":"Compared with a secondary buyout, a corporate carve-out typically offers:","o":["A cleaner, simpler transaction","More operational upside but far greater separation complexity","A guaranteed higher price","No need for diligence"],"a":1,"e":"Carve-outs are messier: you need a transition services agreement, a credible standalone cost base including stranded overhead, and 12 to 24 months of separation work. That complexity deters bidders, which is why returns have historically been stronger."},
{"c":"lbo","l":3,"t":"mc","q":"In a sources and uses table, which belongs under 'uses'?","o":["Sponsor equity contribution","Term loan B proceeds","Refinancing of existing target debt","Revolver commitment"],"a":2,"e":"Uses are what the money is spent on: purchasing the equity, refinancing existing debt, and paying transaction and financing fees. Sources are where the money comes from."},
{"c":"lbo","l":3,"t":"mc","q":"Entry at 10.0x EBITDA with 6.0x of debt. At exit five years later, EBITDA has grown 50% and all debt is repaid, with an exit multiple of 10.0x. What is the approximate multiple of money?","o":["1.9x","2.5x","3.75x","5.0x"],"a":2,"e":"Entry equity is 10.0x less 6.0x, which is 4.0 turns of entry EBITDA. Exit enterprise value is 10.0 times 1.5, which is 15.0 turns of entry EBITDA, with no debt, so all of it is equity. 15.0 divided by 4.0 is 3.75x."},
{"c":"lbo","l":3,"t":"mc","q":"Which of these most improves an LBO return without requiring any operational change?","o":["Lengthening the holding period at a constant multiple of money","Buying at a lower entry multiple","Increasing capital expenditure","Adding more covenants"],"a":1,"e":"Entry price is the single most reliable driver of returns, because every turn of EBITDA saved at entry flows straight to the equity. Lengthening the hold at constant MoM actively reduces IRR, since IRR is time-weighted."},
{"c":"lbo","l":3,"t":"mc","q":"A sponsor holds an asset for three years and achieves a 2.0x multiple of money. The approximate IRR is:","o":["20%","26%","33%","40%"],"a":1,"e":"2.0x over three years means the cube root of 2, which is about 1.26, so roughly 26%. The useful anchors to memorise: 2x in three years is about 26%, 2x in five years is about 15%, 3x in five years is about 25%."},
{"c":"lbo","l":3,"t":"mc","q":"In a typical LBO waterfall, the sponsor's carried interest is usually paid:","o":["From the first dollar of proceeds","Only after limited partners receive their capital back plus a preferred return","Annually regardless of performance","Only if the IRR exceeds 40%"],"a":1,"e":"The standard structure returns LP capital first, then a preferred return, commonly 8%, then a catch-up to the general partner, and only then splits profits, typically 80 to the LPs and 20 to the GP. Carry is the GP's share of profits above that hurdle."},
{"c":"lbo","l":3,"t":"mc","q":"A sponsor buys at 9.0x EBITDA of $100m, funding 50% with equity. After three years EBITDA is $130m, net debt has fallen from $450m to $300m, and the exit multiple is 9.0x. What is the multiple of money?","o":["1.9x","2.0x","2.6x","1.5x"],"a":0,"e":"Entry equity is $450m. Exit enterprise value is 9.0 times $130m, which is $1,170m, less $300m of net debt leaves $870m of equity. 870 divided by 450 is 1.93x, so roughly 1.9x over three years, about a 25% IRR."},
{"c":"lbo","l":3,"t":"mc","q":"An LBO model used as a valuation tool tells you:","o":["The intrinsic value of the business","The maximum a sponsor could pay and still achieve their target return","The value a strategic buyer would pay","The liquidation value"],"a":1,"e":"You fix the required IRR and solve backwards for entry price. That sets a floor in a sale process, since a financial buyer will not exceed it, and strategic buyers with synergies can usually pay more."},
{"c":"lbo","l":3,"t":"mc","q":"If debt makes a company riskier, why do sponsors not simply pay all cash?","o":["They are legally required to use debt","All-equity funding would drastically reduce returns and limit how many deals a fund can do","Cash is unavailable","Lenders would object"],"a":1,"e":"Returns on an unlevered purchase would be roughly the business's own return on capital, well below fund hurdles. Leverage also lets a fund spread committed capital across more investments, which is central to the model."},
{"c":"lbo","l":3,"t":"mc","q":"PIK interest is used when:","o":["The lender wants cash immediately","The borrower needs to preserve liquidity, accruing interest into principal instead of paying cash","Interest rates are zero","The company has no debt"],"a":1,"e":"PIK capitalises interest into the debt balance, so no cash leaves in the period. It carries a higher rate to compensate the lender, and the balance compounds, so it is a liquidity tool that raises the eventual repayment burden."},
{"c":"lbo","l":3,"t":"mc","q":"Maintenance covenants shape an LBO structure because:","o":["They set the purchase price","They are tested regularly, so a breach hands leverage to lenders even if the company is paying its bills","They eliminate interest","They determine the exit multiple"],"a":1,"e":"A breach is an event of default that brings lenders to the table to demand fees, tighter terms or equity injections. Sponsors therefore size leverage to keep meaningful headroom, commonly 25% to 35% EBITDA cushion at close."},
{"c":"lbo","l":3,"t":"mc","q":"An LBO model differs from a DCF in that it solves for:","o":["Enterprise value from projected cash flows","The return to the equity sponsor given an entry price, structure and exit","The cost of capital","The terminal growth rate"],"a":1,"e":"A DCF derives intrinsic value by discounting cash flows at WACC. An LBO fixes the price and structure and calculates IRR and multiple of money, or fixes the required return and solves for the price you can pay."},
{"c":"lbo","l":3,"t":"mc","q":"When a portfolio company breaches a covenant, the most likely first outcome is:","o":["Immediate liquidation","A negotiated waiver or amendment, typically with fees, tighter terms or an equity injection","Automatic debt forgiveness","The sponsor loses the company instantly"],"a":1,"e":"Lenders generally prefer a performing loan on better terms to seizing a business. The breach transfers negotiating leverage, so the price of a waiver is usually a fee, a higher margin, tighter covenants, or fresh sponsor equity."},
{"c":"lbo","l":3,"t":"mc","q":"Quality-of-earnings work is commissioned before an LBO to:","o":["Replace the audit","Test whether reported EBITDA is repeatable and strip out one-off and owner-related items","Set the exit multiple","Value the real estate"],"a":1,"e":"Leverage is sized against EBITDA, so if that number is inflated by non-recurring items or owner add-backs, the structure is built on sand. QofE separates repeatable earnings from noise and frequently moves the price."},
{"c":"lbo","l":3,"t":"mc","q":"If a base case IRR falls short, which lever is least legitimate?","o":["Negotiating a lower entry price","Increasing leverage within what cash flow can service","Assuming multiple expansion at exit with no supporting rationale","Identifying concrete cost savings"],"a":2,"e":"Assuming you sell at a higher multiple than you paid, without a reason, is wishful thinking rather than underwriting. Price, structure and operational improvement are real levers; an unsupported exit multiple is how deals disappoint."},
{"c":"lbo","l":3,"t":"mc","q":"Sponsors track both IRR and multiple of money because:","o":["They always give the same answer","IRR is time-sensitive and can be flattered by quick exits, while MoM measures absolute value created","MoM accounts for risk","IRR ignores the equity cheque"],"a":1,"e":"A fast small gain can produce a spectacular IRR while returning little cash; a long hold can produce a strong MoM with a mediocre IRR. Limited partners care about both, since they need absolute dollars as well as an annualised rate."},
{"c":"lbo","l":3,"t":"mc","q":"Leverage in an LBO should ultimately be sized by:","o":["The maximum lenders will offer","What the business can service through a downturn, with covenant headroom","The sponsor's fund size","The target's historical debt level"],"a":1,"e":"Market capacity sets the outer bound, but the binding test is whether interest coverage and covenants survive a stress case. Stable, contracted, low-capex businesses support far more debt than cyclical, capital-hungry ones."},
{"c":"lbo","l":3,"t":"mc","q":"When stress testing an LBO, the most informative output is:","o":["The base case IRR","The EBITDA level at which covenants break or the equity is wiped out","The number of forecast years","The advisory fee"],"a":1,"e":"The base case always works. What the investment committee needs is the breaking point: how far EBITDA can fall before a covenant breach, and what exit multiple returns only the original capital. Combine downside operating and multiple compression together."},
{"c":"lbo","l":3,"t":"mc","q":"Choosing between an IPO and a sale at exit, the key disadvantage of an IPO is that:","o":["It always produces a lower valuation","It is not a full exit: the sponsor sells a minority, is locked up, and carries market risk for years","It requires no disclosure","It cannot be done for large companies"],"a":1,"e":"A trade sale gives complete cash exit at one price, and a strategic can pay for synergies. An IPO can achieve a higher headline valuation for a growth business and preserves upside, but liquidity comes slowly and subject to market conditions."},
{"c":"lbo","l":3,"t":"mc","q":"A continuation vehicle is used when a sponsor wants to:","o":["Liquidate a fund immediately","Hold a strong asset beyond a fund's life while offering existing investors liquidity","Avoid paying carry","Merge two portfolio companies"],"a":1,"e":"Fund life is finite but a good asset keeps compounding. The obvious conflict is that the sponsor sits on both sides setting the price, which is why independent fairness opinions, LP advisory approval and a third-party lead investor have become standard."},
{"c":"lbo","l":3,"t":"mc","q":"In returns attribution, the component reflecting genuine operational value creation is:","o":["Multiple expansion","EBITDA growth","Deleveraging","The holding period"],"a":1,"e":"Multiple expansion is largely market timing and cannot be repeated on demand. Deleveraging is financial engineering available to anyone who can raise debt. EBITDA growth, especially margin improvement, is the component that evidences actual operating skill."},

/* ========================== RESTRUCTURING (37) ========================== */
{"c":"restr","l":1,"t":"mc","q":"The difference between Chapter 11 and Chapter 7 is:","o":["Chapter 11 is liquidation, Chapter 7 is reorganisation","Chapter 11 is reorganisation, Chapter 7 is liquidation","Chapter 11 applies to individuals only","They are identical in effect"],"a":1,"e":"Chapter 11 lets the company continue operating while it restructures. Chapter 7 shuts it down and a trustee sells the assets to pay claims."},
