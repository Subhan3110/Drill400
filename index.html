<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0D1512"/>
<meta name="description" content="Investment banking interview drills: accounting, valuation, DCF, M&amp;A, LBO, restructuring, capital markets and sector questions."/>
<title>Drill 400</title>

<style>
:root{
--bg:#0D1512;--surf:#14201C;--surf2:#1B2A25;
--line:#26382F;--line2:#334A40;
--text:#E9E6DB;--muted:#8A9A92;--faint:#5A6B63;
--brass:#C6A15B;--brassDim:#8A6F3C;--brassBg:rgba(198,161,91,.10);
--good:#6FB894;--goodBg:rgba(111,184,148,.12);
--bad:#CB7358;--badBg:rgba(203,115,88,.12);
--onBrass:#12190F;
--shadow:0 1px 2px rgba(0,0,0,.30);
--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="light"]{
--bg:#F4F1E9;--surf:#FFFFFF;--surf2:#EDE8DC;
--line:#DCD5C5;--line2:#C4BAA4;
--text:#1A211E;--muted:#55635C;--faint:#6E7A74;
--brass:#8A6A2E;--brassDim:#B79A5F;--brassBg:rgba(138,106,46,.09);
--good:#2E7D5B;--goodBg:rgba(46,125,91,.10);
--bad:#A8452A;--badBg:rgba(168,69,42,.10);
--onBrass:#FFFFFF;
--shadow:0 1px 2px rgba(26,33,30,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;min-height:100vh;
  padding:max(26px,env(safe-area-inset-top)) 20px calc(56px + env(safe-area-inset-bottom));
  display:flex;justify-content:center}
#app{width:100%;max-width:640px}
.screen{display:none}.screen.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ------------------------------ header ------------------------------ */
.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:13px}
.brand svg{flex-shrink:0;display:block}
.wordmark{font-family:var(--serif);font-size:37px;line-height:1;letter-spacing:-.6px}
.wordmark i{font-style:normal;color:var(--brass);margin-left:9px;letter-spacing:.5px}
.lede{font-size:14px;color:var(--muted);line-height:1.55;max-width:52ch}
header{margin-bottom:26px}
.icobtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);color:var(--muted);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;background:var(--surf)}
.icobtn:hover{border-color:var(--line2);color:var(--text)}
.label{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.4px;margin:0 0 10px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.label b{font-weight:600;color:var(--faint)}
.stack{display:grid;gap:9px}
.group{margin-bottom:28px}
.group .seg:last-child{margin-bottom:0}
.group .label:not(:first-child){margin-top:18px}

/* ------------------------------- stats ------------------------------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:28px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center}
.tile b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1;font-weight:400}
.tile small{display:block;font-size:10.5px;color:var(--faint);margin-top:5px;letter-spacing:.2px}
@media(max-width:430px){.tiles{gap:7px}.tile{padding:11px 4px}.tile b{font-size:21px}.tile small{font-size:9.5px}}

/* ------------------------------- cards ------------------------------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
.topic{padding:15px 17px 13px;display:block;text-align:left;width:100%;
  background:var(--surf);border:1px solid var(--line);border-radius:14px;transition:background .12s,border-color .12s}
.topic:hover{border-color:var(--line2)}
.topic.sel{background:var(--brassBg);border-color:var(--brassDim)}
.topic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.topic-n{display:block;font-family:var(--serif);font-size:18px;line-height:1.25}
.topic.sel .topic-n{color:var(--brass)}
.topic-d{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.topic-c{font-size:12px;color:var(--faint);flex-shrink:0;padding-top:4px;font-variant-numeric:tabular-nums}
.mast{display:block;height:3px;background:var(--line);border-radius:3px;margin-top:11px;overflow:hidden}
.mast i{display:block;height:100%;background:var(--brassDim);border-radius:3px;transition:width .4s ease}
.topic.sel .mast i{background:var(--brass)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:64px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:450;
  color:var(--muted);border:1px solid var(--line);transition:.12s;background:var(--surf)}
.seg button:hover{border-color:var(--line2);color:var(--text)}
.seg button.sel{background:var(--brassBg);color:var(--brass);border-color:var(--brassDim);font-weight:600}

.btn{width:100%;padding:15px 18px;border-radius:11px;font-size:15px;font-weight:600;letter-spacing:.2px;
  border:1px solid var(--line2);color:var(--text);background:var(--surf);transition:.12s}
.btn:hover{border-color:var(--brassDim)}
.btn.pri{background:var(--brass);color:var(--onBrass);border-color:var(--brass);box-shadow:var(--shadow)}
.btn.pri:hover{filter:brightness(1.06);border-color:var(--brass)}
.btn[disabled]{opacity:.35;cursor:default;filter:none}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1 1 140px;width:auto}

/* ------------------------------- quiz ------------------------------- */
.bar{height:2px;background:var(--line);border-radius:2px;margin-bottom:24px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .3s ease}
.chips{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:20px}
.chip.acc{color:var(--brass);background:var(--brassBg);border-color:var(--brassDim);font-weight:600}
.qtext{font-family:var(--serif);font-size:23px;line-height:1.38;margin-bottom:24px}
@media(max-width:400px){.wordmark{font-size:30px}.qtext{font-size:20px}.brand{gap:11px}}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:11px;
  background:var(--surf);border:1px solid var(--line);font-size:14.5px;line-height:1.45;transition:.12s}
.opt:not([disabled]):hover{border-color:var(--line2);background:var(--surf2)}
.opt span.k{font-size:12px;color:var(--faint);font-weight:600;margin-top:2px;flex-shrink:0;min-width:11px}
.opt.right{background:var(--goodBg);border-color:var(--good)}
.opt.right span.k{color:var(--good)}
.opt.wrong{background:var(--badBg);border-color:var(--bad)}
.opt.wrong span.k{color:var(--bad)}
.opt.dim{color:var(--faint)}
.opt[disabled]{cursor:default}

.exp{padding:17px 19px;margin-bottom:22px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.exp h4{font-size:13px;font-weight:700;margin-bottom:8px}
.exp p{font-size:14px;line-height:1.6}
.exp.ok{border-color:var(--good)}.exp.ok h4{color:var(--good)}
.exp.no{border-color:var(--bad)}.exp.no h4{color:var(--bad)}




/* ------------------------------ results ------------------------------ */
.bigscore{text-align:center;padding:36px 0 26px}
.bigscore b{display:block;font-family:var(--serif);font-size:68px;line-height:1;font-weight:400}
.bigscore small{display:block;font-size:14px;color:var(--muted);margin-top:10px}
.brk{padding:4px 18px;margin-bottom:26px}
.brk .r{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.brk .r:last-child{border-bottom:none}
.brk .meter{width:64px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.brk .meter i{display:block;height:100%}
.brk .n{font-size:13px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

.rev{margin-bottom:26px}
.rev .item{border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-bottom:8px;overflow:hidden}
.rev .head{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;font-size:14px;line-height:1.45}
.rev .head:hover{background:var(--surf2)}
.rev .mark{flex-shrink:0;font-size:12px;font-weight:700;margin-top:1px}
.rev .mark.y{color:var(--good)}.rev .mark.n{color:var(--bad)}
.rev .body{padding:0 15px 15px;font-size:13.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap}
.rev .body b{display:block;color:var(--text);font-weight:600;font-size:12px;margin-bottom:6px;letter-spacing:.2px}

.note{text-align:center;font-size:12px;color:var(--faint);margin-top:14px;line-height:1.6}
.linkbtn{font-size:13px;color:var(--brass);text-decoration:underline;text-underline-offset:3px;padding:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.topbar .mid{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.flagbtn{font-size:12px;color:var(--faint);padding:4px 9px;border:1px solid var(--line);border-radius:20px;transition:.12s}
.flagbtn:hover{color:var(--text);border-color:var(--line2)}
.flagbtn.on{color:var(--brass);border-color:var(--brassDim);background:var(--brassBg);font-weight:600}
.resume{padding:15px 17px;margin-bottom:22px;border:1px solid var(--brassDim);background:var(--brassBg);border-radius:14px}
.vs{display:flex;align-items:stretch;gap:9px;margin-bottom:16px}
.vs .side{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center}
.vs .side.win{border-color:var(--good);background:var(--goodBg)}
.vs .side b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1}
.vs .side small{display:block;font-size:11px;color:var(--faint);margin-top:5px;letter-spacing:.2px}
.vs .sep{flex:0 0 auto;display:flex;align-items:center;font-size:12px;color:var(--faint)}
.verdictline{text-align:center;font-family:var(--serif);font-size:20px;line-height:1.4;margin-bottom:22px}
.share{padding:15px 17px;margin-bottom:18px;border:1px solid var(--line);background:var(--surf);border-radius:14px}
.share p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
input[type=text]{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;font-size:14px}
.share input{margin-bottom:10px}
.resume p{font-size:13.5px;line-height:1.5;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<div id="app">
  <div id="home" class="screen on"></div>
  <div id="quiz" class="screen"></div>
  <div id="result" class="screen"></div>
</div>
<script>
function qid(q) {
  const s = q.c + "|" + q.q;
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}

/* Every question is multiple choice with four options and an explanation.
   Fields: c category, l difficulty 1-3, q question, o options, a answer index, e explanation. */
const BANK = [

/* ========================== ACCOUNTING (69) ========================== */
{"c":"acct","l":1,"t":"mc","q":"Which statement shows profitability over a period of time rather than a snapshot?","o":["Balance sheet","Income statement","Cash flow statement","Statement of shareholders' equity"],"a":1,"e":"The income statement covers a period. The balance sheet is a snapshot at one date. The cash flow statement covers a period but tracks cash, not profitability."},
{"c":"acct","l":1,"t":"mc","q":"Depreciation increases by $10. Assume a 40% tax rate. What happens to net income?","o":["Falls by $10","Falls by $6","Falls by $4","No change"],"a":1,"e":"Pre-tax income falls $10, tax shield is $4, so net income falls $6."},
{"c":"acct","l":1,"t":"mc","q":"Inventory goes up by $10, paid for in cash. What happens on the income statement?","o":["COGS rises $10","Operating expenses rise $10","Nothing","Revenue falls $10"],"a":2,"e":"Buying inventory is not an expense. It only hits the income statement through COGS when the goods are sold."},
{"c":"acct","l":1,"t":"mc","q":"Which of these is NOT a non-cash add-back in cash flow from operations?","o":["Depreciation and amortization","Stock-based compensation","Deferred taxes","Interest expense"],"a":3,"e":"Interest expense is a real cash cost, already deducted in net income and not added back."},
{"c":"acct","l":1,"t":"mc","q":"Accrued compensation goes up by $10 and is recognised as an expense. 40% tax rate. What is the net change in cash?","o":["Up $10","Up $4","Down $6","No change"],"a":1,"e":"Net income falls $6, but the $10 increase in an accrued liability adds back to operating cash flow. Net effect on cash is +$4."},
{"c":"acct","l":1,"t":"mc","q":"A company buys $100 of PP&E with cash. What is the immediate effect on net income?","o":["Falls $100","Falls $60","No effect","Rises $100"],"a":2,"e":"Capex is a balance sheet and cash flow event. It only hits the income statement over time through depreciation."},
{"c":"acct","l":1,"t":"mc","q":"Which of these is a financing activity on the cash flow statement?","o":["Purchasing equipment","Collecting accounts receivable","Paying a dividend","Paying wages"],"a":2,"e":"Financing covers transactions with capital providers: debt, equity and dividends. Equipment is investing, the other two are operating."},
{"c":"acct","l":1,"t":"mc","q":"Which of these is NOT part of operating working capital?","o":["Inventory","Accounts receivable","Accounts payable","Short-term debt"],"a":3,"e":"Operating working capital excludes cash and all debt, because those are financing items rather than part of the operating cycle."},
{"c":"acct","l":1,"t":"mc","q":"A company issues $100 of new stock. What is the immediate effect on net income?","o":["Rises $100","Rises $60","No effect","Falls $100"],"a":2,"e":"Issuing equity is a financing transaction. Cash and shareholders' equity both rise, and the income statement is untouched."},
{"c":"acct","l":1,"t":"mc","q":"Prepaid expenses increase by $10. What is the effect on cash flow from operations?","o":["Up $10","Down $10","Up $6","No change"],"a":1,"e":"A prepaid expense is an asset. An increase in an operating asset is a use of cash."},
{"c":"acct","l":1,"t":"mc","q":"Which of these increases shareholders' equity?","o":["A share buyback","A dividend payment","Retained net income","Issuing debt"],"a":2,"e":"Buybacks and dividends return capital and reduce equity. Debt is a liability. Only retained earnings build equity from operations."},
{"c":"acct","l":1,"t":"mc","q":"Deferred revenue is classified on the balance sheet as:","o":["An asset","A liability","Contra-equity","Revenue"],"a":1,"e":"Cash has been received but the obligation to deliver still exists, so it sits as a liability until the revenue is earned."},
{"c":"acct","l":1,"t":"mc","q":"Which of these is a current liability?","o":["Goodwill","Accounts payable","Long-term debt due in four years","Treasury stock"],"a":1,"e":"Accounts payable is owed to suppliers within the operating cycle, so it sits in current liabilities. Goodwill is a non-current asset, debt due in four years is non-current, and treasury stock is a contra-equity account."},
{"c":"acct","l":1,"t":"mc","q":"Accounts receivable increases by $20. What happens to cash flow from operations?","o":["Increases by $20","Decreases by $20","No change","Increases by $12 after tax"],"a":1,"e":"An increase in a working capital asset is a use of cash. You booked the revenue but have not collected it, so CFO falls by $20 relative to net income."},
{"c":"acct","l":1,"t":"mc","q":"Which of these does NOT appear on the balance sheet?","o":["Deferred revenue","Accumulated depreciation","Cost of goods sold","Non-controlling interest"],"a":2,"e":"Cost of goods sold is an income statement line for a period. The other three are balance sheet items: deferred revenue is a liability, accumulated depreciation is a contra-asset, and non-controlling interest sits in equity."},
{"c":"acct","l":1,"t":"mc","q":"Net income from the income statement flows directly into which two places?","o":["Revenue and total assets","The top of the cash flow statement and retained earnings","Gross profit and cash","Deferred revenue and goodwill"],"a":1,"e":"Net income is the starting line of the cash flow statement, and it increases retained earnings within shareholders' equity on the balance sheet. Those two links are what tie the three statements together, and they are the answer interviewers listen for."},
{"c":"acct","l":1,"t":"mc","q":"Depreciation increases by $10 with a 40% tax rate. What is the net change in cash?","o":["No change, depreciation is non-cash","Cash rises by $4","Cash falls by $10","Cash falls by $6"],"a":1,"e":"Net income falls $6, but you add the full $10 of depreciation back as non-cash, so cash rises $4. That $4 is the tax shield: the only real economic effect of a depreciation change is the cash tax saved."},
{"c":"acct","l":1,"t":"mc","q":"Why do you need the cash flow statement if you already have the income statement and balance sheet?","o":["It is required by regulators but adds no information","Accrual accounting means net income is not cash, so the CFS reconciles the two","It is the only statement showing revenue","It replaces the balance sheet"],"a":1,"e":"The income statement records revenue when earned and expenses when incurred, not when cash moves. The cash flow statement strips out non-cash items and working capital timing to show what actually happened to cash, which is why a profitable company can still run out of money."},
{"c":"acct","l":2,"t":"mc","q":"Which of these correctly describes the change in retained earnings for a period?","o":["Net income","Net income less dividends","Net income plus depreciation","Operating cash flow less capex"],"a":1,"e":"Retained earnings roll forward as beginning balance plus net income less dividends paid (and less buybacks, depending on treatment)."},
{"c":"acct","l":2,"t":"mc","q":"Deferred tax liabilities most commonly arise because:","o":["The company underpaid taxes and owes back taxes","Depreciation is accelerated for tax purposes versus book purposes","Revenue is recognised later for tax than for book","The company operates in multiple tax jurisdictions"],"a":1,"e":"Faster tax depreciation means lower cash taxes early and higher later. The gap versus book taxes builds a deferred tax liability. Asset write-ups in acquisitions are the other classic source."},
{"c":"acct","l":2,"t":"mc","q":"Goodwill is created when:","o":["A company's share price exceeds book value","Purchase price exceeds the fair value of net identifiable assets acquired","A company writes down an intangible asset","Retained earnings exceed paid-in capital"],"a":1,"e":"Goodwill is the plug that makes the acquisition balance after allocating purchase price to identifiable assets and liabilities at fair value."},
{"c":"acct","l":2,"t":"mc","q":"Which of these increases cash flow from operations, all else equal?","o":["An increase in accounts receivable","An increase in inventory","An increase in accounts payable","An increase in prepaid expenses"],"a":2,"e":"An increase in a liability is a source of cash. An increase in an operating asset is a use of cash."},
{"c":"acct","l":2,"t":"mc","q":"A company bills a customer $10 for services already delivered, on credit. Tax rate 40%. What is the net change in cash?","o":["Up $10","Up $6","Down $4","No change"],"a":2,"e":"Net income rises $6, but receivables rise $10 which is a $10 use of cash. Net effect is minus $4, because the tax is paid in cash before the customer pays."},
{"c":"acct","l":2,"t":"mc","q":"A company records $100 of revenue on credit with $60 of COGS. Tax rate 40%. What is the change in net income?","o":["$100","$60","$40","$24"],"a":3,"e":"Revenue of $100 less COGS of $60 gives $40 of pre-tax profit. Tax at 40% is $16, so net income rises $24. Note that cash has not moved at all: the sale was on credit, so receivables rise $100 while cash falls $16 for the tax."},
{"c":"acct","l":2,"t":"mc","q":"Same transaction: $100 revenue on credit, $60 COGS from existing inventory, 40% tax. What is the change in cash?","o":["Up $40","Up $24","Down $16","Down $100"],"a":2,"e":"Net income of $24, less the $100 increase in receivables, plus the $60 inventory reduction. That is minus $16, since the tax is paid before the cash arrives."},
{"c":"acct","l":2,"t":"mc","q":"Capitalising a cost instead of expensing it does what to net income in year one?","o":["Increases it","Decreases it","No effect","Depends on the tax rate"],"a":0,"e":"Capitalising moves the cost to the balance sheet and spreads it over time as depreciation or amortisation, so year-one expense is lower. Total cash is unaffected."},
{"c":"acct","l":2,"t":"mc","q":"Which inventory method is prohibited under IFRS?","o":["FIFO","LIFO","Weighted average","Specific identification"],"a":1,"e":"IFRS does not permit LIFO. US GAAP does, which is one reason cross-border comps need adjusting."},
{"c":"acct","l":2,"t":"mc","q":"Assuming the charge is not tax-deductible, what is the cash impact of a $50 goodwill impairment?","o":["Down $50","Down $30","Up $20","Zero"],"a":3,"e":"Net income falls $50 but the full charge is added back as non-cash, and with no tax deduction there is no offsetting cash benefit either."},
{"c":"acct","l":2,"t":"mc","q":"Interest expense increases by $10. Tax rate is 40%. What happens to net income?","o":["Falls by $10","Falls by $6","Falls by $4","No change, interest is non-cash"],"a":1,"e":"Interest is tax-deductible, so pre-tax income falls $10 and taxes fall $4. Net income falls by $6. Cash also falls by $6 because interest is a real cash cost."},
{"c":"acct","l":2,"t":"mc","q":"A company repays $50 of debt principal using cash. What is the immediate effect on net income?","o":["Falls by $50","Falls by $30 after tax","No change","Rises by the interest saved"],"a":2,"e":"Principal repayment is a financing activity, not an expense. Net income is unchanged on the day of repayment. Only the interest saved in future periods flows through the income statement."},
{"c":"acct","l":2,"t":"mc","q":"A company switches from straight-line to accelerated depreciation for tax purposes in year one. What happens to year-one cash flow?","o":["Falls, because depreciation is higher","Rises, because cash taxes are lower","No change, depreciation is non-cash","Falls by the depreciation times the tax rate"],"a":1,"e":"Higher depreciation means a lower taxable income and therefore lower cash taxes in year one. Depreciation itself is non-cash, so the only cash effect is the tax shield, which is positive. It reverses in later years."},
{"c":"acct","l":2,"t":"mc","q":"A company negotiates longer payment terms with suppliers, stretching days payable from 30 to 60. All else equal, this:","o":["Reduces cash flow from operations","Increases cash flow from operations","Has no effect on cash flow","Increases net income"],"a":1,"e":"Payables are a source of cash. Paying suppliers later means cash stays in the business longer, which increases operating working capital efficiency and boosts CFO. Net income is unaffected."},
{"c":"acct","l":2,"t":"mc","q":"On a consolidated income statement, non-controlling interest appears as:","o":["An addition to revenue","A deduction to arrive at net income attributable to the parent","Part of operating expenses","A financing cash flow only"],"a":1,"e":"When a parent consolidates a subsidiary it does not wholly own, 100% of the subsidiary's revenue and costs are consolidated, then the share of earnings belonging to outside shareholders is deducted to arrive at net income attributable to the parent. That is the figure used for the parent's EPS."},
{"c":"acct","l":2,"t":"mc","q":"Inventory is $200, COGS is $1,460. What is days inventory outstanding?","o":["50 days","36.5 days","73 days","20 days"],"a":0,"e":"DIO is inventory divided by COGS times 365. That is 200 divided by 1,460, which is 0.137, times 365 equals 50 days. Note the denominator is COGS, not revenue, because inventory is carried at cost."},
{"c":"acct","l":2,"t":"mc","q":"Revenue is $500m, gross profit $200m, operating expenses $120m, interest $20m, tax rate 25%. What is net income?","o":["$45m","$60m","$80m","$40m"],"a":0,"e":"Gross profit of $200m less $120m of operating expenses gives EBIT of $80m. Less $20m of interest leaves $60m pre-tax. Tax at 25% is $15m, so net income is $45m."},
{"c":"acct","l":2,"t":"mc","q":"If you could only look at one financial statement to judge a company, which is the strongest choice?","o":["Income statement, because it shows profitability","Cash flow statement, because it shows real cash generated and is hardest to manipulate","Balance sheet, because it shows what the company owns","Statement of shareholders' equity"],"a":1,"e":"The cash flow statement starts from net income, so you infer profitability anyway, and it shows capex, working capital and financing. Cash is also the hardest line to manipulate, which is why analysts anchor on it when earnings quality is in doubt."},
{"c":"acct","l":2,"t":"mc","q":"What is the key difference between deferred revenue and accounts receivable?","o":["They are the same thing recorded differently","Deferred revenue is cash received before delivery; receivables are delivery before cash","Deferred revenue is an asset; receivables are a liability","Both are recognised as revenue immediately"],"a":1,"e":"Deferred revenue is a liability: you have the cash but still owe the customer the good or service. A receivable is an asset: you have delivered and are owed the cash. They sit on opposite sides of the balance sheet and represent opposite timing."},
{"c":"acct","l":2,"t":"mc","q":"A company buys $100 of inventory using debt, then sells it for $200 in cash. Tax rate 40%. What is the net change in cash over the full cycle?","o":["$200","$160","$100","$60"],"a":1,"e":"Borrowing $100 and spending it on inventory leaves cash flat. Selling brings in $200, and the $100 gross profit is taxed at 40%, so $40 goes out in cash. Net change is $160. Note debt of $100 is still outstanding, so equity only rose by the $60 of net income."},
{"c":"acct","l":2,"t":"mc","q":"Prices are rising. Compared with FIFO, using LIFO produces:","o":["Lower COGS and higher net income","Higher COGS and lower net income","Identical COGS and net income","Higher inventory on the balance sheet"],"a":1,"e":"LIFO expenses the most recently purchased, most expensive units first, so COGS is higher and net income lower. That also means lower cash taxes, which is why US companies use it. Remaining inventory is carried at older, cheaper costs, so the balance sheet understates it."},
{"c":"acct","l":2,"t":"mc","q":"A negative working capital business is one that:","o":["Is insolvent and about to fail","Collects from customers before paying suppliers, so growth releases cash","Has negative equity","Cannot obtain credit"],"a":1,"e":"Supermarkets and subscription businesses billed in advance are the classic cases. Customers fund the business before suppliers are paid, so expansion generates cash rather than consuming it. It is a structural advantage, not a distress signal."},
{"c":"acct","l":2,"t":"mc","q":"Which of these is NOT one of the ways a company can increase its cash balance?","o":["Generate cash from operations","Raise debt or equity","Sell assets","Record higher accrual revenue on credit"],"a":3,"e":"Booking revenue on credit increases receivables and net income, not cash. Cash can only come from operations, from financing, or from selling assets. This distinction is the heart of why the cash flow statement exists."},
{"c":"acct","l":2,"t":"mc","q":"Interest expense rises $10 but is paid in kind rather than in cash. Tax rate 40%. What is the change in cash?","o":["Falls $6","Rises $4","Falls $10","No change"],"a":1,"e":"Net income still falls $6, but PIK interest is non-cash and accrues into the debt balance, so you add it back. Cash rises by the $4 tax saving. This is precisely why sponsors use PIK instruments to protect liquidity."},
{"c":"acct","l":2,"t":"mc","q":"A company pays a $20 cash dividend. Which statement is completely unaffected?","o":["The income statement","The balance sheet","The cash flow statement","All three are affected"],"a":0,"e":"Dividends are a distribution of profit, not an expense, so they never appear on the income statement. Cash falls $20 through financing activities, and retained earnings falls $20 on the balance sheet."},
{"c":"acct","l":2,"t":"mc","q":"What is the most substantive criticism of EBITDA?","o":["It is too difficult to calculate","It ignores capex and working capital, both real cash costs","It is prohibited under IFRS","It cannot be compared across companies"],"a":1,"e":"EBITDA flatters capital-intensive businesses by ignoring the cost of maintaining the asset base, and ignores cash absorbed by working capital. It is also not a defined measure, so adjusted EBITDA is open to generous addbacks."},
{"c":"acct","l":2,"t":"mc","q":"Which margin is the cleanest measure of core operating performance?","o":["Gross margin","Operating margin","Net margin","Dividend payout ratio"],"a":1,"e":"Operating margin captures the full cost base including overhead but sits before interest and tax, so it is not distorted by capital structure or tax jurisdiction. Net margin is the least comparable across companies for exactly that reason."},
{"c":"acct","l":2,"t":"mc","q":"LTM figures can be calculated for which of these?","o":["Total assets","Revenue and EBITDA","Shareholders' equity","Cash balance"],"a":1,"e":"LTM applies only to flow items measured over a period. A balance sheet is a snapshot at a single date, so there is no trailing twelve month version of assets, equity or cash — you simply take the most recent figure."},
{"c":"acct","l":2,"t":"mc","q":"A company has DIO of 40, DSO of 30 and DPO of 90. What is the cash conversion cycle?","o":["160 days","Negative 20 days","100 days","20 days"],"a":1,"e":"40 plus 30 less 90 equals negative 20 days. The company collects from customers and turns inventory well before it pays suppliers, so it is financed by its own supply chain and growth releases cash."},
{"c":"acct","l":2,"t":"mc","q":"Which business has the highest operating leverage?","o":["A staffing agency where cost scales with billable hours","A software company where an extra licence costs almost nothing to deliver","A grocery retailer","A consulting firm"],"a":1,"e":"Operating leverage is the share of fixed costs. Software has near-zero marginal cost, so incremental revenue drops almost entirely to profit — and a revenue decline does the same in reverse. Staffing and consulting costs move with revenue, so leverage is low."},
{"c":"acct","l":2,"t":"mc","q":"Under the equity method, a dividend received from the investee is treated as:","o":["Income on the income statement","A reduction in the carrying value of the investment","Revenue","A new liability"],"a":1,"e":"Income is recognised as your share of the investee's earnings, which increases the carrying value. A dividend is a return of that investment, so it reduces the carrying value rather than being recorded as income again, which would double count."},
{"c":"acct","l":3,"t":"mc","q":"Stock-based compensation is added back in cash flow from operations because:","o":["It is not a real economic cost","It is a non-cash expense in the period, though it dilutes existing shareholders","It is reversed in the following year","It is classified as a financing activity"],"a":1,"e":"It is genuinely non-cash so it gets added back, but it is a real cost to shareholders through dilution. Many investors deduct it when calculating adjusted free cash flow."},
{"c":"acct","l":3,"t":"mc","q":"A company capitalises $100 of interest incurred during construction of a new facility. Compared with expensing it, year-one net income is:","o":["Lower","Higher","Unchanged","Lower by the after-tax amount"],"a":1,"e":"Capitalising moves the cost off the income statement and onto the balance sheet as part of the asset's cost, so year-one net income is higher. It is then depreciated over the asset's life, so the expense is spread out rather than avoided."},
{"c":"acct","l":3,"t":"mc","q":"A company sells equipment with a book value of $40 for $60 in cash. Tax rate is 40%. What is the net change in cash?","o":["$60","$52","$36","$44"],"a":1,"e":"The gain is $20, taxed at 40%, so cash taxes rise $8. Cash proceeds of $60 less $8 of tax equals a net $52 increase. On the cash flow statement the $20 gain is subtracted out of operations as non-cash and the full $60 appears in investing."},
{"c":"acct","l":3,"t":"mc","q":"A company has $100m of revenue, a 40% EBITDA margin, and 80% of its costs are fixed. Revenue falls 10%. Approximately what happens to EBITDA?","o":["Falls 10%, to $36m","Falls about 22%, to around $31m","Falls 40%","Stays flat"],"a":1,"e":"Costs are $60m, of which $48m is fixed and $12m variable. Revenue falls to $90m and variable costs fall 10% to $10.8m, so costs are $58.8m and EBITDA is $31.2m, down 22%. Operating leverage amplifies the revenue decline roughly two-fold."},
{"c":"acct","l":3,"t":"mc","q":"A company writes down $100 of obsolete inventory. Tax rate 40%. What is the net change in cash?","o":["Falls $100","Falls $60","Rises $40","No change"],"a":2,"e":"The write-down is non-cash. Net income falls $60, but you add the $100 charge back on the cash flow statement, so cash rises $40. That $40 is purely the tax deduction the write-down created."},
{"c":"acct","l":3,"t":"mc","q":"How can a company be profitable on the income statement and still go bankrupt?","o":["It cannot, profit guarantees solvency","Profit is accrual-based; cash can drain into working capital, capex or debt repayment","Only if it commits fraud","Only if tax rates rise"],"a":1,"e":"Rapid growth absorbing cash into receivables and inventory, heavy capex, or a large debt maturity can all exhaust liquidity while the income statement still shows profit. Companies fail when they run out of cash, not when they run out of profit."},
{"c":"acct","l":3,"t":"mc","q":"Deferred revenue increases by $100 as a customer pays upfront. Tax rate 40%. What happens?","o":["Net income rises $60 and cash rises $100","No income statement impact; cash rises $100 and a $100 liability is created","Revenue rises $100 immediately","Cash rises $60"],"a":1,"e":"Nothing is earned yet, so nothing touches the income statement. Cash rises $100 on the asset side and deferred revenue rises $100 as a liability. Revenue is only recognised later as the obligation is delivered."},
{"c":"acct","l":3,"t":"mc","q":"Where does the difference between cash and accrual accounting matter most?","o":["Only in tax filings","In timing: accrual matches revenue to when it is earned, which is why cash flow must be checked separately","It only affects small companies","In the choice of auditor"],"a":1,"e":"Accrual accounting gives a better picture of economic performance in a period, but it introduces judgement about timing. That gap is exactly where earnings management lives, so analysts cross-check accrual earnings against cash conversion."},
{"c":"acct","l":3,"t":"mc","q":"A company issues $100 of equity and immediately uses it to buy a building. What is the net change in cash?","o":["Rises $100","No change","Falls $100","Rises $60"],"a":1,"e":"Financing brings in $100 and investing sends out $100, so cash nets to zero. The balance sheet shows PP&E up $100 and shareholders' equity up $100. Net income is untouched, since buying an asset is not an expense."},
{"c":"acct","l":3,"t":"mc","q":"What is the right treatment of a genuinely one-time charge when analysing earnings?","o":["Leave it in, since it happened","Add it back to get normalised earnings, but verify it is truly non-recurring","Always double it for conservatism","Move it to the balance sheet"],"a":1,"e":"You normalise so the run-rate is comparable across periods and peers. The discipline is in the verification: a company that books restructuring charges every year is not experiencing one-time events, and adding those back flatters earnings misleadingly."},
{"c":"acct","l":3,"t":"mc","q":"Capitalising software development costs rather than expensing them does what in year one?","o":["Reduces net income and reduces cash","Raises net income, with no effect on pre-tax cash flow before taxes","Has no effect on any statement","Reduces assets"],"a":1,"e":"The cost moves off the income statement onto the balance sheet as an asset, so year-one net income rises and is then reduced over time through amortisation. The cash outflow is identical either way, which is why analysts watch capitalisation policy as an earnings-quality signal."},
{"c":"acct","l":3,"t":"mc","q":"Which of these is the strongest earnings-quality red flag?","o":["Revenue growing in line with cash collections","Receivables and inventory growing much faster than revenue","A stable gross margin","Consistent dividend payments"],"a":1,"e":"When receivables outrun revenue, the company is booking sales it has not collected, which points to aggressive recognition or deteriorating customers. Inventory outrunning revenue suggests product is not selling and a write-down is coming."},
{"c":"acct","l":3,"t":"mc","q":"A deferred tax liability most commonly unwinds when:","o":["Tax rates fall","Tax depreciation drops below book depreciation in later years","The company pays a dividend","Goodwill is impaired"],"a":1,"e":"Accelerated tax depreciation front-loads deductions, so cash taxes are below book taxes early and a DTL builds. Later, tax depreciation falls below book, cash taxes exceed book taxes, and the liability reverses."},
{"c":"acct","l":3,"t":"mc","q":"When normalising EBITDA across a comp set, the most important discipline is:","o":["Maximising addbacks to raise the multiple","Applying the same adjustments consistently to every company in the set","Using only GAAP figures with no adjustment","Ignoring stock-based compensation entirely"],"a":1,"e":"A multiple is only comparable if numerator and denominator are constructed the same way for every company. Whatever convention you adopt on stock compensation, leases or one-offs, applying it inconsistently makes the whole comp set meaningless."},
{"c":"acct","l":3,"t":"mc","q":"Under current standards, revenue is recognised when:","o":["Cash is received","Control of the good or service transfers to the customer","The contract is signed","The invoice is issued"],"a":1,"e":"The five-step model recognises revenue on transfer of control, which may be at a point in time or over time. Cash timing is irrelevant, which is why upfront payments create deferred revenue and delivered-but-unpaid work creates receivables."},
{"c":"acct","l":3,"t":"mc","q":"A company sells a factory carried at $100 for $70 in cash. Tax rate 40%. What is the net change in cash?","o":["$70","$82","$58","$42"],"a":1,"e":"The $30 loss reduces net income by $18 and is added back as non-cash, so operations contribute $12, which is the tax saving. Investing brings in the full $70 of proceeds. Net change is $82."},
{"c":"acct","l":3,"t":"mc","q":"Under DuPont, a company's ROE is rising purely because its equity multiplier is rising. This means:","o":["Operating performance is improving","The return is being driven by leverage, not performance, so risk is rising","Margins are expanding","Asset turnover has improved"],"a":1,"e":"The equity multiplier is assets over equity, a pure leverage term. A higher ROE from leverage alone means the same operating business funded with more debt, which raises both returns and the probability of distress."},
{"c":"acct","l":3,"t":"mc","q":"When a specific receivable is finally written off against an existing allowance, net income:","o":["Falls by the amount written off","Is unaffected, because the expense was recognised when the allowance was created","Rises","Falls by the after-tax amount"],"a":1,"e":"The income statement hit happens when the allowance is established through bad debt expense. The eventual write-off reduces gross receivables and the allowance equally, so net receivables and net income are unchanged."},
{"c":"acct","l":3,"t":"mc","q":"Actuarial gains and losses on a defined benefit pension plan generally:","o":["Flow through net income immediately","Bypass the income statement and go to other comprehensive income","Are recorded as revenue","Are ignored entirely"],"a":1,"e":"Routing them through OCI is why reported earnings can look stable while the pension obligation swings sharply with discount rate changes. For valuation, a deficit is usually treated as debt-like and added to enterprise value."},
{"c":"acct","l":3,"t":"mc","q":"A weakening foreign subsidiary currency reduces consolidated reported revenue. Where does the translation difference go?","o":["Net income as a foreign exchange loss","Cumulative translation adjustment within other comprehensive income","Cost of goods sold","Deferred revenue"],"a":1,"e":"Translation of a foreign subsidiary for consolidation goes to the CTA in OCI, not through earnings. Transaction effects on foreign-currency denominated items are different and do hit the income statement, which is the distinction being tested."},

/* ========================== ENTERPRISE VALUE (44) ========================== */
{"c":"ev","l":1,"t":"mc","q":"Which formula correctly gives enterprise value?","o":["Equity value + cash - debt","Equity value + debt + preferred + minority interest - cash","Equity value - debt + cash","Market cap + cash + debt"],"a":1,"e":"You add all non-equity claims on the business and subtract cash, since an acquirer effectively gets the cash back."},
{"c":"ev","l":1,"t":"mc","q":"Which pairing is correct?","o":["EV / net income","Equity value / EBITDA","EV / EBITDA","Equity value / EBIT"],"a":2,"e":"EBITDA is available to all capital providers, so it pairs with enterprise value. Net income is after interest, so it pairs with equity value."},
{"c":"ev","l":1,"t":"mc","q":"A company raises $100 of debt and holds the proceeds in cash. What happens to enterprise value?","o":["Rises $100","Falls $100","Unchanged","Rises $60"],"a":2,"e":"Debt up $100 and cash up $100 cancel out. Nothing about the operating business changed, which is exactly the point of EV being capital-structure neutral."},
{"c":"ev","l":1,"t":"mc","q":"Market cap is $500m, debt $200m, cash $50m. What is enterprise value?","o":["$650m","$750m","$350m","$550m"],"a":0,"e":"Enterprise value is market cap plus debt less cash: 500 plus 200 less 50 equals $650m. You add debt because an acquirer must repay or assume it, and subtract cash because it offsets the purchase price."},
{"c":"ev","l":1,"t":"mc","q":"Net debt is defined as:","o":["Total debt plus cash","Total debt minus cash","Long-term debt only","Debt minus equity"],"a":1,"e":"Net debt is total interest-bearing debt less cash and cash equivalents. It is the bridge between enterprise value and equity value."},
{"c":"ev","l":1,"t":"mc","q":"Preferred stock is treated in enterprise value as:","o":["Subtracted like cash","Added like debt","Ignored","Part of common equity"],"a":1,"e":"Preferred sits ahead of common equity and behaves like a debt-like claim, so it is added to get from equity value to enterprise value."},
{"c":"ev","l":1,"t":"mc","q":"Out-of-the-money options under the treasury stock method are:","o":["Included at full count","Included at half count","Excluded","Converted to debt"],"a":2,"e":"They would not be exercised at the current price, so they create no dilution and are left out."},
{"c":"ev","l":1,"t":"mc","q":"A company repays $100 of debt using $100 of balance sheet cash. What happens to enterprise value?","o":["Falls by $100","Rises by $100","No change","Falls by $100 times one minus the tax rate"],"a":2,"e":"Debt falls $100 and cash falls $100, so net debt is unchanged and enterprise value is unchanged. Equity value is also unchanged. This is the cleanest illustration that EV is capital-structure neutral."},
{"c":"ev","l":1,"t":"mc","q":"Equity value differs from enterprise value in that equity value:","o":["Includes debt","Is the value of the whole business","Is the residual belonging to shareholders after all other claims","Excludes cash"],"a":2,"e":"Enterprise value is the value of the operating business available to all capital providers. Equity value is what remains for shareholders once debt, preferred and minority interests are settled, which is why it equals EV less net debt and other claims."},
{"c":"ev","l":1,"t":"mc","q":"You subtract cash in the enterprise value bridge because:","o":["Cash earns no return","An acquirer effectively gets the cash back, reducing the net cost of the business","Cash is not an asset","It is an accounting rule"],"a":1,"e":"Cash is a non-operating asset. Buy the company and the cash comes with it, offsetting part of the price. It also does not generate the EBITDA in the denominator, so leaving it in the numerator would overstate the multiple."},
{"c":"ev","l":2,"t":"mc","q":"Which multiple is least distorted by differences in capital structure?","o":["P/E","EV/EBITDA","Price / book","Dividend yield"],"a":1,"e":"EV/EBITDA sits above both interest expense and the financing decision, so leverage does not mechanically move it the way it moves P/E."},
{"c":"ev","l":2,"t":"mc","q":"A company has 100m basic shares at $10, and 10m options with a $5 strike. Using the treasury stock method, what is the diluted share count?","o":["100m","105m","110m","102.5m"],"a":1,"e":"Proceeds are 10m x $5 = $50m. At $10 per share, that repurchases 5m shares. Net new shares are 10m - 5m = 5m, giving 105m diluted."},
{"c":"ev","l":2,"t":"mc","q":"A company buys back $50 of its own stock using cash. What happens to enterprise value?","o":["Falls $50","Rises $50","Unchanged","Falls $100"],"a":2,"e":"Equity value falls $50 and cash falls $50, so the two moves cancel in EV = equity + debt - cash. The operating business is unchanged."},
{"c":"ev","l":2,"t":"mc","q":"100m shares at $20, debt $300m, cash $100m, EBITDA $250m. What is EV/EBITDA?","o":["8.0x","8.8x","8.4x","9.2x"],"a":1,"e":"Equity value 2,000, plus 300 debt, less 100 cash gives EV of 2,200. Divided by 250 is 8.8x."},
{"c":"ev","l":2,"t":"mc","q":"Which of these is NOT capital-structure neutral?","o":["EV/EBITDA","EV/EBIT","EV/sales","EPS"],"a":3,"e":"EPS is after interest and reflects the share count, so leverage and buybacks move it directly."},
{"c":"ev","l":2,"t":"mc","q":"An unfunded pension obligation should generally be:","o":["Ignored in enterprise value","Treated as a debt-like item and added","Netted against cash","Added to equity value"],"a":1,"e":"It is a real claim on future company cash flows that ranks ahead of shareholders, so it is added alongside debt, usually on an after-tax basis."},
{"c":"ev","l":2,"t":"mc","q":"A company pays a $50 cash dividend. What happens to enterprise value?","o":["Falls by $50","Rises by $50","No change","Falls by $50 after tax"],"a":2,"e":"Cash falls $50 so net debt rises $50, while equity value falls $50 as the share price adjusts. The two moves offset and enterprise value is unchanged. The operating business is exactly as valuable as it was the day before."},
{"c":"ev","l":2,"t":"mc","q":"Fully diluted shares rather than basic shares are used in equity value because:","o":["It is required by IFRS","In-the-money securities will convert and claim a share of value","It always produces a more conservative multiple","Basic shares exclude treasury stock"],"a":1,"e":"Anyone holding in-the-money options, warrants, RSUs or convertibles has a claim on the equity, and an acquirer has to pay for those claims. Ignoring them understates equity value and therefore understates enterprise value and every multiple built on it."},
{"c":"ev","l":2,"t":"mc","q":"Under current accounting standards, finance and operating lease liabilities are:","o":["Excluded from enterprise value entirely","Both capitalised on the balance sheet, with the liability typically added to enterprise value","Only relevant for retailers","Deducted from enterprise value like cash"],"a":1,"e":"Since IFRS 16 and ASC 842, both lease types are capitalised as a right-of-use asset with a matching liability. Most practitioners add the lease liability to net debt, and must then use a consistent EBITDA. The critical thing is consistency across the comp set."},
{"c":"ev","l":2,"t":"mc","q":"Under the treasury stock method, the proceeds from option exercise are assumed to be used to:","o":["Pay a special dividend","Repurchase shares at the current market price","Repay debt","Fund capital expenditure"],"a":1,"e":"The method assumes the company collects the strike price from option holders and immediately uses that cash to buy back shares in the market. The net share increase is therefore the options outstanding less the shares repurchased, which shrinks as the share price rises above the strike."},
{"c":"ev","l":2,"t":"mc","q":"A company reports Q3 year-to-date revenue of $900m, prior-year same period $800m, and prior full year $1,050m. What is LTM revenue?","o":["$1,150m","$950m","$1,750m","$1,050m"],"a":0,"e":"LTM equals prior full year plus current year-to-date less prior year-to-date: 1,050 plus 900 less 800, which is $1,150m. Forgetting to subtract the prior stub is the classic error and would have given $1,950m."},
{"c":"ev","l":2,"t":"mc","q":"A company has 50m shares at $30, options on 5m shares with a $10 strike, debt of $200m and cash of $150m. What is enterprise value using the treasury stock method?","o":["$1,600m","$1,650m","$1,550m","$1,700m"],"a":1,"e":"Option proceeds are 5m times $10, or $50m, which buys back 1.67m shares at $30. Net new shares are 3.33m, so diluted shares are 53.33m and equity value is $1,600m. Add $200m of debt and subtract $150m of cash for an enterprise value of $1,650m."},
{"c":"ev","l":2,"t":"mc","q":"Minority interest is added to enterprise value because:","o":["It is a form of debt","100% of the subsidiary's EBITDA is consolidated in the denominator, so the outside claim belongs in the numerator","It increases the multiple","It represents cash"],"a":1,"e":"Consolidation brings in all of the subsidiary's earnings even though the parent does not own all of it. Adding the minority interest keeps numerator and denominator consistent. The mirror case is an equity method stake, which you subtract."},
{"c":"ev","l":2,"t":"mc","q":"A negative enterprise value means:","o":["The company is worthless","Cash exceeds market capitalisation plus debt, often signalling distress or deep pessimism","The calculation is wrong","The company has no debt"],"a":1,"e":"It happens, usually in cash-rich companies the market expects to burn that cash, or in deep distress. It is not automatically a free lunch: the market is often pricing in that the operating business destroys value."},
{"c":"ev","l":2,"t":"mc","q":"Under the treasury stock method, options with a strike above the current share price are:","o":["Included in full","Excluded, because they are out of the money and not dilutive","Treated as debt","Added to cash"],"a":1,"e":"Only in-the-money options dilute. For those, you add the option shares and subtract the shares repurchasable with the exercise proceeds at the current market price, so net dilution shrinks as the share price rises above the strike."},
{"c":"ev","l":2,"t":"mc","q":"You would use EV/EBIT rather than EV/EBITDA when:","o":["The company has no debt","Capital intensity differs materially across the comp set","Revenue is growing","The company is private"],"a":1,"e":"EBITDA ignores the cost of maintaining the asset base. For capital-heavy businesses, or where depreciation policies differ, EBIT captures that cost and gives a fairer comparison. EV/EBITDA less capex serves a similar purpose."},
{"c":"ev","l":2,"t":"mc","q":"EV/net income is not a valid multiple because:","o":["Net income is too volatile","It mismatches: enterprise value is pre-debt while net income is after interest","Net income is not audited","It double counts revenue"],"a":1,"e":"Numerator and denominator must belong to the same capital providers. Enterprise value covers debt and equity together, while net income is what remains after paying lenders. Pair net income with equity value, giving P/E."},
{"c":"ev","l":2,"t":"mc","q":"Enterprise value is called takeover value because it approximates:","o":["The company's book value","What an acquirer must fund to own the business free and clear","The company's annual revenue","The value of the cash balance"],"a":1,"e":"You pay the equity holders, assume or refinance the debt, take on preferred and minority interests, and receive the target's cash. The caveats are that a real deal includes a control premium and change-of-control debt repayment."},
{"c":"ev","l":2,"t":"mc","q":"Unvested restricted stock units are usually handled in a diluted share count by:","o":["Applying the treasury stock method","Adding the full number of units, since there are no exercise proceeds","Ignoring them","Treating them as debt"],"a":1,"e":"RSUs have no strike price, so there is no cash coming in to repurchase shares. The full count is added, sometimes adjusted for expected forfeitures. Performance shares are included at the level management expects to vest."},
{"c":"ev","l":2,"t":"mc","q":"EV/EBITDA travels better across countries than P/E because it is unaffected by:","o":["Revenue growth","Differences in tax rates and capital structure","Industry dynamics","Currency"],"a":1,"e":"P/E sits after interest and tax, both of which vary enormously by jurisdiction for reasons unrelated to operating quality. EV/EBITDA compares the whole business to its operating earnings before those choices, though capital intensity still needs care."},
{"c":"ev","l":2,"t":"mc","q":"The gap between basic and diluted shares matters most for:","o":["A mature utility with no option programme","A technology company after a sharp share price rise","A company with no employees","A company in liquidation"],"a":1,"e":"Heavy stock-based compensation plus a rising share price pushes large option tranches into the money, and the treasury stock method share count climbs quickly. A valuation built on a stale count understates equity value materially."},
{"c":"ev","l":3,"t":"mc","q":"How should in-the-money convertible bonds usually be treated when calculating enterprise value?","o":["As straight debt at face value","Using the if-converted method: treat as equity and exclude from debt","Ignored entirely","Added to cash"],"a":1,"e":"If the conversion option is in the money, assume conversion. The bonds become shares in the diluted count and drop out of the debt balance, otherwise you double count."},
{"c":"ev","l":3,"t":"mc","q":"How should a large net operating loss carryforward be handled in enterprise value?","o":["Added to enterprise value like debt","Ignored entirely","Treated as a non-operating asset that reduces effective purchase price","Netted against goodwill"],"a":2,"e":"An NOL is a non-operating asset: it saves future cash taxes but is not produced by the operating business. Practitioners typically value it separately, often on a present-value basis, and treat it like cash in the bridge. Note that acquisitions trigger limits on how fast the NOL can be used."},
{"c":"ev","l":3,"t":"mc","q":"A company has a market cap of $400m, debt of $200m and cash of $300m. What is its enterprise value?","o":["$900m","$300m","$500m","Negative $100m"],"a":1,"e":"Enterprise value is $400m plus $200m less $300m, which is $300m. Net debt is negative $100m. This profile is common in cash-rich technology companies and means the market values the operating business at well below the equity market cap."},
{"c":"ev","l":3,"t":"mc","q":"Should short-term investments be treated like cash in the enterprise value bridge?","o":["Always, without exception","Generally yes if genuinely liquid and non-operating, but check for restrictions","Never","Only for private companies"],"a":1,"e":"Marketable securities readily convertible to cash usually net off. The judgement is whether the balance is truly available: cash held as collateral, trapped offshore, or required as a minimum operating balance is not free to an acquirer."},
{"c":"ev","l":3,"t":"mc","q":"Since IFRS 16 and ASC 842, operating leases are:","o":["Still off balance sheet","Capitalised as a right-of-use asset with a matching liability usually added to net debt","Treated as equity","Excluded from all analysis"],"a":1,"e":"The change brought lease obligations onto the balance sheet, which raised reported debt and EBITDA for lease-heavy sectors like retail and airlines. The critical discipline is treating leases consistently across the whole comp set and across historical periods."},
{"c":"ev","l":3,"t":"mc","q":"Two companies have identical EBITDA but very different P/E ratios. Which does NOT explain that?","o":["Different leverage and therefore different interest expense","Different tax rates","Different depreciation and amortisation","Identical capital structure and identical growth"],"a":3,"e":"P/E sits after interest, tax and D&A, so leverage, tax jurisdiction and asset intensity all drive a wedge between identical EBITDA and different earnings. If capital structure and growth were identical, the gap would largely disappear."},
{"c":"ev","l":3,"t":"mc","q":"A company announces a large acquisition funded entirely with new debt. Its enterprise value:","o":["Stays exactly the same","Rises, because it now owns a larger operating business funded by more debt","Falls by the debt raised","Becomes negative"],"a":1,"e":"Raising debt and holding the cash would leave EV unchanged, but spending it on an operating business adds that business to the enterprise. EV rises by roughly the purchase price, adjusted for how the market judges the price paid."},
{"c":"ev","l":3,"t":"mc","q":"A company owns a large minority stake in a listed subsidiary. In the EV bridge you should:","o":["Add the market value of the stake","Subtract the market value of the stake, as a non-operating asset","Ignore it","Treat it as debt"],"a":1,"e":"An equity method stake contributes no EBITDA to the denominator, only a share of net income below the operating line. Subtracting its market value keeps the multiple consistent, exactly as you would subtract cash."},
{"c":"ev","l":3,"t":"mc","q":"Which should be excluded from EBITDA when calculating multiples?","o":["Recurring cost of goods sold","Non-recurring restructuring charges and litigation settlements","Ordinary salaries","Regular maintenance costs"],"a":1,"e":"You want a repeatable run-rate. Genuine one-offs are stripped out, but only if they are truly non-recurring — a company that restructures annually is not experiencing one-time events, and adding those back inflates the denominator."},
{"c":"ev","l":3,"t":"mc","q":"Net debt can be misleading because:","o":["It is difficult to calculate","Not all cash is available, and debt-like items such as pensions and leases sit outside it","Debt is never repaid","Cash always exceeds debt"],"a":1,"e":"Cash may be trapped offshore, pledged, or needed for operations. Meanwhile pension deficits, lease liabilities, earnouts and litigation reserves behave like debt to an acquirer. A proper bridge captures those rather than stopping at debt less cash."},
{"c":"ev","l":3,"t":"mc","q":"The general rule governing what belongs in the enterprise value bridge is:","o":["Include everything on the balance sheet","If the earnings are in the denominator, the claim belongs in the numerator","Only include debt","Only include items over $100m"],"a":1,"e":"Consolidated subsidiary earnings mean the minority interest is added. An equity method stake contributes no EBITDA, so its value is subtracted. That consistency test resolves almost every bridge question you will be asked."},
{"c":"ev","l":3,"t":"mc","q":"For a company with dual share classes, equity value should be calculated by:","o":["Using only the listed class","Applying the listed price across the total share count of all classes with equal economics","Using the higher-voting class only","Using book value"],"a":1,"e":"Most dual-class structures give identical economic rights and differ only in voting. Missing the unlisted class understates equity value badly. Where economic rights genuinely differ, each class must be valued on its own terms."},
{"c":"ev","l":3,"t":"mc","q":"When building a fully diluted share count from filings, the most reliable starting point is:","o":["The weighted average share count used for EPS","The actual shares outstanding on the cover page of the latest filing","Last year's annual report","The share count at IPO"],"a":1,"e":"The weighted average is a backward-looking average over the period, not the count today. The cover page gives actual shares outstanding at a recent date. You then layer on options, RSUs and converts, and check recent filings for large issuances."},

/* ========================== VALUATION (53) ========================== */
{"c":"val","l":1,"t":"mc","q":"Which methodology typically produces the highest valuation range?","o":["Comparable companies","Precedent transactions","Liquidation analysis","LBO analysis"],"a":1,"e":"Precedent transactions include a control premium and often synergy value paid by strategic buyers. LBO analysis usually sets the floor because a sponsor needs a target return."},
{"c":"val","l":1,"t":"mc","q":"Comparable company analysis is based on:","o":["Prices paid in past acquisitions","Current trading multiples of similar public companies","Projected cash flows discounted at WACC","Book value of assets less liabilities"],"a":1,"e":"Comps use current market prices. Precedent transactions use historical deal prices."},
{"c":"val","l":1,"t":"mc","q":"Which methodology is most sensitive to small changes in assumptions?","o":["Comparable companies","Precedent transactions","Discounted cash flow","Liquidation analysis"],"a":2,"e":"Small moves in WACC or terminal growth swing a DCF heavily, because most of the value sits in the terminal value."},
{"c":"val","l":1,"t":"mc","q":"Which of these is an equity value multiple?","o":["EV/EBITDA","EV/sales","P/E","EV/EBIT"],"a":2,"e":"Price is equity value per share and earnings is after interest, so both sides of P/E are equity-level."},
{"c":"val","l":1,"t":"mc","q":"For a company with growing earnings, the forward P/E compared to the trailing P/E is usually:","o":["Higher","Lower","Identical","Negative"],"a":1,"e":"Forward earnings are larger, so the same price divided by a bigger denominator gives a lower multiple."},
{"c":"val","l":1,"t":"mc","q":"EV/sales is most useful when:","o":["The company has stable margins","The company is loss-making or pre-profit","Comparing across industries","Valuing a bank"],"a":1,"e":"When EBITDA and earnings are negative, revenue is the first positive line you can anchor to. It ignores profitability entirely, which is its weakness."},
{"c":"val","l":1,"t":"mc","q":"A 52-week trading range analysis is best described as:","o":["A valuation methodology","A market reference point shown alongside valuation","A DCF cross-check","A liquidity measure"],"a":1,"e":"It shows where the stock has actually traded, which frames a premium discussion, but it is not an independent view of value."},
{"c":"val","l":1,"t":"mc","q":"Which of these is an intrinsic valuation method rather than a relative one?","o":["Comparable companies","Precedent transactions","Discounted cash flow","Premiums paid analysis"],"a":2,"e":"A DCF values a business off its own projected cash flows and risk, so it is intrinsic. Comps, precedents and premiums paid all price the company by reference to what the market pays for something else, so they are relative."},
{"c":"val","l":1,"t":"mc","q":"Which set correctly names the three main valuation methodologies?","o":["DCF, LBO, and book value","Comparable companies, precedent transactions, and DCF","P/E, EV/EBITDA, and EV/sales","Liquidation, replacement cost, and DCF"],"a":1,"e":"Two relative methods, comps and precedents, plus one intrinsic method, the DCF. An LBO analysis is often shown alongside as a floor value, and liquidation or sum-of-the-parts appear in specific situations."},
{"c":"val","l":1,"t":"mc","q":"In which situation is a DCF least appropriate?","o":["A stable consumer goods company","A commercial bank, where cash flow is hard to define and capital structure is the business","A regulated utility","An industrial manufacturer"],"a":1,"e":"For banks, debt is raw material rather than financing, so unlevered free cash flow is not meaningful. They are valued on P/E and price to book against return on equity. DCFs also struggle with early-stage companies and deeply cyclical businesses."},
{"c":"val","l":1,"t":"mc","q":"The key difference between comparable companies and precedent transactions is that precedents:","o":["Use forecast rather than historical figures","Reflect prices paid for control, including a premium and synergies","Exclude private companies","Are always more recent"],"a":1,"e":"Comps show where minority stakes trade in the public market day to day. Precedents show what acquirers actually paid to take control, which includes a control premium and expected synergies, so they typically sit higher."},
{"c":"val","l":1,"t":"mc","q":"The most important criterion when selecting comparable companies is:","o":["Similar share price","Similar business model, end markets, growth and margin profile","Identical market capitalisation","Listing on the same exchange"],"a":1,"e":"You are looking for companies whose cash flows carry similar risk and growth, because that is what a multiple actually prices. Size, geography and capital structure matter, but industry classification alone produces poor comp sets."},
{"c":"val","l":2,"t":"mc","q":"Which multiple would you NOT typically use to value a commercial bank?","o":["P/E","Price to book value","EV/EBITDA","Price to tangible book"],"a":2,"e":"Interest is operating revenue for a bank, and debt is raw material rather than financing, so enterprise value and EBITDA are not meaningful. Banks are valued on equity metrics."},
{"c":"val","l":2,"t":"mc","q":"A football field chart shows:","o":["The company's share price over time","The valuation range implied by each methodology, side by side","Sensitivity of a DCF to WACC and growth","Revenue split by segment"],"a":1,"e":"It stacks the ranges from comps, precedents, DCF, LBO and any others as horizontal bars so you can see where they overlap."},
{"c":"val","l":2,"t":"mc","q":"Liquidation valuation is most relevant for:","o":["A high-growth software company","A distressed company with substantial hard assets","A bank with a strong deposit base","A company being acquired by a strategic buyer"],"a":1,"e":"It answers what creditors would recover in a wind-down, so it matters when going-concern value is in doubt and there are tangible assets to sell."},
{"c":"val","l":2,"t":"mc","q":"The PEG ratio adjusts the P/E for:","o":["Leverage","Growth","Geography","Capital intensity"],"a":1,"e":"P/E divided by the expected earnings growth rate. A PEG near 1.0 is the conventional rough benchmark, though it is a blunt tool."},
{"c":"val","l":2,"t":"mc","q":"Which multiple is standard for a REIT?","o":["EV/EBITDA","Price to funds from operations","EV/sales","Price to book"],"a":1,"e":"FFO adds depreciation back to net income because property generally does not depreciate economically the way the accounts assume."},
{"c":"val","l":2,"t":"mc","q":"Airlines are often valued on EV/EBITDAR rather than EV/EBITDA because:","o":["Rent is added back to normalise for owned versus leased aircraft","Airlines have no depreciation","Rent is tax-deductible","EBITDA is always negative"],"a":0,"e":"One carrier may own its fleet while another leases. Adding rent back puts both on the same footing, with the capitalised lease obligation included in enterprise value."},
{"c":"val","l":2,"t":"mc","q":"Which of these would NOT explain why a company trades at a discount to its peer group?","o":["Higher customer concentration","Weaker governance","Faster forecast growth","Thinner trading liquidity"],"a":2,"e":"Faster growth justifies a premium, not a discount. The others are all legitimate reasons for a lower multiple."},
{"c":"val","l":2,"t":"mc","q":"You are valuing a company using both LTM and NTM multiples and they differ sharply. The most likely explanation is:","o":["An error in the share count","A material change in expected growth or a one-off in the trailing period","A different tax rate","The comp set is too large"],"a":1,"e":"The gap between trailing and forward multiples is the market's view on the next twelve months. A high LTM and low NTM multiple means earnings are expected to grow sharply, or the trailing period contained a depressed one-off. Always state which basis you are quoting."},
{"c":"val","l":2,"t":"mc","q":"A minority stake in a public company trades at a discount to a control valuation primarily because:","o":["Minority holders pay higher taxes","A minority holder cannot direct strategy, cash flows or a sale","Minority shares are less liquid","Accounting rules require it"],"a":1,"e":"Control has value because it lets the owner change management, redirect capital, capture synergies and choose when to sell. A minority holder gets none of that, so the same cash flows are worth less to them. The mirror of this is the control premium paid in M&A."},
{"c":"val","l":2,"t":"mc","q":"A company with high and growing capital expenditure relative to depreciation will typically look:","o":["Cheap on EV/EBITDA and expensive on EV/EBIT","Expensive on both","Cheap on both","Identical on both"],"a":0,"e":"EBITDA ignores the capital intensity entirely, so a capex-heavy business looks cheap on EV/EBITDA. EBIT captures depreciation, which for a growing asset base is rising, so the same company looks more expensive on EV/EBIT. That gap is exactly why you check both."},
{"c":"val","l":2,"t":"mc","q":"Which of these is the strongest argument for a company trading at a premium to its peer group?","o":["A larger absolute revenue base","Structurally higher returns on invested capital","A higher dividend payout ratio","More outstanding shares"],"a":1,"e":"Multiples are ultimately driven by growth, returns and risk. A business that earns returns well above its cost of capital creates value with every incremental dollar invested, which justifies a premium. Size alone, payout policy and share count do not."},
{"c":"val","l":2,"t":"mc","q":"A peer trades at 12.0x EV/EBITDA. Your company has EBITDA of $150m, debt of $400m and cash of $50m. What is the implied equity value?","o":["$1,800m","$1,450m","$2,150m","$1,350m"],"a":1,"e":"Implied enterprise value is 12.0 times $150m, which is $1,800m. Subtract net debt of $350m to get $1,450m of equity value. Applying the multiple gives you enterprise value, so you must always bridge down to equity."},
{"c":"val","l":2,"t":"mc","q":"Precedent transactions usually produce a higher valuation than trading comps because:","o":["They use larger companies","Acquirers pay a control premium and can justify it with synergies","They exclude debt","They are calculated after tax"],"a":1,"e":"Control lets a buyer change strategy, capital structure and cost base, and synergies mean the target is worth more to that buyer than standalone. Both are reflected in the price paid, so transaction multiples exceed trading multiples."},
{"c":"val","l":2,"t":"mc","q":"How would you value a company with negative EBITDA?","o":["It cannot be valued","Use revenue multiples, or a DCF once cash flows turn positive","Use EV/EBITDA anyway","Use book value only"],"a":1,"e":"A negative denominator makes EV/EBITDA meaningless. You move up the income statement to EV/revenue or EV/gross profit, benchmark against growth, and build a DCF that models the path to profitability explicitly."},
{"c":"val","l":2,"t":"mc","q":"Which of these is a valuation methodology beyond the main three?","o":["Liquidation value","Gross margin analysis","Days sales outstanding","Working capital ratio"],"a":0,"e":"Liquidation value, replacement cost, sum-of-the-parts, dividend discount models and LBO analysis all supplement the core three. Liquidation matters most in distress, where going-concern value may be below the value of the assets sold off."},
{"c":"val","l":2,"t":"mc","q":"Asked to value an apple tree, the best answer is:","o":["The cost of the seed","The present value of the future apples it will produce, cross-checked against the price of similar trees","Its weight in timber","The average price of all trees"],"a":1,"e":"The question tests whether you grasp that valuation is intrinsic value from future cash flows, cross-checked by relative value from comparables. It is the DCF and comps framework stripped of finance vocabulary."},
{"c":"val","l":2,"t":"mc","q":"Multiples tend to compress as a company matures primarily because:","o":["Accounting standards change","Growth slows and the reinvestment opportunity shrinks","Companies become riskier","Share counts rise"],"a":1,"e":"A multiple capitalises expected future growth and returns. As a business matures, growth converges toward the economy and excess returns are competed away, so the market pays fewer turns for the same earnings."},
{"c":"val","l":2,"t":"mc","q":"What most clearly makes a precedent transaction a poor comparable?","o":["It closed in a very different market environment or cycle","It involved a public company","It was advised by a different bank","The consideration was in cash"],"a":0,"e":"Transaction multiples embed the financing conditions and sentiment of their moment, so a deal struck at a cycle peak tells you little today. Unusual strategic motivations, distressed sales and very different target sizes also break comparability."},
{"c":"val","l":2,"t":"mc","q":"How would you value a company that is already subject to an announced acquisition?","o":["Use its unaffected share price before the announcement","Use the current market price, which reflects the deal","Use book value","It cannot be valued"],"a":0,"e":"Once a deal is announced the share price converges on the offer and no longer reflects standalone value. For any standalone analysis, including a premiums paid study, you use the unaffected price before the leak or announcement."},
{"c":"val","l":2,"t":"mc","q":"You use the median rather than the mean of a comp set because:","o":["It is easier to calculate","The mean is distorted by outliers in a small sample","Regulators require it","It is always higher"],"a":1,"e":"With eight comparables, one company at 40x against a group at 9x to 13x drags the mean several turns. The median describes where the group actually trades. The better step still is to ask why the outlier trades there and whether it belongs in the set."},
{"c":"val","l":2,"t":"mc","q":"A discount for lack of marketability is applied because:","o":["Private shares have no value","The holder cannot readily sell the stake, so a buyer pays less","Private companies pay more tax","It is required by accounting standards"],"a":1,"e":"Illiquidity is a real cost to an investor, and empirical studies of restricted stock support discounts commonly in the 10% to 30% range. It is distinct from a control discount, which reflects inability to direct the business rather than inability to exit."},
{"c":"val","l":2,"t":"mc","q":"Investors focus on ROIC over growth because:","o":["Growth is irrelevant to value","Growth only creates value when ROIC exceeds the cost of capital","ROIC is easier to forecast","Growth cannot be measured"],"a":1,"e":"Growth multiplies the spread between returns and the cost of capital. Above WACC, reinvestment creates value and growth compounds it; below WACC, growth accelerates value destruction. Sustained high ROIC is also evidence of a competitive moat."},
{"c":"val","l":3,"t":"mc","q":"Control premiums in M&A most commonly fall in which range?","o":["0% to 5%","20% to 40%","60% to 80%","Above 100%"],"a":1,"e":"Twenty to forty percent over the undisturbed price is the usual band, though it varies widely by sector, competitive dynamics and synergy potential."},
{"c":"val","l":3,"t":"mc","q":"In a valuation context, LBO analysis is usually interpreted as:","o":["A ceiling on value","A floor on value","The most likely value","Irrelevant to strategic buyers"],"a":1,"e":"A sponsor needs to hit a target IRR, so the price it can pay is typically below what a strategic buyer with synergies would pay. That sets a floor for the range."},
{"c":"val","l":3,"t":"mc","q":"In a premiums paid analysis, the premium is normally measured against:","o":["The target's book value","The target's unaffected share price before any leak or rumour","The acquirer's share price","The sector median multiple"],"a":1,"e":"You measure against the unaffected price, typically one day, one week and one month before the first rumour or announcement. Using the price after a leak understates the premium, because the market has already partly priced in the deal."},
{"c":"val","l":3,"t":"mc","q":"A company earns a 7% return on invested capital against a 10% cost of capital. Faster growth will:","o":["Create more value","Destroy more value","Have no effect on value","Always increase the multiple"],"a":1,"e":"When ROIC is below WACC, each dollar reinvested returns less than it costs, so it destroys value. Growth scales that destruction. This is why unprofitable expansion is punished and why capital discipline matters more than growth for low-return businesses."},
{"c":"val","l":3,"t":"mc","q":"Two companies in the same industry have identical financials but trade at different multiples. The least likely explanation is:","o":["Different expected growth rates","Different returns on invested capital","Differences in management quality or governance","Different numbers of shares outstanding"],"a":3,"e":"Share count changes the price per share but not the multiple, since both numerator and denominator scale together. Growth, returns, risk, liquidity and governance all legitimately drive a multiple gap."},
{"c":"val","l":3,"t":"mc","q":"Valuing a private company differs from a public one mainly because:","o":["Private companies cannot be valued","There is no observable share price, and discounts for illiquidity and control often apply","Private companies have no cash flows","Multiples do not apply"],"a":1,"e":"You lose the market price as an anchor, the financials are often unaudited with owner-related costs to normalise, and a marketability discount typically applies. You derive multiples from public comps and then adjust."},
