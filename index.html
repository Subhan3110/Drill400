<html lang="en">

<title>Drill 400</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D1512'/%3E%3Cpath d='M7 7h18l-3 5H10z' fill='%238A6F3C'/%3E%3Cpath d='M11 14h10l-2 5h-6z' fill='%23A8874A'/%3E%3Cpath d='M13.5 21h5l-2.5 6z' fill='%23C6A15B'/%3E%3C/svg%3E"/>
<style>
:root{
--bg:#0D1512;--surf:#14201C;--surf2:#1B2A25;
--line:#26382F;--line2:#334A40;
--text:#E9E6DB;--muted:#8A9A92;--faint:#5A6B63;
--brass:#C6A15B;--brassDim:#8A6F3C;--brassBg:rgba(198,161,91,.10);
--good:#6FB894;--goodBg:rgba(111,184,148,.12);
--bad:#CB7358;--badBg:rgba(203,115,88,.12);
--onBrass:#12190F;
--shadow:0 1px 2px rgba(0,0,0,.30);
--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="light"]{
--bg:#F4F1E9;--surf:#FFFFFF;--surf2:#EDE8DC;
--line:#DCD5C5;--line2:#C4BAA4;
--text:#1A211E;--muted:#55635C;--faint:#6E7A74;
--brass:#8A6A2E;--brassDim:#B79A5F;--brassBg:rgba(138,106,46,.09);
--good:#2E7D5B;--goodBg:rgba(46,125,91,.10);
--bad:#A8452A;--badBg:rgba(168,69,42,.10);
--onBrass:#FFFFFF;
--shadow:0 1px 2px rgba(26,33,30,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;min-height:100vh;
  padding:max(26px,env(safe-area-inset-top)) 20px calc(56px + env(safe-area-inset-bottom));
  display:flex;justify-content:center}
#app{width:100%;max-width:640px}
.screen{display:none}.screen.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ------------------------------ header ------------------------------ */
.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:13px}
.brand svg{flex-shrink:0;display:block}
.wordmark{font-family:var(--serif);font-size:37px;line-height:1;letter-spacing:-.6px}
.wordmark i{font-style:normal;color:var(--brass);margin-left:9px;letter-spacing:.5px}
.lede{font-size:14px;color:var(--muted);line-height:1.55;max-width:52ch}
header{margin-bottom:26px}
.icobtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);color:var(--muted);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;background:var(--surf)}
.icobtn:hover{border-color:var(--line2);color:var(--text)}
.label{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.4px;margin:0 0 10px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.label b{font-weight:600;color:var(--faint)}
.stack{display:grid;gap:9px}
.group{margin-bottom:28px}
.group .seg:last-child{margin-bottom:0}
.group .label:not(:first-child){margin-top:18px}

/* ------------------------------- stats ------------------------------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:28px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center}
.tile b{display:block;font-family:var(--serif);font-size:25px;line-height:1.1;font-weight:400}
.tile small{display:block;font-size:10.5px;color:var(--faint);margin-top:5px;letter-spacing:.2px}
@media(max-width:430px){.tiles{gap:7px}.tile{padding:11px 4px}.tile b{font-size:21px}.tile small{font-size:9.5px}}

/* ------------------------------- cards ------------------------------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
.topic{padding:15px 17px 13px;display:block;text-align:left;width:100%;
  background:var(--surf);border:1px solid var(--line);border-radius:14px;transition:background .12s,border-color .12s}
.topic:hover{border-color:var(--line2)}
.topic.sel{background:var(--brassBg);border-color:var(--brassDim)}
.topic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.topic-n{display:block;font-family:var(--serif);font-size:18px;line-height:1.25}
.topic.sel .topic-n{color:var(--brass)}
.topic-d{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.topic-c{font-size:12px;color:var(--faint);flex-shrink:0;padding-top:4px;font-variant-numeric:tabular-nums}
.mast{display:block;height:3px;background:var(--line);border-radius:3px;margin-top:11px;overflow:hidden}
.mast i{display:block;height:100%;background:var(--brassDim);border-radius:3px;transition:width .4s ease}
.topic.sel .mast i{background:var(--brass)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:64px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:450;
  color:var(--muted);border:1px solid var(--line);transition:.12s;background:var(--surf)}
.seg button:hover{border-color:var(--line2);color:var(--text)}
.seg button.sel{background:var(--brassBg);color:var(--brass);border-color:var(--brassDim);font-weight:600}

.btn{width:100%;padding:15px 18px;border-radius:11px;font-size:15px;font-weight:600;letter-spacing:.2px;
  border:1px solid var(--line2);color:var(--text);background:var(--surf);transition:.12s}
.btn:hover{border-color:var(--brassDim)}
.btn.pri{background:var(--brass);color:var(--onBrass);border-color:var(--brass);box-shadow:var(--shadow)}
.btn.pri:hover{filter:brightness(1.06);border-color:var(--brass)}
.btn[disabled]{opacity:.35;cursor:default;filter:none}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1 1 140px;width:auto}

/* ------------------------------- quiz ------------------------------- */
.bar{height:2px;background:var(--line);border-radius:2px;margin-bottom:24px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .3s ease}
.chips{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:20px}
.chip.acc{color:var(--brass);background:var(--brassBg);border-color:var(--brassDim);font-weight:600}
.qtext{font-family:var(--serif);font-size:23px;line-height:1.38;margin-bottom:24px}
@media(max-width:400px){.wordmark{font-size:30px}.qtext{font-size:20px}.brand{gap:11px}}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:11px;
  background:var(--surf);border:1px solid var(--line);font-size:14.5px;line-height:1.45;transition:.12s}
.opt:not([disabled]):hover{border-color:var(--line2);background:var(--surf2)}
.opt span.k{font-size:12px;color:var(--faint);font-weight:600;margin-top:2px;flex-shrink:0;min-width:11px}
.opt.right{background:var(--goodBg);border-color:var(--good)}
.opt.right span.k{color:var(--good)}
.opt.wrong{background:var(--badBg);border-color:var(--bad)}
.opt.wrong span.k{color:var(--bad)}
.opt.dim{color:var(--faint)}
.opt[disabled]{cursor:default}

.exp{padding:17px 19px;margin-bottom:22px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.exp h4{font-size:13px;font-weight:700;margin-bottom:8px}
.exp p{font-size:14px;line-height:1.6}
.exp.ok{border-color:var(--good)}.exp.ok h4{color:var(--good)}
.exp.no{border-color:var(--bad)}.exp.no h4{color:var(--bad)}

textarea{width:100%;min-height:160px;background:var(--surf);border:1px solid var(--line);border-radius:11px;
  font-size:14.5px;line-height:1.6;padding:15px;resize:vertical;margin-bottom:14px;font-family:var(--sans)}
textarea::placeholder{color:var(--faint)}
input[type=password],input[type=text]{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;font-size:14px;margin-bottom:10px}

.model{padding:19px;margin-bottom:22px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.model h4{font-size:11.5px;font-weight:700;color:var(--faint);margin-bottom:10px}
.model p{font-family:var(--serif);font-size:15.5px;line-height:1.65;white-space:pre-wrap}

.grade{padding:19px 19px 17px;margin-bottom:18px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.grade .score{font-family:var(--serif);font-size:32px;line-height:1}
.grade .verdict{font-size:14.5px;line-height:1.6;margin:10px 0 14px}
.grade h5{font-size:11.5px;font-weight:700;margin-bottom:6px}
.grade li{font-size:13.5px;line-height:1.55;color:var(--muted);margin-bottom:4px;list-style:none}
.grade .tip{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;font-size:13.5px;line-height:1.55;color:var(--brass)}

/* ------------------------------ results ------------------------------ */
.bigscore{text-align:center;padding:36px 0 26px}
.bigscore b{display:block;font-family:var(--serif);font-size:68px;line-height:1;font-weight:400}
.bigscore small{display:block;font-size:14px;color:var(--muted);margin-top:10px}
.brk{padding:4px 18px;margin-bottom:26px}
.brk .r{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.brk .r:last-child{border-bottom:none}
.brk .meter{width:64px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.brk .meter i{display:block;height:100%}
.brk .n{font-size:13px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

.rev{margin-bottom:26px}
.rev .item{border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-bottom:8px;overflow:hidden}
.rev .head{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;font-size:14px;line-height:1.45}
.rev .head:hover{background:var(--surf2)}
.rev .mark{flex-shrink:0;font-size:12px;font-weight:700;margin-top:1px}
.rev .mark.y{color:var(--good)}.rev .mark.n{color:var(--bad)}
.rev .body{padding:0 15px 15px;font-size:13.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap}
.rev .body b{display:block;color:var(--text);font-weight:600;font-size:12px;margin-bottom:6px;letter-spacing:.2px}

.note{text-align:center;font-size:12px;color:var(--faint);margin-top:14px;line-height:1.6}
.keybox{padding:17px 19px}
.keybox p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.linkbtn{font-size:13px;color:var(--brass);text-decoration:underline;text-underline-offset:3px;padding:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.topbar .mid{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.flagbtn{font-size:12px;color:var(--faint);padding:4px 9px;border:1px solid var(--line);border-radius:20px;transition:.12s}
.flagbtn:hover{color:var(--text);border-color:var(--line2)}
.flagbtn.on{color:var(--brass);border-color:var(--brassDim);background:var(--brassBg);font-weight:600}
.resume{padding:15px 17px;margin-bottom:22px;border:1px solid var(--brassDim);background:var(--brassBg);border-radius:14px}
.resume p{font-size:13.5px;line-height:1.5;margin-bottom:12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(128,128,128,.35);border-top-color:currentColor;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<div id="app">
  <div id="home" class="screen on"></div>
  <div id="quiz" class="screen"></div>
  <div id="result" class="screen"></div>
</div>
<script>
function qid(q) {
  const s = q.c + "|" + q.q;
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
const Q = [
/* ---------------------------- ACCOUNTING ---------------------------- */
{c:"acct",l:1,t:"mc",q:"Which statement shows profitability over a period of time rather than a snapshot?",o:["Balance sheet","Income statement","Cash flow statement","Statement of shareholders' equity"],a:1,e:"The income statement covers a period. The balance sheet is a snapshot at one date. The cash flow statement covers a period but tracks cash, not profitability."},
{c:"acct",l:1,t:"open",q:"Walk me through the three financial statements.",m:"Income statement: revenue down to net income over a period, showing profitability after operating costs, interest and taxes.\n\nCash flow statement: starts at net income, adds back non-cash items (D&A, stock comp, deferred taxes), adjusts for working capital changes, then investing (capex, acquisitions) and financing (debt, equity, dividends). Ends at net change in cash.\n\nBalance sheet: assets = liabilities + shareholders' equity at a point in time. Shows what the company owns and how it was funded.\n\nGood answers add one sentence on how they link: net income flows to the top of the CFS and into retained equity, and ending cash from the CFS becomes the cash line on the balance sheet."},
{c:"acct",l:1,t:"mc",q:"Depreciation increases by $10. Assume a 40% tax rate. What happens to net income?",o:["Falls by $10","Falls by $6","Falls by $4","No change"],a:1,e:"Pre-tax income falls $10, tax shield is $4, so net income falls $6."},
{c:"acct",l:1,t:"open",q:"Depreciation goes up by $10. Walk me through all three statements, 40% tax rate.",m:"Income statement: operating income down $10, net income down $6.\n\nCash flow statement: start at net income down $6, add back the $10 of non-cash depreciation, so cash from operations is up $4. Net change in cash up $4.\n\nBalance sheet: PP&E down $10, cash up $4, so assets down $6. On the other side, retained earnings down $6 from net income. Balances.\n\nAlways go in this order (IS, CFS, BS) so you can check that the balance sheet balances at the end."},
{c:"acct",l:1,t:"mc",q:"Inventory goes up by $10, paid for in cash. What happens on the income statement?",o:["COGS rises $10","Operating expenses rise $10","Nothing","Revenue falls $10"],a:2,e:"Buying inventory is not an expense. It only hits the income statement through COGS when the goods are sold."},
{c:"acct",l:1,t:"mc",q:"Which of these is NOT a non-cash add-back in cash flow from operations?",o:["Depreciation and amortization","Stock-based compensation","Deferred taxes","Interest expense"],a:3,e:"Interest expense is a real cash cost, already deducted in net income and not added back."},
{c:"acct",l:1,t:"open",q:"If you already have the income statement and balance sheet, why do you need the cash flow statement?",m:"Because accrual accounting means net income is not cash. Revenue can be booked before cash arrives, expenses can be recorded before they are paid, and large cash items (capex, debt repayment, buybacks) never touch the income statement at all.\n\nThe cash flow statement reconciles net income to the actual change in cash and shows where the cash came from: operations, investing or financing. Two companies with identical net income can have very different cash generation."},
{c:"acct",l:1,t:"mc",q:"Accrued compensation goes up by $10 and is recognised as an expense. 40% tax rate. What is the net change in cash?",o:["Up $10","Up $4","Down $6","No change"],a:1,e:"Net income falls $6, but the $10 increase in an accrued liability adds back to operating cash flow. Net effect on cash is +$4."},
{c:"acct",l:1,t:"mc",q:"A company buys $100 of PP&E with cash. What is the immediate effect on net income?",o:["Falls $100","Falls $60","No effect","Rises $100"],a:2,e:"Capex is a balance sheet and cash flow event. It only hits the income statement over time through depreciation."},
{c:"acct",l:2,t:"open",q:"If you could only look at one financial statement to judge a company, which would you pick and why?",m:"The cash flow statement, because it shows actual cash generated rather than accounting profit, and you can reverse-engineer a lot of the other two from it.\n\nIt starts at net income (so you see the bottom of the income statement), shows working capital movements and capex (so you see balance sheet dynamics), and reveals whether the company funds itself or depends on external capital.\n\nWhat you lose: revenue, margins, and the full capital structure. A strong answer names the trade-off rather than pretending the choice is free."},
{c:"acct",l:2,t:"mc",q:"Which of these correctly describes the change in retained earnings for a period?",o:["Net income","Net income less dividends","Net income plus depreciation","Operating cash flow less capex"],a:1,e:"Retained earnings roll forward as beginning balance plus net income less dividends paid (and less buybacks, depending on treatment)."},
{c:"acct",l:2,t:"open",q:"What is the difference between deferred revenue and accounts receivable?",m:"Deferred revenue is cash collected before the product or service is delivered. It sits as a liability because the company still owes something. Common in software subscriptions and prepaid contracts.\n\nAccounts receivable is revenue already recognised but not yet collected. It is an asset because cash is owed to the company.\n\nSo they are opposites in timing: deferred revenue is cash first and revenue later, receivables are revenue first and cash later."},
{c:"acct",l:2,t:"mc",q:"Deferred tax liabilities most commonly arise because:",o:["The company underpaid taxes and owes back taxes","Depreciation is accelerated for tax purposes versus book purposes","Revenue is recognised later for tax than for book","The company operates in multiple tax jurisdictions"],a:1,e:"Faster tax depreciation means lower cash taxes early and higher later. The gap versus book taxes builds a deferred tax liability. Asset write-ups in acquisitions are the other classic source."},
{c:"acct",l:2,t:"open",q:"A company buys $100 of inventory using debt, then sells it for $200 in cash. Walk me through the statements for the full cycle. 40% tax.",m:"Purchase: no income statement impact. Cash flow: inventory up $100 reduces operating cash flow by $100, debt issuance adds $100 to financing, net cash change zero. Balance sheet: inventory up $100, debt up $100.\n\nSale: revenue $200, COGS $100, pre-tax income $100, net income $60. Cash flow: net income up $60, inventory falls $100 which adds $100 back to operating cash flow, so cash up $160. Balance sheet: cash up $160, inventory down $100, assets up $60. Debt still up $100, retained earnings up $60.\n\nCumulative check: cash up $160, inventory back to zero, so assets up $160. Debt up $100 and retained earnings up $60 on the other side. Balances."},
{c:"acct",l:2,t:"mc",q:"Goodwill is created when:",o:["A company's share price exceeds book value","Purchase price exceeds the fair value of net identifiable assets acquired","A company writes down an intangible asset","Retained earnings exceed paid-in capital"],a:1,e:"Goodwill is the plug that makes the acquisition balance after allocating purchase price to identifiable assets and liabilities at fair value."},
{c:"acct",l:2,t:"open",q:"What is the difference between LIFO and FIFO, and what happens to COGS and net income when prices are rising?",m:"FIFO assumes the oldest inventory is sold first. LIFO assumes the newest is sold first.\n\nWith rising prices, LIFO charges the newer, higher-cost units to COGS. That means higher COGS, lower pre-tax income, lower taxes and lower net income, but higher cash flow because of the tax saving. Ending inventory on the balance sheet is understated.\n\nFIFO does the reverse: lower COGS, higher reported profit, higher taxes, and inventory carried closer to current cost. LIFO is permitted under US GAAP but not IFRS."},
{c:"acct",l:2,t:"mc",q:"Which of these increases cash flow from operations, all else equal?",o:["An increase in accounts receivable","An increase in inventory","An increase in accounts payable","An increase in prepaid expenses"],a:2,e:"An increase in a liability is a source of cash. An increase in an operating asset is a use of cash."},
{c:"acct",l:3,t:"open",q:"A company writes down $100 of obsolete inventory. Walk me through the three statements. 40% tax.",m:"Income statement: a $100 write-down is an expense, pre-tax income down $100, net income down $60.\n\nCash flow statement: net income down $60, add back the $100 non-cash write-down, so operating cash flow is up $40. That gain is the tax shield, not real economic value. Net change in cash up $40.\n\nBalance sheet: inventory down $100, cash up $40, assets down $60. Retained earnings down $60. Balances.\n\nThe nuance interviewers look for: cash actually rises because of the tax deduction, even though the company just destroyed $100 of value."},
{c:"acct",l:3,t:"mc",q:"Stock-based compensation is added back in cash flow from operations because:",o:["It is not a real economic cost","It is a non-cash expense in the period, though it dilutes existing shareholders","It is reversed in the following year","It is classified as a financing activity"],a:1,e:"It is genuinely non-cash so it gets added back, but it is a real cost to shareholders through dilution. Many investors deduct it when calculating adjusted free cash flow."},
{c:"acct",l:3,t:"open",q:"How can a company be profitable on the income statement and still go bankrupt?",m:"Because profit is not liquidity. Common paths:\n\nWorking capital drain: rapid growth ties cash up in receivables and inventory faster than it comes back in. Profitable but cash-negative.\n\nHeavy capex: reported earnings look fine while capex well above depreciation consumes all the cash.\n\nDebt maturities: a refinancing wall or covenant breach forces a default even with positive earnings.\n\nNon-cash earnings quality: revenue recognised on long contracts or aggressive accruals with no cash behind it.\n\nThe general point is that companies go bankrupt when they run out of cash or breach an obligation, not when net income turns negative."},
{c:"acct",l:3,t:"open",q:"Deferred revenue increases by $100. Walk me through the three statements. 40% tax.",m:"Income statement: no impact. The cash was received but the revenue has not been earned yet.\n\nCash flow statement: deferred revenue is a liability, so the increase adds $100 to operating cash flow. Net change in cash up $100.\n\nBalance sheet: cash up $100 on the asset side, deferred revenue liability up $100. Balances with no equity impact.\n\nWhen the service is later delivered, revenue is recognised, the liability unwinds, and net income and retained earnings rise with no further cash movement."},
{c:"acct",l:3,t:"open",q:"What is the difference between cash-based and accrual accounting, and where does it matter most in analysis?",m:"Cash accounting records revenue and expenses when cash moves. Accrual accounting records them when they are earned or incurred, regardless of cash timing.\n\nPublic companies report on an accrual basis, which is why the cash flow statement exists as the bridge.\n\nIt matters most where the two diverge persistently: long-cycle contracts, subscription businesses with heavy deferred revenue, companies capitalising costs that peers expense, and businesses with stretched payables. A widening gap between net income and operating cash flow over several years is one of the standard earnings-quality red flags."},

/* -------------------- ENTERPRISE / EQUITY VALUE -------------------- */
{c:"ev",l:1,t:"mc",q:"Which formula correctly gives enterprise value?",o:["Equity value + cash - debt","Equity value + debt + preferred + minority interest - cash","Equity value - debt + cash","Market cap + cash + debt"],a:1,e:"You add all non-equity claims on the business and subtract cash, since an acquirer effectively gets the cash back."},
{c:"ev",l:1,t:"open",q:"What is the difference between equity value and enterprise value?",m:"Equity value is the value of the company available to shareholders: share price times fully diluted shares.\n\nEnterprise value is the value of the core operating business, regardless of how it is financed. You take equity value, add debt, preferred stock and minority interest, and subtract cash and non-operating assets.\n\nThe practical point: enterprise value is capital-structure neutral, so two identical businesses with different leverage have similar EV but very different equity values. That is why EV pairs with EBITDA and EBIT, and equity value pairs with net income and EPS."},
{c:"ev",l:1,t:"mc",q:"Which pairing is correct?",o:["EV / net income","Equity value / EBITDA","EV / EBITDA","Equity value / EBIT"],a:2,e:"EBITDA is available to all capital providers, so it pairs with enterprise value. Net income is after interest, so it pairs with equity value."},
{c:"ev",l:1,t:"open",q:"Why do you subtract cash when calculating enterprise value?",m:"Two ways to explain it. First, cash is a non-operating asset. Enterprise value is meant to capture the operating business, and cash sitting on the balance sheet is not part of operations.\n\nSecond, from an acquirer's view, if you pay for the equity and then get the target's cash, your net cost is lower by that amount. You could immediately use it to pay down the debt you just assumed.\n\nThe caveat worth mentioning: not all cash is truly excess. Operating cash needed to run the business, or trapped cash in foreign subsidiaries, arguably should not be netted."},
{c:"ev",l:1,t:"mc",q:"A company raises $100 of debt and holds the proceeds in cash. What happens to enterprise value?",o:["Rises $100","Falls $100","Unchanged","Rises $60"],a:2,e:"Debt up $100 and cash up $100 cancel out. Nothing about the operating business changed, which is exactly the point of EV being capital-structure neutral."},
{c:"ev",l:2,t:"open",q:"Why do you add minority interest to enterprise value?",m:"When a company owns more than 50% but less than 100% of a subsidiary, it consolidates 100% of that subsidiary's revenue and EBITDA into its own financials. The portion it does not own shows up as minority interest.\n\nSo the EBITDA in your multiple already includes value the parent does not own. To keep the numerator and denominator consistent, you add minority interest back into enterprise value.\n\nThe alternative, and arguably cleaner, approach is to deconsolidate: strip the subsidiary's EBITDA out and value the stake separately."},
{c:"ev",l:2,t:"mc",q:"Which multiple is least distorted by differences in capital structure?",o:["P/E","EV/EBITDA","Price / book","Dividend yield"],a:1,e:"EV/EBITDA sits above both interest expense and the financing decision, so leverage does not mechanically move it the way it moves P/E."},
{c:"ev",l:2,t:"open",q:"Can enterprise value be negative? What does it mean?",m:"Yes, when cash exceeds market capitalisation plus debt. It happens with cash-rich companies whose operating business the market values at close to zero or less, sometimes after a collapse in the share price, and occasionally with shell companies or busted biotechs.\n\nMechanically it says the market thinks the operating business destroys value, so you would rather have the cash than the business attached to it.\n\nIn practice, check whether the cash is actually accessible before treating it as a free lunch. Trapped cash, pending litigation, or a business burning cash fast usually explains the gap."},
{c:"ev",l:2,t:"mc",q:"A company has 100m basic shares at $10, and 10m options with a $5 strike. Using the treasury stock method, what is the diluted share count?",o:["100m","105m","110m","102.5m"],a:1,e:"Proceeds are 10m x $5 = $50m. At $10 per share, that repurchases 5m shares. Net new shares are 10m - 5m = 5m, giving 105m diluted."},
{c:"ev",l:2,t:"open",q:"Walk me through the treasury stock method.",m:"It estimates dilution from in-the-money options and warrants.\n\nTake the in-the-money options only. Assume they are all exercised, which creates new shares. Assume the company uses the cash proceeds (number of options times strike price) to buy back shares at the current market price. The difference between shares issued and shares repurchased is the net dilution.\n\nExample: 10m options at a $5 strike, share price $10. Proceeds are $50m, which buys back 5m shares, so net new shares are 5m.\n\nOut-of-the-money options are excluded. Restricted stock units are usually added in full since there are no proceeds."},
{c:"ev",l:3,t:"open",q:"Should short-term investments be treated the same as cash in enterprise value?",m:"Usually yes, if they are liquid and non-operating: money market funds, short-dated government paper, marketable securities. An acquirer could convert them to cash quickly and use them to reduce the net cost.\n\nBut apply judgment. Illiquid investments, strategic equity stakes, or securities pledged as collateral should not be netted at face value. Equity stakes in other companies are better treated separately at fair value.\n\nThe test is: is it non-operating, liquid, and genuinely available? If not, do not net it."},
{c:"ev",l:3,t:"mc",q:"How should in-the-money convertible bonds usually be treated when calculating enterprise value?",o:["As straight debt at face value","Using the if-converted method: treat as equity and exclude from debt","Ignored entirely","Added to cash"],a:1,e:"If the conversion option is in the money, assume conversion. The bonds become shares in the diluted count and drop out of the debt balance, otherwise you double count."},
{c:"ev",l:3,t:"open",q:"How are operating leases treated in enterprise value, and why did this change?",m:"Under the older US GAAP and IFRS treatment, operating leases were off balance sheet. Analysts capitalised them manually, often by multiplying annual rent by a factor (commonly 8x) or discounting the future commitments, and adding the result to debt as a debt-like obligation.\n\nSince IFRS 16 and ASC 842, most leases sit on the balance sheet as a right-of-use asset and a corresponding lease liability, and the expense splits into depreciation and interest, which lifts reported EBITDA.\n\nThe practical implications: you must know whether a comparable set is reported pre or post standard, because EBITDA and leverage are not comparable across the transition. Include the lease liability in debt for EV when EBITDA is reported post-IFRS 16, and be consistent across all comps."},
{c:"ev",l:3,t:"open",q:"Two companies have identical EBITDA but very different P/E ratios. Give three reasons why.",m:"Leverage: the more indebted company pays more interest, so net income is lower and P/E is mechanically higher for a given equity value.\n\nCapital intensity and D&A: identical EBITDA can sit on very different depreciation bases, so EBIT and net income diverge.\n\nTax rate: different jurisdictions, NOL balances or one-off items move net income without touching EBITDA.\n\nBeyond those three: minority interests, non-operating income, share count and buyback policy, and simply different growth or risk expectations priced by the market."}
];

const Q2 = [
/* ----------------------------- VALUATION ----------------------------- */
{c:"val",l:1,t:"open",q:"What are the three main valuation methodologies?",m:"Comparable company analysis: apply trading multiples of similar public companies to the target's metrics. Reflects current public market sentiment, no control premium.\n\nPrecedent transactions: apply multiples paid in past M&A deals for similar companies. Includes a control premium and reflects the deal environment at the time.\n\nDiscounted cash flow: project unlevered free cash flow, discount at WACC, add a terminal value. Intrinsic rather than market-based, and the most assumption-sensitive.\n\nA strong answer adds that you triangulate rather than pick one, and presents the ranges together on a football field chart."},
{c:"val",l:1,t:"mc",q:"Which methodology typically produces the highest valuation range?",o:["Comparable companies","Precedent transactions","Liquidation analysis","LBO analysis"],a:1,e:"Precedent transactions include a control premium and often synergy value paid by strategic buyers. LBO analysis usually sets the floor because a sponsor needs a target return."},
{c:"val",l:1,t:"open",q:"When would a DCF not be the right tool?",m:"When cash flows cannot be forecast with any confidence. Early-stage companies with no revenue, biotechs pre-approval, or highly cyclical businesses at an unrepresentative point in the cycle.\n\nFinancial institutions: banks and insurers are valued on P/E, price to book or a dividend discount model, because interest is part of operations and unlevered free cash flow is not meaningful.\n\nDistressed situations where the relevant question is asset recovery rather than going-concern cash flow.\n\nYou can still run one for reference, but you would weight it lightly and lean on comps, precedent transactions or asset-based approaches."},
{c:"val",l:1,t:"mc",q:"Comparable company analysis is based on:",o:["Prices paid in past acquisitions","Current trading multiples of similar public companies","Projected cash flows discounted at WACC","Book value of assets less liabilities"],a:1,e:"Comps use current market prices. Precedent transactions use historical deal prices."},
{c:"val",l:1,t:"open",q:"What is the difference between comparable companies and precedent transactions?",m:"Comps use what similar public companies trade at today. Precedents use what buyers actually paid for similar companies in past deals.\n\nThree practical differences. Precedents carry a control premium, typically 20% to 40%, because the buyer gains control and often pays for synergies. Comps update in real time while precedents are historical and can reflect a very different financing or macro environment. Comps have clean, current, public data while precedent data is often incomplete because private deal terms are not disclosed.\n\nSo comps tell you standalone market value, precedents tell you likely takeout value."},
{c:"val",l:1,t:"mc",q:"Which methodology is most sensitive to small changes in assumptions?",o:["Comparable companies","Precedent transactions","Discounted cash flow","Liquidation analysis"],a:2,e:"Small moves in WACC or terminal growth swing a DCF heavily, because most of the value sits in the terminal value."},
{c:"val",l:1,t:"open",q:"How do you pick comparable companies?",m:"Start with the industry and business model, then screen on financial and operating similarity.\n\nThe main criteria: same sector and sub-sector, similar business mix and revenue model, comparable size (revenue or market cap, often within a band), similar growth and margin profile, similar geography and end markets, and similar capital intensity.\n\nSources: the company's own filings and its stated peer group, equity research comp tables, and screens by SIC or GICS code.\n\nThe honest part of the answer is that you rarely get perfect comps, so you note where each one differs and let that inform whether the target should trade at a premium or discount to the set."},
{c:"val",l:2,t:"open",q:"Why do precedent transactions usually give a higher value than comps?",m:"Control premium: buying 100% of a company means you can change strategy, management and capital structure. Buyers pay for that, typically 20% to 40% above the undisturbed trading price.\n\nSynergies: strategic acquirers can justify paying more because the combined entity is worth more than the sum of the parts. Part of that value gets handed to the seller in the negotiation.\n\nCompetitive process: auctions push prices up. Sellers run them for exactly this reason.\n\nThe caveat: if the precedents were struck in a hotter market or with cheaper financing, the premium partly reflects the environment, not the asset."},
{c:"val",l:2,t:"mc",q:"Which multiple would you NOT typically use to value a commercial bank?",o:["P/E","Price to book value","EV/EBITDA","Price to tangible book"],a:2,e:"Interest is operating revenue for a bank, and debt is raw material rather than financing, so enterprise value and EBITDA are not meaningful. Banks are valued on equity metrics."},
{c:"val",l:2,t:"open",q:"How would you value a company with negative EBITDA?",m:"Move up the income statement to a metric that is still positive: EV/revenue, EV/gross profit, or a sector-specific operating metric like EV per subscriber, per user, or per megawatt.\n\nUse a DCF if you can credibly forecast the path to profitability, valuing it on normalised or terminal-year margins rather than current ones.\n\nApply forward multiples: if the company turns EBITDA-positive in two years, value it on year-three EBITDA and discount back.\n\nConsider asset-based or liquidation value as a floor, and for early-stage businesses, precedent venture rounds or acquisitions of similar assets."},
{c:"val",l:2,t:"mc",q:"A football field chart shows:",o:["The company's share price over time","The valuation range implied by each methodology, side by side","Sensitivity of a DCF to WACC and growth","Revenue split by segment"],a:1,e:"It stacks the ranges from comps, precedents, DCF, LBO and any others as horizontal bars so you can see where they overlap."},
{c:"val",l:2,t:"open",q:"What valuation methodologies exist beyond the main three?",m:"LBO analysis: solve for the maximum price a sponsor could pay while hitting a target IRR. Usually gives a floor value.\n\nSum of the parts: value each division on its own appropriate multiple and add them, subtracting net debt and corporate costs. Used for conglomerates.\n\nLiquidation analysis: value the assets in a wind-down, net of liabilities. Relevant in distress.\n\nDividend discount model: standard for banks and insurers, and for mature high-payout businesses.\n\nReplacement cost: what it would cost to rebuild the asset base. Used in real estate, infrastructure and some industrials.\n\nM&A premiums analysis and future share price analysis are also common in bank pitch materials."},
{c:"val",l:2,t:"mc",q:"Liquidation valuation is most relevant for:",o:["A high-growth software company","A distressed company with substantial hard assets","A bank with a strong deposit base","A company being acquired by a strategic buyer"],a:1,e:"It answers what creditors would recover in a wind-down, so it matters when going-concern value is in doubt and there are tangible assets to sell."},
{c:"val",l:2,t:"open",q:"How would you value an apple tree?",m:"The interviewer wants to see if you can map the three methodologies onto something unfamiliar.\n\nDCF: project the apples the tree produces each year, multiply by price per apple, subtract the cost of water, fertiliser and harvesting, discount at a rate reflecting the risk of disease and weather, and add a terminal value for the remaining productive life.\n\nComps: look at what similar apple trees in the same orchard and region sell for, on a per-tree or per-yield basis.\n\nPrecedents: look at what buyers have actually paid for comparable trees or orchards in past transactions.\n\nLiquidation: the value of the timber if you cut it down. That sets the floor.\n\nStay structured and say the framework out loud. That is what is being tested, not the apples."},
{c:"val",l:3,t:"open",q:"Two companies in the same industry have identical financials but trade at different multiples. Why?",m:"Growth and margin trajectory: identical trailing numbers can sit on very different forward expectations. Multiples are forward-looking.\n\nQuality of earnings: recurring revenue, contract length, customer concentration and cash conversion all justify a premium.\n\nRisk: end-market cyclicality, regulatory exposure, litigation, geographic concentration.\n\nCapital structure and liquidity: leverage moves P/E, and thin float or low trading volume drags on valuation.\n\nGovernance and ownership: dual-class shares, a controlling shareholder, or weak management discount a stock.\n\nIndex membership and coverage: inclusion in a major index and analyst coverage support valuation.\n\nAlso worth saying: one of them may simply be mispriced, and identifying that is the investment case."},
{c:"val",l:3,t:"open",q:"How does valuing a private company differ from valuing a public one?",m:"No market price, so there is no observable equity value to anchor to. You lean more on DCF and comps.\n\nIlliquidity discount: private stakes are hard to sell, so a discount is typically applied, often in the 10% to 30% range depending on the situation.\n\nData quality: financials may be unaudited, and private company accounts often carry owner compensation, related-party transactions and personal expenses that need normalising into a clean EBITDA.\n\nSize and control: private targets are often smaller, which usually means a lower multiple, though a control stake removes the minority discount.\n\nCapital structure: no public debt or ratings, so cost of debt is harder to observe, and beta has to be taken from public comps and relevered.\n\nA DCF for a private company also cannot be sanity-checked against a market price, so the assumptions carry more weight."},
{c:"val",l:3,t:"mc",q:"Control premiums in M&A most commonly fall in which range?",o:["0% to 5%","20% to 40%","60% to 80%","Above 100%"],a:1,e:"Twenty to forty percent over the undisturbed price is the usual band, though it varies widely by sector, competitive dynamics and synergy potential."},
{c:"val",l:3,t:"open",q:"What is a sum-of-the-parts valuation and when would you use it?",m:"You value each business segment separately using multiples or DCFs appropriate to that segment, add them together, then subtract net debt, unallocated corporate costs (often capitalised at a multiple) and any minority interests.\n\nUse it when the segments have genuinely different economics: a conglomerate, a company with a fast-growing division buried inside a mature one, or a business with a valuable stake in a listed entity.\n\nIt is also the standard tool in break-up or activist analysis, where the argument is that the parts are worth more than the whole and the market is applying a conglomerate discount.\n\nThe weak point is segment disclosure. If the company does not report clean segment EBITDA, you are estimating, and corporate cost allocation is subjective."},
{c:"val",l:3,t:"open",q:"How would you value an oil and gas company or a biotech differently?",m:"Oil and gas: reserves drive value. Use net asset value based on proved and probable reserves with a commodity price deck, and multiples like EV per barrel of oil equivalent or EV/EBITDAX. Cash flows are commodity-price dependent, so sensitivity to the price deck matters more than growth assumptions.\n\nBiotech: value is in the pipeline. Use a risk-adjusted NPV per drug candidate, probability-weighted by clinical phase success rates, with peak sales estimates, patent life and pricing assumptions. Pre-revenue companies often get valued on precedent licensing deals and comparable company market caps by phase.\n\nThe general principle: when the standard three methodologies break down, find the metric that actually drives value in that industry and build the valuation around it."},
{c:"val",l:3,t:"mc",q:"In a valuation context, LBO analysis is usually interpreted as:",o:["A ceiling on value","A floor on value","The most likely value","Irrelevant to strategic buyers"],a:1,e:"A sponsor needs to hit a target IRR, so the price it can pay is typically below what a strategic buyer with synergies would pay. That sets a floor for the range."},

/* -------------------------------- DCF -------------------------------- */
{c:"dcf",l:1,t:"open",q:"Walk me through a DCF.",m:"Project unlevered free cash flow for five to ten years: take EBIT, tax it at the marginal rate, add back D&A, subtract capex and the change in net working capital.\n\nCalculate WACC: weight cost of equity (from CAPM) and after-tax cost of debt by target capital structure weights.\n\nDiscount the projected cash flows back to today at WACC.\n\nCalculate terminal value, either with the Gordon growth method (final year cash flow grown at a modest perpetual rate, divided by WACC less growth) or an exit multiple applied to terminal-year EBITDA. Discount it back too.\n\nSum the discounted cash flows and terminal value to get enterprise value. Subtract net debt and other non-equity claims to get equity value, then divide by diluted shares for an implied price per share.\n\nFinish by mentioning you would sensitise WACC and terminal assumptions."},
{c:"dcf",l:1,t:"mc",q:"Unlevered free cash flow equals:",o:["Net income + D&A - capex - change in NWC","EBIT x (1 - tax rate) + D&A - capex - change in NWC","EBITDA - capex","Operating cash flow - dividends"],a:1,e:"Start at EBIT so the figure sits before interest and is therefore available to all capital providers. Tax-effect it, then adjust for non-cash and investment items."},
{c:"dcf",l:1,t:"mc",q:"Unlevered free cash flow is discounted at:",o:["Cost of equity","WACC","Cost of debt","Risk-free rate"],a:1,e:"Unlevered cash flow belongs to both debt and equity holders, so it is discounted at the blended cost of both."},
{c:"dcf",l:1,t:"open",q:"What is WACC and how do you calculate it?",m:"The blended required return of all capital providers, used to discount unlevered free cash flow.\n\nWACC = (E / (D+E)) x cost of equity + (D / (D+E)) x cost of debt x (1 - tax rate).\n\nCost of equity comes from CAPM: risk-free rate + levered beta x equity risk premium, with a size or country premium added where relevant. The risk-free rate is typically the yield on a long-dated government bond in the relevant currency.\n\nCost of debt is the company's current borrowing cost, taken from the yield on its traded debt or from a rating-implied spread, and it is tax-effected because interest is deductible.\n\nWeights should reflect target or market-value capital structure, not book values."},
{c:"dcf",l:1,t:"mc",q:"Levered free cash flow is discounted at:",o:["WACC","Cost of equity","Cost of debt","Marginal tax rate"],a:1,e:"Levered free cash flow is already after interest, so it belongs only to equity holders. Discounting it gives equity value directly."},
{c:"dcf",l:1,t:"open",q:"What is the difference between levered and unlevered free cash flow?",m:"Unlevered free cash flow is before interest. It represents cash available to all capital providers, is discounted at WACC, and gives you enterprise value directly.\n\nLevered free cash flow is after interest and mandatory debt repayment. It represents cash available to equity holders only, is discounted at cost of equity, and gives you equity value directly.\n\nUnlevered is the market standard for DCFs because it isolates the operating business from financing decisions, which makes comparisons across companies cleaner. Levered DCFs show up mainly for financial institutions and in some project finance contexts."},
{c:"dcf",l:1,t:"mc",q:"The two standard methods for calculating terminal value are:",o:["Perpetuity growth and exit multiple","Book value and liquidation value","Comps and precedents","Payback period and IRR"],a:0,e:"Gordon growth applies a perpetual growth rate, exit multiple applies a trading multiple to the terminal-year metric. In practice you cross-check one against the other."},
{c:"dcf",l:2,t:"open",q:"How do you calculate cost of equity?",m:"CAPM: cost of equity = risk-free rate + levered beta x equity risk premium.\n\nRisk-free rate: yield on a long-dated government bond matching the currency of the cash flows, typically a ten- or twenty-year maturity.\n\nEquity risk premium: the historical or implied excess return of equities over the risk-free rate, commonly in the range of 4% to 6%.\n\nBeta: take the unlevered betas of comparable companies, average them, and relever at the target company's capital structure using beta levered = beta unlevered x (1 + (1 - t) x D/E).\n\nAdjustments often added: a size premium for smaller companies and a country risk premium for emerging market exposure. Some practitioners use a build-up model or multi-factor approach instead of plain CAPM."},
{c:"dcf",l:2,t:"mc",q:"Beta measures:",o:["Total volatility of a stock","Volatility relative to the market","The risk-free rate","The probability of default"],a:1,e:"Beta captures systematic risk, the part of volatility that moves with the market and cannot be diversified away."},
{c:"dcf",l:2,t:"open",q:"Why do you unlever and relever beta?",m:"Observed beta for a comparable company reflects both its business risk and its capital structure. More leverage means more volatile equity returns, so a higher beta, even if the underlying operations are identical.\n\nTo isolate business risk, you unlever each comp's beta: beta unlevered = beta levered / (1 + (1 - t) x D/E).\n\nAverage or take the median of those unlevered betas to get a clean read on the industry's operating risk.\n\nThen relever at the target's own or target capital structure: beta levered = beta unlevered x (1 + (1 - t) x D/E).\n\nWithout this, you would import the comps' financing decisions into your discount rate, which has nothing to do with the company you are valuing."},
{c:"dcf",l:2,t:"mc",q:"Terminal value typically represents what share of total DCF value?",o:["Under 20%","Around 30%","Roughly 50% to 80%","Always under 50%"],a:2,e:"That concentration is exactly why interviewers press on terminal assumptions and why you always sanity-check the implied exit multiple."},
{c:"dcf",l:2,t:"mc",q:"Final-year free cash flow is $100m, WACC is 10%, perpetual growth is 2%. What is the terminal value?",o:["$1,000m","$1,250m","$1,275m","$1,020m"],a:2,e:"TV = FCF x (1+g) / (WACC - g) = 100 x 1.02 / 0.08 = $1,275m. Note the growth applied to the final year before discounting."},
{c:"dcf",l:2,t:"open",q:"How do you get from enterprise value to an implied share price in a DCF?",m:"Sum the discounted forecast cash flows and the discounted terminal value to get enterprise value.\n\nSubtract total debt, preferred stock and minority interest. Add cash and any non-operating assets such as marketable securities or stakes in other companies. That gives equity value.\n\nAlso subtract unfunded pension liabilities and any other debt-like items if they are material.\n\nDivide equity value by the fully diluted share count, calculated using the treasury stock method for in-the-money options and the if-converted method for convertibles.\n\nThe result is implied value per share, which you compare to the current trading price to conclude whether the stock looks under or over valued."},
{c:"dcf",l:2,t:"mc",q:"All else equal, raising the terminal growth rate:",o:["Lowers the valuation","Raises the valuation","Has no effect","Raises WACC"],a:1,e:"A higher g shrinks the denominator (WACC - g), which increases terminal value and therefore enterprise value. Keep g at or below long-run GDP or inflation to stay credible."},
{c:"dcf",l:3,t:"open",q:"What are the main flaws of a DCF?",m:"Terminal value dominance: often 60% to 80% of the value sits in a number driven by two assumptions you cannot observe.\n\nDiscount rate sensitivity: a 50 basis point move in WACC can shift the valuation by 10% or more, and WACC itself relies on beta estimates, an assumed equity risk premium and a chosen risk-free rate.\n\nForecast reliability: nobody forecasts five to ten years accurately, and the further out you go the more the projection reflects the modeller's priors than the business.\n\nStatic capital structure: standard WACC assumes constant weights, which is wrong for companies deleveraging or recapitalising.\n\nIt ignores market sentiment entirely, which matters if you are advising on a transaction that has to clear at a market-acceptable price.\n\nThe honest framing: a DCF is a tool for understanding what assumptions the current price implies, not a machine that outputs truth."},
{c:"dcf",l:3,t:"open",q:"Why do you use WACC rather than cost of equity to discount unlevered free cash flow?",m:"Because unlevered free cash flow is calculated before interest, so it represents cash available to every capital provider: lenders and shareholders alike.\n\nThe discount rate has to match the claim being discounted. If the cash flow belongs to debt and equity together, the required return must be the blended return demanded by debt and equity together, which is WACC.\n\nUsing cost of equity would overstate the discount rate, because debt is cheaper than equity (lower risk and tax-deductible interest), and would understate the value.\n\nThe mirror image: levered free cash flow is after interest, belongs to equity only, and is therefore discounted at cost of equity to arrive directly at equity value."},
{c:"dcf",l:3,t:"open",q:"Two companies generate identical free cash flow but have different WACCs. Give the reasons.",m:"Capital structure: more debt in the mix lowers WACC up to a point, since debt is cheaper and tax-deductible. Past the point where distress risk rises, it starts pushing WACC up again.\n\nBusiness risk: a more cyclical or operationally leveraged business carries a higher beta, so a higher cost of equity.\n\nSize: smaller companies typically carry a size premium in cost of equity.\n\nCredit quality: a weaker rating means a wider spread and a higher cost of debt.\n\nGeography and currency: different risk-free rates and country risk premia for the same nominal cash flow.\n\nTax rate: a higher marginal tax rate makes the debt shield more valuable, lowering WACC.\n\nIdentical cash flow today says nothing about the risk of that cash flow persisting, and WACC is about risk."},
{c:"dcf",l:3,t:"mc",q:"The mid-year convention:",o:["Assumes cash flows arrive at year end, lowering valuation","Assumes cash flows arrive evenly through the year, raising valuation","Only applies to terminal value","Adjusts the tax rate"],a:1,e:"Discounting at 0.5, 1.5, 2.5 rather than 1, 2, 3 reflects cash arriving throughout the year rather than in a lump at year end. It raises present value modestly."},
{c:"dcf",l:3,t:"open",q:"How would you build a DCF for a company with no revenue yet?",m:"Build the forecast bottom-up from operating drivers rather than growing a revenue line: addressable market, expected penetration, pricing, unit economics, and the time to commercialisation.\n\nExtend the projection horizon well beyond the usual five years, out to the point where the business reaches a steady state, sometimes ten to fifteen years. Terminal value is then applied to normalised mature-state cash flow.\n\nUse a substantially higher discount rate reflecting the risk, or better, probability-weight scenarios: a success case, a partial case and a failure case, each with an assigned probability. This is standard for biotech, where you risk-adjust by clinical phase.\n\nBe explicit that the output is a scenario-weighted range, not a point estimate, and cross-check it against what venture rounds or comparable acquisitions imply."},
{c:"dcf",l:3,t:"open",q:"Should cost of equity be higher for a $5bn company or a $500m company, and why?",m:"Higher for the $500m company, all else equal.\n\nThe main reason is the size premium. Empirically, smaller companies have delivered higher returns than CAPM alone predicts, which practitioners capture by adding a premium to cost of equity, often 100 to 400 basis points depending on the size bucket.\n\nThe underlying drivers: smaller companies tend to have less diversified revenue, more customer and key-person concentration, thinner access to capital markets, lower trading liquidity, and less analyst coverage.\n\nCaveats worth adding: this is an all-else-equal statement. A small, unlevered, contracted-revenue infrastructure asset can easily carry a lower cost of equity than a large, highly levered cyclical."},
{c:"dcf",l:3,t:"open",q:"How does a change in capital structure affect WACC and enterprise value in a DCF?",m:"Mechanically, adding debt lowers WACC initially, because debt is cheaper than equity and interest is tax-deductible. A lower WACC raises the present value of the same unlevered cash flows, so enterprise value rises.\n\nBut two offsetting effects. First, more leverage raises the equity's beta, so cost of equity rises, partly cancelling the benefit. Second, beyond a certain leverage level, distress risk pushes the cost of debt up sharply and the cost of equity with it, so WACC turns and rises.\n\nThat gives the classic U-shaped WACC curve with an optimal capital structure somewhere in the middle.\n\nThe important conceptual point: unlevered free cash flow itself does not change with capital structure. Only the discount rate does. Under strict Modigliani-Miller with no taxes, even that would not change value. The tax shield is where the real value comes from, and that is what an APV approach values explicitly instead of burying it in WACC."}
];

const Q3 = [
/* ------------------------ M&A / MERGER MODEL ------------------------ */
{c:"ma",l:1,t:"open",q:"Why do companies acquire other companies?",m:"Synergies: cost savings from removing duplicate functions, facilities and overhead, or revenue synergies from cross-selling and distribution.\n\nMarket position: consolidating a fragmented industry, buying market share, or eliminating a competitor.\n\nCapability acquisition: buying technology, intellectual property, a product line or a team faster than building it.\n\nGeographic expansion: entering a new market with an established platform instead of from scratch.\n\nFinancial motives: deploying excess cash, using NOLs, or acquiring an undervalued asset.\n\nDefensive: preventing a rival from buying the target.\n\nThe cynical ones worth naming if the interviewer invites it: empire building and management incentives tied to size rather than returns."},
{c:"ma",l:1,t:"mc",q:"In an all-stock deal with no synergies, the transaction is accretive when:",o:["The acquirer's P/E is lower than the target's P/E","The acquirer's P/E is higher than the target's P/E","Both trade at the same P/E","The target has higher revenue"],a:1,e:"A higher-P/E acquirer is issuing expensive currency to buy cheaper earnings, so EPS rises. The reverse is dilutive."},
{c:"ma",l:1,t:"open",q:"Walk me through a merger model.",m:"Assumptions: purchase price and form of consideration (cash, stock, debt), synergies, transaction fees, and the financing structure.\n\nPurchase price allocation: write up assets to fair value, create a deferred tax liability on the write-ups, and plug the remainder as goodwill. Wipe out the target's existing goodwill and equity.\n\nCombine the income statements: add revenues and expenses, layer in synergies, then adjust for new interest expense on acquisition debt, forgone interest on cash used, and incremental D&A from asset write-ups.\n\nCalculate the new share count: existing acquirer shares plus any shares issued as consideration.\n\nCompute pro forma EPS and compare it to standalone acquirer EPS. The difference is accretion or dilution.\n\nFinish with sensitivities on price and synergies, and the break-even synergy level."},
{c:"ma",l:1,t:"mc",q:"Which financing method is usually cheapest for an acquirer, assuming it is available?",o:["Issuing new equity","Raising new debt","Using excess cash on hand","Issuing convertible bonds"],a:2,e:"Cash costs only the forgone interest income, typically the lowest of the three. Debt is next, since interest is tax-deductible. Equity is the most expensive form of currency."},
{c:"ma",l:1,t:"open",q:"What is the difference between accretion and dilution?",m:"It compares the acquirer's pro forma EPS after the deal against its standalone EPS.\n\nIf pro forma EPS is higher, the deal is accretive. If lower, it is dilutive.\n\nThe drivers are the earnings the target brings, plus synergies, less the cost of the consideration: interest on new debt, forgone interest on cash used, and dilution from new shares issued. Incremental D&A from asset write-ups also drags.\n\nThe critical caveat: accretion is an accounting outcome, not a measure of value creation. You can pay far too much and still show accretion if you fund with cheap debt. Interviewers want to hear that you know the difference."},
{c:"ma",l:1,t:"mc",q:"Synergies in M&A are usually split into:",o:["Tax and accounting","Revenue and cost","Short-term and permanent","Hard and soft assets"],a:1,e:"Cost synergies come from eliminating overlap. Revenue synergies come from cross-selling and expanded distribution. Cost synergies are far more credible."},
{c:"ma",l:1,t:"open",q:"Why are revenue synergies treated as less credible than cost synergies?",m:"Cost synergies are largely within the acquirer's control. You can count the duplicate finance departments, the overlapping facilities and the redundant systems, and put a timeline on removing them.\n\nRevenue synergies depend on customer behaviour. They assume clients will buy the combined offering, that sales teams will cross-sell effectively, and that no customers leave because of the merger. Integration disruption frequently costs revenue rather than adding it.\n\nEmpirically, a large share of announced revenue synergies never materialise, while cost synergies are more often delivered.\n\nSo in models, revenue synergies are usually heavily haircut or shown separately, and the base case runs on cost synergies alone."},
{c:"ma",l:2,t:"open",q:"Walk me through purchase price allocation.",m:"Start with the equity purchase price paid for the target.\n\nWipe out the target's existing shareholders' equity and its existing goodwill. Both disappear in the new basis.\n\nWrite up the target's identifiable assets to fair value: PP&E, and identifiable intangibles such as customer relationships, trade names and technology. These write-ups create incremental depreciation and amortisation going forward, which reduces pro forma net income.\n\nCreate a deferred tax liability on the write-ups, because the step-up is generally not deductible for tax purposes in a stock deal. The standard calculation is the write-up amount multiplied by the tax rate.\n\nThe residual is new goodwill: equity purchase price less book value of equity, plus existing goodwill written off, less asset write-ups, plus the new deferred tax liability.\n\nGoodwill is not amortised but is tested annually for impairment."},
{c:"ma",l:2,t:"open",q:"What happens to the target's existing goodwill in an acquisition?",m:"It is written off entirely. Goodwill from the target's own past acquisitions does not carry over.\n\nThe reason is that purchase accounting resets the target's balance sheet to fair value from the acquirer's perspective. Goodwill by definition is not an identifiable asset, so it cannot be revalued. It is eliminated along with the target's existing shareholders' equity.\n\nNew goodwill is then created based on what the acquirer actually paid relative to the fair value of identifiable net assets.\n\nA practical consequence: the write-off of old goodwill increases the new goodwill figure, which is why it appears as an add-back in the standard goodwill formula."},
{c:"ma",l:2,t:"mc",q:"Acquirer trades at 15x earnings, target at 20x. All-stock deal, no synergies. The deal is:",o:["Accretive","Dilutive","Neutral","Cannot be determined"],a:1,e:"The acquirer is issuing 15x currency to buy 20x earnings, so it gives up more in earnings per share than it gains. Dilutive without synergies."},
{c:"ma",l:2,t:"open",q:"Why does the choice between a cash deal and a stock deal change accretion?",m:"Because the cost of each currency is different.\n\nCash: the cost is the forgone interest income on that cash, often 1% to 4% pre-tax, which is very low. Deals funded with cash are usually accretive for that reason alone.\n\nDebt: the cost is the after-tax interest rate on the new borrowing. Compare it to the target's earnings yield. If the after-tax cost of debt is below the inverse of the purchase P/E, the deal is accretive.\n\nStock: the cost is the acquirer's own earnings yield, the inverse of its P/E. If the acquirer trades at 20x, its cost of equity currency is 5%, which is expensive relative to debt.\n\nSo the ranking on accretion is normally cash, then debt, then stock. That ranking says nothing about which is right strategically, since stock shares deal risk with the seller and preserves balance sheet capacity."},
{c:"ma",l:2,t:"open",q:"What is the difference between a stock purchase and an asset purchase?",m:"Stock purchase: the buyer acquires the target's shares and takes the entire legal entity, including all assets and all liabilities, known and unknown. Contracts and licences generally transfer automatically. The buyer usually does not get a tax step-up in asset basis, so the write-ups create a deferred tax liability.\n\nAsset purchase: the buyer picks specific assets and assumes specific liabilities, leaving the rest behind. The buyer gets a step-up in tax basis, so the write-ups are actually depreciable for tax and create real cash tax savings. Contracts often need consent to transfer.\n\nBuyers generally prefer asset deals for the tax step-up and liability protection. Sellers generally prefer stock deals because asset sales can trigger double taxation for a corporate seller and leave residual liabilities behind.\n\nDistressed deals are frequently structured as asset sales, notably through a section 363 process, precisely so the buyer takes clean assets."},
{c:"ma",l:2,t:"mc",q:"A deferred tax liability is created in an acquisition mainly because:",o:["The target owes back taxes","Asset write-ups increase book D&A but are not deductible for tax","Goodwill is amortised for book purposes","The acquirer changes tax jurisdiction"],a:1,e:"Book depreciation rises on the written-up assets while tax depreciation does not, so book taxes are lower than cash taxes and the gap accrues as a DTL."},
{c:"ma",l:3,t:"open",q:"How do you calculate the synergies needed to make a deal EPS-neutral?",m:"Build the pro forma income statement with zero synergies, then solve for the pre-tax synergy figure that makes pro forma EPS equal standalone acquirer EPS.\n\nMechanically: calculate pro forma net income with no synergies, calculate the net income required to hit standalone EPS on the new share count (standalone EPS x pro forma diluted shares), take the difference, and gross it up by dividing by (1 - tax rate). That gives the required pre-tax synergies.\n\nThen the analytical step that matters: compare that number to the target's total operating cost base or SG&A. If break-even requires synergies equal to 30% of the target's entire cost base, the deal is priced on hope. If it requires 3%, it is very achievable.\n\nThat ratio is one of the most useful sanity checks in a merger model, and it is exactly what a board would ask."},
{c:"ma",l:3,t:"open",q:"Why might an accretive deal still destroy value?",m:"Accretion is an EPS arithmetic outcome, driven by the relative cost of financing versus the target's earnings yield. Cheap debt makes almost anything accretive in the short run.\n\nValue destruction happens when the price paid exceeds the present value of the cash flows plus realisable synergies. You can overpay dramatically and still show accretion, because the debt is cheap and the interest cost is below the acquired earnings yield.\n\nOther routes: the accretion relies on synergies that never arrive, the leverage added raises the acquirer's cost of capital and risk of distress, integration disrupts both businesses, or the deal takes the company into a structurally worse industry.\n\nThe right test is a value test, not an EPS test: does the deal generate a return above the cost of capital? Markets often mark the acquirer down on announcement of an accretive deal for exactly this reason."},
{c:"ma",l:3,t:"open",q:"How does a merger model change if the target has large net operating losses?",m:"NOLs are a tax asset: they shelter future taxable income, so they add value and improve accretion.\n\nThe complication is that tax authorities limit their use after a change of control. In the US, section 382 caps the annual usable amount at roughly the target's equity value at change of control multiplied by a published long-term tax-exempt rate.\n\nSo in the model you do not simply apply the full NOL balance. You calculate the annual limitation, apply it against pro forma taxable income year by year, carry forward the unused portion, and account for the expiry schedule.\n\nThe practical effect: a large NOL balance in a small-equity-value target is worth far less than face value. You would value the NOL as the present value of the actual annual tax savings, and present it as a separate line in the valuation bridge rather than embedding it silently in the tax rate."},
{c:"ma",l:3,t:"open",q:"What is a contribution analysis and when is it useful?",m:"It compares what each party contributes to the combined entity (revenue, EBITDA, net income, sometimes assets or cash flow) against what each party receives in ownership of the combined entity.\n\nExample: if the target contributes 30% of combined EBITDA but its shareholders receive 40% of the combined equity, the acquirer's shareholders are giving up more than they get on that metric.\n\nIt is most useful in mergers of equals and large all-stock deals, where the exchange ratio is the central negotiation and there is no clean cash price to anchor on. It is also used to argue fairness to a board and appears in fairness opinions.\n\nThe limitation: it treats contributions as if all earnings are equally valuable, ignoring growth, margin quality and risk. A faster-growing contributor legitimately deserves more than its current EBITDA share."},
{c:"ma",l:3,t:"mc",q:"An acquirer trades at 15x earnings and funds an acquisition entirely with debt at a 5% interest rate. Tax rate is 40%. Ignoring the target's own multiple, the after-tax cost of debt versus the acquirer's earnings yield is:",o:["3% versus 6.7%, so accretive","5% versus 6.7%, so accretive","3% versus 15%, so dilutive","6.7% versus 3%, so dilutive"],a:0,e:"After-tax cost of debt is 5% x (1 - 0.40) = 3%. The acquirer's earnings yield is 1/15 = 6.7%. Financing cost below the yield being acquired means accretion."},
{c:"ma",l:3,t:"open",q:"How does purchase accounting affect the combined income statement going forward?",m:"Incremental D&A: asset write-ups to fair value, especially identifiable intangibles like customer relationships and technology, create new depreciation and amortisation that did not exist before. This reduces pro forma EBIT and net income, and is a common source of dilution.\n\nGoodwill: not amortised, so no recurring income statement drag, but subject to annual impairment testing. An impairment produces a large non-cash charge later.\n\nInventory step-up: written up to fair value and then expensed through COGS as the inventory is sold, which depresses gross margin for a quarter or two after closing.\n\nDeferred revenue haircut: acquired deferred revenue is often written down to fair value, so the combined company recognises less revenue than the target would have standalone. This is significant in software deals.\n\nTransaction and integration costs run through the income statement in the period incurred.\n\nThis is why companies emphasise adjusted or cash EPS after acquisitions, stripping out amortisation of acquired intangibles."},

/* -------------------------------- LBO -------------------------------- */
{c:"lbo",l:1,t:"open",q:"Walk me through an LBO.",m:"A financial sponsor acquires a company using a large proportion of debt and a relatively small equity cheque, typically 40% to 60% equity today.\n\nSet the purchase price, usually as a multiple of EBITDA, and build sources and uses: sources are the debt tranches and sponsor equity, uses are the purchase of equity, refinancing existing debt, and transaction fees.\n\nProject the operating case forward five years, build the debt schedule with mandatory amortisation and a cash sweep, and track the declining debt balance and the interest expense.\n\nAssume an exit, usually at a multiple applied to exit-year EBITDA, often the same as entry to be conservative. Exit equity value is exit enterprise value less remaining net debt.\n\nCalculate returns: multiple of money is exit equity divided by entry equity, and IRR is the annualised version of that over the hold period.\n\nThe three value drivers to name: debt paydown, EBITDA growth, and multiple expansion."},
{c:"lbo",l:1,t:"mc",q:"The three main value drivers in an LBO are:",o:["Revenue growth, cost cuts, and dividends","Debt paydown, EBITDA growth, and multiple expansion","Tax savings, capex reduction, and refinancing","Synergies, integration, and market share"],a:1,e:"Debt paydown converts enterprise value into equity value, EBITDA growth raises enterprise value, and multiple expansion raises it further. Sponsors control the first two far more than the third."},
{c:"lbo",l:1,t:"open",q:"Why do private equity firms use debt in an LBO?",m:"Returns amplification: with a smaller equity cheque, any given increase in enterprise value translates into a much larger percentage return on the equity invested. Leverage magnifies the outcome in both directions.\n\nTax efficiency: interest is tax-deductible, so the debt creates a real cash tax shield that increases free cash flow available to service the debt.\n\nDebt paydown as a return engine: every euro of cash used to repay debt transfers value from lenders to equity holders without needing any operational improvement.\n\nCapital efficiency: a fund with a fixed pool of committed capital can buy more companies and diversify across more deals if each deal uses less equity.\n\nDiscipline: fixed debt service forces management to focus on cash generation rather than empire building.\n\nThe cost is fragility. Fixed obligations against variable cash flows means a downturn can wipe the equity out entirely."},
{c:"lbo",l:1,t:"mc",q:"Which profile makes the best LBO candidate?",o:["High growth, high capex, no assets","Stable cash flows, low capex, strong asset base","Early stage, negative EBITDA, high optionality","Highly cyclical with volatile margins"],a:1,e:"Debt service needs predictable cash. Low capex leaves more free cash for the sweep, and hard assets support secured borrowing capacity."},
{c:"lbo",l:1,t:"open",q:"What are the exit routes in an LBO?",m:"Sale to a strategic buyer: often the highest price, because a corporate acquirer can pay for synergies a sponsor cannot.\n\nSecondary buyout: sale to another financial sponsor. Very common, though it requires the next buyer to see remaining upside.\n\nIPO: take the company public. Usually a partial exit since the sponsor retains a stake subject to lock-up, and it is market-window dependent.\n\nDividend recapitalisation: not a true exit, but raises new debt to pay the sponsor a dividend, returning capital early and de-risking the position while retaining ownership.\n\nTypical hold periods run three to seven years. The exit assumption matters enormously in the model, which is why the base case usually assumes exit at the entry multiple."},
{c:"lbo",l:1,t:"mc",q:"All else equal, IRR increases when:",o:["The exit multiple falls","The hold period lengthens with the same exit equity value","The exit multiple rises","Entry leverage decreases"],a:2,e:"A higher exit multiple raises exit enterprise value and therefore equity proceeds. A longer hold for the same total return lowers the annualised rate."},
{c:"lbo",l:2,t:"mc",q:"Entry at 5.0x EBITDA of $100m with 60% debt. Exit after 5 years at 5.0x on EBITDA of $130m, with $150m of debt repaid. Approximate IRR?",o:["12%","20%","28%","35%"],a:1,e:"Entry EV $500m, debt $300m, equity $200m. Exit EV $650m, debt $150m, equity $500m. That is 2.5x MoM over 5 years, so IRR = 2.5^(1/5) - 1, roughly 20%."},
{c:"lbo",l:2,t:"open",q:"How do you estimate IRR quickly without a calculator?",m:"Work from the multiple of money and the hold period, using a few memorised anchors.\n\nOver five years: 2.0x is roughly 15%, 2.5x is roughly 20%, 3.0x is roughly 25%.\n\nOver three years: 2.0x is roughly 26%, 1.5x is roughly 15%.\n\nOver seven years: 2.0x is roughly 10%, 3.0x is roughly 17%.\n\nThe underlying relationship is IRR = MoM^(1/years) - 1, and the rule of 72 helps: a doubling in five years is about 14% to 15%.\n\nInterpolate between anchors for anything in between, and say out loud that you are approximating. Interviewers care that you can size the answer in your head, not that you get the third decimal."},
{c:"lbo",l:2,t:"open",q:"What is the difference between senior secured debt and subordinated debt in an LBO?",m:"Senior secured (term loan A, term loan B, revolver): first claim on assets, secured by collateral, lowest interest rate, floating rate tied to a benchmark. Carries maintenance or incurrence covenants, and has mandatory amortisation plus a cash sweep. Usually held by banks and institutional loan investors.\n\nSubordinated or junior debt (high yield bonds, mezzanine, second lien): ranks behind senior in the payment waterfall and in bankruptcy. Higher interest rate to compensate, often fixed, typically bullet maturity with no amortisation, longer tenor, and looser covenants. Mezzanine may carry PIK interest and warrants.\n\nThe structural logic: senior debt is cheap but limited in quantity by asset coverage and leverage tests, so junior tranches fill the gap between what senior lenders will provide and the total leverage the sponsor wants."},
{c:"lbo",l:2,t:"mc",q:"A revolving credit facility in an LBO is primarily there to:",o:["Fund the purchase price","Cover seasonal working capital swings and short-term liquidity","Pay sponsor dividends","Replace the equity cheque"],a:1,e:"The revolver is drawn and repaid as working capital needs fluctuate. It is usually undrawn or lightly drawn at close and carries a commitment fee on the unused portion."},
{c:"lbo",l:2,t:"open",q:"What is a dividend recapitalisation and why do sponsors do them?",m:"The portfolio company raises new debt and uses the proceeds to pay a dividend to the sponsor, rather than investing in the business.\n\nWhy sponsors do it: it returns capital early, which de-risks the position and improves IRR because cash comes back sooner. It lets the sponsor lock in gains without selling, which is useful when the exit market is unattractive but credit markets are open. It also resets leverage back up, restoring the leverage effect after years of paydown.\n\nThe downsides: it re-levers the company and increases default risk, it consumes debt capacity that could have funded acquisitions or growth, and it is reputationally sensitive since the sponsor takes cash out while the company carries the risk.\n\nThe volume of dividend recaps is usually a decent barometer of how loose credit markets are."},
{c:"lbo",l:2,t:"mc",q:"Total leverage in a typical mid-market LBO most commonly falls in which range?",o:["1x to 2x EBITDA","4x to 6x EBITDA","8x to 10x EBITDA","Above 12x EBITDA"],a:1,e:"Four to six times is the conventional band, though it moves with credit conditions, sector, and cash flow stability. Software deals have gone materially higher."},
