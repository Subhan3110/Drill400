{c:"lbo",l:3,t:"open",q:"How does an LBO model differ from a DCF in what it actually solves for?",m:"A DCF solves for intrinsic value: given a set of cash flows and a discount rate, what is the business worth today, independent of who owns it or how it is financed.\n\nAn LBO solves for a return: given a price, a capital structure and an exit assumption, what IRR does the equity earn. Or inverted, given a required IRR, what is the maximum price payable.\n\nThe practical differences follow from that. A DCF uses unlevered free cash flow and WACC, and capital structure affects only the discount rate. An LBO uses levered cash flow after interest, tracks the debt schedule in detail, and capital structure is central rather than incidental.\n\nA DCF captures value over the full life of the asset through a terminal value. An LBO captures value only over the hold period and assumes a sale at the end.\n\nA DCF tells you what something is worth. An LBO tells you what a particular type of buyer can afford to pay."},

/* --------------------- RESTRUCTURING / DISTRESSED --------------------- */
{c:"restr",l:1,t:"open",q:"What does a restructuring banker actually do?",m:"Advises companies or creditors when the capital structure has become unsustainable relative to the business.\n\nOn the company side (debtor advisory): assess liquidity, build a cash flow forecast, evaluate whether the balance sheet can be fixed out of court, design a new capital structure, negotiate with creditor groups, and if necessary prepare for and run a court process. Often also runs a distressed sale of assets or the whole business.\n\nOn the creditor side: represent a lender group or bondholder committee, value the business, determine where value breaks, and negotiate for the best recovery.\n\nThe skills differ from M&A: much more focus on liquidity and covenant mechanics, valuation of the business as it actually is rather than as management hopes, and negotiation among parties with genuinely opposed interests.\n\nIt is also counter-cyclical, which is why restructuring groups stay busy when M&A volumes collapse."},
{c:"restr",l:1,t:"mc",q:"The difference between Chapter 11 and Chapter 7 is:",o:["Chapter 11 is liquidation, Chapter 7 is reorganisation","Chapter 11 is reorganisation, Chapter 7 is liquidation","Chapter 11 applies to individuals only","They are identical in effect"],a:1,e:"Chapter 11 lets the company continue operating while it restructures. Chapter 7 shuts it down and a trustee sells the assets to pay claims."},
{c:"restr",l:1,t:"open",q:"Who are the two sides in a restructuring mandate, and how do their objectives differ?",m:"The debtor, meaning the company and its existing equity holders and management, and the creditors, meaning lenders, bondholders and sometimes trade claims.\n\nThe debtor wants to keep the business operating, preserve some value for existing equity, retain management control, and reduce the debt burden as much as possible. It wants the business valued high enough that equity is not wiped out.\n\nCreditors want to maximise recovery on their claims. Senior creditors often want a sale or a quick process. Junior creditors typically argue for a higher enterprise value, because value only reaches them if the business is worth more than the senior claims.\n\nValuation becomes adversarial rather than technical: where value breaks determines who owns the company afterwards, so every party argues for the number that serves its position."},
{c:"restr",l:1,t:"mc",q:"The absolute priority rule states that:",o:["All creditors are paid equally","Senior claims must be satisfied in full before junior claims receive anything","Equity holders are paid first","Trade creditors rank above secured lenders"],a:1,e:"The waterfall runs from secured debt through unsecured to equity. In practice, deviations happen when senior classes consent to give junior parties something to buy cooperation and speed."},
{c:"restr",l:2,t:"open",q:"Why would a company file for bankruptcy rather than restructure out of court?",m:"Holdout problem: an out-of-court exchange generally needs very high creditor participation, often 90% or more. A small group refusing can block the deal, hoping to be paid in full while everyone else takes a haircut. Chapter 11 binds dissenters once the required majorities approve, and allows cramdown of a dissenting class.\n\nAutomatic stay: filing immediately halts collection actions, foreclosures and litigation, giving breathing room a distressed company may not otherwise have.\n\nContract rejection: the ability to reject burdensome leases and executory contracts is often the core value driver, especially in retail and airlines.\n\nDIP financing: super-priority status makes new money available when no lender would otherwise fund the company.\n\nClean sale: a section 363 sale delivers assets free and clear of liens, which buyers pay more for.\n\nThe costs are why it is not the default: professional fees, loss of control, public disclosure, customer and supplier flight, and time."},
{c:"restr",l:2,t:"mc",q:"Debtor-in-possession financing ranks:",o:["Behind existing secured debt","Pari passu with unsecured creditors","With super-priority, generally ahead of existing claims","As equity"],a:2,e:"Super-priority is what makes DIP lending possible. Without it, no lender would extend credit to a company already in default."},
{c:"restr",l:2,t:"open",q:"What is the fulcrum security?",m:"The most senior class of claims that does not get repaid in full, and therefore the class that converts into the equity of the reorganised company.\n\nClasses above it are paid in full in cash or reinstated debt. Classes below it get little or nothing. The fulcrum class sits exactly where enterprise value runs out, so it absorbs the remaining value in equity form.\n\nWhy it matters: identifying the fulcrum tells you who actually controls the outcome. That class negotiates the plan, ends up owning the business, and has the strongest economic interest in the valuation debate.\n\nIt is also the core of distressed investing. Funds buy into the anticipated fulcrum security at a discount specifically to convert into post-reorganisation equity, which is loan-to-own."},
{c:"restr",l:2,t:"open",q:"How does valuation differ in a restructuring context?",m:"The purpose changes. You are not advising on a price to transact at, you are determining where value breaks in the capital structure, which decides who owns the company.\n\nMethodology shifts: DCF matters but management projections are treated with heavy scepticism because they were produced by a party with an interest in a high number. Comps are adjusted because the company is not a healthy peer. Liquidation analysis becomes central, since creditors have a legal right to receive at least what they would get in a Chapter 7 liquidation, which is the best interests test.\n\nYou also value the business as reorganised, after rejecting bad contracts and right-sizing the cost base, rather than as currently operating.\n\nAnd it is adversarial. Each side hires its own advisers, and competing valuations with very different assumptions are presented to the court. The judge may ultimately decide."},
{c:"restr",l:3,t:"open",q:"How do you determine the fulcrum security in practice?",m:"Estimate enterprise value of the reorganised business, usually with a DCF and comps, presented as a range rather than a point.\n\nLay out the capital structure in strict priority order: super-priority DIP, secured first lien, second lien, senior unsecured, subordinated, preferred, common equity, with the face amount of each.\n\nWalk the enterprise value down the waterfall. Allocate value to each class in order until it runs out. The class where value is exhausted part way through is the fulcrum.\n\nExample: enterprise value of 600, first lien of 400 and second lien of 300. The first lien is covered in full. The second lien receives 200 against a 300 claim, a 67% recovery, and takes the equity. Everything below is out of the money.\n\nBecause enterprise value is a range, the fulcrum can shift between classes across the range, which is precisely what the parties fight over."},
{c:"restr",l:3,t:"open",q:"What is a section 363 sale and why do buyers like it?",m:"A court-approved sale of assets during a Chapter 11 case, under section 363 of the US bankruptcy code, conducted outside a full plan of reorganisation.\n\nBuyers like it because the assets transfer free and clear of existing liens, claims and most successor liabilities. That certainty is worth a meaningful premium relative to buying a distressed company outside of court, where unknown liabilities follow the asset.\n\nThe process typically involves a stalking horse bidder that sets a floor price and negotiates break-up fee protection, followed by a court-supervised auction where competing bids must exceed the stalking horse by a set increment.\n\nIt is also fast, often a few months, compared with a full plan process, which matters when the business is losing value every week.\n\nThe trade-off for creditors: speed can mean a thinner price, and junior creditors often object that a quick sale locks in a valuation that leaves them out of the money."},
{c:"restr",l:3,t:"open",q:"How does a debt-for-equity swap flow through the financial statements?",m:"Balance sheet: debt is reduced by the face amount exchanged, and shareholders' equity increases. Existing common equity is massively diluted or cancelled entirely.\n\nIncome statement: if the debt is exchanged for equity worth less than the carrying amount, the company records a gain on extinguishment of debt, which is non-cash. Going forward, interest expense falls sharply, which raises net income.\n\nCash flow statement: the swap itself is a non-cash financing transaction and is disclosed rather than shown as a cash movement. The gain on extinguishment is backed out of operating cash flow as a non-cash item. The real ongoing cash effect is lower interest payments.\n\nTax angle worth mentioning: cancellation of debt income may be taxable, though it is often sheltered by the insolvency exception or by NOLs, and the change of control can restrict those NOLs afterwards."},
{c:"restr",l:3,t:"open",q:"Why would creditors prefer a reorganisation over liquidating the company?",m:"Because going-concern value usually exceeds liquidation value. A functioning business with customers, contracts, trained staff and brand equity is worth more than the sum of its assets sold piecemeal in a forced sale.\n\nLiquidation values are heavily discounted: inventory sells at a fraction of cost, specialised equipment has few buyers, and receivables collect poorly once the company is gone.\n\nIn a reorganisation, creditors take equity in the new entity and capture the upside if the business recovers, rather than crystallising a low cash recovery today.\n\nWhen creditors prefer liquidation instead: the business is structurally unviable with no path to positive cash flow, the assets are genuinely more valuable elsewhere, or senior creditors are fully covered by collateral and simply want cash quickly without bearing reorganisation risk.\n\nThe best interests test formalises this by requiring that no creditor receive less under the plan than it would in a Chapter 7 liquidation."}
];

{c:"brain",l:1,t:"mc",q:"You have 8 balls, one of which is slightly heavier. Using a balance scale, what is the minimum number of weighings to guarantee finding it?",o:["1","2","3","4"],a:1,e:"Weigh 3 against 3. If they balance, the heavy ball is in the remaining 2 and one more weighing finds it. If not, take the heavier 3 and weigh 1 against 1."},
{c:"brain",l:1,t:"mc",q:"What is the angle between the hour and minute hands at 3:15?",o:["0 degrees","7.5 degrees","15 degrees","22.5 degrees"],a:1,e:"The minute hand is at 90 degrees. The hour hand has moved a quarter past 3, so 3.25 x 30 = 97.5 degrees. The difference is 7.5 degrees."},
{c:"brain",l:1,t:"mc",q:"A fair coin lands heads 10 times in a row. What is the probability the next flip is heads?",o:["Less than 50%","Exactly 50%","More than 50%","Cannot be determined"],a:1,e:"Flips are independent, so the prior run tells you nothing. Assuming a genuinely fair coin, it stays at 50%. Interviewers use this to check you do not fall for the gambler's fallacy."},
{c:"brain",l:2,t:"open",q:"How many golf balls fit inside a school bus?",m:"There is no right answer. The interviewer is testing whether you can build a structured estimate out loud.\n\nEstimate the bus volume: roughly 12m long, 2.5m wide, 2m high gives about 60 cubic metres, or 60,000,000 cubic centimetres. Subtract space for seats, engine and wheel arches, call it 25%, leaving around 45,000,000.\n\nEstimate a golf ball: about 4.3cm diameter, so its bounding cube is roughly 80 cubic centimetres. Sphere packing is not perfect, so use the cube volume as the effective space per ball, which builds the inefficiency in.\n\nDivide: 45,000,000 / 80 is roughly 550,000 balls.\n\nState your assumptions as you go, round aggressively, and sanity-check the order of magnitude at the end. Hundreds of thousands is the right answer band."},
{c:"brain",l:2,t:"mc",q:"You have two ropes, each burning for exactly 60 minutes but at an uneven rate. How do you measure 45 minutes?",o:["Light one rope at one end, then the second","Light rope one at both ends and rope two at one end; when rope one finishes, light rope two's other end","Cut both ropes in half","It cannot be done"],a:1,e:"Rope one burning from both ends finishes in 30 minutes. Rope two has 30 minutes left at that point, and lighting its second end halves that to 15. Total 45."},
{c:"brain",l:2,t:"open",q:"How many petrol stations are there in Norway?",m:"Build it top down from population.\n\nNorway has roughly 5.5 million people. Around 3 million private cars, so roughly one car per 1.8 people.\n\nAssume a typical station serves around 1,500 to 2,500 cars in its catchment. Take 2,000 as the midpoint. That gives roughly 1,500 stations.\n\nSanity-check bottom up: Oslo has around 700,000 people and you might guess 60 to 80 stations, which scales to roughly 500 to 650 nationally on population alone. Then adjust upward heavily for rural Norway, where long distances and low density mean far more stations per capita.\n\nLanding in the range of 1,300 to 1,800 is a good answer. The actual figure is in that vicinity.\n\nWhat matters is naming your assumptions, cross-checking with a second method, and giving a range rather than a false-precision number."},
{c:"brain",l:2,t:"open",q:"Why are manhole covers round?",m:"The classic answer: a circle is the only shape that cannot fall through its own opening. A square cover can be turned diagonally and dropped through, since the diagonal is longer than the side. Constant width prevents that.\n\nOther legitimate reasons worth adding: round covers can be rolled rather than carried, they do not need to be aligned in any particular orientation when replaced, the circular shape distributes compressive load evenly with no weak corners, and pipes and shafts are themselves round.\n\nThis question is really testing whether you produce one answer and stop, or whether you generate several angles and rank them. Give the safety answer first, then layer the practical ones."},
{c:"brain",l:3,t:"open",q:"Estimate the annual revenue of a single Starbucks store.",m:"Build from throughput.\n\nAssume roughly 12 operating hours a day with an average of 40 to 60 customers per hour, weighting peak morning hours more heavily. Call it 500 customers a day.\n\nAverage ticket of around 60 to 70 NOK, or roughly $6 to $7, since many customers buy food alongside a drink.\n\nDaily revenue: 500 x $6.50 is roughly $3,250.\n\nAnnual: $3,250 x 360 days is roughly $1.2 million.\n\nCross-check: Starbucks has historically reported average US store revenue somewhere around $1.5 million, so an estimate in the $1 million to $1.5 million range is well calibrated.\n\nThen mention variance: airport and city-centre locations run far higher, suburban drive-throughs differ in mix, and the answer would change materially by country."},
{c:"brain",l:3,t:"open",q:"How would you estimate the total market size for coffee consumed outside the home in Norway?",m:"Top-down from population. Roughly 5.5 million people, of whom perhaps 3.5 million are regular coffee drinkers.\n\nAssume the average regular drinker buys coffee out around 2 times a week. That is roughly 100 purchases a year, so 350 million transactions.\n\nAverage price of around 45 NOK per cup gives roughly 15.75 billion NOK, or about 1.5 billion dollars.\n\nCross-check bottom up: count the approximate number of cafes, bakeries and convenience outlets selling coffee, perhaps 5,000 to 7,000 outlets, at average annual coffee revenue of 2 to 3 million NOK each, which lands in a similar range.\n\nThen refine. Norway has unusually high per capita coffee consumption but a strong home-brewing culture, which pulls the out-of-home share down relative to the total. Flag that as the main sensitivity, and note whether you are including the coffee element of restaurant and hotel sales or just dedicated coffee purchases."},

{c:"acct",l:2,t:"mc",q:"A company bills a customer $10 for services already delivered, on credit. Tax rate 40%. What is the net change in cash?",o:["Up $10","Up $6","Down $4","No change"],a:2,e:"Net income rises $6, but receivables rise $10 which is a $10 use of cash. Net effect is minus $4, because the tax is paid in cash before the customer pays."},
{c:"acct",l:2,t:"mc",q:"A company records $100 of revenue on credit with $60 of COGS. Tax rate 40%. What is the change in net income?",o:["$100","$60","$40","$24"],a:3,e:"Gross profit is $40, taxed at 40% leaves $24."},
{c:"acct",l:2,t:"mc",q:"Same transaction: $100 revenue on credit, $60 COGS from existing inventory, 40% tax. What is the change in cash?",o:["Up $40","Up $24","Down $16","Down $100"],a:2,e:"Net income of $24, less the $100 increase in receivables, plus the $60 inventory reduction. That is minus $16, since the tax is paid before the cash arrives."},
{c:"acct",l:2,t:"mc",q:"Capitalising a cost instead of expensing it does what to net income in year one?",o:["Increases it","Decreases it","No effect","Depends on the tax rate"],a:0,e:"Capitalising moves the cost to the balance sheet and spreads it over time as depreciation or amortisation, so year-one expense is lower. Total cash is unaffected."},
{c:"acct",l:2,t:"mc",q:"Which inventory method is prohibited under IFRS?",o:["FIFO","LIFO","Weighted average","Specific identification"],a:1,e:"IFRS does not permit LIFO. US GAAP does, which is one reason cross-border comps need adjusting."},
{c:"acct",l:2,t:"mc",q:"Assuming the charge is not tax-deductible, what is the cash impact of a $50 goodwill impairment?",o:["Down $50","Down $30","Up $20","Zero"],a:3,e:"Net income falls $50 but the full charge is added back as non-cash, and with no tax deduction there is no offsetting cash benefit either."},
{c:"acct",l:2,t:"open",q:"What is working capital, and what does a negative working capital business look like?",m:"Working capital is current assets less current liabilities. For analysis, operating working capital strips out cash and short-term debt, leaving receivables and inventory less payables and accrued expenses.\n\nIt measures how much cash is tied up in the operating cycle. Growth in working capital consumes cash, which is why fast-growing companies can be profitable and cash-hungry at once.\n\nNegative working capital means the company collects from customers before it pays suppliers. Supermarkets, restaurants and subscription software are the classic cases: customers pay immediately, suppliers are paid on 30 to 60 day terms. Growth then releases cash rather than absorbing it, which is a genuinely attractive structural feature.\n\nThe risk is that it reverses violently if growth stalls or suppliers tighten terms."},
{c:"acct",l:2,t:"open",q:"What are the three ways a company can increase its cash balance?",m:"Operations: generate more cash from the business itself, by improving margins, growing profitably, or releasing working capital through faster collections, leaner inventory or extended payables.\n\nInvesting: sell assets, divest a division, cut capex, or liquidate investments.\n\nFinancing: raise debt, issue equity, or stop returning capital by cutting dividends and suspending buybacks.\n\nThe useful follow-up is quality. Cash from operations is sustainable. Cash from asset sales is one-off. Cash from new debt is borrowed and has to be serviced. A company whose cash balance is rising only because it keeps issuing debt is not the same as one generating it internally, even though both show a higher cash line."},
{c:"acct",l:3,t:"open",q:"A company issues $100 of equity and uses it to buy a building. Walk me through the statements.",m:"At issuance: no income statement impact. Cash flow statement shows $100 inflow from financing. Balance sheet shows cash up $100 and shareholders' equity up $100.\n\nAt purchase: still no income statement impact. Cash flow statement shows $100 outflow under investing. Balance sheet shows cash down $100 and PP&E up $100.\n\nNet position: assets are up $100 in the form of a building rather than cash, equity is up $100, net change in cash is zero.\n\nGoing forward, the building depreciates, which reduces net income and creates the usual depreciation add-back. If the building is land, it is not depreciated at all, which is a nuance worth flagging."},
{c:"acct",l:3,t:"open",q:"How do you handle one-time charges when analysing a company's earnings?",m:"Strip out genuinely non-recurring items to get a clean picture of run-rate profitability: restructuring charges, legal settlements, asset impairments, gains or losses on disposals, and acquisition costs.\n\nBut apply scepticism. A company that reports a restructuring charge every single year is not reporting one-time items, it is reporting a recurring cost of doing business, and adjusting it out flatters the numbers.\n\nThe practical checks: look back several years to see whether the same adjustment keeps appearing, check whether the company adjusts out cash costs as well as non-cash ones, and compare adjusted EBITDA against actual operating cash flow.\n\nCredit agreements in leveraged deals often permit very generous addbacks, which is why adjusted EBITDA in loan documents can differ substantially from anything economically meaningful."},
{c:"acct",l:3,t:"open",q:"How does capitalising software development costs affect the three statements?",m:"Income statement: in the year of spend, the cost does not hit operating expenses, so operating income and net income are higher than under expensing. In later years the capitalised asset amortises, so earnings are lower than they would otherwise be.\n\nCash flow statement: under expensing the cost sits inside operating cash flow. Under capitalising it moves to investing as capex. Operating cash flow therefore looks stronger, even though total cash movement is identical.\n\nBalance sheet: an intangible asset is created and amortised down over its useful life.\n\nThis is why it distorts comparisons. Two software companies with identical economics can show very different EBITDA and free cash flow depending on how aggressively they capitalise. The defence is to check capitalised development spend as a share of total R&D and compare against peers."},
{c:"acct",l:3,t:"open",q:"What are the most common earnings-quality red flags?",m:"A widening gap between net income and operating cash flow over several periods, which suggests earnings are not converting to cash.\n\nReceivables or inventory growing materially faster than revenue, which points to channel stuffing, collection problems or obsolete stock.\n\nRepeated one-time charges, or a large and growing gap between reported and adjusted earnings.\n\nAggressive capitalisation of costs peers expense, or lengthening depreciation lives which quietly boosts earnings.\n\nRevenue recognition changes, unusual sales terms near period end, or a rising share of revenue from estimates on long-term contracts.\n\nChanges in auditor, CFO departures, late filings, or material weaknesses disclosed in internal controls.\n\nAny single item can have an innocent explanation. Several at once in the same direction is the signal."},

{c:"ev",l:1,t:"mc",q:"Market cap is $500m, debt $200m, cash $50m. What is enterprise value?",o:["$650m","$750m","$350m","$550m"],a:0,e:"500 + 200 - 50 = 650."},
{c:"ev",l:1,t:"mc",q:"Net debt is defined as:",o:["Total debt plus cash","Total debt minus cash","Long-term debt only","Debt minus equity"],a:1,e:"Net debt is total interest-bearing debt less cash and cash equivalents. It is the bridge between enterprise value and equity value."},
{c:"ev",l:1,t:"mc",q:"Preferred stock is treated in enterprise value as:",o:["Subtracted like cash","Added like debt","Ignored","Part of common equity"],a:1,e:"Preferred sits ahead of common equity and behaves like a debt-like claim, so it is added to get from equity value to enterprise value."},
{c:"ev",l:1,t:"mc",q:"Out-of-the-money options under the treasury stock method are:",o:["Included at full count","Included at half count","Excluded","Converted to debt"],a:2,e:"They would not be exercised at the current price, so they create no dilution and are left out."},
{c:"ev",l:2,t:"mc",q:"A company buys back $50 of its own stock using cash. What happens to enterprise value?",o:["Falls $50","Rises $50","Unchanged","Falls $100"],a:2,e:"Equity value falls $50 and cash falls $50, so the two moves cancel in EV = equity + debt - cash. The operating business is unchanged."},
{c:"ev",l:2,t:"mc",q:"100m shares at $20, debt $300m, cash $100m, EBITDA $250m. What is EV/EBITDA?",o:["8.0x","8.8x","8.4x","9.2x"],a:1,e:"Equity value 2,000, plus 300 debt, less 100 cash gives EV of 2,200. Divided by 250 is 8.8x."},
{c:"ev",l:2,t:"mc",q:"Which of these is NOT capital-structure neutral?",o:["EV/EBITDA","EV/EBIT","EV/sales","EPS"],a:3,e:"EPS is after interest and reflects the share count, so leverage and buybacks move it directly."},
{c:"ev",l:2,t:"mc",q:"An unfunded pension obligation should generally be:",o:["Ignored in enterprise value","Treated as a debt-like item and added","Netted against cash","Added to equity value"],a:1,e:"It is a real claim on future company cash flows that ranks ahead of shareholders, so it is added alongside debt, usually on an after-tax basis."},
{c:"ev",l:2,t:"open",q:"Why would you use EV/EBIT rather than EV/EBITDA?",m:"EBIT is after depreciation and amortisation, so it captures the cost of maintaining the asset base. EBITDA treats capital intensity as if it were free.\n\nThat matters when comparing companies with very different asset bases. A capital-intensive manufacturer and an asset-light software business can show similar EBITDA margins while having completely different economics, and EV/EBIT narrows that gap.\n\nEV/EBIT is also the better choice when depreciation is a reasonable proxy for maintenance capex, which is roughly true for mature businesses in steady state.\n\nThe drawback: depreciation policy varies between companies and jurisdictions, and acquisitive companies carry large amortisation of acquired intangibles that is not an economic cost in the same way. That is why EBITDA remains the default in leveraged finance."},
{c:"ev",l:2,t:"open",q:"Why can you not use EV/net income as a multiple?",m:"Because the numerator and denominator describe different claims. Enterprise value covers the whole capital structure, debt and equity together. Net income is what remains after interest has been paid to lenders, so it belongs to equity holders only.\n\nPairing them means comparing a whole-company value against an equity-only earnings figure, and the ratio moves with leverage for reasons that have nothing to do with the business.\n\nThe consistency rule: anything before interest (EBITDA, EBIT, unlevered free cash flow, revenue) pairs with enterprise value. Anything after interest (net income, EPS, levered free cash flow, book equity) pairs with equity value."},
{c:"ev",l:3,t:"open",q:"A company announces a large acquisition funded entirely with new debt. What happens to its enterprise value?",m:"Mechanically, enterprise value rises by roughly the amount paid. New debt is added and the cash raised leaves immediately to buy the target, so nothing nets out. The combined entity now contains two operating businesses.\n\nEquity value moves separately, and that is the more interesting question. If the market believes the price paid is below the value of what was acquired plus synergies, the acquirer's share price rises. If it thinks the acquirer overpaid, equity value falls even though enterprise value went up.\n\nThat divergence is the single clearest illustration that enterprise value measures the size of the asset base while equity value measures the value created for shareholders."},
{c:"ev",l:3,t:"open",q:"How do you handle a company that owns a large minority stake in a listed subsidiary?",m:"A stake below 50% is not consolidated. It appears either at fair value or under the equity method, and the parent's EBITDA contains none of the subsidiary's operations. So the stake is a non-operating asset.\n\nThe right treatment is to subtract the market value of the stake from enterprise value, alongside cash, before calculating multiples. Otherwise you would be dividing an enterprise value that includes the stake by an EBITDA that excludes it, and the company would look artificially expensive.\n\nApply a tax discount if disposal would trigger a material capital gain, and consider a liquidity discount if the stake is large relative to the subsidiary's float.\n\nThis is also the core of a sum-of-the-parts argument, where the case is that the market is not fully crediting the stake."},
{c:"ev",l:3,t:"open",q:"Which items should be excluded from EBITDA when calculating multiples?",m:"Non-operating income and expense: interest income, gains or losses on investments, and foreign exchange translation effects unrelated to trading.\n\nNon-recurring items: restructuring charges, litigation settlements, impairments, gains or losses on asset sales, and transaction costs.\n\nIncome from equity-method investments, since the corresponding stake should be valued separately and excluded from enterprise value.\n\nThe judgment calls: stock-based compensation is non-cash and usually left in EBITDA by convention, but many investors deduct it because it is a genuine cost to shareholders. Capitalised development costs sit outside EBITDA entirely, which flatters companies that capitalise aggressively.\n\nThe discipline that matters most is consistency. Whatever you exclude for the target must be excluded for every comparable, or the multiple set is meaningless."},
{c:"ev",l:3,t:"open",q:"Why is net debt sometimes a misleading measure?",m:"It assumes all cash is available to repay debt, which is often untrue. Cash trapped in foreign subsidiaries carries a repatriation tax cost. Cash required as an operating float cannot be swept out. Restricted or pledged cash is not free at all.\n\nIt also ignores debt-like obligations that sit outside reported debt: unfunded pensions, lease liabilities under older reporting, securitised receivables, factoring arrangements, and large contingent liabilities.\n\nAnd it says nothing about timing. Two companies with identical net debt look the same, even when one faces a maturity wall in eighteen months and the other has nothing due for seven years.\n\nSo net debt is a starting point. The real analysis is a maturity schedule, a liquidity profile, and a check for obligations that behave like debt without being labelled as such."}

{c:"val",l:1,t:"mc",q:"Which of these is an equity value multiple?",o:["EV/EBITDA","EV/sales","P/E","EV/EBIT"],a:2,e:"Price is equity value per share and earnings is after interest, so both sides of P/E are equity-level."},
{c:"val",l:1,t:"mc",q:"For a company with growing earnings, the forward P/E compared to the trailing P/E is usually:",o:["Higher","Lower","Identical","Negative"],a:1,e:"Forward earnings are larger, so the same price divided by a bigger denominator gives a lower multiple."},
{c:"val",l:1,t:"mc",q:"EV/sales is most useful when:",o:["The company has stable margins","The company is loss-making or pre-profit","Comparing across industries","Valuing a bank"],a:1,e:"When EBITDA and earnings are negative, revenue is the first positive line you can anchor to. It ignores profitability entirely, which is its weakness."},

{c:"val",l:2,t:"mc",q:"Which multiple is standard for a REIT?",o:["EV/EBITDA","Price to funds from operations","EV/sales","Price to book"],a:1,e:"FFO adds depreciation back to net income because property generally does not depreciate economically the way the accounts assume."},
{c:"val",l:2,t:"mc",q:"Airlines are often valued on EV/EBITDAR rather than EV/EBITDA because:",o:["Rent is added back to normalise for owned versus leased aircraft","Airlines have no depreciation","Rent is tax-deductible","EBITDA is always negative"],a:0,e:"One carrier may own its fleet while another leases. Adding rent back puts both on the same footing, with the capitalised lease obligation included in enterprise value."},
{c:"val",l:2,t:"mc",q:"Which of these would NOT explain why a company trades at a discount to its peer group?",o:["Higher customer concentration","Weaker governance","Faster forecast growth","Thinner trading liquidity"],a:2,e:"Faster growth justifies a premium, not a discount. The others are all legitimate reasons for a lower multiple."},
{c:"val",l:2,t:"open",q:"Why do multiples tend to compress as a company matures?",m:"A multiple is shorthand for the present value of future cash flows relative to today's earnings. Most of a high multiple is paid for growth that has not happened yet.\n\nAs a company matures, forecast growth falls toward the rate of the wider economy, so less of the value sits in the future and the multiple converges on something closer to the inverse of the cost of capital adjusted for modest growth.\n\nSecond effect: reinvestment opportunity shrinks. A mature business returns cash rather than compounding it internally, which lowers the value of each retained euro.\n\nThird: competitive erosion. Early high returns on capital attract entrants, margins normalise, and the market prices that in ahead of time.\n\nThis is why comparing a multiple across companies at different lifecycle stages tells you very little on its own."},
{c:"val",l:2,t:"open",q:"What makes a precedent transaction a bad comparable?",m:"Timing. A deal struck in a very different credit or macro environment reflects that environment's financing costs and risk appetite, not the intrinsic value of the asset. Deals from before a sector disruption are often useless.\n\nDeal dynamics. A competitive auction with several strategic bidders produces a different multiple from a bilateral distressed sale, even for identical assets.\n\nBuyer type. A strategic paying for synergies sets a different benchmark from a financial sponsor.\n\nStructure. Earnouts, contingent consideration, minority stakes and non-cash consideration all distort the headline multiple, and the terms are frequently undisclosed.\n\nBusiness fit. Different scale, geography, margin profile or growth rate, even within the same sector.\n\nThe honest handling is to show the set, flag which deals you weight and why, and be explicit about what the headline multiple does and does not include."},
{c:"val",l:2,t:"open",q:"How would you value a company that is about to be acquired?",m:"Recognise that the current share price is no longer a clean read on standalone value. Once a deal is rumoured or announced, the price reflects the probability-weighted outcome of the offer rather than fundamentals.\n\nSo you work from the undisturbed price, meaning the level before the first leak or announcement, and treat the offer as a premium to that.\n\nThe analysis then runs in two directions. Standalone value using the normal three methodologies, to judge whether the offer is fair. And deal value, comparing the premium and the implied multiple against precedent transactions in the sector.\n\nFor a fairness opinion you would also run a discounted cash flow on management projections, test what synergies the buyer needs to justify the price, and consider whether a higher bidder could plausibly emerge."},
{c:"val",l:3,t:"open",q:"Which methodology would you trust most for a regulated utility, and why?",m:"A DCF, with a regulated asset base approach as the cross-check.\n\nUtilities are the rare case where the DCF's biggest weakness disappears. Cash flows are highly predictable because tariffs are set by a regulator over multi-year price control periods, volumes are inelastic, and the allowed return on the regulatory asset base is published. You are forecasting a formula rather than guessing at competitive dynamics.\n\nThe standard sector approach is to value the regulated asset base and assess the premium the market pays to it, which reflects expectations about outperformance against the regulatory settlement.\n\nComps still matter as a sanity check, but they are dominated by interest rates: utilities trade as bond proxies, so the multiple moves with yields rather than with operating performance. Dividend discount models also work well given high, stable payout ratios."},
{c:"val",l:3,t:"open",q:"How do you adjust comparable companies for different accounting standards?",m:"Identify the material differences first. The usual ones: LIFO versus FIFO inventory, which is permitted under US GAAP but not IFRS; capitalisation of development costs, which IFRS requires when criteria are met and US GAAP largely does not; revaluation of fixed assets, allowed under IFRS only; and differing treatment of pensions and provisions.\n\nThen restate to a common basis. LIFO reserves are disclosed and can be used to convert to FIFO. Capitalised development spend can be added back to operating expense to put everyone on a comparable EBITDA.\n\nAlso normalise for lease accounting if the set spans the transition to IFRS 16 and ASC 842, because EBITDA and leverage are not comparable across it.\n\nThe general rule: adjust the metric rather than adjusting the multiple, and disclose every adjustment in the output so the client can see what you did."},
{c:"val",l:3,t:"open",q:"How do you present a valuation when the methodologies disagree sharply?",m:"Do not average them. An average hides the disagreement, which is usually the most informative part of the analysis.\n\nShow the ranges side by side on a football field, then explain the driver of the spread. A DCF far above the comps means either your forecast is more optimistic than the market's or the market is applying a discount you have not modelled. Precedents far above current comps usually means the deal environment when those transactions were struck was materially better.\n\nWeight explicitly and say why. For a stable business with good comps, lean on trading multiples. For a business in transition, lean on the DCF because the current earnings base is unrepresentative.\n\nThen give a recommended range that is narrower than the union of all methods, and state what would have to be true for the value to sit at each end. A client can act on that. They cannot act on a single number with no reasoning attached."},
{c:"val",l:3,t:"open",q:"How would you value a company in an industry with no public comparables?",m:"Widen the lens rather than abandoning comps. Look for companies with similar economic characteristics rather than the same industry label: comparable margin structure, capital intensity, growth profile, customer concentration and contract length. A niche industrial with recurring service revenue may be better compared to other recurring-revenue businesses than to its own sector.\n\nUse international comps where the business model translates, adjusting for country risk and accounting differences.\n\nLean harder on the DCF, since it does not need a peer set, and stress-test it more thoroughly because there is no market anchor.\n\nLook for private transaction data, and for private equity ownership in the space, where deal multiples sometimes surface through debt documentation or press.\n\nAnd consider a sum-of-the-parts if segments map to different comparable universes. Finally, be explicit with the client that the range is wider than usual and say why."},
{c:"val",l:3,t:"open",q:"On a practical level, what is the difference between building a trading comp and a transaction comp?",m:"Trading comps: data is current, complete and public. You pull market cap from live prices, net debt and financials from the latest filings, and forward estimates from consensus. The work is in calendarising fiscal years, adjusting for one-offs, building a clean diluted share count and normalising EBITDA. Everything is verifiable.\n\nTransaction comps: data is historical and frequently incomplete. Private targets do not publish financials, so the target EBITDA underlying a reported multiple often comes from press reports or the acquirer's own disclosure. Consideration structures with earnouts and assumed liabilities distort the headline price.\n\nThe practical consequences: trading comps can be updated daily and defended line by line, while transaction comps require judgment about which deals to include and disclosure of where the figures came from. Transaction sets are also usually smaller, so one outlier deal can move the median materially."},

/* ------------------------------ DCF (more) ------------------------------ */
{c:"dcf",l:1,t:"mc",q:"The risk-free rate in a DCF is normally taken from:",o:["The central bank policy rate","A long-dated government bond yield in the relevant currency","The company's cost of debt","The interbank rate"],a:1,e:"The maturity should roughly match the horizon of the cash flows, so a ten- or twenty-year government bond is conventional."},
{c:"dcf",l:1,t:"mc",q:"The equity risk premium is most commonly assumed to be in which range?",o:["0% to 2%","4% to 6%","8% to 10%","12% to 15%"],a:1,e:"Four to six percent is the standard practitioner range, drawn from long-run historical excess returns and implied market estimates."},
{c:"dcf",l:1,t:"mc",q:"An increase in net working capital is:",o:["A source of cash that raises free cash flow","A use of cash that reduces free cash flow","Neutral to free cash flow","Added back like depreciation"],a:1,e:"Growing receivables and inventory tie cash up in the operating cycle, so the increase is subtracted when calculating free cash flow."},
{c:"dcf",l:1,t:"mc",q:"A DCF gives an enterprise value of $1,000m. Net debt is $200m and there are 100m diluted shares. What is the implied price per share?",o:["$10.00","$8.00","$12.00","$6.00"],a:1,e:"Equity value is 1,000 less 200 = 800, divided by 100m shares gives $8.00."},
{c:"dcf",l:2,t:"mc",q:"Cost of equity is 10% on 70% of the capital structure, pre-tax cost of debt is 6% on 30%, tax rate 25%. What is WACC?",o:["7.60%","8.35%","8.80%","9.20%"],a:1,e:"0.70 x 10% = 7.00%. 0.30 x 6% x (1 - 0.25) = 1.35%. Total 8.35%."},
{c:"dcf",l:2,t:"mc",q:"At a 10% WACC, the discount factor applied to a year-three cash flow is approximately:",o:["0.91","0.83","0.75","0.68"],a:2,e:"1 divided by 1.10 cubed is 0.751."},
{c:"dcf",l:2,t:"mc",q:"The perpetual growth rate in a terminal value should generally not exceed:",o:["The company's historical growth rate","Long-run nominal GDP growth","WACC minus 1%","The inflation rate"],a:1,e:"A company growing faster than the economy forever would eventually become the entire economy. Two to three percent is the usual band in developed markets."},
{c:"dcf",l:2,t:"mc",q:"Which of these raises WACC, all else equal?",o:["A lower risk-free rate","A higher levered beta","A higher tax rate with debt in the structure","More cash on the balance sheet"],a:1,e:"A higher beta raises cost of equity directly through CAPM. A higher tax rate makes the interest shield more valuable, which lowers WACC."},
{c:"dcf",l:2,t:"open",q:"How do you forecast revenue in a DCF?",m:"Build it from drivers rather than applying a growth rate to the total, wherever the data allows.\n\nThe standard decompositions: price times volume for industrials and consumer goods; customers times average revenue per customer for subscription businesses; installed base times utilisation for equipment; store count times sales per store for retail.\n\nSegment it where the business has genuinely different units, because a blended growth rate hides a declining legacy division inside a growing one.\n\nAnchor the early years to management guidance, consensus estimates and the company's own order book or backlog, then fade toward a sustainable long-run rate by the end of the forecast period. A forecast that has the company growing at 15% in year ten is usually a sign the model has not been faded properly.\n\nCross-check the implied market share at the end of the forecast. If it exceeds what the industry can plausibly support, the forecast is wrong regardless of how clean the build looks."},
{c:"dcf",l:2,t:"open",q:"What do you do if your Gordon growth terminal value implies an unreasonable exit multiple?",m:"Treat it as a signal that an assumption is wrong, not as something to override.\n\nFirst, calculate the implied exit multiple by dividing the terminal value by terminal-year EBITDA, and compare it to where the sector trades today. If your growth and WACC assumptions imply a 20x exit for a business whose peers trade at 8x, the model is saying something the market does not believe.\n\nThen diagnose. Usually the terminal growth rate is too high relative to WACC, since the denominator is very sensitive when the two converge. Sometimes the terminal-year cash flow is inflated because capex has been forecast below depreciation, which is not sustainable in perpetuity.\n\nFix the driver rather than plugging the output. And present both methods side by side in the final analysis, since the cross-check between them is the point."},
{c:"dcf",l:3,t:"open",q:"How should stock-based compensation be treated in a DCF?",m:"The conservative and increasingly standard treatment is to deduct it as a real expense rather than adding it back as non-cash.\n\nThe logic: although no cash leaves the company, the cost is borne by shareholders through dilution. A company that pays part of its workforce in shares is transferring value out of existing holders just as surely as if it had paid cash and then issued shares to replace it. Adding it back and then ignoring the growing share count values the company twice over.\n\nThe alternative, which is defensible if done consistently, is to add it back to cash flow but then increase the diluted share count each year to reflect the shares issued, and discount the resulting equity value across the higher count.\n\nWhat you cannot do is add it back and hold the share count flat. That is the treatment most companies prefer in their adjusted metrics, and it is the reason adjusted free cash flow for high-growth technology companies often overstates what shareholders actually receive."},
{c:"dcf",l:3,t:"open",q:"How do you handle a large NOL balance in a DCF?",m:"Do not simply lower the tax rate. Model it explicitly, because the shield is finite and time-limited.\n\nProject taxable income year by year, apply the NOL against it until the balance is exhausted, and let the effective cash tax rate rise to the marginal rate afterwards. Respect any annual usage limitation and the expiry schedule.\n\nThe cleaner presentation is to run the DCF at the full marginal tax rate and then value the NOL separately as the present value of the tax savings, adding it as a non-operating asset in the bridge from enterprise value to equity value. That keeps the operating valuation clean and makes the tax asset visible to the client.\n\nAlso flag the change-of-control point. If the company is an acquisition candidate, the buyer's ability to use the NOLs may be capped, which means the asset is worth more to the company standalone than to an acquirer."},
{c:"dcf",l:3,t:"open",q:"What is adjusted present value, and when is it better than WACC?",m:"APV values the business in two pieces. First, the unlevered value: discount unlevered free cash flow at the unlevered cost of equity, as if the company carried no debt. Second, the value of financing side effects, principally the present value of the interest tax shield, less the expected cost of financial distress.\n\nEnterprise value is the sum of the two.\n\nIt is better than WACC whenever the capital structure changes materially over the forecast period, because WACC assumes constant weights. The obvious case is an LBO, where leverage starts at five or six times and falls toward two or three. A single WACC is simply wrong there.\n\nIt is also clearer when you want to show a client exactly how much of the value comes from the operating business and how much from the tax shield, which is useful in capital structure advisory work.\n\nThe cost is more assumptions: you need an explicit debt schedule and a view on the discount rate for the shield."},
{c:"dcf",l:3,t:"open",q:"How do you sanity-check a DCF before showing it to anyone?",m:"Check the implied exit multiple from the Gordon growth terminal value against current sector trading multiples. A large gap means an assumption is out of line.\n\nCheck the share of value sitting in the terminal value. Above roughly 80% means the explicit forecast is doing almost no work and the answer is really just a multiple in disguise.\n\nCheck capex against depreciation in the terminal year. They should converge for a steady-state business. Capex permanently below depreciation implies an asset base shrinking to nothing.\n\nCheck the implied margins and returns on capital at the end of the forecast. If the company earns 40% returns on capital in perpetuity with no competitive response, the forecast is not credible.\n\nCheck the implied market share against industry size.\n\nAnd compare the output to the current share price and the analyst target range. Being far outside is not automatically wrong, but you need a specific reason why the market is mistaken."},
{c:"dcf",l:3,t:"open",q:"Should WACC use the company's current or target capital structure?",m:"Target, in almost all cases, because the discount rate applies to cash flows stretching decades into the future and today's snapshot rarely persists.\n\nThe target is usually taken as the company's stated policy if it has one, or the median capital structure of the peer group, on the reasoning that the industry has converged on something close to optimal for that risk profile.\n\nUse market values rather than book values for the weights, since the cost of capital is about what investors require today, not historical accounting entries.\n\nThe important consistency point: the same capital structure must be used to relever beta. Using peer-median leverage for the weights and current leverage for beta produces an internally inconsistent discount rate, which is one of the most common errors in student models.\n\nWhere leverage will genuinely change a lot over the forecast, such as a company deleveraging after an acquisition, the honest answer is that WACC is the wrong tool and APV handles it properly."}
];

/* ------------------------------ M&A (more) ------------------------------ */
{c:"ma",l:1,t:"mc",q:"A hostile takeover is best described as:",o:["Any deal where the price is contested","An offer taken directly to shareholders over the board's objection","A deal blocked by regulators","An acquisition funded entirely with debt"],a:1,e:"When the target's board refuses to negotiate, the bidder can go around it with a tender offer or a proxy fight."},
{c:"ma",l:1,t:"mc",q:"A poison pill works by:",o:["Requiring the bidder to pay a break fee","Letting all other shareholders buy discounted shares, diluting the bidder","Forcing an immediate shareholder vote","Transferring assets to a subsidiary"],a:1,e:"Once a bidder crosses a set ownership threshold, the rights plan triggers and makes the stake prohibitively expensive to increase."},
{c:"ma",l:1,t:"mc",q:"In an all-cash acquisition, the acquirer's share count:",o:["Rises by the purchase price divided by share price","Falls","Is unchanged","Depends on the target's share count"],a:2,e:"No shares are issued, so only the balance sheet and interest expense change. That is part of why cash deals are usually more accretive."},
{c:"ma",l:1,t:"mc",q:"A tender offer is:",o:["A bid submitted to the target's board","An offer made directly to the target's shareholders to buy their shares","A regulatory filing","An agreement to negotiate exclusively"],a:1,e:"It bypasses the board, which is why it is the standard instrument in a hostile approach."},
{c:"ma",l:2,t:"mc",q:"Acquirer has 100m shares and EPS of $2.00, trading at $30. It buys a target with $50m of net income for $600m, all in stock. What is pro forma EPS?",o:["$2.00","$2.08","$2.50","$1.92"],a:1,e:"Shares issued: 600/30 = 20m, so 120m total. Combined net income: 200 + 50 = 250. EPS = 250/120 = $2.08, so accretive."},
{c:"ma",l:2,t:"mc",q:"A break fee in a merger agreement is typically:",o:["Paid by the buyer if financing fails only","Paid by the target if it walks away for a competing bid","Paid to regulators","Paid annually until closing"],a:1,e:"It compensates the buyer for costs and deters interlopers. A reverse break fee runs the other way, covering the seller if the buyer fails to close."},
{c:"ma",l:2,t:"mc",q:"Which of these reduces accretion in a merger model?",o:["Cost synergies","Incremental D&A from asset write-ups","Using cash rather than stock","A lower purchase price"],a:1,e:"Purchase accounting write-ups create new depreciation and amortisation that did not previously exist, which drags on pro forma earnings."},
{c:"ma",l:2,t:"mc",q:"An earnout is most often used when:",o:["The buyer lacks financing","Buyer and seller disagree about the target's future performance","Regulatory approval is uncertain","The target is publicly listed"],a:1,e:"Part of the price is made contingent on hitting agreed targets, which bridges a valuation gap by shifting performance risk back to the seller."},
{c:"ma",l:2,t:"open",q:"What is a fairness opinion, and what does it actually cover?",m:"A written opinion from an investment bank to a target's board stating whether the consideration offered is fair, from a financial point of view, to shareholders.\n\nIt is supported by the standard valuation work: comps, precedent transactions, a DCF on management projections, and premiums paid analysis. The output is a range, and the opinion says whether the offer falls within it.\n\nWhat it does not cover: whether the deal is a good strategic idea, whether a better price could have been obtained by running a different process, the allocation of consideration between classes of shareholders, or anything non-financial.\n\nIt exists largely for board protection under fiduciary duty. The structural criticism is that the bank issuing it often earns a much larger fee contingent on the deal closing, which is a conflict boards are supposed to manage by using an independent adviser."},
{c:"ma",l:2,t:"open",q:"Walk me through a sell-side M&A process.",m:"Preparation: agree scope with the client, conduct due diligence on the business, build the financial model and the management projections, and prepare marketing materials, the teaser and the confidential information memorandum. Set up the data room.\n\nFirst round: distribute the teaser to a screened buyer list, sign NDAs, send the CIM, and collect non-binding indications of interest.\n\nSecond round: shortlist bidders, open the data room, run management presentations and site visits, distribute the draft purchase agreement, and collect binding offers with markups.\n\nNegotiation: select the preferred bidder or run a final round, negotiate price and terms, and sign.\n\nClosing: satisfy conditions, obtain regulatory and shareholder approvals, and complete.\n\nThe banker's job throughout is to create and maintain competitive tension, because that is what moves the price."},
{c:"ma",l:2,t:"open",q:"What is the difference between a strategic buyer and a financial buyer?",m:"A strategic buyer is an operating company in the same or an adjacent industry. It can realise synergies by combining the two businesses, holds the asset indefinitely, and can pay more because part of the value comes from the combination rather than the target alone. It typically has a lower cost of capital and can use stock as currency.\n\nA financial buyer is a private equity fund. It has no synergies, holds for three to seven years, and needs an exit. Its price is constrained by the return it must deliver to its own investors and by how much leverage the credit markets will supply.\n\nConsequences for a sale process: strategics usually set the top of the price range, but they move slower, carry antitrust risk, and may want access to sensitive information from a competitor. Sponsors are faster, more certain to close, and less disruptive to the business, which is why sellers sometimes accept a slightly lower price from one."},
{c:"ma",l:3,t:"open",q:"Why might a seller prefer stock consideration over cash?",m:"Tax deferral. In many jurisdictions a share-for-share exchange can be structured so no taxable event arises until the shares are eventually sold, whereas cash triggers an immediate capital gains charge.\n\nUpside participation. If the seller believes in the combined entity, particularly where the synergies are real, stock lets them share in value they helped create.\n\nSignal and alignment. Accepting stock tells the market the seller believes in the buyer, which can help the deal's reception.\n\nDeal certainty. Stock deals do not depend on financing conditions, so there is less risk of the buyer failing to fund.\n\nThe countervailing risks: the seller takes market risk between signing and closing, exchange ratios may be fixed or floating with collars, and a minority stake in someone else's company carries no control. Founders selling for liquidity and diversification almost always prefer cash."},
{c:"ma",l:3,t:"open",q:"How do you assess whether a deal will clear antitrust review?",m:"Start with market definition, since everything follows from it. Regulators define the relevant product and geographic market, and a deal that looks concentrated on a narrow definition can look benign on a broad one.\n\nCalculate combined market share and the change in concentration, typically using the Herfindahl-Hirschman Index. Published guidelines give thresholds above which authorities presume harm and investigate closely.\n\nAssess the theory of harm: horizontal overlap between direct competitors is the most scrutinised, vertical integration raises foreclosure concerns, and conglomerate deals are usually easier.\n\nThen consider remedies. Most problematic deals clear with divestitures of overlapping assets or behavioural commitments, so the question is often not whether it clears but at what cost.\n\nPractically, this shapes the agreement: who bears regulatory risk, whether there is a hell-or-high-water covenant obliging the buyer to divest whatever is needed, the size of the reverse break fee, and the outside date."},
{c:"ma",l:3,t:"open",q:"What happens to the target's existing debt in an acquisition?",m:"It depends on the terms of the debt and the structure of the deal.\n\nRefinanced: most common in a leveraged transaction. Change-of-control provisions in credit agreements typically require repayment on a takeover, so the target's debt is repaid at closing and new financing is put in place. The repayment amount appears in the uses section of the sources and uses table.\n\nAssumed: if the debt is attractively priced and has no change-of-control put, the buyer may keep it in place. This is more common with investment grade bonds.\n\nPut to the company: many high yield bonds carry a change-of-control put at 101, giving holders the right to require repurchase at a small premium.\n\nLeft behind: in an asset purchase, the liabilities stay with the selling entity unless specifically assumed.\n\nThe practical modelling point: enterprise value is what you pay for the business, and how the target's debt is handled determines how much of that price goes to equity holders versus lenders."},
{c:"ma",l:3,t:"open",q:"How do you build a synergy schedule with phasing?",m:"Separate cost and revenue synergies, and model each as a run-rate figure with a realisation curve rather than switching them on in full at closing.\n\nTypical phasing for cost synergies: perhaps 25% to 35% realised in year one, 70% to 80% in year two, and full run rate by year three. Headcount reductions and duplicate facility closures take time because of notice periods, redundancy processes and lease terms.\n\nModel the costs to achieve alongside them. Severance, systems integration, facility exit costs and advisory fees are usually front-loaded and often total one to two times the annual run-rate saving. Net synergies in the first year are frequently negative.\n\nRevenue synergies get a longer ramp and a heavy probability haircut, and the base case usually excludes them entirely.\n\nThe presentation that matters to a board: net synergy contribution by year, cumulative costs to achieve, and the year in which the deal turns cash accretive."},

/* ------------------------------ LBO (more) ------------------------------ */
{c:"lbo",l:1,t:"mc",q:"Sponsor equity as a share of the total purchase price in a typical LBO today is around:",o:["5% to 15%","40% to 60%","75% to 85%","90% or more"],a:1,e:"The 1980s deals ran far higher leverage. Modern structures typically sit near half equity, more for businesses with volatile cash flows."},
{c:"lbo",l:1,t:"mc",q:"A cash sweep provision means:",o:["The sponsor can withdraw excess cash as a dividend","Excess free cash flow must be used to repay debt","Interest can be deferred in a downturn","Working capital is funded by the revolver"],a:1,e:"It accelerates deleveraging, which is one of the main return drivers, and reduces lender risk. It typically steps down as leverage falls."},
{c:"lbo",l:1,t:"mc",q:"Which tranche normally carries mandatory amortisation?",o:["High yield bonds","Term loan A / senior secured","Mezzanine","PIK notes"],a:1,e:"Senior secured loans amortise on a schedule. Bonds and junior tranches are typically bullet repayments at maturity."},
{c:"lbo",l:1,t:"mc",q:"A management incentive plan in an LBO is usually sized at roughly:",o:["Under 1% of equity","5% to 15% of equity","25% to 30% of equity","50% of equity"],a:1,e:"Options or sweet equity vesting on time and on return hurdles, which aligns management with the sponsor's exit."},
{c:"lbo",l:2,t:"mc",q:"EBITDA is $100m, leverage is 5.0x, and the blended interest rate is 8%. What is annual interest expense?",o:["$25m","$40m","$50m","$80m"],a:1,e:"Debt is 5.0 x 100 = $500m. At 8% that is $40m of interest."},
{c:"lbo",l:2,t:"mc",q:"Same company: EBITDA $100m, interest expense $40m. What is interest coverage?",o:["1.5x","2.5x","4.0x","5.0x"],a:1,e:"EBITDA divided by interest is 100/40 = 2.5x. Lenders typically want comfortably above 2.0x at close."},
{c:"lbo",l:2,t:"mc",q:"A target with $80m EBITDA is bought at 10.0x. The sponsor funds 45% with equity. What is the equity cheque?",o:["$320m","$360m","$400m","$440m"],a:1,e:"Enterprise value is 10 x 80 = $800m. 45% of that is $360m, with $440m of debt."},
{c:"lbo",l:2,t:"mc",q:"Entry at 8.0x, exit at 8.0x after five years, EBITDA flat, and no debt repaid. What is the multiple of money?",o:["0.5x","1.0x","1.5x","2.0x"],a:1,e:"With no growth, no multiple expansion and no deleveraging, none of the three value drivers has done anything. The sponsor gets its money back and nothing more."},
{c:"lbo",l:2,t:"open",q:"How do you build a debt schedule?",m:"Start with the opening balance of each tranche from the sources and uses table.\n\nFor each forecast year, calculate cash available for debt repayment: EBITDA, less cash interest, less cash taxes, less capex, less the change in working capital, which gives levered free cash flow before debt service.\n\nApply mandatory amortisation first, in the order the credit agreement requires. Then apply the cash sweep to prepay the remaining balance, respecting any minimum cash balance the business needs to operate.\n\nDraw or repay the revolver to plug any shortfall or hold excess.\n\nCalculate interest on average balances to avoid the circularity of charging interest on a balance that the interest itself determines. Most models either use average balances or enable iterative calculation.\n\nRoll the closing balance forward, and test the covenants at each period end. The output feeds the interest line on the income statement, which is what creates the circular reference the model has to resolve."},
{c:"lbo",l:2,t:"open",q:"What is a buy-and-build strategy, and why do sponsors use it?",m:"Acquire a platform company in a fragmented industry, then bolt on smaller competitors through the hold period, integrating them into a single larger business.\n\nThe main source of value is multiple arbitrage. Small companies trade at lower multiples than large ones, so buying a business at 6x and having it valued inside the platform at 10x creates value immediately, before any operational improvement.\n\nSecondary sources: cost synergies from consolidating overhead, purchasing scale, cross-selling, and the strategic premium a larger and more diversified platform commands at exit.\n\nTypical targets: healthcare clinics, veterinary practices, IT services, insurance brokerage, specialist distribution.\n\nThe risks: integration capability is the binding constraint, and roll-ups frequently fail because the platform's management cannot absorb deals at the pace the model assumes. Add-ons also consume debt capacity and often require equity injections, which drags on IRR if the money goes in late."},
{c:"lbo",l:3,t:"open",q:"What happens if a portfolio company breaches a covenant?",m:"A breach is an event of default, which gives lenders the right to accelerate the loan and demand immediate repayment. In practice they rarely do, because forcing a liquidation usually gives them a worse recovery than keeping the business running.\n\nWhat happens instead is a negotiation. Lenders have leverage and use it. Common outcomes: a waiver in exchange for a fee and a higher margin; an amendment resetting the covenant levels, often with tighter terms elsewhere; a requirement that the sponsor injects fresh equity, sometimes through an explicit equity cure right written into the agreement; or restrictions on further acquisitions and distributions.\n\nIf the business is genuinely impaired rather than temporarily off-plan, the conversation becomes a restructuring, and the question is whether the sponsor puts in more money or hands the keys to the lenders.\n\nCovenant-lite structures remove maintenance tests entirely, which is why breaches in that market now typically surface only at a missed payment, much later and with less value left."},
{c:"lbo",l:3,t:"open",q:"Why do sponsors commission quality-of-earnings work before an LBO?",m:"Because the entire capital structure is sized off EBITDA, so an overstated EBITDA means an overpaid purchase price and a structure the business cannot actually service.\n\nA quality-of-earnings review tests whether reported EBITDA is real and repeatable: it identifies non-recurring items dressed as ongoing profit, addbacks that are not achievable, revenue recognised aggressively near period end, related-party transactions priced off market, owner compensation that needs normalising in a founder-owned business, and working capital manipulated ahead of a sale.\n\nIt also establishes a normalised working capital level, which becomes the peg in the purchase agreement and determines the completion adjustment.\n\nThe commercial significance: every million of EBITDA that turns out to be unsustainable costs the sponsor the purchase multiple, so ten times that, in overpayment. It is the cheapest diligence spend in the process relative to what it protects."},
{c:"lbo",l:3,t:"open",q:"If the base case IRR falls short of target, what levers can a sponsor pull?",m:"Price. Reducing the entry multiple is the single most powerful lever and the first one to test, because every turn of EBITDA paid at entry comes straight out of the return.\n\nLeverage. More debt reduces the equity cheque and amplifies returns, but only if the business can service it and lenders will provide it.\n\nOperational plan. Higher EBITDA growth through margin improvement, pricing, or cost programmes, though the model should not assume improvements the sponsor cannot specifically deliver.\n\nExit multiple. Assuming expansion is the least defensible lever, since it depends on market conditions rather than anything the sponsor controls. Underwriting to multiple expansion is how sponsors lose money.\n\nHold period. Selling earlier raises IRR for a given multiple of money, which is why sponsors sometimes exit strong assets sooner than the operating plan implies.\n\nStructure. Dividend recapitalisation to return capital early, or add-on acquisitions at lower multiples.\n\nThe honest answer includes the point that if the deal only works on heroic assumptions, the right lever is to walk away."},
{c:"lbo",l:3,t:"open",q:"What is the difference between IRR and multiple of money, and why do sponsors track both?",m:"Multiple of money is total equity proceeds divided by equity invested. It measures how much value was created and ignores time entirely.\n\nIRR is the annualised rate of return, which accounts for both the size and the timing of cash flows.\n\nThey diverge because of timing. A deal returning 2.0x in two years is a 41% IRR but only doubles the money. A deal returning 3.0x in eight years is a 15% IRR but triples it. A quick flip can post a spectacular IRR while returning very little capital.\n\nSponsors track both because their investors care about both. Limited partners need absolute capital returned to meet their own obligations, which MoM captures, and they need to compare against alternative uses of capital over time, which IRR captures.\n\nIRR is also gameable through subscription lines of credit that delay calling capital, which is precisely why sophisticated investors look at MoM and at distributions to paid-in capital alongside it."}
];
