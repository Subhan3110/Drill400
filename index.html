  document.querySelectorAll("#home .seg").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    S[g.dataset.seg] = Number(b.dataset.v); renderHome();
  }));
  const stB = document.getElementById("start"); if (stB) stB.onclick = () => start();
  const mp = document.getElementById("multiplayer");
  if (mp) mp.onclick = () => { S.mpOpen = true; S.mpMsg = ""; S.mpLink = ""; renderHome(); };
  const mpc = document.getElementById("mpclose");
  if (mpc) mpc.onclick = () => { S.mpOpen = false; S.mpLink = ""; renderHome(); };
  const mps = document.getElementById("mpsend");
  if (mps) mps.onclick = async () => {
    S.name = (document.getElementById("mpnm").value || "").trim().slice(0, 18);
    ls.set(K_NAME, S.name);
    const pl = pool(); if (!pl.length) return;
    const deck = shuffle(pl).slice(0, S.len === 0 ? pl.length : Math.min(S.len, pl.length));
    const url = makeInviteLink(deck);
    S.invite = { deck, key: setKey(encodeDeck(deck)) };
    const text = `${S.name || "Someone"} sent you a Drill 400 set — ${deck.length} questions. Same ones for both of us.`;
    try {
      if (navigator.share) { await navigator.share({ title: "Drill 400", text, url }); S.mpMsg = "Link sent. Play the same set below."; }
      else { await navigator.clipboard.writeText(url); S.mpMsg = "Link copied. Send it, then play the same set below."; }
    } catch (e) {
      if (e && e.name === "AbortError") return;
      S.mpMsg = "Copy this link:"; S.mpLink = url;
    }
    renderHome();
  };
  document.getElementById("theme").onclick = toggleTheme;
  const ac = document.getElementById("acceptchal"); if (ac) ac.onclick = startChallenge;
  const sc = document.getElementById("skipchal");
  if (sc) sc.onclick = () => { S.chal = null; try { history.replaceState(null, "", location.pathname + location.search); } catch {} renderHome(); };
  const rs = document.getElementById("resume"); if (rs) rs.onclick = resume;
  const ds = document.getElementById("discard"); if (ds) ds.onclick = () => { ls.del(K_RESUME); renderHome(); };
}

/* ================================ QUIZ ================================ */
function start() {
  if (S.invite) {                       // play the set you just shared
    S.deck = S.invite.deck; S.setKey = S.invite.key; S.invite = null; S.mpOpen = false;
  } else {
    const p = pool(); if (!p.length) return;
    S.deck = shuffle(p).slice(0, S.len === 0 ? p.length : Math.min(S.len, p.length));
    S.setKey = setKey(encodeDeck(S.deck));
  }
  S.idx = 0; S.log = []; S.chalActive = null; S.startedAt = Date.now();
  resetQ(); saveResume(); show("quiz"); renderQuiz();
}
function startChallenge() {
  const c = S.chal; if (!c) return;
  S.deck = c.deck; S.idx = 0; S.log = []; S.setKey = c.key;
  // An invite carries no score yet, so there is nothing to compare against.
  S.chalActive = c.kind === "result" ? { name: c.name, right: c.right, total: c.total } : null;
  S.startedAt = Date.now(); S.chal = null; S.mpOpen = false; S.invite = null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  resetQ(); saveResume(); show("quiz"); renderQuiz();
}
function saveResume() {
  if (S.idx >= S.deck.length) { ls.del(K_RESUME); return; }
  ls.set(K_RESUME, { deck: S.deck.map(q => q.id), idx: S.idx, log: S.log, startedAt: S.startedAt, chal: S.chalActive, setKey: S.setKey,
                     catName: S.cat === "all" ? "Everything" : S.cat === "weak" ? "Ones you missed"
                            : S.cat === "flag" ? "Flagged" : CATNAME[S.cat] || "a set" });
}
function resume() {
  const r = ls.get(K_RESUME, null); if (!r) return;
  const deck = r.deck.map(id => byId[id]).filter(Boolean);
  if (!deck.length) { ls.del(K_RESUME); renderHome(); return; }
  S.deck = deck; S.idx = Math.min(r.idx, deck.length - 1); S.log = r.log || []; S.chalActive = r.chal || null; S.setKey = r.setKey || null;
  S.startedAt = r.startedAt || Date.now();
  resetQ(); show("quiz"); renderQuiz();
}
function resetQ() { S.picked = null; }
const cur = () => S.deck[S.idx];
const logged = () => S.log.some(e => e.id === cur().id);

function record(correct) {
  const q = cur();
  S.log.push({ id: q.id, cat: q.c, correct });
  const prev = S.stats[q.id] || { seen: 0, wrong: 0 };
  S.stats[q.id] = { seen: prev.seen + 1, wrong: correct ? Math.max(0, prev.wrong - 1) : prev.wrong + 1 };
  saveStats(); markDay(); saveResume();
}
function next() {
  if (S.idx + 1 >= S.deck.length) { ls.del(K_RESUME); show("result"); renderResult(); return; }
  S.idx++; resetQ(); saveResume(); renderQuiz(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function toggleFlag() {
  const id = cur().id;
  S.flags.has(id) ? S.flags.delete(id) : S.flags.add(id);
  saveFlags(); renderQuiz();
}
const fmtTime = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function renderQuiz() {
  const q = cur();
  const pct = (S.idx / S.deck.length) * 100;
  let body = "";

  body += `<div class="stack">` + q.o.map((o, i) => {
    let cls = "opt";
    if (S.picked !== null) cls += i === q.a ? " right" : (i === S.picked ? " wrong" : " dim");
    return `<button class="${cls}" data-i="${i}" ${S.picked !== null ? "disabled" : ""}>
      <span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;
  }).join("") + `</div>`;

  if (S.picked !== null) {
    const ok = S.picked === q.a;
    body += `<div class="exp ${ok ? "ok" : "no"}" role="status"><h4>${ok ? "Correct" : "Not quite"}</h4><p>${esc(q.e)}</p></div>`;
  }

  const done = S.picked !== null;
  if (done) body += `<button class="btn pri" id="next">${S.idx + 1 >= S.deck.length ? "See results" : "Next question"}</button>`;

  const flagged = S.flags.has(q.id);
  document.getElementById("quiz").innerHTML = `
    <div class="topbar">
      <button class="linkbtn" id="back" style="text-decoration:none;color:var(--muted)">Back</button>
      <div class="mid">
        <button class="flagbtn ${flagged ? "on" : ""}" id="flag" aria-pressed="${flagged}">${flagged ? "Flagged" : "Flag"}</button>
        <span>${S.idx + 1} of ${S.deck.length}</span>
      </div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="chips"><span class="chip acc">${esc(CATNAME[q.c])}</span>
      <span class="chip">${LVLNAME[q.l]}</span></div>
    <div class="qtext">${esc(q.q)}</div>${body}`;

  document.getElementById("back").onclick = () => { saveResume(); show("home"); renderHome(); };
  document.getElementById("flag").onclick = toggleFlag;
  document.querySelectorAll("#quiz .opt").forEach(b => b.onclick = () => pick(Number(b.dataset.i)));
  const nx = document.getElementById("next"); if (nx) nx.onclick = next;
}

function pick(i) {
  if (S.picked !== null) return;
  S.picked = i; record(i === cur().a); renderQuiz();
}

/* =============================== RESULTS =============================== */
function renderResult() {
  const right = S.log.filter(e => e.correct).length;
  const pct = S.log.length ? Math.round(right / S.log.length * 100) : 0;
  const col = pct >= 70 ? "good" : pct >= 50 ? "brass" : "bad";
  const by = {};
  S.log.forEach(e => { (by[e.cat] = by[e.cat] || { r: 0, t: 0 }).t++; if (e.correct) by[e.cat].r++; });
  const rows = Object.entries(by).sort((a, b) => a[1].r / a[1].t - b[1].r / b[1].t);
  saveMyResult(S.setKey, right, S.log.length);
  const elapsed = S.startedAt ? Date.now() - S.startedAt : 0;
  const perQ = S.log.length && elapsed ? Math.round(elapsed / S.log.length / 1000) : 0;

  const review = S.log.map((e, i) => {
    const q = byId[e.id]; if (!q) return "";
    const open = S.openRev === i;
    return `<div class="item">
      <button class="head" data-rev="${i}" aria-expanded="${open}">
        <span class="mark ${e.correct ? "y" : "n"}">${e.correct ? "✓" : "✗"}</span>
        <span>${esc(q.q)}</span></button>
      ${open ? `<div class="body"><b>${esc(q.o[q.a])}</b>${esc(q.e)}</div>` : ""}
    </div>`;
  }).join("");

  const ca = S.chalActive;
  let vs = "";
  if (ca) {
    const theirs = ca.total ? Math.round(ca.right / ca.total * 100) : 0;
    const iWin = pct > theirs, tie = pct === theirs;
    vs = `<div class="vs">
        <div class="side ${iWin ? "win" : ""}"><b>${right}/${S.log.length}</b><small>YOU</small></div>
        <div class="sep">vs</div>
        <div class="side ${!iWin && !tie ? "win" : ""}"><b>${ca.right}/${ca.total}</b><small>${esc(ca.name.toUpperCase())}</small></div>
      </div>
      <div class="verdictline" style="color:var(--${iWin ? "good" : tie ? "brass" : "bad"})">
        ${iWin ? "You win." : tie ? "Dead heat." : esc(ca.name) + " takes it."}
      </div>`;
  }

  document.getElementById("result").innerHTML = `
    ${vs}
    <div class="bigscore"><b style="color:var(--${col})">${pct}%</b>
      <small>${right} of ${S.log.length} answered well${elapsed ? ` &middot; ${fmtTime(elapsed)} &middot; ${perQ}s per question` : ""}</small></div>
    ${rows.length > 1 ? `<div class="label">By topic</div><div class="card brk">${rows.map(([k, v]) => {
      const r = v.r / v.t, c = r >= .7 ? "good" : r >= .5 ? "brass" : "bad";
      return `<div class="r"><span style="font-size:14px">${esc(CATNAME[k])}</span>
        <span style="display:flex;align-items:center;gap:12px">
          <span class="meter"><i style="width:${r * 100}%;background:var(--${c})"></i></span>
          <span class="n">${v.r}/${v.t}</span></span></div>`;
    }).join("")}</div>` : ""}

    ${S.log.length ? `<div class="label">Review <b>tap to expand</b></div><div class="rev">${review}</div>` : ""}

    ${S.log.length ? `
      ${S.shareOpen ? `<div class="share">
        <p>${ca ? "Send the result back" : "Send this exact set to a friend"} — they get the same questions in the same order, and see your score at the end.</p>
        <input type="text" id="nm" placeholder="Your name" value="${esc(S.name)}" maxlength="18" autocomplete="off"/>
        <div class="row"><button class="btn pri" id="dosend">${navigator.share ? "Share link" : "Copy link"}</button>
          <button class="btn" id="closeshare">Close</button></div>
        ${S.shareMsg ? `<p style="margin:10px 0 0;color:var(--brass)">${esc(S.shareMsg)}</p>` : ""}
      </div>` : `<button class="btn" id="openshare" style="margin-bottom:9px">${ca ? "Send your result back" : "Challenge a friend"}</button>`}
    ` : ""}

    <div class="stack group" style="margin-bottom:0"><button class="btn pri" id="again">Run another set</button>
      <button class="btn" id="home2">Change topic</button></div>
    <div class="note">Everything you got wrong is saved under &ldquo;Ones you missed&rdquo; on the home screen.</div>`;

  document.querySelectorAll("#result .head").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.rev); S.openRev = S.openRev === i ? null : i; renderResult();
  });
  const os = document.getElementById("openshare");
  if (os) os.onclick = () => { S.shareOpen = true; S.shareMsg = ""; renderResult(); };
  const cs = document.getElementById("closeshare");
  if (cs) cs.onclick = () => { S.shareOpen = false; renderResult(); };
  const ds = document.getElementById("dosend");
  if (ds) ds.onclick = async () => {
    S.name = (document.getElementById("nm").value || "").trim().slice(0, 18);
    ls.set(K_NAME, S.name);
    const url = makeChallengeLink();
    const text = `${S.name || "I"} scored ${right}/${S.log.length} on Drill 400. Same questions, your turn.`;
    try {
      if (navigator.share) { await navigator.share({ title: "Drill 400", text, url }); return; }
      await navigator.clipboard.writeText(url);
      S.shareMsg = "Link copied. Paste it to them.";
    } catch (e) {
      if (e && e.name === "AbortError") return;
      S.shareMsg = url;
    }
    renderResult();
  };
  document.getElementById("again").onclick = () => { S.openRev = null; S.shareOpen = false; start(); window.scrollTo(0, 0); };
  document.getElementById("home2").onclick = () => { S.openRev = null; S.shareOpen = false; show("home"); renderHome(); window.scrollTo(0, 0); };
}

/* A challenge link tapped while the app is already open changes only the hash,
   which does not reload the page — so pick it up explicitly. */
window.addEventListener("hashchange", () => {
  const c = readLink();
  if (!c) return;
  S.chal = c; S.shareOpen = false;
  show("home"); renderHome(); window.scrollTo(0, 0);
});

applyTheme();
S.chal = readLink();
renderHome();

</script>
</body>
</html>
