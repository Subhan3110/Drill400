{"c":"restr","l":1,"t":"mc","q":"The absolute priority rule states that:","o":["All creditors are paid equally","Senior claims must be satisfied in full before junior claims receive anything","Equity holders are paid first","Trade creditors rank above secured lenders"],"a":1,"e":"The waterfall runs from secured debt through unsecured to equity. In practice, deviations happen when senior classes consent to give junior parties something to buy cooperation and speed."},
{"c":"restr","l":1,"t":"mc","q":"A prepackaged bankruptcy is:","o":["A filing made without creditor notice","A plan negotiated and voted on before the company files","A liquidation under Chapter 7","A filing that skips court approval"],"a":1,"e":"The terms are agreed and the required creditor votes secured in advance, so the court process can be completed in weeks rather than months."},
{"c":"restr","l":1,"t":"mc","q":"Cramdown refers to:","o":["Forcing a company into liquidation","Confirming a plan over the objection of a dissenting class","Reducing management compensation","Calling a loan early"],"a":1,"e":"The court can confirm a plan despite a dissenting class, provided the plan is fair and equitable to that class and does not unfairly discriminate."},
{"c":"restr","l":1,"t":"mc","q":"The best interests test requires that each creditor receives:","o":["Payment in full","At least what it would receive in a Chapter 7 liquidation","An equal share with all other creditors","Equity in the reorganised company"],"a":1,"e":"It is the floor protection for dissenting creditors, which is why a liquidation analysis is a required part of any plan."},
{"c":"restr","l":1,"t":"mc","q":"A technical default is:","o":["A missed interest payment","A breach of a covenant without a missed payment","A default caused by a clerical error","A default on a subsidiary's debt only"],"a":1,"e":"Breaching a leverage or coverage test triggers default rights even though the company has kept paying. It is often the first visible sign of distress."},
{"c":"restr","l":1,"t":"mc","q":"An automatic stay in Chapter 11 means:","o":["Management is automatically replaced","Creditors must stop collection efforts immediately","The company must liquidate within 90 days","Interest stops accruing on secured debt"],"a":1,"e":"Filing triggers an immediate halt to collection actions, lawsuits and foreclosures. It is the breathing space that makes reorganisation possible. Note that oversecured creditors may continue to accrue interest, so option four is wrong."},
{"c":"restr","l":1,"t":"mc","q":"A restructuring banker primarily:","o":["Sells new equity to retail investors","Advises a distressed company or its creditors on recapitalising the balance sheet","Audits financial statements","Manages a hedge fund"],"a":1,"e":"They advise either the debtor or a creditor group on how to fix an unsustainable capital structure, through exchanges, new money, asset sales or a Chapter 11 plan. Fees are typically monthly retainers plus a completion fee, because a distressed client cannot guarantee a success outcome."},
{"c":"restr","l":1,"t":"mc","q":"In a restructuring, the debtor and creditor advisers differ in that the debtor side generally seeks:","o":["The lowest possible enterprise value","To preserve value for existing stakeholders and keep the business operating","Immediate liquidation","Maximum recovery for bondholders"],"a":1,"e":"The debtor wants breathing room, a sustainable structure and as much retained equity as possible. Creditors want maximum recovery and often argue for a lower enterprise value, since that pushes the fulcrum higher and gives them the equity."},
{"c":"restr","l":2,"t":"mc","q":"Debtor-in-possession financing ranks:","o":["Behind existing secured debt","Pari passu with unsecured creditors","With super-priority, generally ahead of existing claims","As equity"],"a":2,"e":"Super-priority is what makes DIP lending possible. Without it, no lender would extend credit to a company already in default."},
{"c":"restr","l":2,"t":"mc","q":"Exit financing in a Chapter 11 process refers to:","o":["Fees paid to advisers on emergence","New capital raised to fund the company out of bankruptcy","The sale of the business to a third party","Repayment of the DIP facility by equity holders"],"a":1,"e":"It replaces the DIP facility and funds plan distributions and working capital as the reorganised company emerges."},
{"c":"restr","l":2,"t":"mc","q":"In the claims waterfall, trade creditors normally rank:","o":["Ahead of secured lenders","Alongside secured lenders","As general unsecured claims, below secured debt","Below equity"],"a":2,"e":"Unless they hold security or benefit from a critical vendor order, trade claims sit in the general unsecured pool and often recover very little."},
{"c":"restr","l":2,"t":"mc","q":"Exclusivity in Chapter 11 refers to:","o":["The debtor's exclusive right to propose a plan for an initial period","A single creditor's right to negotiate alone","The exclusive use of one valuation method","The court's exclusive jurisdiction"],"a":0,"e":"The debtor has the exclusive right to file a plan for the first 120 days, extendable up to 18 months. Once exclusivity lapses, any party in interest can file a competing plan, which sharply shifts leverage toward creditors."},
{"c":"restr","l":2,"t":"mc","q":"A company's debt trading at 30 cents on the dollar most directly implies:","o":["The company will definitely liquidate","The market expects recovery well below par","Interest rates have risen sharply","The debt is secured"],"a":1,"e":"Secondary market prices are the market's probability-weighted view of recovery. Thirty cents implies expected recovery far below par. It does not guarantee liquidation, and it usually signals the market sees this tranche as at or below the fulcrum."},
{"c":"restr","l":2,"t":"mc","q":"A first lien and second lien lender typically govern their relationship through:","o":["The indenture only","An intercreditor agreement","The bankruptcy code alone","A fairness opinion"],"a":1,"e":"The intercreditor agreement sets out the payment and lien priority, standstill periods during which the second lien cannot enforce, voting on amendments, and whether the second lien can object to a section 363 sale or DIP financing. It is often where the real leverage is decided."},
{"c":"restr","l":2,"t":"mc","q":"A company has $600m of enterprise value, $400m of secured debt and $300m of unsecured debt. Where does the fulcrum sit?","o":["The secured debt","The unsecured debt","The equity","There is no fulcrum"],"a":1,"e":"Value covers the $400m secured claim in full, leaving $200m for the $300m of unsecured debt, which is therefore only partially covered. The unsecured class is the fulcrum: it is where value runs out, so those holders typically convert into the reorganised equity. The existing equity is wiped out."},
{"c":"restr","l":2,"t":"mc","q":"A company files for Chapter 11 rather than restructuring out of court mainly to:","o":["Avoid paying advisers","Bind holdout creditors through cramdown and obtain the automatic stay","Increase its share price","Avoid disclosure"],"a":1,"e":"Out-of-court deals need near-unanimous consent, so a small holdout group can block them. Chapter 11 binds dissenters if the statutory voting thresholds are met, and the automatic stay halts collection while a plan is negotiated."},
{"c":"restr","l":2,"t":"mc","q":"The fulcrum security is:","o":["The most senior secured claim","The claim where enterprise value runs out, which typically converts into the new equity","The equity of the reorganised company","The debtor-in-possession facility"],"a":1,"e":"Claims above it are paid in full, claims below receive little or nothing. Because the fulcrum holders absorb the residual, they usually end up owning the reorganised business, which is why distressed funds buy deliberately into that layer."},
{"c":"restr","l":2,"t":"mc","q":"Valuation in a restructuring is distinctive because:","o":["Only book value is used","It determines which creditor class receives the equity, so every party argues for a different number","Multiples do not apply","Cash flows are irrelevant"],"a":1,"e":"Enterprise value decides where the fulcrum sits, so one turn of EBITDA can move hundreds of millions between classes. Seniors argue for a low value to capture all the equity; juniors argue high to get above the line."},
{"c":"restr","l":2,"t":"mc","q":"Lenders agree to an amend and extend because:","o":["They are required to","Pushing out maturity beats forcing a default that would crystallise a loss today","It reduces the interest rate","It converts debt to equity"],"a":1,"e":"If the business is viable but faces a near-term maturity it cannot refinance, extending buys time and usually earns the lenders a fee, higher margin and tighter terms. The criticism is that it can postpone rather than solve the problem."},
{"c":"restr","l":2,"t":"mc","q":"A company facing a large maturity in twelve months should first consider:","o":["Immediately filing for bankruptcy","Refinancing or extending, moving to more invasive options only if markets are closed","Liquidating assets","Paying a special dividend"],"a":1,"e":"You work from least to most disruptive: refinance, amend and extend, or a distressed exchange; then new money or asset sales; then a consensual swap; and only then a prepackaged filing. Acting early, while liquidity remains, preserves options."},
{"c":"restr","l":2,"t":"mc","q":"Adequate protection exists to:","o":["Guarantee full recovery to all creditors","Protect a secured creditor's collateral value while the automatic stay prevents enforcement","Give equity a recovery","Speed up liquidation"],"a":1,"e":"The stay removes the secured creditor's main remedy, so the code compensates with cash payments, replacement liens or a demonstrated equity cushion. It is the central early fight, especially over the use of cash collateral."},
{"c":"restr","l":2,"t":"mc","q":"A credit bid allows a secured creditor to:","o":["Force an immediate liquidation","Bid for the collateral using the face value of its debt rather than cash","Increase its interest rate","Vote in another creditor's class"],"a":1,"e":"It sets an effective floor on the sale price and gives lenders a route to owning the business outright. Buying the fulcrum debt cheaply and credit bidding to take the equity is the classic loan-to-own strategy."},
{"c":"restr","l":2,"t":"mc","q":"Covenant-lite loans have changed restructurings because:","o":["They default more quickly","Without maintenance covenants, lenders have no early trigger, so problems surface later with less value left","They eliminate interest","They require court supervision"],"a":1,"e":"Maintenance covenants were an early warning system that brought lenders to the table while enterprise value remained. Without them, companies burn liquidity for longer before anyone can intervene, so recoveries have tended to be lower."},
{"c":"restr","l":3,"t":"mc","q":"A creditor holding a claim that is 'out of the money' in a restructuring will typically:","o":["Receive par recovery","Receive equity in the reorganised company","Receive little or nothing and may be cancelled","Automatically become the fulcrum"],"a":2,"e":"If enterprise value runs out before reaching that claim in the waterfall, the claim is out of the money and receives little or nothing. Under absolute priority those holders can be cancelled entirely, though they often get a small recovery as consideration for not litigating."},
{"c":"restr","l":3,"t":"mc","q":"In a Chapter 11 plan vote, a class is deemed to accept if it is approved by:","o":["A simple majority of holders only","Two thirds in amount and more than one half in number of those voting","Unanimous consent","Any single creditor over 50%"],"a":1,"e":"The dual test is two thirds by dollar amount and a majority by number of claims actually voting in that class. The amount test is why a fund holding just over one third of a class can block confirmation of that class."},
{"c":"restr","l":3,"t":"mc","q":"In practice you identify the fulcrum security by:","o":["Asking the auditor","Estimating enterprise value and walking it down the claims waterfall until value is exhausted","Choosing the largest tranche","Taking the most junior claim always"],"a":1,"e":"You stack the claims in priority order against your enterprise value estimate. The class that is only partially covered is the fulcrum. Secondary market prices are a useful cross-check, since the fulcrum typically trades at a deep discount to par."},
{"c":"restr","l":3,"t":"mc","q":"Buyers like a section 363 sale because assets are acquired:","o":["At book value","Free and clear of most liens, claims and successor liability, with court approval","Without paying cash","Without any competitive process"],"a":1,"e":"Court approval delivers clean title and speed, which is why distressed buyers prefer it to a plan process. The trade-off is that it is subject to an auction with stalking horse protections, and secured lenders can credit bid."},
{"c":"restr","l":3,"t":"mc","q":"In a debt-for-equity swap, the immediate balance sheet effect is:","o":["Cash increases","Debt falls and equity rises, with no cash movement","Assets increase","Revenue increases"],"a":1,"e":"The exchange converts a liability into equity, so leverage falls without any cash leaving the business. There may be a gain on extinguishment if debt is retired below carrying value, and existing shareholders are heavily diluted or wiped out."},
{"c":"restr","l":3,"t":"mc","q":"Creditors usually prefer reorganisation over liquidation because:","o":["It is faster","Going-concern value normally exceeds the proceeds from selling assets piecemeal","It avoids court","It guarantees par recovery"],"a":1,"e":"A functioning business with customers, contracts and people is worth more intact than broken up, so the pool available to creditors is larger. Liquidation makes sense only when the business destroys value as a going concern."},
{"c":"restr","l":3,"t":"mc","q":"Liability management transactions are controversial because they typically:","o":["Require court approval","Move collateral or priority away from some existing lenders using gaps in loose documents","Increase recoveries for all creditors equally","Are illegal"],"a":1,"e":"Drop-down and uptier structures shift assets to unrestricted subsidiaries or elevate a cooperating lender group above others. Covenant-lite documents made them possible, and they have turned creditor groups against one another and produced extensive litigation."},
{"c":"restr","l":3,"t":"mc","q":"A rights offering in a reorganisation allows creditors to:","o":["Sell their claims to the debtor","Invest new money into the reorganised company, usually at a discount to plan value","Vote twice on the plan","Avoid dilution automatically"],"a":1,"e":"It raises the exit capital the company needs while letting creditors protect their position. A backstop party commits to take up any unsubscribed portion for a fee, which is itself a valuable and often contested piece of economics."},
{"c":"restr","l":3,"t":"mc","q":"Restructurings are usually triggered by liquidity rather than leverage because:","o":["Leverage is never a problem","A highly levered company survives while it can service its obligations; it fails when it cannot pay","Lenders ignore leverage","Leverage is not measurable"],"a":1,"e":"High leverage is sustainable as long as cash flow covers interest and maturities. The crisis arrives when a covenant breaks, a maturity lands, or cash runs short. That is why the thirteen-week cash flow forecast is the central document in a distressed situation."},
{"c":"restr","l":3,"t":"mc","q":"In a recovery waterfall, the correct order from first to last is:","o":["Equity, unsecured, secured, administrative","Administrative and DIP, secured, unsecured, then equity","Unsecured, secured, equity","Trade creditors, equity, secured"],"a":1,"e":"Super-priority DIP and administrative claims come first, then secured creditors to the extent of their collateral, then unsecured including trade and any deficiency claims, and equity receives only whatever remains, which is usually nothing."},
{"c":"restr","l":3,"t":"mc","q":"A distressed debt fund differs from a traditional lender in that it:","o":["Always wants cash repayment quickly","Bought the claim at a discount, so it will litigate, take equity and play for control","Never buys secured debt","Cannot vote on a plan"],"a":1,"e":"Buying at 45 cents makes par a 2.2x return, which changes every incentive. They have no relationship to protect, will hold out for equity in the reorganised business, and often build a blocking position above one third of a class to gain a veto."},
{"c":"restr","l":3,"t":"mc","q":"Plan valuations are heavily litigated because:","o":["Courts require three opinions","Enterprise value determines which class owns the reorganised equity","Auditors disagree","Valuation is illegal in bankruptcy"],"a":1,"e":"Senior creditors hire experts arguing for a low value so their claim absorbs all the equity; juniors argue for a high value to get above the fulcrum. The judge usually picks within the range, which is why most cases settle on a negotiated split."},
{"c":"restr","l":3,"t":"mc","q":"For a good business with a broken balance sheet, the most efficient solution is usually:","o":["Chapter 7 liquidation","A prepackaged Chapter 11 or consensual debt-for-equity swap","Selling all assets piecemeal","Doing nothing"],"a":1,"e":"The operating business is fine, so you fix the capital structure with minimum disruption. A prepack negotiates the deal first and uses the court only to bind holdouts, often completing in 30 to 60 days. Go fully out of court if the creditor group is small and aligned."},

/* ========================== MARKETS & CAPITAL MARKETS (32) ========================== */
{"c":"mkts","l":1,"t":"mc","q":"In an IPO, the greenshoe or over-allotment option allows the underwriters to:","o":["Cancel the offering if demand is weak","Sell up to 15% additional shares to stabilise the aftermarket","Set the price after trading begins","Buy shares at a discount for their own account"],"a":1,"e":"The greenshoe lets underwriters sell up to 15% more than the base deal. If the stock trades down they buy in the market to cover the short, supporting the price; if it trades up they exercise the option and take shares from the issuer."},
{"c":"mkts","l":1,"t":"mc","q":"Bookbuilding in an IPO refers to:","o":["Preparing the prospectus","Collecting investor demand at different price levels to set the final price","Auditing the financial statements","Registering shares with the regulator"],"a":1,"e":"During the roadshow, underwriters collect indications of interest specifying how many shares investors will buy at what price. The resulting demand curve, the book, determines the final price and the allocation."},
{"c":"mkts","l":1,"t":"mc","q":"A rights issue differs from a follow-on offering in that:","o":["It is offered to existing shareholders pro rata, usually at a discount","It can only be used by private companies","It does not dilute shareholders","It requires no regulatory filing"],"a":0,"e":"A rights issue gives existing holders the right to buy new shares in proportion to their current stake, at a discount to the market price. Shareholders who take up their rights are not economically diluted; those who do not can usually sell the rights."},
{"c":"mkts","l":1,"t":"mc","q":"The quiet period around an IPO restricts:","o":["Trading in the company's shares","Public communications by the company and its underwriters","The company's ability to sign contracts","The payment of dividends"],"a":1,"e":"The quiet period limits promotional public statements outside the prospectus, so that investors make decisions on the registered disclosure rather than on selective marketing. It also restricts underwriters from publishing research for a defined period after listing."},
{"c":"mkts","l":2,"t":"mc","q":"IPOs are typically priced at a discount to estimated fair value primarily to:","o":["Comply with regulation","Compensate investors for uncertainty and ensure a successful aftermarket","Reduce the underwriters' fees","Satisfy accounting standards"],"a":1,"e":"The deliberate discount, commonly 10% to 15%, rewards investors for taking on an unproven listed company and helps the stock trade up on day one. A broken IPO that trades below issue damages the company's ability to return to market."},
{"c":"mkts","l":2,"t":"mc","q":"A bond trading at a price above par implies its coupon is:","o":["Below the current market yield","Above the current market yield","Equal to the current market yield","Unrelated to market yield"],"a":1,"e":"Price and yield move inversely. A bond priced above par pays a coupon higher than what the market currently demands for that risk, so investors bid the price up until the yield to maturity matches the market rate."},
{"c":"mkts","l":2,"t":"mc","q":"A company's credit spread widens sharply while government yields are unchanged. This most likely reflects:","o":["A fall in inflation expectations","Deteriorating perceived credit risk at that company or sector","A change in central bank policy","An increase in the risk-free rate"],"a":1,"e":"The spread is the compensation for credit risk above the risk-free rate. If the benchmark is unchanged but the spread widens, the market is demanding more compensation for lending to that issuer specifically, implying higher perceived default risk."},
{"c":"mkts","l":2,"t":"mc","q":"An inverted yield curve means:","o":["Short-term rates exceed long-term rates","Long-term rates exceed short-term rates","Credit spreads have widened","Inflation expectations have risen"],"a":0,"e":"Inversion means shorter maturities yield more than longer ones, usually because the market expects policy rates to be cut in response to a slowdown. It has historically been one of the more reliable recession indicators, though with long and variable lags."},
{"c":"mkts","l":2,"t":"mc","q":"A block trade is best described as:","o":["A company issuing new shares to the public","A large existing shareholder selling a big stake, usually overnight","A regulator-mandated trading halt","A merger of two listed companies"],"a":1,"e":"A block trade is a secondary sale of existing shares by a large holder, often a sponsor or founder, typically executed overnight at a discount to the closing price via an accelerated bookbuild. No new shares are created, so there is no dilution."},
{"c":"mkts","l":2,"t":"mc","q":"A SPAC raises capital by:","o":["Selling shares in an operating business","Listing a shell company that later merges with a private target","Issuing high yield debt","Acquiring distressed loans"],"a":1,"e":"A special purpose acquisition company lists with no operations, holding investor cash in trust, then has a set window, usually 24 months, to find and merge with a private target. Shareholders can redeem rather than participate, which is what makes the structure fragile."},
{"c":"mkts","l":2,"t":"mc","q":"Duration measures a bond's:","o":["Time to maturity in years only","Price sensitivity to a change in interest rates","Probability of default","Coupon frequency"],"a":1,"e":"Duration is the approximate percentage change in price for a one percent change in yield. A bond with a duration of 7 falls about 7% if yields rise 100 basis points. It rises with maturity and falls with coupon size."},
{"c":"mkts","l":2,"t":"mc","q":"In a leveraged loan, a pricing flex provision allows:","o":["The borrower to reduce the interest rate at will","The arranger to adjust pricing or terms to clear the market during syndication","The lender to demand immediate repayment","The rating agency to change the rating"],"a":1,"e":"Flex lets the arranging bank move pricing, and sometimes structure, within agreed limits if the deal is not clearing at the launch terms. It is how banks protect themselves against underwriting risk, and the absence of flex is one reason borrowers pay up for private credit."},
{"c":"mkts","l":2,"t":"mc","q":"A company buying back its own shares in the open market will, all else equal:","o":["Increase EPS and reduce equity value","Reduce share count and increase EPS","Increase enterprise value","Increase the share count"],"a":1,"e":"A buyback reduces shares outstanding, so the same net income is divided over fewer shares and EPS rises. Equity value falls by the cash spent and net debt rises by the same amount, so enterprise value is unchanged."},
{"c":"mkts","l":2,"t":"mc","q":"An accelerated bookbuild is characterised by:","o":["A multi-week roadshow","Raising or placing equity within hours, usually overnight","A fixed price set months in advance","Retail-only distribution"],"a":1,"e":"An ABB launches after market close and prices before the next open, placing stock with institutions in a matter of hours. Speed reduces market risk and information leakage, at the cost of a wider discount and no retail participation."},
{"c":"mkts","l":2,"t":"mc","q":"A lock-up agreement after an IPO typically prevents:","o":["The company from issuing debt","Insiders from selling shares for a set period, commonly 180 days","Analysts from publishing research indefinitely","The underwriters from stabilising the price"],"a":1,"e":"Lock-ups stop insiders and pre-IPO holders from flooding the market immediately after listing, which would undermine the price. Expiry is a watched event, since a large volume of newly sellable stock often pressures the shares."},
{"c":"mkts","l":2,"t":"mc","q":"In an IPO, the final offer price is set:","o":["Months in advance in the prospectus","The night before trading, based on demand gathered in the bookbuild","By the regulator","On the first day of trading"],"a":1,"e":"A price range is published at roadshow launch, demand is collected over one to two weeks, and pricing and allocation are agreed the evening before listing, balancing proceeds against aftermarket performance and shareholder quality."},
{"c":"mkts","l":2,"t":"mc","q":"Under a firm commitment underwriting, the underwriters:","o":["Act only as agent with no capital at risk","Buy the entire issue and resell it, bearing the placement risk","Guarantee the share price for a year","Take equity in the issuer"],"a":1,"e":"The bank purchases the issue and resells it, earning the gross spread for taking that risk. Best efforts means acting only as agent with no guarantee, which appears in smaller or riskier offerings where no bank will take the book risk."},
{"c":"mkts","l":2,"t":"mc","q":"Which is the defining difference between investment grade and high yield debt?","o":["Maturity length","Credit rating, at the BBB minus / BB plus boundary, with all the pricing and covenant consequences","Currency of issue","Whether it is listed"],"a":1,"e":"Below the boundary, spreads widen sharply, covenants tighten, security and call protection appear, and the investor base shifts from ratings-constrained institutions to dedicated credit funds. A fall below it forces index holders to sell."},
{"c":"mkts","l":2,"t":"mc","q":"Companies issue convertible bonds mainly because:","o":["They never have to repay them","The embedded equity option allows a materially lower coupon","They avoid all dilution","They carry no covenants"],"a":1,"e":"Investors pay for the conversion option through yield, so the coupon is often several hundred basis points below straight debt. If the stock performs, the bond converts and the company has effectively sold equity at a premium to the issue-date price."},
{"c":"mkts","l":2,"t":"mc","q":"The purpose of a pitchbook is to:","o":["Educate the client neutrally","Argue for a course of action and for the bank's suitability to execute it","Satisfy regulators","Record historical financials"],"a":1,"e":"It is a persuasion document, which is why every page carries a message in its header and the analysis exists to support a recommendation. Most pitches never convert to a mandate, which is why materials are recycled and updated across clients."},
{"c":"mkts","l":2,"t":"mc","q":"Private credit has taken share from banks primarily because it offers:","o":["Lower interest rates","Speed and certainty of execution, with no syndication risk or flex","Government guarantees","Shorter maturities"],"a":1,"e":"A direct lender commits the whole financing with one counterparty and no market-flex risk, which is worth real money to a sponsor in a competitive auction. Borrowers pay several hundred basis points more for that certainty."},
{"c":"mkts","l":2,"t":"mc","q":"The most significant limitation of a fairness opinion is that:","o":["It is not written down","It says the price is fair, not best, and the adviser often has a fee contingent on closing","It is only valid for one day","It cannot be shown to shareholders"],"a":1,"e":"The range is usually wide enough to accommodate most plausible outcomes, and it relies on management projections the adviser does not independently verify. It supports the board's process rather than guaranteeing the outcome."},
{"c":"mkts","l":2,"t":"mc","q":"A broad auction rather than a targeted process generally trades:","o":["Speed for a lower price","Confidentiality and business disruption for a higher price through competition","Certainty for lower fees","Nothing, they are identical"],"a":1,"e":"Contacting a wide universe maximises competitive tension and usually the price, but leaks more, unsettles employees and customers, and exposes sensitive information to competitors. A targeted process reverses that trade-off."},
{"c":"mkts","l":2,"t":"mc","q":"A CIM differs from a prospectus principally in that a CIM:","o":["Is publicly filed","Is disclaimed and carries no statutory liability, so buyers must rely on their own diligence","Contains audited figures only","Is prepared by the regulator"],"a":1,"e":"A prospectus carries securities law liability and is weighted toward risk disclosure. A CIM is a selling document with management projections and adjusted EBITDA, explicitly not to be relied upon, which is exactly why buyers run quality-of-earnings work."},
{"c":"mkts","l":3,"t":"mc","q":"A company with a BBB rating is considering a large debt-funded acquisition that would push leverage to 4.5x. The most likely consequence is:","o":["No ratings impact","A downgrade to high yield, raising its cost of capital and narrowing its investor base","An automatic upgrade due to increased size","Regulatory prohibition of the deal"],"a":1,"e":"BBB is the lowest investment grade notch. Leverage at 4.5x is well outside investment grade tolerance for most sectors, so a downgrade to BB is likely. That forces index-constrained holders to sell and permanently raises funding costs, which is why such deals often include a commitment to deleverage."},
{"c":"mkts","l":3,"t":"mc","q":"A payment-in-kind toggle note allows the issuer to:","o":["Convert the note into equity at will","Choose between paying cash interest or accruing it into principal","Extend the maturity indefinitely","Repay early with no penalty"],"a":1,"e":"The toggle gives the issuer optionality to preserve cash by capitalising interest instead of paying it, usually at a higher rate. It appears in aggressive structures and is a signal of a borrower-friendly market, since it shifts liquidity risk to lenders."},
{"c":"mkts","l":3,"t":"mc","q":"The main reason rising rates reduce deal volume is:","o":["Companies stop needing advice","A bid-ask spread opens as sellers anchor on old valuations while buyers reprice to the new cost of capital","Regulators block deals","Banks close"],"a":1,"e":"Higher financing costs mean the same EBITDA supports less debt and larger equity cheques, depressing what buyers can pay. Until seller expectations adjust, which takes quarters, transactions simply do not clear."},
{"c":"mkts","l":3,"t":"mc","q":"From a buyer's perspective in a sell-side process, the first substantive document received after signing an NDA is:","o":["The purchase agreement","The confidential information memorandum","The audited accounts","The fairness opinion"],"a":1,"e":"The teaser comes first anonymously, then the NDA unlocks the CIM and a process letter. First-round indications follow, and only shortlisted bidders receive management presentations, data room access and a draft purchase agreement."},
{"c":"mkts","l":3,"t":"mc","q":"A dual-track process improves outcomes mainly by:","o":["Reducing adviser fees","Creating competitive tension, since buyers know a credible IPO alternative exists","Guaranteeing a higher IPO price","Avoiding due diligence"],"a":1,"e":"The IPO valuation becomes a floor in the M&A negotiation and removes the buyer's ability to argue no other exit exists. The costs are duplicated advisers and diligence, heavy management load, and disclosure buyers can use against you."},
{"c":"mkts","l":3,"t":"mc","q":"In a DCF, the most common technical error when modelling inflation is:","o":["Using nominal cash flows","Raising the discount rate for inflation without also inflating the cash flows","Using a long forecast period","Including working capital"],"a":1,"e":"Mixing a nominal discount rate with real cash flows systematically undervalues a business. Beyond the mechanics, the decisive business variable is pricing power: a company that can pass through input costs protects real margins."},
{"c":"mkts","l":3,"t":"mc","q":"M&A advisory fees are structured mainly as:","o":["A fixed monthly salary","A success fee on completion, on a sliding scale that falls as deal size rises","A percentage of the target's profits","An hourly rate"],"a":1,"e":"The bulk is contingent on closing, which is why deal teams are so focused on completion and why a fairness opinion from the same adviser carries a conflict. Restructuring is the exception, relying on monthly retainers because distressed clients cannot guarantee an outcome."},
{"c":"mkts","l":3,"t":"mc","q":"For an owner whose priority is full, immediate liquidity, the right route is:","o":["An IPO","A trade sale","A minority growth round","A rights issue"],"a":1,"e":"An IPO sells only a minority at listing, locks insiders up for six months, and leaves them selling down over years with market risk throughout. A trade sale delivers a complete exit at a single price, and a strategic may pay for synergies too."},

/* ========================== SECTORS (34) ========================== */
{"c":"sect","l":1,"t":"mc","q":"Which metric is most central to valuing a SaaS business?","o":["Gross margin alone","Annual recurring revenue and net revenue retention","Inventory turnover","Days payable outstanding"],"a":1,"e":"ARR measures the contracted recurring base and net revenue retention shows whether that base grows without new customers. Retention above 100% means the business compounds from existing customers alone, which is what justifies high revenue multiples."},
{"c":"sect","l":2,"t":"mc","q":"A SaaS company has net revenue retention of 120%. This means:","o":["It is losing 20% of customers","Existing customers spent 20% more this year than last, after churn","It grew total revenue 20%","Gross margin is 120%"],"a":1,"e":"NRR nets expansion and upsell against churn and downgrades within the existing cohort only. Above 100% the base grows even with zero new sales, which is why investors treat it as the single best predictor of durable growth."},
{"c":"sect","l":2,"t":"mc","q":"The rule of 40 for software states that:","o":["Growth must exceed 40%","Revenue growth plus free cash flow margin should exceed 40%","Gross margin must be 40%","Churn should be under 40%"],"a":1,"e":"It balances growth against profitability: a company growing 60% while burning 20% passes, as does one growing 15% at a 25% margin. It is a rough screen, but it captures the trade-off investors accept between the two."},
{"c":"sect","l":2,"t":"mc","q":"CAC payback period measures:","o":["Total marketing spend","The months of gross profit needed to recover the cost of acquiring a customer","Customer lifetime value","Annual churn"],"a":1,"e":"It is acquisition cost divided by monthly gross profit per new customer. Under 12 months is strong, over 24 suggests the model struggles. Using gross profit rather than revenue matters, since delivery costs are real."},
{"c":"sect","l":2,"t":"mc","q":"For a bank, the standard valuation approach is:","o":["EV/EBITDA","Price to book and price to earnings, benchmarked against return on equity","EV/sales","EV/EBITDAR"],"a":1,"e":"Enterprise value is meaningless for a bank, since debt is raw material rather than financing and cash is inventory. Price to book is anchored because assets are largely financial and marked near fair value, and it tracks ROE closely."},
{"c":"sect","l":2,"t":"mc","q":"Net interest margin for a bank measures:","o":["Total fee income","The spread between interest earned on assets and paid on funding, over earning assets","Operating expenses over revenue","Loan losses over loans"],"a":1,"e":"NIM is the core profitability measure of lending. It widens when rates rise if assets reprice faster than deposits, which is why rate sensitivity and deposit beta are central to bank analysis."},
{"c":"sect","l":2,"t":"mc","q":"CET1 ratio for a bank measures:","o":["Liquidity over 30 days","Core equity capital against risk-weighted assets","Loans over deposits","Net interest margin"],"a":1,"e":"It is the primary regulatory solvency measure. Because the denominator is risk-weighted, two banks with identical assets can have very different ratios depending on the riskiness of what they hold, which is why the weighting methodology is scrutinised."},
{"c":"sect","l":2,"t":"mc","q":"A telecom operator is commonly valued on:","o":["EV/EBITDA and EV per subscriber","Price to book","EV/ARR","Combined ratio"],"a":0,"e":"Telecoms are capital-intensive with heavy D&A, so EBITDA multiples dominate, cross-checked against enterprise value per subscriber. ARPU, churn and capex intensity including spectrum costs are the key operating drivers."},
{"c":"sect","l":2,"t":"mc","q":"ARPU in a subscription or telecom business stands for:","o":["Average revenue per user","Annual rate of profit utilisation","Adjusted return on paid usage","Average risk per unit"],"a":0,"e":"ARPU times subscribers gives revenue, so the two drivers of growth are adding users and increasing spend per user. Mature markets grow mainly through ARPU, which is why bundling and price rises dominate telecom strategy."},
{"c":"sect","l":2,"t":"mc","q":"Content production costs at a streaming company are usually:","o":["Expensed entirely when incurred","Capitalised and amortised over the expected viewing life","Treated as goodwill","Recorded as deferred revenue"],"a":1,"e":"Content is capitalised as an asset and amortised against expected viewership, typically front-loaded. That means cash spend on content far exceeds the amortisation charge in a growth phase, so EBITDA materially overstates cash generation."},
{"c":"sect","l":2,"t":"mc","q":"A pre-revenue biotech is typically valued using:","o":["EV/EBITDA","Risk-adjusted net present value, probability-weighting each drug by trial phase","Price to book","EV/subscriber"],"a":1,"e":"Each candidate is modelled to peak sales then discounted, with the cash flows multiplied by the probability of technical and regulatory success at its phase. Phase 1 success rates are around 10%, rising sharply by Phase 3."},
{"c":"sect","l":2,"t":"mc","q":"Biologics face less severe generic erosion than small molecule drugs because:","o":["They have longer patents","Biosimilars are harder and costlier to manufacture and approve, so competition is slower","They are not regulated","They are cheaper"],"a":1,"e":"A biosimilar is not an identical copy and requires its own clinical work and complex manufacturing, so fewer entrants appear and price erosion is more gradual. That durability is a key reason biologics command premium valuations."},
{"c":"sect","l":2,"t":"mc","q":"Same-store sales growth for a retailer is important because it:","o":["Includes new store openings","Strips out the effect of new openings to show underlying demand","Measures total revenue","Reflects inventory levels"],"a":1,"e":"Total revenue can grow purely by opening stores, which masks a deteriorating base. Comparable or like-for-like sales isolate the performance of existing locations, which is the cleanest read on brand health and traffic."},
{"c":"sect","l":2,"t":"mc","q":"For a retailer, a rising inventory balance relative to sales usually signals:","o":["Improving demand","Slowing sell-through and a likely markdown or write-down ahead","Higher gross margin","Reduced working capital"],"a":1,"e":"Inventory outrunning sales means product is not moving, and in fashion or seasonal categories that almost always ends in discounting. It is one of the most reliable early warnings of a margin miss."},
{"c":"sect","l":2,"t":"mc","q":"The standard earnings metric for a REIT is:","o":["Net income","Funds from operations, which adds back real estate depreciation","EBITDA","Gross profit"],"a":1,"e":"Property depreciation is a large non-cash charge that does not reflect economic reality, since well-maintained real estate tends to appreciate. FFO adds it back and removes property sale gains. AFFO further deducts maintenance capex and is closer to distributable cash."},
{"c":"sect","l":2,"t":"mc","q":"Net operating income for a property is calculated before:","o":["Property taxes","Debt service, depreciation and capital expenditure","Vacancy losses","Operating expenses"],"a":1,"e":"NOI is rental income less operating expenses, vacancy and property taxes, but before financing and capital items. That makes it capital-structure neutral, which is why it is the standard input for cap rate valuation."},
{"c":"sect","l":2,"t":"mc","q":"A cyclical industrial business is best valued on:","o":["Peak earnings times a peak multiple","Mid-cycle normalised earnings and a through-the-cycle multiple","Book value only","Current quarter annualised"],"a":1,"e":"Applying a peak multiple to peak earnings compounds the error in both directions across the cycle. You normalise margins over a full cycle and cross-check with price to book or enterprise value per unit of capacity, which are more stable."},
{"c":"sect","l":2,"t":"mc","q":"Backlog is an important metric for industrials and engineering firms because it:","o":["Measures past performance","Provides visibility on contracted future revenue","Reflects inventory value","Shows the dividend capacity"],"a":1,"e":"Backlog is work already won but not yet delivered, so it underpins forward revenue. Analysts watch the book-to-bill ratio: above one means orders exceed deliveries and backlog is building, which is a leading indicator of growth."},
{"c":"sect","l":2,"t":"mc","q":"In oil and gas, proved reserves differ from probable reserves in that proved are:","o":["Larger in volume always","Reasonably certain to be recoverable under existing conditions, conventionally at 90% confidence","Not yet discovered","Owned by the government"],"a":1,"e":"Proved reserves, or 1P, carry roughly 90% confidence. Adding probable gives 2P at around 50%, and adding possible gives 3P at about 10%. Valuation weights them by certainty, with proved developed producing reserves carrying the most value."},
{"c":"sect","l":2,"t":"mc","q":"A midstream pipeline business typically has:","o":["Direct commodity price exposure","Fee-based, often take-or-pay contracted revenue with stable cash flows","No fixed assets","Highly variable margins"],"a":1,"e":"Volume-based tariffs under long-term contracts make midstream far more stable than upstream, which is why these assets support high leverage and are often held in yield-focused structures. The main risks are volume and counterparty credit."},
{"c":"sect","l":2,"t":"mc","q":"For a subscription consumer business, the most important early warning metric is:","o":["Total revenue","Churn rate","Headcount","Gross square footage"],"a":1,"e":"Churn determines customer lifetime and therefore the return on acquisition spend. Rising churn is often masked by aggressive new customer acquisition in headline revenue, so it is where deterioration appears first."},
{"c":"sect","l":3,"t":"mc","q":"Why is a naive DCF particularly misleading for a fast-growing SaaS business?","o":["Software has no cash flows","Sales and marketing is expensed immediately but is really an investment in future recurring revenue","Discount rates do not apply","Revenue is not recognised"],"a":1,"e":"Current free cash flow is depressed by spending that creates a multi-year revenue stream, so the business looks value-destroying while compounding. The fix is cohort modelling, or normalising sales and marketing to a maintenance level to find the steady-state margin."},
{"c":"sect","l":3,"t":"mc","q":"A bank trading below one times tangible book value most likely implies the market expects:","o":["Return on equity below the cost of equity","Rapid asset growth","A dividend increase","Falling loan losses"],"a":0,"e":"The relationship between price to book and ROE is tight. Earning below the cost of equity means each retained dollar is worth less than a dollar, so the market discounts book. It can also signal doubt about asset marks."},
{"c":"sect","l":3,"t":"mc","q":"For an insurer, the combined ratio measures:","o":["Investment returns","Claims plus expenses as a percentage of premiums, where under 100% means an underwriting profit","Total assets over equity","Premium growth"],"a":1,"e":"A combined ratio of 95% means the insurer earned five cents of underwriting profit per premium dollar before investment income. Above 100% means underwriting loses money and the insurer relies on its investment float to be profitable."},
{"c":"sect","l":3,"t":"mc","q":"A rising provision for credit losses at a bank most directly signals:","o":["Higher fee income","Expected future loan defaults, which reduces current earnings","Increased deposits","Lower capital requirements"],"a":1,"e":"Provisions are forward-looking estimates charged against current earnings. Rising provisions signal deteriorating credit expectations, and because the estimate is judgemental, it is also a lever management can use to smooth reported results."},
{"c":"sect","l":3,"t":"mc","q":"A media company shifting from linear TV to streaming typically sees:","o":["Immediate margin expansion","Near-term margin compression from content spend and subscriber acquisition costs","No change in economics","Lower content costs"],"a":1,"e":"Streaming front-loads content investment and marketing while revenue builds subscriber by subscriber, whereas linear delivered high-margin advertising and affiliate fees immediately. The market evaluates the transition on subscriber growth and churn rather than near-term profit."},
{"c":"sect","l":3,"t":"mc","q":"A patent cliff for a pharmaceutical company means:","o":["A patent has been granted","Exclusivity expires and generic entry causes a rapid collapse in that drug's revenue","R&D spending increases","The drug failed trials"],"a":1,"e":"Small molecule drugs often lose the large majority of revenue within a year of generic entry. It is why pharma valuation focuses on the pipeline replacing expiring revenue, and why patent expiry dates drive M&A timing."},
{"c":"sect","l":3,"t":"mc","q":"For a healthcare services provider, payer mix matters because:","o":["It determines the tax rate","Reimbursement rates differ sharply between government and commercial payers","It sets the share count","It affects depreciation"],"a":1,"e":"Commercial insurance typically reimburses well above Medicare or Medicaid rates for the same procedure, so two providers with identical volumes can have very different margins. A shift in mix moves profitability without any operational change."},
{"c":"sect","l":3,"t":"mc","q":"A capitalisation rate in real estate is:","o":["Net operating income divided by property value","Property value divided by rent","The interest rate on the mortgage","The vacancy percentage"],"a":0,"e":"The cap rate is the unlevered yield on a property, effectively the inverse of a multiple. A lower cap rate means a higher valuation, and cap rates move with interest rates, which is why rising rates depress property values directly."},
{"c":"sect","l":3,"t":"mc","q":"In real estate private equity, a core investment strategy is characterised by:","o":["Ground-up development with high risk","Stabilised, well-leased assets with modest leverage and lower target returns","Distressed asset purchases","Converting property types"],"a":1,"e":"Core sits at the low end of the risk spectrum, with income-driven returns from stabilised assets. Core-plus, value-add and opportunistic move progressively toward leasing risk, repositioning and development, with higher leverage and return targets."},
{"c":"sect","l":3,"t":"mc","q":"Oil and gas exploration and production companies are commonly valued on:","o":["Net asset value based on proved reserves, plus EV per flowing barrel","Price to book only","EV/ARR","Combined ratio"],"a":0,"e":"The core method is a reserve-based NAV discounting production from proved reserves at strip pricing, usually at a standardised discount rate. EV per flowing barrel and EV per barrel of reserves serve as market cross-checks."},
{"c":"sect","l":3,"t":"mc","q":"An upstream oil producer's earnings are most directly exposed to:","o":["Refining crack spreads","The realised commodity price against a largely fixed cost base","Retail fuel margins","Pipeline tariffs"],"a":1,"e":"Upstream costs per barrel are relatively fixed, so a price move flows almost entirely to profit, giving extreme operating leverage. Midstream earns fee-based tariffs and downstream earns on crack spreads, so each segment has a different exposure."},
{"c":"sect","l":3,"t":"mc","q":"A consumer staples business typically trades at a premium to a consumer discretionary one because:","o":["It grows faster","Demand is less cyclical, so cash flows are more predictable","It has higher gross margins always","It uses less capital"],"a":1,"e":"People buy food and household products through a recession, while discretionary purchases are deferred. Lower earnings volatility means lower risk and a higher multiple, even though discretionary businesses often grow faster in an upturn."},
{"c":"sect","l":3,"t":"mc","q":"A semiconductor manufacturer with its own fabs differs from a fabless designer mainly in:","o":["Product quality","Capital intensity and operating leverage, since fabs are enormous fixed-cost assets","Patent ownership","Customer relationships"],"a":1,"e":"An integrated manufacturer carries multi-billion dollar fab costs, so utilisation drives margins and downturns are brutal. A fabless designer outsources production, keeping capital intensity low and margins steadier, but depends on foundry capacity and pricing."},

/* ========================== BRAIN TEASERS (34) ========================== */
{"c":"brain","l":1,"t":"mc","q":"A bat and a ball cost $1.10 together. The bat costs $1.00 more than the ball. How much does the ball cost?","o":["$0.10","$0.05","$0.11","$0.01"],"a":1,"e":"If the ball is x, the bat is x + 1.00, so 2x + 1.00 = 1.10 and x = 0.05. The intuitive answer of $0.10 would make the total $1.20."},
{"c":"brain","l":1,"t":"mc","q":"You have 8 balls, one of which is slightly heavier. Using a balance scale, what is the minimum number of weighings to guarantee finding it?","o":["1","2","3","4"],"a":1,"e":"Weigh 3 against 3. If they balance, the heavy ball is in the remaining 2 and one more weighing finds it. If not, take the heavier 3 and weigh 1 against 1."},
{"c":"brain","l":1,"t":"mc","q":"What is the angle between the hour and minute hands at 3:15?","o":["0 degrees","7.5 degrees","15 degrees","22.5 degrees"],"a":1,"e":"The minute hand is at 90 degrees. The hour hand has moved a quarter past 3, so 3.25 x 30 = 97.5 degrees. The difference is 7.5 degrees."},
{"c":"brain","l":1,"t":"mc","q":"A fair coin lands heads 10 times in a row. What is the probability the next flip is heads?","o":["Less than 50%","Exactly 50%","More than 50%","Cannot be determined"],"a":1,"e":"Flips are independent, so the prior run tells you nothing. Assuming a genuinely fair coin, it stays at 50%. Interviewers use this to check you do not fall for the gambler's fallacy."},
{"c":"brain","l":1,"t":"mc","q":"You roll two fair dice. What is the probability the total is 7?","o":["1/12","1/6","1/8","5/36"],"a":1,"e":"Six of the thirty-six combinations sum to seven, which is 1/6. Seven is the most likely total on two dice."},
{"c":"brain","l":1,"t":"mc","q":"You flip a fair coin three times. What is the probability of at least one head?","o":["1/2","5/8","3/4","7/8"],"a":3,"e":"The only excluded outcome is three tails, which has probability 1/8. So 1 - 1/8 = 7/8."},
{"c":"brain","l":1,"t":"mc","q":"A shirt is marked up 25% and then discounted 20% off the marked price. The final price versus the original is:","o":["5% higher","Exactly the same","5% lower","20% lower"],"a":1,"e":"Start at 100. Up 25% gives 125. Down 20% of 125 is 25, giving 100. The percentages offset exactly because 1.25 times 0.80 equals 1.00. Successive percentage changes multiply, they do not add."},
{"c":"brain","l":1,"t":"mc","q":"Using the rule of 72, roughly how long does money take to double at an 8% annual return?","o":["6 years","9 years","12 years","15 years"],"a":1,"e":"The rule of 72 divides 72 by the annual percentage return to approximate the doubling period. 72 divided by 8 is 9 years. It is accurate enough for mental maths between about 5% and 15%, and it is the fastest way to sanity-check an IRR in an interview."},
{"c":"brain","l":2,"t":"mc","q":"You have two ropes, each burning for exactly 60 minutes but at an uneven rate. How do you measure 45 minutes?","o":["Light one rope at one end, then the second","Light rope one at both ends and rope two at one end; when rope one finishes, light rope two's other end","Cut both ropes in half","It cannot be done"],"a":1,"e":"Rope one burning from both ends finishes in 30 minutes. Rope two has 30 minutes left at that point, and lighting its second end halves that to 15. Total 45."},
{"c":"brain","l":2,"t":"mc","q":"A car drives 60km at 30km/h and returns the same 60km at 60km/h. What is the average speed for the trip?","o":["45 km/h","40 km/h","50 km/h","35 km/h"],"a":1,"e":"Total distance 120km, total time 2 + 1 = 3 hours, so 40 km/h. Averaging the two speeds gives 45 and is the trap."},
{"c":"brain","l":2,"t":"mc","q":"How many times do the hour and minute hands of a clock overlap in 24 hours?","o":["24","23","22","12"],"a":2,"e":"They overlap 11 times in each 12-hour cycle, not 12, because the hour hand keeps moving. That gives 22 in a day."},
{"c":"brain","l":2,"t":"mc","q":"Three switches outside a room control three bulbs inside. You may enter once. How do you identify which switch controls which bulb?","o":["It cannot be done","Turn on switch one for several minutes then off, turn on switch two, then enter: lit is two, warm is one, cold is three","Turn on all three and enter immediately","Turn on switches one and two together"],"a":1,"e":"The trick is using heat as a second signal alongside light, which gives you three distinguishable states from one observation."},
{"c":"brain","l":2,"t":"mc","q":"A stock falls 50%. What percentage gain is needed to get back to the starting price?","o":["50%","75%","100%","150%"],"a":2,"e":"From 100 down to 50, you need to gain 50 on a base of 50, which is 100%. This asymmetry is why drawdowns matter so much in investing: a 90% loss requires a 900% gain to recover."},
{"c":"brain","l":2,"t":"mc","q":"You have a 3-litre jug and a 5-litre jug and need exactly 4 litres. What is the minimum number of pours?","o":["3","6","8","It is impossible"],"a":1,"e":"Fill the 5, pour into the 3 leaving 2 in the 5-litre. Empty the 3, move the 2 litres into it, refill the 5, then top up the 3-litre which takes 1 more, leaving exactly 4 in the 5-litre jug. Six operations."},
{"c":"brain","l":2,"t":"mc","q":"What is the probability that two people in a room of 23 share a birthday?","o":["About 6%","About 23%","About 50%","About 90%"],"a":2,"e":"The birthday paradox. You compute the complement: the probability everyone is distinct is 365/365 times 364/365 and so on, which falls below 50% at 23 people. The count of pairs, 253, grows much faster than the number of people."},
{"c":"brain","l":2,"t":"mc","q":"A rope ladder hangs over the side of a ship, with rungs 30cm apart and 5 rungs above the water. The tide rises 90cm. How many rungs are above water now?","o":["2","3","5","8"],"a":2,"e":"The ship floats, so it rises with the tide and the ladder rises with it. Five rungs remain above water. The question tests whether you notice the physical setup rather than doing the arithmetic you were invited to do."},
{"c":"brain","l":2,"t":"mc","q":"A company's revenue grows 15% a year. Using the rule of 72, roughly how long until revenue doubles?","o":["Under 5 years","About 7 years","About 10 years","About 15 years"],"a":0,"e":"72 divided by 15 is 4.8, so just under 5 years. The exact figure is 4.96 years, so the approximation is close. Being able to do this instantly is useful for sanity-checking growth assumptions in a model."},
{"c":"brain","l":2,"t":"mc","q":"Roughly how many golf balls fit inside a standard school bus?","o":["About 5,000","About 500,000","About 50 million","About 500"],"a":1,"e":"A bus is roughly 12m by 2.5m by 2m, or about 60 cubic metres. A golf ball with packing inefficiency occupies roughly 100 cubic centimetres, so about 600,000 fit, less seats and wheel arches. The method matters far more than the number."},
{"c":"brain","l":2,"t":"mc","q":"Norway has about 5.5 million people. Roughly how many petrol stations would you estimate?","o":["About 150","About 1,500","About 15,000","About 150,000"],"a":1,"e":"Roughly 2.5 million cars, each refuelling about once a week, gives 2.5 million fills weekly. A station handling around 300 fills a day does about 2,000 a week, implying around 1,250 to 1,500 stations. The actual figure is close to this."},
{"c":"brain","l":2,"t":"mc","q":"Why are manhole covers round?","o":["Round is cheaper to manufacture","A circle cannot fall through its own opening, unlike a square through its diagonal","Roads are circular","Regulations require it"],"a":1,"e":"A square cover can be turned diagonally and dropped through the hole; a circle has constant width so it cannot. Round covers also need no alignment and can be rolled. The question tests structured reasoning rather than knowledge."},
{"c":"brain","l":2,"t":"mc","q":"Oslo has roughly 700,000 people. Roughly how many windows would you estimate in the city?","o":["About 100,000","About 5 million","About 500 million","About 5 billion"],"a":1,"e":"Around 300,000 households averaging perhaps 8 windows gives 2.4 million residential windows. Add commercial, schools and public buildings, perhaps doubling it, so roughly 5 million. Any answer in the low millions with a clear method is defensible."},
{"c":"brain","l":2,"t":"mc","q":"Roughly how many full-time piano tuners would you estimate in Oslo?","o":["About 2","About 20","About 200","About 2,000"],"a":1,"e":"Roughly 300,000 households, perhaps 1 in 25 with a piano, gives 12,000 plus institutional instruments. Tuned about annually, against a tuner doing roughly 700 tunings a year, implies 15 to 20 people. The classic Fermi problem."},
{"c":"brain","l":2,"t":"mc","q":"Revenue grew 21% over two years. What was the compound annual growth rate?","o":["10.5%","10.0%","21.0%","11.0%"],"a":1,"e":"The square root of 1.21 is exactly 1.10, so 10%. It is not 10.5% because growth compounds: 100 to 110 to 121, where the extra 1 is second-year growth on the first year's gain. Always quote CAGR rather than averaging annual rates."},
{"c":"brain","l":3,"t":"mc","q":"You have two identical eggs and a 100-floor building, and want to find the highest floor an egg survives, minimising drops in the worst case. What is the optimal worst case?","o":["10 drops","14 drops","20 drops","50 drops"],"a":1,"e":"Start at floor 14 and reduce the step by one each time (14, 27, 39...). That balances the two search phases so the worst case is 14 either way."},
{"c":"brain","l":3,"t":"mc","q":"You have 100 coins on a table, 10 showing heads, in a completely dark room. You must split them into two piles with an equal number of heads. What do you do?","o":["Impossible without light","Split 50-50 at random","Take any 10 coins as one pile and flip all of them","Take 10 coins and leave them as they are"],"a":2,"e":"Take any 10 coins into a new pile. If it contains h heads, the other pile has 10 minus h heads. Flipping all 10 in the small pile turns its h heads into 10 minus h heads. Both piles now match, for any h."},
{"c":"brain","l":3,"t":"mc","q":"Two trains 100km apart approach each other at 50km/h each. A bird flies at 80km/h between them until they meet. How far does the bird fly?","o":["80km","100km","160km","Infinite"],"a":0,"e":"Do not sum the infinite series. The trains close at a combined 100km/h over 100km, so they meet after exactly 1 hour. The bird flies for 1 hour at 80km/h, so it covers 80km. Reframing to elapsed time is the whole trick."},
{"c":"brain","l":3,"t":"mc","q":"You have 10 bags of coins. Nine contain 10g coins, one contains 9g coins. Using a digital scale ONCE, how do you find the light bag?","o":["Impossible with one weighing","Take 1 coin from each bag","Take 1 coin from bag 1, 2 from bag 2, up to 10 from bag 10","Weigh all bags together"],"a":2,"e":"Taking 1 from bag 1, 2 from bag 2 and so on gives 55 coins weighing 550g if all were 10g. The shortfall in grams tells you the bag number directly: a 3g shortfall means bag 3 is the light one."},
{"c":"brain","l":3,"t":"mc","q":"You roll a fair die repeatedly until you get a 6. What is the expected number of rolls?","o":["3","5","6","36"],"a":2,"e":"For a geometric distribution the expected number of trials is 1 divided by the probability of success. With probability one sixth, the expectation is 6 rolls. The intuition is that in the long run one roll in six is a success, so on average you wait six."},
{"c":"brain","l":3,"t":"mc","q":"Roughly what annual revenue does a single busy Starbucks store generate?","o":["About $150,000","About $1.5m","About $15m","About $50m"],"a":1,"e":"Say 500 customers a day at an average ticket of roughly $8, which is $4,000 daily, times 360 days, giving about $1.4m. Published averages for the chain sit close to this. State the assumptions and the arithmetic out loud."},
{"c":"brain","l":3,"t":"mc","q":"Estimating the Norwegian out-of-home coffee market, the right first step is:","o":["Look up the answer","Size the drinking population, cups per person per week, and average price","Guess a round number","Use the GDP of Norway"],"a":1,"e":"About 4 million adults drinking roughly 3 out-of-home cups a week at around 40 kroner gives about 25 billion kroner a year. Build from population, frequency and price, then sanity-check per capita, since Norway has among the highest coffee consumption globally."},
{"c":"brain","l":3,"t":"mc","q":"Roughly what annual fare revenue does the Oslo metro generate?","o":["About 100m kroner","About 2 to 3 billion kroner","About 50 billion kroner","About 500m kroner"],"a":1,"e":"Roughly 100 million journeys a year at an effective fare of perhaps 25 kroner, once season tickets are averaged in, gives about 2.5 billion kroner. The effective fare is well below the single-ticket price, which is the assumption most candidates miss."},
{"c":"brain","l":3,"t":"mc","q":"Roughly what does an empty Boeing 747 weigh?","o":["About 20 tonnes","About 180 tonnes","About 1,000 tonnes","About 5 tonnes"],"a":1,"e":"Build it up: around 400 passengers plus baggage is roughly 40 tonnes, fuel for a long haul is over 100 tonnes, and maximum takeoff weight is close to 400 tonnes. Working back, the empty operating weight is roughly 180 tonnes."},
{"c":"brain","l":3,"t":"mc","q":"Roughly how large is the global luxury watch market annually?","o":["About $6bn","About $60bn","About $600bn","About $600m"],"a":1,"e":"Swiss watch exports alone run around $25bn at export value, roughly doubling at retail, plus German, Japanese and independent brands. A bottom-up build of buyers times replacement rate times average price lands in the same $55bn to $70bn region."},
{"c":"brain","l":3,"t":"mc","q":"Roughly what annual revenue does a large European hub airport with 30 million passengers generate?","o":["About 75m euros","About 750m euros","About 7.5bn euros","About 25m euros"],"a":1,"e":"Aeronautical charges of roughly 15 to 20 euros per departing passenger on 15 million departures gives around 275m. Commercial revenue from retail, food and parking adds perhaps 10 to 20 euros per passenger across all 30 million, so roughly 750m in total."},
];

/* Stable ids: hashed from category + question text, so progress survives any
   reordering or insertion of questions. */
const QUESTIONS = BANK.map((x, i) => ({ ...x, id: qid(x), ord: i }));


</script>
<script>
/* ============================ The Drill Room ============================ */
const CATS = [
  { k:"acct",  n:"Accounting",         d:"Three statements, working capital, write-downs" },
  { k:"ev",    n:"Enterprise Value",   d:"EV vs equity value, dilution, multiples" },
  { k:"val",   n:"Valuation",          d:"Comps, precedents, methodology selection" },
  { k:"dcf",   n:"DCF",                d:"UFCF, WACC, terminal value, sensitivities" },
  { k:"ma",    n:"M&A / Merger Model", d:"Accretion, purchase accounting, synergies" },
  { k:"lbo",   n:"LBO",                d:"Returns, leverage, debt schedule, exits" },
  { k:"restr", n:"Restructuring",      d:"Chapter 11, fulcrum security, recoveries" },
  { k:"mkts",  n:"Markets & Capital",  d:"IPOs, debt markets, deal process, rates" },
  { k:"sect",  n:"Sectors",            d:"SaaS, FIG, healthcare, retail, real estate, energy" },
  { k:"brain", n:"Brain Teasers",      d:"Market sizing, logic, mental maths" },
];
const CATNAME = Object.fromEntries(CATS.map(c => [c.k, c.n]));
const LVLNAME = { 1:"Easy", 2:"Medium", 3:"Hard" };
const K_STATS = "ib400-stats-v2", K_OLDSTATS = "ib400-stats-v1",
      K_FLAGS = "ib400-flags-v1", K_DAYS = "ib400-days-v1", K_THEME = "ib400-theme",
      K_RESUME = "ib400-resume-v1", K_NAME = "ib400-name", K_SETS = "ib400-sets-v1";

const LOGO = `<svg width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Drill 400">
  <rect x=".75" y=".75" width="46.5" height="46.5" rx="11.5" fill="var(--surf2)" stroke="var(--line2)" stroke-width="1.5"/>
  <path d="M12 13h24l-4 6.4H16z" fill="var(--brassDim)"/>
  <path d="M17.4 21.6h13.2l-3 6H20.4z" fill="#A8874A"/>
  <path d="M21.6 29.8h4.8L24 37z" fill="var(--brass)"/>
</svg>`;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ls = {
  get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k)    { try { localStorage.removeItem(k); } catch {} },
};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = () => new Date().toISOString().slice(0, 10);
const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const byOrd = Object.fromEntries(QUESTIONS.map(q => [q.ord, q]));

/* ---------------------------- multiplayer ----------------------------
   Two link types, both carrying the whole set in the URL hash so there is
   no server involved:
     #m=name~ords              an invite — nobody has played it yet
     #c=name~right~total~ords  a result — the sender's score on that set
   Your own score for each set is kept locally, so when a result link comes
   back for a set you have already played, the comparison is immediate. */
const b36 = n => n.toString(36).padStart(3, "0");
const encodeDeck = deck => deck.map(q => b36(q.ord)).join("");
function decodeDeck(ords) {
  const deck = [];
  for (let i = 0; i + 3 <= ords.length; i += 3) {
    const q = byOrd[parseInt(ords.slice(i, i + 3), 36)];
    if (q) deck.push(q);
  }
  return deck;
}
function setKey(ords) {
  let h = 2166136261;
  for (let i = 0; i < ords.length; i++) { h ^= ords.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
const myResults = () => ls.get(K_SETS, {});
function saveMyResult(key, right, total) {
  if (!key) return;
  const all = myResults();
  all[key] = { right, total, at: Date.now() };
  ls.set(K_SETS, all);
}
const base = () => location.href.split("#")[0];

/* An invite for a set that has not been played yet. */
function makeInviteLink(deck) {
  return base() + "#m=" + encodeURIComponent([S.name || "", encodeDeck(deck)].join("~"));
}
/* A result for the set just played. */
function makeChallengeLink() {
  const deck = S.log.map(e => byId[e.id]).filter(Boolean);
  const right = S.log.filter(e => e.correct).length;
  return base() + "#c=" + encodeURIComponent([S.name || "", right, S.log.length, encodeDeck(deck)].join("~"));
}

function readLink() {
  const h = location.hash;
  try {
    let m = /^#m=(.+)$/.exec(h);
    if (m) {
      const [name, ords] = decodeURIComponent(m[1]).split("~");
      const deck = decodeDeck(ords || "");
      if (!deck.length) return null;
      return { kind: "invite", name: (name || "").trim() || "Your friend", deck, key: setKey(ords) };
    }
    m = /^#c=(.+)$/.exec(h);
    if (m) {
      const [name, right, total, ords] = decodeURIComponent(m[1]).split("~");
      const deck = decodeDeck(ords || "");
      if (!deck.length) return null;
      const key = setKey(ords);
      return { kind: "result", name: (name || "").trim() || "Your friend",
               right: +right || 0, total: +total || deck.length, deck, key, mine: myResults()[key] || null };
    }
  } catch { return null; }
  return null;
}

/* Stats used to be keyed by array index. Ids are now hashed from the question
   text, so migrate once using the original ordering held in `ord`. */
function loadStats() {
  const cur = ls.get(K_STATS, null);
  if (cur) return cur;
  const old = ls.get(K_OLDSTATS, null);
  const out = {};
  if (old) {
    for (const [k, v] of Object.entries(old)) {
      const q = QUESTIONS.find(x => String(x.ord) === String(k));
      if (q) out[q.id] = v;
    }
    ls.set(K_STATS, out);
  }
  return out;
}

const S = {
  cat: "all", lvl: 0, len: 10,
  stats: loadStats(),
  flags: new Set(ls.get(K_FLAGS, [])),
  theme: ls.get(K_THEME, null),
  deck: [], idx: 0, log: [], startedAt: 0, openRev: null,
  name: ls.get(K_NAME, ""), chal: null, chalActive: null, shareOpen: false, shareMsg: "",
  setKey: null, mpOpen: false, mpMsg: "", mpLink: "", invite: null,
  picked: null,
};

/* ------------------------------- theme ------------------------------- */
function applyTheme() {
  const t = S.theme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "light" ? "#F4F1E9" : "#0D1512");
  return t;
}
function toggleTheme() { S.theme = applyTheme() === "light" ? "dark" : "light"; ls.set(K_THEME, S.theme); applyTheme(); renderHome(); }

const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
const saveStats = () => ls.set(K_STATS, S.stats);
const saveFlags = () => ls.set(K_FLAGS, [...S.flags]);
const weakIds = () => Object.keys(S.stats).filter(id => S.stats[id].wrong > 0 && byId[id]);

/* --------------------------- progress model --------------------------- */
const seenCount  = () => Object.keys(S.stats).filter(id => byId[id] && S.stats[id].seen > 0).length;
const isMastered = id => { const s = S.stats[id]; return !!s && s.seen > 0 && s.wrong === 0; };
const masteredIn = k => QUESTIONS.filter(q => (k === "all" || q.c === k) && isMastered(q.id)).length;
function accuracy() {
  let seen = 0, wrong = 0;
  for (const id of Object.keys(S.stats)) { if (!byId[id]) continue; seen += S.stats[id].seen; wrong += S.stats[id].wrong; }
  return seen ? Math.round((seen - wrong) / seen * 100) : 0;
}
function markDay() {
  const d = ls.get(K_DAYS, []);
  if (d[d.length - 1] !== today()) { d.push(today()); ls.set(K_DAYS, d.slice(-400)); }
}
function streak() {
  const d = ls.get(K_DAYS, []);
  if (!d.length) return 0;
  const set = new Set(d), day = 86400000;
  let cur = new Date(today() + "T00:00:00Z").getTime(), n = 0;
  if (!set.has(new Date(cur).toISOString().slice(0, 10))) cur -= day;  // yesterday still counts
  while (set.has(new Date(cur).toISOString().slice(0, 10))) { n++; cur -= day; }
  return n;
}

function pool() {
  const weak = new Set(weakIds());
  return QUESTIONS.filter(q =>
    (S.cat === "all" || (S.cat === "weak" ? weak.has(String(q.id))
                       : S.cat === "flag" ? S.flags.has(q.id) : q.c === S.cat)) &&
    (S.lvl === 0 || q.l === S.lvl));
}

/* ================================ HOME ================================ */
function inviteCard() {
  const c = S.chal;
  if (!c) return "";
  if (c.kind === "invite") {
    return `<div class="resume">
      <p><b>${esc(c.name)} invited you to a set.</b> ${c.deck.length} question${c.deck.length === 1 ? "" : "s"}, the same ones in the same order for both of you.</p>
      <div class="row"><button class="btn pri" id="acceptchal">Start the set</button><button class="btn" id="skipchal">Not now</button></div>
    </div>`;
  }
  // a result came back
  if (c.mine) {
    const myPct = c.mine.total ? c.mine.right / c.mine.total : 0;
    const theirPct = c.total ? c.right / c.total : 0;
    const iWin = myPct > theirPct, tie = myPct === theirPct;
    return `<div class="resume">
      <p><b>${esc(c.name)} finished your set.</b></p>
      <div class="vs" style="margin-top:12px">
        <div class="side ${iWin ? "win" : ""}"><b>${c.mine.right}/${c.mine.total}</b><small>YOU</small></div>
        <div class="sep">vs</div>
        <div class="side ${!iWin && !tie ? "win" : ""}"><b>${c.right}/${c.total}</b><small>${esc(c.name.toUpperCase())}</small></div>
      </div>
      <div class="verdictline" style="margin:4px 0 14px;color:var(--${iWin ? "good" : tie ? "brass" : "bad"})">
        ${iWin ? "You win." : tie ? "Dead heat." : esc(c.name) + " takes it."}
      </div>
      <button class="btn" id="skipchal">Done</button>
    </div>`;
  }
  return `<div class="resume">
    <p><b>${esc(c.name)} challenged you.</b> ${c.right} of ${c.total} on this set of ${c.deck.length}. Same questions, same order.</p>
    <div class="row"><button class="btn pri" id="acceptchal">Take the challenge</button><button class="btn" id="skipchal">Not now</button></div>
  </div>`;
}


function renderHome() {
  const p = pool(), wk = weakIds().length, fl = [...S.flags].filter(id => byId[id]).length;
  const n = S.len === 0 ? p.length : Math.min(S.len, p.length);
  const seen = seenCount(), acc = accuracy(), st = streak(), mast = masteredIn("all");
  const saved = ls.get(K_RESUME, null);

  const topic = (k, name, desc, count, done) => {
    const pctM = count ? Math.round((done || 0) / count * 100) : 0;
    return `<button class="topic ${S.cat === k ? "sel" : ""}" data-cat="${k}" aria-pressed="${S.cat === k}">
      <span class="topic-top">
        <span><span class="topic-n">${esc(name)}</span><span class="topic-d">${esc(desc)}</span></span>
        <span class="topic-c">${count}</span>
      </span>
      ${done !== null ? `<span class="mast"><i style="width:${pctM}%"></i></span>` : ""}
    </button>`;
  };
  const seg = (name, val, opts) => `<div class="seg" data-seg="${name}">` +
    opts.map(o => `<button data-v="${o[0]}" class="${String(val) === String(o[0]) ? "sel" : ""}" aria-pressed="${String(val) === String(o[0])}">${esc(o[1])}</button>`).join("") + `</div>`;

  document.getElementById("home").innerHTML = `
    <header>
      <div class="headrow">
        <div class="brand">${LOGO}<div class="wordmark">Drill<i>400</i></div></div>
        <button class="icobtn" id="theme" title="Switch theme" aria-label="Switch colour theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <div class="lede">${QUESTIONS.length} investment banking interview questions. Every one is multiple choice, and every answer is explained.</div>
    </header>

    ${inviteCard()}

    ${saved ? `<div class="resume">
      <p><b>Unfinished set.</b> You were ${saved.idx + 1} of ${saved.deck.length} through ${esc(saved.catName)}.</p>
      <div class="row"><button class="btn pri" id="resume">Resume</button><button class="btn" id="discard">Discard</button></div>
    </div>` : ""}

    <div class="tiles">
      <div class="tile"><b>${seen}</b><small>SEEN</small></div>
      <div class="tile"><b style="color:var(--${acc >= 70 ? "good" : acc >= 50 ? "brass" : seen ? "bad" : "faint"})">${seen ? acc + "%" : "–"}</b><small>ACCURACY</small></div>
      <div class="tile"><b style="color:var(--${st ? "brass" : "faint"})">${st}</b><small>DAY STREAK</small></div>
      <div class="tile"><b>${mast}</b><small>MASTERED</small></div>
    </div>

    <div class="label">Topic</div>
    <div class="stack group">
      ${topic("all", "Everything", "All topics mixed, the way a real interview runs", QUESTIONS.length, mast)}
      ${wk ? topic("weak", "Ones you missed", "Questions you have got wrong before", wk, null) : ""}
      ${fl ? topic("flag", "Flagged", "Questions you marked to come back to", fl, null) : ""}
      ${CATS.map(c => { const tot = QUESTIONS.filter(q => q.c === c.k).length;
        return topic(c.k, c.n, c.d, tot, masteredIn(c.k)); }).join("")}
    </div>

    <div class="group">
      <div class="label">Difficulty</div>
      ${seg("lvl", S.lvl, [[0,"All"],[1,"Easy"],[2,"Medium"],[3,"Hard"]])}
      <div class="label">Length</div>
      ${seg("len", S.len, [[5,"5"],[10,"10"],[20,"20"],[0,"All"]])}
    </div>

    <button class="btn pri" id="start" ${p.length ? "" : "disabled"}>
      ${p.length ? `Start (${n} question${n === 1 ? "" : "s"})` : "No questions match that combination"}
    </button>
    ${p.length ? `<div class="note">${p.length} available in this selection</div>` : ""}

    ${p.length ? `
      ${S.mpOpen ? `<div class="share" style="margin-top:18px">
        <p><b>Multiplayer.</b> Send this link to anyone. They get this exact set, same questions, same order — then you can compare scores.</p>
        <input type="text" id="mpnm" placeholder="Your name" value="${esc(S.name)}" maxlength="18" autocomplete="off"/>
        <div class="row">
          <button class="btn pri" id="mpsend">${navigator.share ? "Create & share link" : "Create & copy link"}</button>
          <button class="btn" id="mpclose">Close</button>
        </div>
        ${S.mpMsg ? `<p style="margin:10px 0 0;color:var(--brass)">${esc(S.mpMsg)}</p>` : ""}
        ${S.mpLink ? `<input type="text" id="mplink" readonly value="${esc(S.mpLink)}" style="margin-top:10px"/>` : ""}
      </div>` : `<button class="btn" id="multiplayer" style="margin-top:10px">Multiplayer</button>`}
    ` : ""}
`;

  document.querySelectorAll("#home .topic").forEach(b => b.onclick = () => { S.cat = b.dataset.cat; renderHome(); });
