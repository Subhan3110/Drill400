{c:"ma",l:3,t:"open",q:"How would you advise a client considering an unsolicited approach for a public target?",m:"Start with whether they can actually win, because a failed hostile bid is expensive and damaging.\n\nAssess the target's defences: does it have a staggered board, a poison pill, restrictions on calling special meetings or acting by written consent, and what does the state of incorporation allow. A classified board plus a pill can push a fight out past two annual meetings, which most acquirers will not sustain.\n\nAssess the shareholder base. Concentrated institutional ownership and an active shareholder register make a tender offer or proxy fight viable. A large founder or family stake that opposes the deal usually makes it impossible.\n\nAssess financing and certainty. A hostile bid needs fully committed financing announced up front, because the target will attack any conditionality as illusory.\n\nThen the sequencing. The normal path is a private approach first, the so-called bear hug letter, which puts the board under pressure without going public. Escalation options are going public with the letter, launching a tender offer directly to shareholders, and running a proxy contest to replace the board.\n\nThe commercial advice is usually to weigh the premium required against the cost. Hostile situations typically end in a higher price, the arrival of a white knight, or no deal. And the acquirer must accept that due diligence will be limited to public information, which raises the risk on everything they cannot see."},
/* =========================== LBO (expansion) =========================== */
{c:"lbo",l:1,t:"mc",q:"In an LBO, the sponsor's equity return is driven by all of these EXCEPT:",o:["Debt paydown from cash generation","EBITDA growth","Multiple expansion at exit","The target's dividend policy before the deal"],a:3,e:"The three classic value drivers are deleveraging, EBITDA growth and multiple expansion. The target's pre-deal dividend policy is irrelevant, because the capital structure is entirely replaced at close."},
{c:"lbo",l:2,t:"mc",q:"A sponsor invests $200m of equity and exits five years later for $600m of equity proceeds. What is the approximate IRR?",o:["20%","25%","33%","40%"],a:1,e:"That is a 3.0x multiple of money over five years. The rule of thumb is that 3x over five years is roughly 25%, since 1.25 to the fifth is about 3.05. Memorising the grid of MoM to IRR for three and five year holds is worth doing."},
{c:"lbo",l:2,t:"open",q:"What is the difference between a leveraged buyout and a leveraged recapitalisation?",m:"In an LBO, ownership changes. A sponsor acquires the company, funds the purchase largely with debt raised against the target's own cash flows, and contributes an equity cheque for the balance. The existing shareholders are bought out.\n\nIn a leveraged recapitalisation, ownership largely stays, but the capital structure changes. The company raises new debt and uses the proceeds to pay a large special dividend or to repurchase a substantial block of shares. Existing shareholders get cash but the company remains independent.\n\nThe motivations differ. An LBO is a change of control driven by a sponsor's view that they can improve the business and exit at a profit. A leveraged recap is often a defensive move, either to return capital to shareholders, to make the company less attractive as a takeover target by loading it with debt and reducing free float, or to satisfy an activist without selling.\n\nThere is also the dividend recapitalisation, which is a leveraged recap done by a sponsor on a company it already owns, pulling cash out ahead of exit.\n\nThe analytical similarity is that both increase financial risk in exchange for higher returns on a smaller equity base, and both require the same test: does the business generate cash reliably enough to service the new structure through a downturn."},
{c:"lbo",l:2,t:"mc",q:"Original issue discount on a term loan means the lender:",o:["Charges a higher interest rate","Funds less than par while the borrower repays par","Takes equity warrants","Defers interest to maturity"],a:1,e:"With 2% OID, the lender advances 98 cents for every dollar of face value, but the borrower still owes and repays 100. It raises the effective yield without raising the coupon, and in a sources and uses table it reduces the cash actually available from that tranche."},
{c:"lbo",l:3,t:"open",q:"Walk me through how a sponsor decides how much leverage to put on a business.",m:"Leverage is set by what the business can service through a downturn, not by what lenders will offer at the top of a cycle.\n\nThe starting point is the market: current total leverage multiples for comparable credits in that sector, which move with the cycle and with ratings. That gives the outer bound.\n\nThen the cash flow test. Model free cash flow after interest, mandatory amortisation, capex and working capital, and check that coverage holds in a stress case, not just the base case. The specific metrics lenders and sponsors look at are total debt to EBITDA, EBITDA to interest, and free cash flow to total debt. A business needs meaningful headroom above its covenants at close, typically 25% to 35% EBITDA cushion, because covenants are tested quarterly and a breach hands control to the lenders.\n\nThen the business characteristics. Stable, contracted, recurring revenue with low capital intensity supports far more leverage than a cyclical, capital-hungry business. That is why software and healthcare services carry high multiples while industrials and consumer discretionary carry less.\n\nFinally the return maths. More leverage raises IRR if things go well, but it also raises the probability of the equity being wiped out. Sponsors size leverage to maximise risk-adjusted returns, and increasingly find that returns driven by operational improvement are more repeatable than returns driven by financial engineering.\n\nThe practical constraint in a competitive auction is that the debt quantum is often set by the financing available, and the equity cheque becomes the plug."},
{c:"lbo",l:3,t:"mc",q:"Entry at 10.0x EBITDA with 6.0x of debt. At exit five years later, EBITDA has grown 50% and all debt is repaid, with an exit multiple of 10.0x. What is the approximate multiple of money?",o:["1.9x","2.5x","3.75x","5.0x"],a:2,e:"Entry equity is 10.0x less 6.0x, which is 4.0 turns of entry EBITDA. Exit enterprise value is 10.0 times 1.5, which is 15.0 turns of entry EBITDA, with no debt, so all of it is equity. 15.0 divided by 4.0 is 3.75x."},
{c:"lbo",l:2,t:"open",q:"What is a management rollover, and why do sponsors want it?",m:"A rollover is where existing management, instead of cashing out entirely at close, reinvests some or all of their proceeds into equity of the new holding company alongside the sponsor.\n\nSponsors want it for alignment. Management who have real money at risk in the new structure behave differently from management who have just been paid out and now hold only options. It also signals confidence: if the CEO is unwilling to roll, the sponsor should ask what they know.\n\nIt reduces the sponsor's equity cheque, which helps returns, though that is usually secondary to the alignment argument.\n\nTypical structures have management rolling 20% to 50% of their after-tax proceeds, sometimes with the rollover structured to be tax-deferred so they are not taxed on value they have not received in cash.\n\nAlongside the rollover sits the management incentive plan, typically 8% to 12% of equity, often structured as options or profits interests that vest on time and on returns, with a ratchet so management earn a larger share as the sponsor's MoM passes defined hurdles.\n\nThe tension to be aware of: a large rollover concentrates management's personal wealth in one illiquid asset, which can make them more conservative than the sponsor wants, so the incentive plan has to be structured to restore appetite for risk."},
{c:"lbo",l:3,t:"mc",q:"Which of these most improves an LBO return without requiring any operational change?",o:["Lengthening the holding period at a constant multiple of money","Buying at a lower entry multiple","Increasing capital expenditure","Adding more covenants"],a:1,e:"Entry price is the single most reliable driver of returns, because every turn of EBITDA saved at entry flows straight to the equity. Lengthening the hold at constant MoM actively reduces IRR, since IRR is time-weighted."},
{c:"lbo",l:2,t:"open",q:"Why do sponsors care about the quality of a company's revenue, not just its level?",m:"Because leverage turns revenue volatility into equity volatility, and a levered balance sheet cannot absorb a bad year.\n\nHigh-quality revenue means contracted or recurring, with long terms, high renewal rates and a diversified customer base. It is predictable enough that you can commit to a fixed debt service schedule against it. That is why software, healthcare services, waste management and testing and inspection businesses command high entry multiples and support high leverage: the cash flow is visible years out.\n\nLow-quality revenue means project-based, one-off, concentrated in a few customers, exposed to a commodity price, or dependent on a single contract up for renewal. The same headline EBITDA supports far less debt.\n\nThe specific diligence questions: what percentage of revenue is under contract and for how long, what is gross and net retention, what is the customer concentration, how has the business performed in past recessions, and how much of last year's revenue would repeat if the sales team stopped selling tomorrow.\n\nThis is also what quality-of-earnings work is for. It separates repeatable revenue from one-time items, verifies that reported EBITDA is real and normalises for owner-related and non-recurring costs, so that the leverage is sized against a number that will still be there next year."},
{c:"lbo",l:3,t:"mc",q:"A sponsor holds an asset for three years and achieves a 2.0x multiple of money. The approximate IRR is:",o:["20%","26%","33%","40%"],a:1,e:"2.0x over three years means the cube root of 2, which is about 1.26, so roughly 26%. The useful anchors to memorise: 2x in three years is about 26%, 2x in five years is about 15%, 3x in five years is about 25%."},
{c:"lbo",l:2,t:"open",q:"What is the difference between a sponsor-to-sponsor deal and a corporate carve-out, from a returns perspective?",m:"A sponsor-to-sponsor deal, also called a secondary buyout, means buying from another private equity firm. The seller has usually already done the obvious work: the cost base has been optimised, the reporting is institutional, the management team is professionalised and the low-hanging fruit is gone. That means the buyer is paying a full price for a clean asset and must find a genuinely new thesis, typically international expansion, a buy-and-build, or a product extension the previous owner lacked the time or capital for. Diligence is faster because the data room is already built, but the margin for error on price is thin.\n\nA corporate carve-out means buying a division from a larger company. These are typically messier and cheaper. The division has been run as part of a group, so it shares systems, back office, procurement and sometimes customers with the parent. The upside is that corporate parents often under-manage non-core divisions, so there is real operational improvement available, and the seller is often motivated by strategic focus rather than price maximisation.\n\nThe cost is complexity. You need a transition services agreement to keep the business running while you stand up standalone functions, you have to build a credible standalone cost base including the stranded corporate overhead the carve-out financials never showed, and separation itself takes 12 to 24 months and real cash.\n\nHistorically, carve-outs have produced stronger returns on average, precisely because that complexity deters competition in the auction."},
{c:"lbo",l:3,t:"mc",q:"In a typical LBO waterfall, the sponsor's carried interest is usually paid:",o:["From the first dollar of proceeds","Only after limited partners receive their capital back plus a preferred return","Annually regardless of performance","Only if the IRR exceeds 40%"],a:1,e:"The standard structure returns LP capital first, then a preferred return, commonly 8%, then a catch-up to the general partner, and only then splits profits, typically 80 to the LPs and 20 to the GP. Carry is the GP's share of profits above that hurdle."},
{c:"lbo",l:3,t:"open",q:"How would you stress test an LBO model before committing to a bid?",m:"You are testing whether the equity survives, not whether the base case works. The base case always works, that is why it is in the deck.\n\nStart with the downside case on operations. Model a recession-level revenue decline consistent with what the business or its sector actually did in the last downturn, hold fixed costs fixed rather than assuming management cuts perfectly, and see what happens to EBITDA. Then check covenant headroom quarter by quarter, because a breach is a default even if the company is generating cash.\n\nTest the financing separately. Flex the interest rate, particularly on floating rate tranches, because in a rising rate environment interest expense can consume cash flow without any operational deterioration. Check whether the revolver is sufficient at the trough, and model the mandatory amortisation and any maturity wall.\n\nTest the exit. Run exit multiple compression of one to three turns, which is the most common way returns disappoint, and lengthen the hold period by two years, since IRR is highly sensitive to time.\n\nThen run the combinations, not just one at a time. The realistic bad scenario is lower EBITDA and multiple compression together, because both are driven by the same downturn.\n\nThe outputs that matter: at what EBITDA level does the equity go to zero, at what exit multiple does the deal return only capital, and what is the minimum EBITDA that keeps covenants intact. Those three numbers tell the investment committee what they are actually underwriting."},
{c:"lbo",l:2,t:"mc",q:"Which of these is a use of cash in an LBO's debt schedule?",o:["Cash flow available for debt repayment","Mandatory amortisation","Revolver drawdown","Beginning cash balance"],a:1,e:"Mandatory amortisation is a contractual repayment and therefore a use. Cash flow available for repayment, revolver draws and the opening cash balance are all sources within the schedule."},
{c:"lbo",l:3,t:"open",q:"A sponsor asks whether to exit via IPO or a sale. How do you advise?",m:"The comparison is not simply which produces the higher headline value, because the two routes differ on certainty, timing and how much the sponsor actually realises.\n\nA sale to a strategic buyer usually produces the highest price, because a strategic can pay for synergies a financial buyer cannot. It is also a clean, complete exit at a single moment, with cash at close. The constraints are antitrust risk where the buyer is a competitor, and the reality that there may be only one or two credible strategics.\n\nA sale to another sponsor gives a clean exit and a competitive process, but the buyer is underwriting a return, so the price is capped by what their own model supports.\n\nAn IPO rarely produces a full exit. The sponsor sells a minority at listing, then remains locked up for six months and sells down over subsequent years, carrying market risk the whole time. It can produce a higher valuation for a high-growth business that public investors will pay a premium for, and it preserves upside if the business keeps compounding. But it is expensive, exposes the company to public reporting, and the price is set by a market window that can close.\n\nThe practical advice depends on the asset and the fund. A business with a strong growth story and scale suits an IPO. A business best owned by a strategic, or one where the fund is late in its life and needs distributions, suits a sale. Most sponsors run a dual-track process precisely to keep both options live and use each to price the other."},
{c:"lbo",l:3,t:"open",q:"What is a continuation vehicle, and why have they become common?",m:"A continuation vehicle is a new fund, raised by the same sponsor, that buys one or more assets from an existing fund the sponsor also manages. Existing limited partners choose either to cash out at the transaction price or to roll their interest into the new vehicle.\n\nThey exist because fund life is finite, usually ten years, but a good asset does not stop compounding on that schedule. A sponsor holding a high-performing company at the end of a fund's life previously had to sell it to someone else. A continuation vehicle lets them keep it while giving LPs who need liquidity a way out.\n\nThey became common because exit markets slowed sharply, leaving sponsors with ageing portfolios and LPs waiting on distributions. A continuation vehicle generates distributions without a genuine third-party sale.\n\nThe obvious problem is the conflict of interest: the sponsor is on both sides, setting the price at which it sells to itself. The market response has been to require an independent fairness opinion, LP advisory committee approval, and price validation from a new third-party lead investor who negotiates the terms at arm's length.\n\nThe critical view is that these transactions can mark up performance without a real exit, and that a sponsor who cannot sell an asset to a third party should not be able to sell it to itself. The defence is that the best assets are exactly the ones you want to hold longer, and the data on continuation vehicle performance has so far been reasonable."},
];

/* ====================== RESTRUCTURING (expansion) ====================== */
{c:"restr",l:1,t:"mc",q:"An automatic stay in Chapter 11 means:",o:["Management is automatically replaced","Creditors must stop collection efforts immediately","The company must liquidate within 90 days","Interest stops accruing on secured debt"],a:1,e:"Filing triggers an immediate halt to collection actions, lawsuits and foreclosures. It is the breathing space that makes reorganisation possible. Note that oversecured creditors may continue to accrue interest, so option four is wrong."},
{c:"restr",l:2,t:"mc",q:"Exclusivity in Chapter 11 refers to:",o:["The debtor's exclusive right to propose a plan for an initial period","A single creditor's right to negotiate alone","The exclusive use of one valuation method","The court's exclusive jurisdiction"],a:0,e:"The debtor has the exclusive right to file a plan for the first 120 days, extendable up to 18 months. Once exclusivity lapses, any party in interest can file a competing plan, which sharply shifts leverage toward creditors."},
{c:"restr",l:2,t:"open",q:"What is adequate protection, and why does it matter to a secured creditor?",m:"Adequate protection is the requirement that a secured creditor's interest in its collateral not be eroded during the bankruptcy, given that the automatic stay prevents them from simply seizing it.\n\nIt can take several forms: periodic cash payments equal to the depreciation of the collateral, replacement or additional liens on other assets, or a demonstration that there is a sufficient equity cushion above the debt that the creditor cannot be harmed.\n\nIt matters because the stay takes away the secured creditor's primary remedy. Without adequate protection, a debtor could operate for two years while the collateral depreciated and the creditor would have no recourse. The doctrine is the constitutional backstop that makes the stay acceptable.\n\nIt is also the main fight in the early stage of a case, particularly around cash collateral. If a lender has a lien on receivables and inventory, the debtor cannot use that cash to operate without either consent or a court finding of adequate protection. That gives the secured lender enormous early leverage, and it is typically resolved in a negotiated cash collateral order that sets a budget, reporting requirements and milestones the debtor has to hit.\n\nAn undersecured creditor is in a weaker position: they get adequate protection only on the secured portion, and their deficiency claim is unsecured."},
{c:"restr",l:3,t:"mc",q:"A creditor holding a claim that is 'out of the money' in a restructuring will typically:",o:["Receive par recovery","Receive equity in the reorganised company","Receive little or nothing and may be cancelled","Automatically become the fulcrum"],a:2,e:"If enterprise value runs out before reaching that claim in the waterfall, the claim is out of the money and receives little or nothing. Under absolute priority those holders can be cancelled entirely, though they often get a small recovery as consideration for not litigating."},
{c:"restr",l:2,t:"open",q:"What is a credit bid, and why is it powerful?",m:"A credit bid lets a secured creditor bid for the collateral in a sale using the face value of its debt as currency, rather than cash. If a lender is owed $300m and the collateral is being sold under section 363, it can bid up to $300m without writing a cheque.\n\nIt is powerful for two reasons. First, it sets an effective floor on the sale price. No third party will buy the asset below the credit bid, because the lender can always top them at no incremental economic cost to itself. Second, it gives the secured lender a route to owning the business outright, which is often exactly what a distressed debt fund bought the paper to achieve. Buying the fulcrum debt at 40 cents and credit bidding to take the equity is the classic loan-to-own strategy.\n\nThe limits: the right can be restricted by the court for cause, for example where the lien's validity is disputed or where credit bidding would chill the auction. There have been cases where courts capped a credit bid to encourage genuine competitive bidding.\n\nFor the debtor and unsecured creditors, a credit bid is often unwelcome, because it can transfer the business to the lender at a price that leaves nothing for anyone junior, and it removes the possibility of a cash sale that would generate distributable proceeds."},
{c:"restr",l:3,t:"open",q:"How does a distressed debt fund think differently from a traditional lender?",m:"A traditional lender underwrites to be repaid. They lend at par, expect a coupon and principal back, and a restructuring is a failure of the original credit decision. Their objective in a workout is to maximise recovery on the existing claim, often with a strong preference for cash and a quick resolution.\n\nA distressed fund buys the claim in the secondary market at a discount, so their economics are entirely different. Buying at 45 cents means par recovery is a 2.2x return and a 60 cent recovery is still a 33% gain. They have no relationship to protect and no regulatory capital charge driving them toward a quick exit.\n\nThat changes behaviour in specific ways. They will litigate, because the option value of a better outcome exceeds the legal cost on their basis. They will take equity rather than cash, because they are underwriting the reorganised business, not just the claim. They will buy deliberately into the fulcrum security to convert into control, the loan-to-own trade. And they will buy a blocking position, typically over one third of a class, to gain a veto over any plan, since confirmation requires two thirds by amount of an impaired class.\n\nThe practical implication for a restructuring banker is that once the debt has traded from banks to funds, the negotiation changes character. You are no longer negotiating with a party that wants their money back, you are negotiating with one that has a view on the equity value of the reorganised business and the patience to fight for it."},
{c:"restr",l:2,t:"mc",q:"A company's debt trading at 30 cents on the dollar most directly implies:",o:["The company will definitely liquidate","The market expects recovery well below par","Interest rates have risen sharply","The debt is secured"],a:1,e:"Secondary market prices are the market's probability-weighted view of recovery. Thirty cents implies expected recovery far below par. It does not guarantee liquidation, and it usually signals the market sees this tranche as at or below the fulcrum."},
{c:"restr",l:3,t:"mc",q:"In a Chapter 11 plan vote, a class is deemed to accept if it is approved by:",o:["A simple majority of holders only","Two thirds in amount and more than one half in number of those voting","Unanimous consent","Any single creditor over 50%"],a:1,e:"The dual test is two thirds by dollar amount and a majority by number of claims actually voting in that class. The amount test is why a fund holding just over one third of a class can block confirmation of that class."},
{c:"restr",l:2,t:"open",q:"What is the difference between a covenant-lite loan and a traditional loan, and what has it meant for restructurings?",m:"A traditional leveraged loan carries maintenance covenants, tested every quarter regardless of what the borrower does, typically a maximum leverage ratio and a minimum interest coverage ratio. Breaching one is an event of default even if the company is paying every bill on time.\n\nA covenant-lite loan has only incurrence covenants, tested only when the borrower takes a specific action such as raising more debt, making an acquisition or paying a dividend. If the business deteriorates but the borrower does nothing, no covenant is ever tested.\n\nThe shift has had a real effect on restructuring dynamics. Maintenance covenants were an early warning system: a breach brought lenders to the table while there was still enterprise value to negotiate over, and gave them leverage to demand amendments, fees, tighter terms or an equity injection. Without them, lenders often have no seat at the table until the company actually runs out of cash or misses a payment.\n\nThe consequence is that restructurings arrive later and with less value left. Companies burn through liquidity for longer before anyone can intervene, so recoveries have tended to be lower and cases more chaotic.\n\nIt also interacts with liability management: loose documents combined with no maintenance testing gave rise to the drop-down and uptier transactions where value is moved away from existing lenders, because nothing in the credit agreement stopped it in time."},
{c:"restr",l:3,t:"open",q:"How would you value a company for a plan of reorganisation, and why is it contested?",m:"The mechanics are conventional: a DCF on the post-emergence business plan, trading comparables on the reorganised capital structure, and precedent transactions. The output is a total enterprise value for the reorganised entity.\n\nWhat makes it contested is that the valuation determines who owns the company. The waterfall distributes value by priority, so the enterprise value decides exactly where the fulcrum sits, and the holders at the fulcrum become the new equity owners. One turn of EBITDA can move hundreds of millions of dollars from one creditor class to another.\n\nThat produces entirely predictable positioning. Senior creditors argue for a low valuation, because a low value means their claim consumes all the equity and junior classes are wiped out. Junior creditors and equity argue for a high valuation, because value above the senior claims flows to them. Both sides hire experts who produce reports supporting their position, and valuation disputes are the single most litigated issue in large Chapter 11 cases.\n\nThe business plan itself is part of the fight, since management's projections drive the DCF, and management's incentives are shaped by who they expect to own the company and by the management incentive plan they will receive.\n\nThe judge ultimately decides, often by picking a point within the range rather than adopting either expert wholesale. Practically, this is why most cases settle on a negotiated split rather than going to a valuation trial: the outcome is uncertain and the cost of litigating is enormous."},
{c:"restr",l:2,t:"mc",q:"A first lien and second lien lender typically govern their relationship through:",o:["The indenture only","An intercreditor agreement","The bankruptcy code alone","A fairness opinion"],a:1,e:"The intercreditor agreement sets out the payment and lien priority, standstill periods during which the second lien cannot enforce, voting on amendments, and whether the second lien can object to a section 363 sale or DIP financing. It is often where the real leverage is decided."},
{c:"restr",l:3,t:"open",q:"A client has a good business but a broken balance sheet. Walk me through the options.",m:"That is the textbook case for a balance sheet restructuring rather than an operational turnaround, and the options run from least to most disruptive.\n\nFirst, liability management out of court. Refinance if the market will take it, extend maturities through an amend and extend, or exchange existing debt for new debt at a lower principal amount in a distressed exchange. Discounted debt buybacks in the open market also work if the company has liquidity and the debt trades well below par.\n\nSecond, a new money injection. The sponsor or a new investor puts in equity or preferred, often alongside a lender concession, which works when the lenders believe the business is viable and want the equity holder to share the pain.\n\nThird, an asset sale. Sell a non-core division to pay down debt. This is attractive when the balance sheet problem is quantitatively modest and there is a saleable asset the business does not need.\n\nFourth, a consensual out-of-court restructuring with a debt-for-equity swap, where lenders take a share of the equity in exchange for reducing principal. Faster and cheaper than Chapter 11, but it requires near-unanimous consent because you cannot bind holdouts outside court.\n\nFifth, a prepackaged or prearranged Chapter 11, where the deal is negotiated first and the filing is used only to bind dissenters through cramdown and to cleanse the balance sheet. That is the standard answer for a good business with too much debt: it is quick, often 30 to 60 days, and preserves the operating business.\n\nThe key judgement is holdout risk. If the creditor group is small and aligned, do it out of court. If it is fragmented, particularly with public bonds, you will need the court's binding power."},

{c:"brain",l:1,t:"mc",q:"A shirt is marked up 25% and then discounted 20% off the marked price. The final price versus the original is:",o:["5% higher","Exactly the same","5% lower","20% lower"],a:1,e:"Start at 100. Up 25% gives 125. Down 20% of 125 is 25, giving 100. The percentages offset exactly because 1.25 times 0.80 equals 1.00. Successive percentage changes multiply, they do not add."},
{c:"brain",l:2,t:"mc",q:"A stock falls 50%. What percentage gain is needed to get back to the starting price?",o:["50%","75%","100%","150%"],a:2,e:"From 100 down to 50, you need to gain 50 on a base of 50, which is 100%. This asymmetry is why drawdowns matter so much in investing: a 90% loss requires a 900% gain to recover."},
{c:"brain",l:2,t:"mc",q:"You have a 3-litre jug and a 5-litre jug and need exactly 4 litres. What is the minimum number of pours?",o:["3","6","8","It is impossible"],a:1,e:"Fill the 5, pour into the 3 leaving 2 in the 5-litre. Empty the 3, move the 2 litres into it, refill the 5, then top up the 3-litre which takes 1 more, leaving exactly 4 in the 5-litre jug. Six operations."},
{c:"brain",l:2,t:"open",q:"Estimate the number of piano tuners in Oslo.",m:"This is the classic Fermi estimate. State assumptions, do round numbers, and show the structure.\n\nDemand side. Oslo has roughly 700,000 people, or about 300,000 households. Assume 1 in 25 households owns a piano, which gives 12,000 household pianos. Add institutional pianos: schools, churches, concert halls, hotels and music schools, perhaps another 1,000. Call it 13,000 pianos.\n\nAssume a piano is tuned once a year on average. Households with a piano that nobody plays tune less often; serious players and institutions tune more. That gives 13,000 tunings a year.\n\nSupply side. A tuner does perhaps 3 tunings a day allowing for travel, works 5 days a week, 45 weeks a year, so about 675 tunings per tuner per year. Round to 700.\n\n13,000 divided by 700 is roughly 19. So call it 15 to 20 full-time piano tuners in Oslo.\n\nThen sanity check it out loud: that is one tuner per 35,000 people, which feels plausible for a niche skilled trade. If the interviewer pushes, the assumptions most worth flexing are piano ownership rate and tuning frequency, because the answer is close to linear in both."},
{c:"brain",l:3,t:"mc",q:"You have 100 coins on a table, 10 showing heads, in a completely dark room. You must split them into two piles with an equal number of heads. What do you do?",o:["Impossible without light","Split 50-50 at random","Take any 10 coins as one pile and flip all of them","Take 10 coins and leave them as they are"],a:2,e:"Take any 10 coins into a new pile. If it contains h heads, the other pile has 10 minus h heads. Flipping all 10 in the small pile turns its h heads into 10 minus h heads. Both piles now match, for any h."},
{c:"brain",l:3,t:"mc",q:"Two trains 100km apart approach each other at 50km/h each. A bird flies at 80km/h between them until they meet. How far does the bird fly?",o:["80km","100km","160km","Infinite"],a:0,e:"Do not sum the infinite series. The trains close at a combined 100km/h over 100km, so they meet after exactly 1 hour. The bird flies for 1 hour at 80km/h, so it covers 80km. Reframing to elapsed time is the whole trick."},
{c:"brain",l:2,t:"mc",q:"What is the probability that two people in a room of 23 share a birthday?",o:["About 6%","About 23%","About 50%","About 90%"],a:2,e:"The birthday paradox. You compute the complement: the probability everyone is distinct is 365/365 times 364/365 and so on, which falls below 50% at 23 people. The count of pairs, 253, grows much faster than the number of people."},
{c:"brain",l:3,t:"open",q:"How would you estimate the annual revenue of the global luxury watch market?",m:"Build it from units and price, and cross-check from the top down.\n\nBottom up. The addressable buyer base is high-income adults globally. Take roughly 8 billion people, of whom perhaps 1.5 billion are in developed or upper-middle income economies with meaningful discretionary spend. Assume 5% of those buy a luxury watch at some point, and that a buyer purchases one every 10 years on average. That is 75 million buyers, buying 7.5 million watches a year.\n\nAverage price is the difficult assumption because the distribution is extremely skewed. Entry luxury sits around 3,000 to 5,000 dollars, mid-tier around 10,000, and a small tail runs into hundreds of thousands. A weighted average of maybe 8,000 dollars is reasonable.\n\n7.5 million times 8,000 gives roughly 60 billion dollars a year.\n\nTop down cross-check. Switzerland exports the large majority of luxury watches by value, and Swiss watch exports run around 25 billion dollars annually at export value. Retail markup roughly doubles that, so 50 billion dollars at retail from Switzerland alone, plus German, Japanese and independent brands. That supports something in the 55 to 70 billion range.\n\nSo call it 60 billion dollars. The two methods agreeing is the point worth making out loud, and I would flag that the single most sensitive assumption is average selling price."},
{c:"brain",l:2,t:"mc",q:"A rope ladder hangs over the side of a ship, with rungs 30cm apart and 5 rungs above the water. The tide rises 90cm. How many rungs are above water now?",o:["2","3","5","8"],a:2,e:"The ship floats, so it rises with the tide and the ladder rises with it. Five rungs remain above water. The question tests whether you notice the physical setup rather than doing the arithmetic you were invited to do."},
{c:"brain",l:3,t:"mc",q:"You have 10 bags of coins. Nine contain 10g coins, one contains 9g coins. Using a digital scale ONCE, how do you find the light bag?",o:["Impossible with one weighing","Take 1 coin from each bag","Take 1 coin from bag 1, 2 from bag 2, up to 10 from bag 10","Weigh all bags together"],a:2,e:"Taking 1 from bag 1, 2 from bag 2 and so on gives 55 coins weighing 550g if all were 10g. The shortfall in grams tells you the bag number directly: a 3g shortfall means bag 3 is the light one."},
{c:"brain",l:2,t:"open",q:"A company's revenue grew 21% over two years. What was the average annual growth rate, and why is it not 10.5%?",m:"The answer is 10%, not 10.5%, because growth compounds.\n\nIf revenue grows at rate g for two years, the total factor is 1 plus g, squared. Set that equal to 1.21. The square root of 1.21 is exactly 1.10, so g is 10%.\n\nThe reason 10.5% is wrong is that simple averaging ignores growth on growth. Growing 10% twice takes 100 to 110 to 121, and that extra 1 is the second year's growth applied to the first year's gain.\n\nThe general formula is the compound annual growth rate: the ending value divided by the beginning value, raised to the power of one over the number of years, minus one.\n\nThe practical point for banking: always quote CAGR rather than an average of annual growth rates, and be aware that the gap widens sharply with volatility. A business that grows 50% then falls 50% has a 0% average but a negative 13.4% CAGR, and the CAGR is the one that reflects what actually happened to the money."},
{c:"brain",l:3,t:"mc",q:"You roll a fair die repeatedly until you get a 6. What is the expected number of rolls?",o:["3","5","6","36"],a:2,e:"For a geometric distribution the expected number of trials is 1 divided by the probability of success. With probability one sixth, the expectation is 6 rolls. The intuition is that in the long run one roll in six is a success, so on average you wait six."},
{c:"brain",l:3,t:"open",q:"Estimate how much revenue a major airport generates in a year.",m:"Split it into aeronautical and non-aeronautical revenue, because airports earn substantially from both.\n\nTake a large European hub handling roughly 30 million passengers a year.\n\nAeronautical revenue comes from airlines: landing fees, passenger service charges and aircraft parking. A reasonable blended figure is 15 to 20 euros per departing passenger. With 15 million departing passengers, that is roughly 250 to 300 million euros.\n\nNon-aeronautical revenue comes from retail concessions, food and beverage, duty free, car parking, property rental and advertising. Airports typically take a percentage of concession sales rather than the sales themselves. A common benchmark is 10 to 20 euros of airport revenue per passenger. Across 30 million passengers, that is 300 to 600 million euros. Parking alone is often 15% to 20% of the total and is among the highest-margin lines.\n\nCombining, total revenue lands somewhere around 600 million to 900 million euros a year, so call it 750 million.\n\nCross-check: published figures for airports of that size typically fall in that range, and the split is usually somewhere near 45% aeronautical and 55% commercial.\n\nThe insight worth stating is that the business model is really a real estate and retail business attached to a regulated infrastructure asset, which is why airport valuations are so sensitive to passenger mix. Long-haul and leisure passengers spend far more per head than short-haul business travellers."},
];


const Q14 = [
/* ================== MARKETS & CAPITAL MARKETS ================== */
{c:"mkts",l:1,t:"mc",q:"In an IPO, the greenshoe or over-allotment option allows the underwriters to:",o:["Cancel the offering if demand is weak","Sell up to 15% additional shares to stabilise the aftermarket","Set the price after trading begins","Buy shares at a discount for their own account"],a:1,e:"The greenshoe lets underwriters sell up to 15% more than the base deal. If the stock trades down they buy in the market to cover the short, supporting the price; if it trades up they exercise the option and take shares from the issuer."},
{c:"mkts",l:1,t:"mc",q:"Bookbuilding in an IPO refers to:",o:["Preparing the prospectus","Collecting investor demand at different price levels to set the final price","Auditing the financial statements","Registering shares with the regulator"],a:1,e:"During the roadshow, underwriters collect indications of interest specifying how many shares investors will buy at what price. The resulting demand curve, the book, determines the final price and the allocation."},
{c:"mkts",l:2,t:"open",q:"Walk me through the IPO process from mandate to listing.",m:"Roughly six to nine months, in five phases.\n\nPreparation and selection. The company appoints underwriters in a bake-off, choosing lead left bookrunner and syndicate. In parallel it prepares for public company life: audited accounts to the required standard, internal controls, a board with the necessary independent directors, and often a corporate reorganisation of the group structure.\n\nDue diligence and drafting. The banks, lawyers and auditors conduct business, financial and legal due diligence. The core output is the registration statement, an S-1 in the US or a prospectus elsewhere, containing the business description, risk factors, management discussion and audited financials. Drafting sessions run for weeks.\n\nRegulatory review. The document is filed, initially confidentially in many jurisdictions, and the regulator returns comments. Several rounds of amendments follow. The company is in a quiet period with restrictions on public statements.\n\nMarketing. Analyst presentations, publication of pre-deal research where permitted, then the public filing and the roadshow, typically one to two weeks of investor meetings. A price range is set at the launch of the roadshow and the book is built against it.\n\nPricing and listing. The night before trading, the underwriters and the company agree the final price and allocations, balancing proceeds against aftermarket performance and quality of the shareholder base. Trading begins the next day, followed by a stabilisation period using the greenshoe, a 180-day lock-up on insiders, and the end of the quiet period when research can be published."},
{c:"mkts",l:2,t:"mc",q:"IPOs are typically priced at a discount to estimated fair value primarily to:",o:["Comply with regulation","Compensate investors for uncertainty and ensure a successful aftermarket","Reduce the underwriters' fees","Satisfy accounting standards"],a:1,e:"The deliberate discount, commonly 10% to 15%, rewards investors for taking on an unproven listed company and helps the stock trade up on day one. A broken IPO that trades below issue damages the company's ability to return to market."},
{c:"mkts",l:2,t:"open",q:"What is the difference between a firm commitment and a best efforts underwriting?",m:"In a firm commitment, the underwriters buy the entire issue from the company at an agreed price and resell it to investors. The company's proceeds are certain the moment the underwriting agreement is signed. The underwriters carry the risk that they cannot place the shares at or above what they paid, and they are compensated for that risk through the gross spread, typically around 7% for a US IPO and lower for larger deals.\n\nIn a best efforts arrangement, the underwriters act as agent rather than principal. They market the deal and place whatever they can, but do not guarantee the outcome. The company bears the placement risk. Fees are lower.\n\nFirm commitment is the standard for established IPOs and large follow-ons, because issuers want certainty and because the underwriters' willingness to put capital at risk is itself a signal of confidence.\n\nBest efforts appears in smaller, riskier or more speculative offerings where no bank will take the book risk, and in certain structures such as all-or-none offerings.\n\nWorth noting that in practice the firm commitment risk is smaller than it appears, because the underwriting agreement is signed only after the book is built and pricing is agreed, so the underwriters already know demand exists. The genuine exposure is the overnight gap between signing and settlement, plus any market-out clause."},
{c:"mkts",l:2,t:"mc",q:"A bond trading at a price above par implies its coupon is:",o:["Below the current market yield","Above the current market yield","Equal to the current market yield","Unrelated to market yield"],a:1,e:"Price and yield move inversely. A bond priced above par pays a coupon higher than what the market currently demands for that risk, so investors bid the price up until the yield to maturity matches the market rate."},
{c:"mkts",l:2,t:"open",q:"Explain the difference between investment grade and high yield debt.",m:"The dividing line is the credit rating. Investment grade is BBB minus and above from S&P and Fitch, or Baa3 and above from Moody's. High yield, also called sub-investment grade or junk, is BB plus and below.\n\nThe practical differences run well beyond the label.\n\nPricing and structure. Investment grade bonds are priced as a spread over the relevant government benchmark, usually with light covenants, no security, and bullet maturities. High yield carries a much wider spread, typically has an incurrence covenant package, is often secured or structurally senior, and almost always has call protection, meaning the issuer cannot refinance for the first few years without paying a premium.\n\nInvestor base. Investment grade is bought by insurance companies, pension funds and index funds constrained by ratings mandates. High yield is bought by dedicated credit funds, and pricing depends much more on fundamental credit analysis than on ratings.\n\nMarket behaviour. Investment grade spreads are driven largely by interest rates and broad risk sentiment. High yield behaves much more like equity: spreads widen sharply when default expectations rise, and the asset class correlates with equity markets in stress.\n\nThe crossing point matters commercially. A downgrade from BBB minus to BB plus, a fallen angel, forces index-constrained holders to sell and can move a company's cost of capital materially, which is why maintaining investment grade is a stated financial policy for many corporates and shapes how much they are willing to borrow for an acquisition."},
{c:"mkts",l:2,t:"mc",q:"A company's credit spread widens sharply while government yields are unchanged. This most likely reflects:",o:["A fall in inflation expectations","Deteriorating perceived credit risk at that company or sector","A change in central bank policy","An increase in the risk-free rate"],a:1,e:"The spread is the compensation for credit risk above the risk-free rate. If the benchmark is unchanged but the spread widens, the market is demanding more compensation for lending to that issuer specifically, implying higher perceived default risk."},
{c:"mkts",l:3,t:"open",q:"How do rising interest rates affect M&A and LBO activity?",m:"Through several channels, most of them negative for volume but not uniformly.\n\nCost of debt. Leveraged loans are floating rate, so a rise in base rates feeds directly into interest expense. At higher rates, the same EBITDA supports less debt, because the constraint is interest coverage rather than leverage multiple. Sponsors must write larger equity cheques for the same enterprise value, which compresses returns.\n\nValuation. Higher risk-free rates raise WACC and depress discounted cash flow valuations, particularly for long-duration assets whose value sits in distant cash flows. That is why high-growth technology multiples compress most sharply when rates rise.\n\nThe bid-ask spread. This is the practical killer of deal volume. Sellers anchor on the valuations available in the prior cycle while buyers reprice immediately to the new cost of capital. Until sellers' expectations adjust, which takes quarters, transactions simply do not clear.\n\nFinancing availability. Banks become less willing to underwrite, particularly if they are holding hung debt from deals committed before rates moved. That has pushed a large share of leveraged financing toward private credit funds, which can be faster and more certain but price higher.\n\nThe offsetting effects: corporate acquirers with cash and strong balance sheets gain a relative advantage over sponsors, so strategic share of activity rises. Distress and restructuring activity increases as floating rate borrowers face rising debt service. And take-private activity can pick up where public valuations fall faster than private marks."},
{c:"mkts",l:1,t:"mc",q:"A rights issue differs from a follow-on offering in that:",o:["It is offered to existing shareholders pro rata, usually at a discount","It can only be used by private companies","It does not dilute shareholders","It requires no regulatory filing"],a:0,e:"A rights issue gives existing holders the right to buy new shares in proportion to their current stake, at a discount to the market price. Shareholders who take up their rights are not economically diluted; those who do not can usually sell the rights."},
{c:"mkts",l:2,t:"open",q:"What is a convertible bond, and why do companies issue them?",m:"A convertible bond is debt that the holder can convert into a fixed number of the issuer's shares. Economically it is a straight bond plus an embedded call option on the equity.\n\nWhy issuers like them. The coupon is materially lower than on straight debt, often several hundred basis points, because the investor is paying for the option through yield. If the stock performs, the bond converts to equity and never has to be repaid in cash, so the company has effectively sold equity at a premium to the price on the issue date, typically 20% to 40% above. For a company with a high equity valuation and limited debt capacity, it is often the cheapest available capital.\n\nWhy investors buy them. They get downside protection from the bond floor plus upside participation in the equity. Convertible arbitrage funds buy the bond, short the stock against it and trade the volatility, which is why issuance depends heavily on the health of that investor base.\n\nThe costs and risks for the issuer. Dilution if the stock rises, though at a price above the current one. Accounting complexity, and the need to include the conversion shares in diluted EPS via the if-converted method when they are in the money. And if the stock falls and the bond stays out of the money, the company still has to refinance or repay debt at maturity, having gained only the coupon saving.\n\nCommon with high-growth companies, and heavily used by issuers who want capital without printing equity at a price they consider too low."},
{c:"mkts",l:2,t:"mc",q:"An inverted yield curve means:",o:["Short-term rates exceed long-term rates","Long-term rates exceed short-term rates","Credit spreads have widened","Inflation expectations have risen"],a:0,e:"Inversion means shorter maturities yield more than longer ones, usually because the market expects policy rates to be cut in response to a slowdown. It has historically been one of the more reliable recession indicators, though with long and variable lags."},
{c:"mkts",l:3,t:"open",q:"Walk me through a sell-side process from the buyer's perspective.",m:"From the other side of the table, the process is a sequence of gates where information is exchanged for commitment.\n\nFirst contact is a teaser, a one or two page anonymised summary. If interested, the buyer signs a non-disclosure agreement and receives the confidential information memorandum, which describes the business, market, financials and management in detail, along with a process letter setting out the timetable.\n\nThe first round requires a non-binding indication of interest: a valuation range, sources of financing, required approvals, and assumptions. The seller uses these to select who advances, weighing price against certainty and speed.\n\nSecond round buyers get management presentations, access to the data room, and expert sessions. This is where the real diligence happens: commercial, financial including a quality-of-earnings report, legal, tax, IT, insurance and environmental. Buyers also receive a draft sale and purchase agreement to mark up.\n\nThe final bid comes with a binding offer, a marked-up SPA, and committed or highly confident financing. Sellers now weigh price against deal certainty: the level of conditionality, the financing certainty, the regulatory risk, and the extent of the buyer's SPA changes. A slightly lower bid with a clean contract and committed funds frequently beats a higher bid with conditions.\n\nThen exclusivity, confirmatory diligence, final negotiation, signing, regulatory clearance, and closing.\n\nThe buyer's tactical considerations throughout: how to differentiate without overpaying, whether to try to pre-empt the process with an early aggressive offer before competition builds, and how much to spend on diligence before knowing whether they are the preferred party."},
{c:"mkts",l:2,t:"mc",q:"A block trade is best described as:",o:["A company issuing new shares to the public","A large existing shareholder selling a big stake, usually overnight","A regulator-mandated trading halt","A merger of two listed companies"],a:1,e:"A block trade is a secondary sale of existing shares by a large holder, often a sponsor or founder, typically executed overnight at a discount to the closing price via an accelerated bookbuild. No new shares are created, so there is no dilution."},
{c:"mkts",l:2,t:"open",q:"What goes into a pitchbook, and what is its purpose?",m:"A pitchbook is the document a bank uses to win or advance a mandate. The structure varies but most contain the same building blocks.\n\nAn executive summary or situation overview, framing what the client is facing and what the bank is proposing.\n\nMarket and sector context: industry dynamics, recent transaction activity, valuation trends, and where the client sits competitively.\n\nA valuation section, if relevant: comparable companies, precedent transactions, a DCF, and an LBO analysis where applicable, usually summarised in a football field.\n\nStrategic alternatives: for a sale mandate, the possible buyer universe split into strategics and sponsors with a view on each. For a financing mandate, structure options with pricing indications. For a defence mandate, the options available against an approach.\n\nProcess considerations: timetable, structure, key risks, and what happens next.\n\nCredentials: the bank's relevant transaction experience, sector coverage and team.\n\nThe purpose is persuasion, not education. A pitchbook argues for a course of action and for the bank's suitability to execute it. That means every page needs a message, usually captured in the header, and the analysis exists to support the recommendation.\n\nThe junior reality is that pitchbooks consume a large share of analyst time, most never lead to a mandate, and the same materials get recycled and updated across clients. The skill worth developing is making each page say one clear thing, because a page without a message is a page that will be cut."},
{c:"mkts",l:3,t:"mc",q:"A company with a BBB rating is considering a large debt-funded acquisition that would push leverage to 4.5x. The most likely consequence is:",o:["No ratings impact","A downgrade to high yield, raising its cost of capital and narrowing its investor base","An automatic upgrade due to increased size","Regulatory prohibition of the deal"],a:1,e:"BBB is the lowest investment grade notch. Leverage at 4.5x is well outside investment grade tolerance for most sectors, so a downgrade to BB is likely. That forces index-constrained holders to sell and permanently raises funding costs, which is why such deals often include a commitment to deleverage."},
/* ============ MARKETS & CAPITAL MARKETS (continued) ============ */
{c:"mkts",l:2,t:"mc",q:"A SPAC raises capital by:",o:["Selling shares in an operating business","Listing a shell company that later merges with a private target","Issuing high yield debt","Acquiring distressed loans"],a:1,e:"A special purpose acquisition company lists with no operations, holding investor cash in trust, then has a set window, usually 24 months, to find and merge with a private target. Shareholders can redeem rather than participate, which is what makes the structure fragile."},
{c:"mkts",l:2,t:"open",q:"What is private credit, and why has it taken share from banks?",m:"Private credit means loans originated and held by non-bank lenders, typically direct lending funds managed by asset managers and private equity firms, rather than syndicated through the broadly syndicated loan market.\n\nThe share shift has several causes.\n\nRegulation. Post-crisis capital rules made holding leveraged loans more expensive for banks, and leveraged lending guidance constrained how much they could lend against EBITDA. Non-bank lenders face none of that.\n\nCertainty and speed. A direct lender can commit to a whole financing quickly, with one counterparty, no syndication risk and no flex. For a sponsor in a competitive auction, certainty of financing is worth real money, because a bid backed by committed private credit is more likely to be accepted than a higher bid contingent on a syndication that might not clear.\n\nFlexibility. Private credit will lend against business models banks find difficult, particularly recurring revenue software lending where leverage is sized against ARR rather than EBITDA, and will structure around unusual situations.\n\nMarket conditions. When syndicated markets closed during periods of volatility, private credit remained open, and having financed deals through that window it kept the relationships afterwards.\n\nThe trade-offs. Borrowers pay more, often several hundred basis points above syndicated pricing. Loans are illiquid and marked by the manager rather than by the market, which has drawn criticism about valuation transparency. And concentration means that if a credit deteriorates, a small group of lenders holds the whole exposure, which changes restructuring dynamics: fewer parties, faster negotiation, but no market price to anchor on."},
{c:"mkts",l:2,t:"mc",q:"Duration measures a bond's:",o:["Time to maturity in years only","Price sensitivity to a change in interest rates","Probability of default","Coupon frequency"],a:1,e:"Duration is the approximate percentage change in price for a one percent change in yield. A bond with a duration of 7 falls about 7% if yields rise 100 basis points. It rises with maturity and falls with coupon size."},
{c:"mkts",l:3,t:"open",q:"How does the choice between a dual-track process and a straight sale affect outcomes?",m:"A dual track runs an IPO preparation and an M&A sale process in parallel, keeping both exits live until late in the process.\n\nThe primary benefit is competitive tension. Trade and sponsor buyers know the seller has a credible alternative, which removes their ability to push price down by arguing that no other exit exists. The IPO valuation, supported by research and investor feedback, becomes a floor in the M&A negotiation. Empirically, dual tracks tend to achieve higher prices than single-track sales.\n\nThe second benefit is optionality on timing. Equity markets can close abruptly. Running both means a shut IPO window does not force the seller to accept a weak bid, and a disappointing M&A round does not force a listing into a poor market.\n\nThe costs are real. It is expensive, because you pay for two sets of advisers, two sets of diligence and two document workstreams. It is extremely demanding on management, who must run the business while preparing a prospectus and meeting buyers. It creates information risk, since the IPO filing discloses detail that buyers can use in negotiation. And there is signalling risk: if the process fails on both tracks, the asset is publicly seen to have been shopped without success.\n\nThe practical judgement is about the asset. Dual tracks make sense for large, high-quality businesses with genuine public market appeal and multiple credible buyers. For a smaller or more specialised asset where the IPO alternative is not genuinely credible, the threat is transparent and the cost is wasted."},
{c:"mkts",l:2,t:"mc",q:"In a leveraged loan, a pricing flex provision allows:",o:["The borrower to reduce the interest rate at will","The arranger to adjust pricing or terms to clear the market during syndication","The lender to demand immediate repayment","The rating agency to change the rating"],a:1,e:"Flex lets the arranging bank move pricing, and sometimes structure, within agreed limits if the deal is not clearing at the launch terms. It is how banks protect themselves against underwriting risk, and the absence of flex is one reason borrowers pay up for private credit."},
{c:"mkts",l:2,t:"open",q:"What is a fairness opinion, and what are its limitations?",m:"A fairness opinion is a letter from a financial adviser stating that the consideration in a transaction is fair, from a financial point of view, to a specified group, usually the target's shareholders. It is supported by a board presentation setting out the valuation work.\n\nIts function is primarily governance. Directors owe fiduciary duties, and a fairness opinion is evidence that the board informed itself before approving a deal. It is a defence against shareholder litigation alleging the board failed to obtain a proper price.\n\nThe limitations are significant and worth naming.\n\nIt says fair, not best. It opines that the price falls within a defensible range, not that it is the highest achievable. A range wide enough to encompass most plausible outcomes makes the opinion easy to give.\n\nThe conflict of interest is structural. The adviser giving the opinion is frequently the same bank running the sale process and earning a success fee contingent on the deal closing. That has driven a market for independent opinions from firms with no stake in completion, and disclosure of adviser fees in proxy statements.\n\nIt relies on management projections, which the adviser does not independently verify and which management may have shaped with knowledge of the outcome they want.\n\nIt is a point-in-time view based on market conditions and information at that date, with extensive qualifications in the letter itself.\n\nCourts have become more sceptical, and a fairness opinion alone does not insulate a board where the process itself was flawed."},
{c:"mkts",l:1,t:"mc",q:"The quiet period around an IPO restricts:",o:["Trading in the company's shares","Public communications by the company and its underwriters","The company's ability to sign contracts","The payment of dividends"],a:1,e:"The quiet period limits promotional public statements outside the prospectus, so that investors make decisions on the registered disclosure rather than on selective marketing. It also restricts underwriters from publishing research for a defined period after listing."},
{c:"mkts",l:3,t:"open",q:"How does inflation affect the valuation of a business?",m:"Through several channels that often pull in opposite directions, which is why a simple statement that inflation is bad for valuations is incomplete.\n\nDiscount rate. Higher inflation generally means higher nominal risk-free rates, which raises WACC and reduces present value. This hits long-duration assets hardest, because more of their value sits in distant cash flows. A high-growth company with most value in the terminal period suffers far more than a mature cash generator.\n\nCash flows. In a DCF, if you raise the discount rate for inflation you must also inflate the cash flows, or you are comparing nominal rates to real cash flows and systematically undervaluing. This is the most common technical error on this topic.\n\nPricing power. The critical business variable. A company that can pass input cost increases through to customers protects its margin, so real cash flows hold and the valuation effect is mostly the discount rate. A company that cannot sees margins compress in real terms, and suffers on both sides. This is why inflation separates businesses with brand or contractual pricing power from commoditised ones.\n\nWorking capital. Inflation increases the nominal value of inventory and receivables, so a growing business absorbs more cash into working capital just to stand still, which reduces free cash flow.\n\nCapital intensity. Replacement cost of assets rises faster than depreciation, which is based on historic cost. Reported earnings therefore overstate true economic earnings for asset-heavy businesses, since the real cost of maintaining capacity exceeds the depreciation charge.\n\nDebt. Existing fixed-rate debt is eroded in real terms, which benefits leveraged borrowers, while floating rate debt reprices upward immediately."},
{c:"mkts",l:2,t:"mc",q:"A company buying back its own shares in the open market will, all else equal:",o:["Increase EPS and reduce equity value","Reduce share count and increase EPS","Increase enterprise value","Increase the share count"],a:1,e:"A buyback reduces shares outstanding, so the same net income is divided over fewer shares and EPS rises. Equity value falls by the cash spent and net debt rises by the same amount, so enterprise value is unchanged."},
{c:"mkts",l:2,t:"open",q:"What is the difference between a strategic review, a formal sale process and an auction?",m:"They differ in how public they are and how many parties are involved, and each has different consequences.\n\nA strategic review is the broadest and vaguest term. A board announces it is reviewing options, which can include a sale, a separation, a recapitalisation or continuing as is. It is often announced under activist pressure. The ambiguity is deliberate: it signals openness without committing to a sale, and it can flush out interest without the company appearing to be for sale.\n\nA sale process is a run transaction with a defined objective. It can be broad or targeted. A broad auction contacts a wide universe of strategics and sponsors to maximise competition and therefore price. A targeted process approaches a small number of likely buyers, which preserves confidentiality, reduces business disruption and limits the risk of competitors obtaining sensitive information, at the cost of some competitive tension.\n\nAn auction specifically means a structured, multi-round competitive process with a set timetable, first-round indications and final binding bids. Formal sale processes under some takeover regimes carry specific regulatory meaning and disclosure obligations.\n\nThe trade-off running through all of it is price against confidentiality and certainty. Wider processes generally achieve higher prices but leak more, unsettle employees and customers, and, if they fail, leave the company publicly marked as having tried to sell.\n\nA negotiated bilateral deal sits at the other end: fastest, most confidential, but exposes the board to the criticism that it never tested the market, which is why go-shop provisions exist."},
{c:"mkts",l:3,t:"mc",q:"A payment-in-kind toggle note allows the issuer to:",o:["Convert the note into equity at will","Choose between paying cash interest or accruing it into principal","Extend the maturity indefinitely","Repay early with no penalty"],a:1,e:"The toggle gives the issuer optionality to preserve cash by capitalising interest instead of paying it, usually at a higher rate. It appears in aggressive structures and is a signal of a borrower-friendly market, since it shifts liquidity risk to lenders."},
{c:"mkts",l:2,t:"open",q:"What is a confidential information memorandum and how does it differ from a prospectus?",m:"A CIM is the primary marketing document in a private M&A sale process. It is prepared by the sell-side adviser, typically 50 to 100 pages, and covers the investment highlights, business description, market overview, operational detail, management team and financial information including historical results and management projections.\n\nA prospectus is the offering document for a public securities issuance, filed with and reviewed by a securities regulator.\n\nThe differences that matter.\n\nAudience and access. A CIM goes only to parties who have signed a non-disclosure agreement, after being screened by the seller. A prospectus is public.\n\nLegal standing. A prospectus carries statutory liability: material misstatements or omissions expose the issuer and underwriters to securities law claims. A CIM is explicitly disclaimed, typically stating that it is not to be relied upon, that no representation is made as to accuracy, and that the buyer must rely on its own diligence and on the representations in the purchase agreement. That disclaimer is why buyers do their own diligence rather than relying on the CIM.\n\nContent and tone. A CIM is a selling document and reads like one: it presents the equity story, includes forward projections, and emphasises strengths. A prospectus is heavily weighted toward risk disclosure, contains extensive risk factors, and is written defensively because the liability regime rewards caution.\n\nFinancials. A prospectus requires audited statements in a prescribed format. A CIM often presents adjusted EBITDA with management addbacks, which is precisely what the buyer's quality-of-earnings work exists to test."},
{c:"mkts",l:2,t:"mc",q:"An accelerated bookbuild is characterised by:",o:["A multi-week roadshow","Raising or placing equity within hours, usually overnight","A fixed price set months in advance","Retail-only distribution"],a:1,e:"An ABB launches after market close and prices before the next open, placing stock with institutions in a matter of hours. Speed reduces market risk and information leakage, at the cost of a wider discount and no retail participation."},
{c:"mkts",l:3,t:"open",q:"What does a bank actually get paid for, across its product lines?",m:"Understanding the fee model explains a lot of behaviour, and interviewers notice when a candidate knows it.\n\nM&A advisory is a success fee, paid on completion, typically a percentage of transaction value on a sliding scale that falls as size rises. Large deals might be well under 1%, small deals several percent. There is often a retainer and announcement fee, but the bulk is contingent on closing. This is why deal teams are so focused on completion, and why a fairness opinion from the same adviser carries a conflict.\n\nEquity capital markets is the gross spread, the difference between what investors pay and what the issuer receives. Around 7% for a small US IPO, materially lower for large deals and follow-ons, split between the underwriting syndicate with the lead bookrunners taking the largest share.\n\nDebt capital markets is an underwriting fee on issuance, typically well under 1% for investment grade and higher for high yield, reflecting the risk and work involved.\n\nLeveraged finance earns arrangement and underwriting fees on the financing, plus original issue discount economics, and the bank may also earn on holding or trading the paper.\n\nRestructuring is structured differently: monthly retainers, which matter because cases run for a long time and the client may not have cash, plus a completion fee on emergence or on a transaction. The retainer model exists precisely because a distressed client cannot guarantee a success outcome.\n\nThe strategic consequence is that advisory revenue is lumpy and cyclical, which is why banks value the stability of financing relationships and why coverage bankers are measured on the whole wallet from a client rather than on advisory fees alone."},
{c:"mkts",l:2,t:"mc",q:"A lock-up agreement after an IPO typically prevents:",o:["The company from issuing debt","Insiders from selling shares for a set period, commonly 180 days","Analysts from publishing research indefinitely","The underwriters from stabilising the price"],a:1,e:"Lock-ups stop insiders and pre-IPO holders from flooding the market immediately after listing, which would undermine the price. Expiry is a watched event, since a large volume of newly sellable stock often pressures the shares."},
{c:"mkts",l:3,t:"open",q:"How would you advise a private company choosing between an IPO, a sale and staying private with new capital?",m:"Frame it around what the owners actually want, because the three routes solve different problems.\n\nIf the objective is full liquidity now, a sale is the answer. An IPO does not achieve it: insiders sell a minority at listing, are locked up for six months, and sell down over years carrying market risk throughout. A trade sale gives complete exit at a single price, and a strategic buyer may pay for synergies no public investor will.\n\nIf the objective is capital to grow while keeping control, the choice is between an IPO and a private round. An IPO raises primary capital, gives a currency for acquisitions, provides ongoing access to markets, and confers profile. The costs are substantial: listing expenses, ongoing reporting and compliance, exposure to quarterly expectations, loss of strategic privacy, and significant management time. A private round from growth equity or a sponsor avoids all of that, is faster, and keeps the company out of public view, but typically comes with governance rights, preference structures and an eventual exit expectation.\n\nIf the objective is partial liquidity while retaining upside, a minority stake sale or a recapitalisation can take money off the table without ceding the business.\n\nThe practical determinants: the company's scale and predictability, since public markets punish businesses that miss guidance and a company needs genuine forecast reliability before listing. Whether there is a credible strategic buyer. Where valuations are in each market at the time, since the gap between public and private multiples moves. And whether management genuinely wants to run a public company, which is a different job.\n\nThe honest advice is often to prepare for more than one route, which is the argument for a dual track."},
];

      K_FLAGS = "ib400-flags-v1", K_DAYS = "ib400-days-v1", K_THEME = "ib400-theme",
      K_RESUME = "ib400-resume-v1", K_MODEL = "claude-sonnet-5";

  <rect x=".75" y=".75" width="46.5" height="46.5" rx="11.5" fill="var(--surf2)" stroke="var(--line2)" stroke-width="1.5"/>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ls = {
  get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
